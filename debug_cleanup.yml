---
- name: Debug ArgoCD cleanup for user456
  hosts: localhost
  gather_facts: false
  vars:
    guid: "456"
    _dynamic_username: "user-456"
    _user_guid: "456"
    ocp4_workload_dynamic_user_provisioning_gitops_namespace: "tssc-gitops"
  
  tasks:
    - name: Find all ArgoCD applications in gitops namespace
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: "{{ ocp4_workload_dynamic_user_provisioning_gitops_namespace }}"
      register: r_all_argocd_apps

    - name: Debug all ArgoCD apps
      ansible.builtin.debug:
        msg:
          - "Total ArgoCD apps found: {{ r_all_argocd_apps.resources | length }}"
          - "App names: {{ r_all_argocd_apps.resources | map(attribute='metadata.name') | list }}"

    - name: Test pattern matching for user456
      ansible.builtin.debug:
        msg:
          - "Testing pattern '.*user-?{{ _user_guid }}.*' against app names"
          - "Pattern: .*user-?456.*"
      
    - name: Find apps matching name pattern
      ansible.builtin.set_fact:
        _matched_apps: "{{ r_all_argocd_apps.resources | selectattr('metadata.name', 'match', '.*user-?' + _user_guid + '.*') | list }}"
    
    - name: Debug matched apps
      ansible.builtin.debug:
        msg:
          - "Apps matching name pattern: {{ _matched_apps | length }}"
          - "Matched app names: {{ _matched_apps | map(attribute='metadata.name') | list }}"

    - name: Check backstage labels
      ansible.builtin.debug:
        msg:
          - "App: {{ item.metadata.name }}"
          - "Has backstage-name label: {{ item.metadata.labels.get('backstage-name', 'NOT_FOUND') }}"
          - "Label value: {{ item.metadata.labels.get('backstage-name', '') }}"
          - "Matches user pattern: {{ (item.metadata.labels.get('backstage-name', '') | regex_search('.*user-?' + _user_guid + '.*')) is not none }}"
      loop: "{{ r_all_argocd_apps.resources }}"
      when: "'user456' in item.metadata.name"