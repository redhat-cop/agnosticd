---
# Test script for AWS region validation filters
- name: Test AWS Region Validation Filters
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Test Case 1: RHEL AI workload
    rhelai_workload:
      rhelai_instance_type: g6.2xlarge
      rhelai_instance_image: RHELAI13
      bastion_instance_type: t3a.large
    
    # Test Case 2: GPU workload
    gpu_workload:
      gpu_instance_type: g5.4xlarge
      default_instance_type: m5.xlarge
    
    # Test Case 3: Standard workload
    standard_workload:
      default_instance_type: m5.xlarge
      bastion_instance_type: t3a.large
  
  tasks:
    - name: Test 1 - RHEL AI workload validation (should pass)
      debug:
        msg: "{{ 'us-east-2' | aws_validate_region_compatibility(rhelai_workload) }}"
    
    - name: Test 2 - RHEL AI workload validation (should fail)
      debug:
        msg: "{{ 'eu-west-1' | aws_validate_region_compatibility(rhelai_workload) }}"
    
    - name: Test 3 - Get optimal regions for RHEL AI workload
      debug:
        msg: "{{ rhelai_workload | aws_get_optimal_regions }}"
    
    - name: Test 4 - Get optimal regions for GPU workload
      debug:
        msg: "{{ gpu_workload | aws_get_optimal_regions }}"
    
    - name: Test 5 - Get optimal regions for standard workload
      debug:
        msg: "{{ standard_workload | aws_get_optimal_regions }}"
    
    - name: Test 6 - Auto-select region for RHEL AI workload
      debug:
        msg: "{{ rhelai_workload | aws_auto_select_region }}"
    
    - name: Test 7 - Auto-select region with preferred (valid)
      debug:
        msg: "{{ rhelai_workload | aws_auto_select_region('us-east-1') }}"
    
    - name: Test 8 - Auto-select region with preferred (invalid)
      debug:
        msg: "{{ rhelai_workload | aws_auto_select_region('eu-west-1') }}"
