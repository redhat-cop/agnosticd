---
# Platform Setup Playbook for ADS Workshop
# Usage:
#   ansible-playbook setup_platform.yml -e @platform_vars.yml
#
# Prerequisites:
#   - OpenShift cluster with cluster-admin access
#   - cert-manager operator installed
#   - ODF (OpenShift Data Foundation) installed
#
# This playbook installs:
#   - Quay operator and registry
#   - Jenkins
#   - OpenShift GitOps (ArgoCD)
#   - OpenShift DevSpaces
#   - GitLab
#   - RHDH Orchestrator
#   - ADS Platform (Keycloak, ACS, TPA, etc.) - NO USERS

- name: Setup ADS Workshop Platform
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    # Action: always 'create' for platform
    ACTION: create

    # OCP username for role execution
    ocp_username: admin

    # Required vars
    _required_vars:
      - guid
      - subdomain_base_suffix

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - item is defined
          - item | length > 0
        fail_msg: "Required variable '{{ item }}' is not defined. Please provide it via -e or vars file."
      loop: "{{ _required_vars }}"

    - name: Show platform setup configuration
      ansible.builtin.debug:
        msg:
          - "==========================================="
          - "ADS Workshop Platform Setup"
          - "==========================================="
          - "GUID: {{ guid }}"
          - "Base Domain: {{ subdomain_base_suffix }}"
          - "Action: {{ ACTION }}"
          - ""
          - "Prerequisites Required:"
          - "  - cert-manager operator"
          - "  - ODF (OpenShift Data Foundation)"
          - ""
          - "Will Install:"
          - "  - Quay operator and registry"
          - "  - Jenkins"
          - "  - OpenShift GitOps (ArgoCD)"
          - "  - OpenShift DevSpaces"
          - "  - GitLab"
          - "  - RHDH Orchestrator"
          - "  - ADS Platform (Keycloak, ACS, TPA)"
          - "==========================================="

    - name: Check OpenShift cluster connectivity
      kubernetes.core.k8s_cluster_info:
      register: r_cluster_info
      failed_when: false

    - name: Display cluster information
      ansible.builtin.debug:
        msg:
          - "Connected to cluster:"
          - "  Kubernetes: {{ r_cluster_info.version.server.kubernetes.gitVersion | default('Unknown') }}"
          - "  OpenShift: {{ r_cluster_info.version.server.openshift | default('Unknown') }}"
      when: r_cluster_info is defined and r_cluster_info.version is defined

    - name: Fail if cluster not accessible
      ansible.builtin.fail:
        msg: "Cannot connect to OpenShift cluster. Check your kubeconfig."
      when: r_cluster_info.failed | default(false)

  tasks:
    # =============================================================================
    # Quay Operator
    # =============================================================================
    - name: Install Quay operator and registry
      ansible.builtin.include_role:
        name: ocp4_workload_quay_operator
      vars:
        become_override: false

    # =============================================================================
    # Jenkins
    # =============================================================================
    - name: Install Jenkins
      ansible.builtin.include_role:
        name: ocp4_workload_jenkins
      vars:
        become_override: false

    # =============================================================================
    # OpenShift GitOps (ArgoCD)
    # =============================================================================
    - name: Install OpenShift GitOps
      ansible.builtin.include_role:
        name: ocp4_workload_openshift_gitops
      vars:
        become_override: false

    # =============================================================================
    # OpenShift DevSpaces
    # =============================================================================
    - name: Install OpenShift DevSpaces
      ansible.builtin.include_role:
        name: ocp4_workload_openshift_devspaces
      vars:
        become_override: false

    # =============================================================================
    # GitLab
    # =============================================================================
    - name: Install GitLab
      ansible.builtin.include_role:
        name: ocp4_workload_gitops_gitlab
      vars:
        become_override: false

    # =============================================================================
    # RHDH Orchestrator
    # =============================================================================
    - name: Install RHDH Orchestrator
      ansible.builtin.include_role:
        name: ocp4_workload_rhdh_orchestrator
      vars:
        become_override: false

    # =============================================================================
    # ADS Platform (Infrastructure Only - NO USERS)
    # =============================================================================
    - name: Install ADS Platform Infrastructure
      ansible.builtin.include_role:
        name: ocp4_workload_advanced_developer_suite_platform
      vars:
        become_override: false

  post_tasks:
    - name: Get cluster apps domain
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Ingress
        name: cluster
      register: r_ingress_config

    - name: Set apps domain fact
      ansible.builtin.set_fact:
        _apps_domain: "{{ r_ingress_config.resources[0].spec.domain }}"

    - name: Platform setup complete
      ansible.builtin.debug:
        msg:
          - "==========================================="
          - "Platform Setup Complete!"
          - "==========================================="
          - ""
          - "Access URLs (wait for all pods to be ready):"
          - "  OpenShift Console: https://console-openshift-console.{{ _apps_domain }}"
          - "  ArgoCD: https://openshift-gitops-server-openshift-gitops.{{ _apps_domain }}"
          - "  GitLab: https://gitlab-gitlab.{{ _apps_domain }}"
          - "  RHDH: https://backstage-tssc-dh.{{ _apps_domain }}"
          - "  Keycloak: https://sso.{{ _apps_domain }}"
          - "  Quay: https://quay-quay-enterprise.{{ _apps_domain }}"
          - ""
          - "Admin Credentials:"
          - "  Username: {{ ocp4_workload_advanced_developer_suite_admin_user }}"
          - "  Password: {{ common_password }}"
          - ""
          - "Next Steps:"
          - "  1. Verify all operators are installed and running"
          - "  2. Check all platform pods are ready (may take 10-15 minutes)"
          - "  3. Run student provisioning playbook:"
          - "     ansible-playbook provision_students.yml -e @student_vars.yml"
          - "==========================================="
