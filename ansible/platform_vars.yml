---
# Platform Setup Variables for ADS Workshop
# Usage:
#   ansible-playbook setup_platform.yml -e @platform_vars.yml

# =============================================================================
# REQUIRED VARIABLES - YOU MUST SET THESE
# =============================================================================

# Workshop GUID (change this for your environment)
guid: ads-workshop-001

# Base domain suffix for your OpenShift cluster
# Example: If your apps domain is apps.cluster-abc123.example.com, use:
subdomain_base_suffix: cluster-abc123.example.com

# =============================================================================
# COMMON PASSWORD
# =============================================================================
# Used for admin accounts across all services
# In production, this is auto-generated from GUID: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
# For testing, use a simple password
common_password: openshift

# =============================================================================
# ADMIN CREDENTIALS
# =============================================================================
ocp4_workload_advanced_developer_suite_admin_user: admin
ocp4_workload_advanced_developer_suite_admin_password: "{{ common_password }}"
ocp4_workload_advanced_developer_suite_quay_admin_user: quayadmin
ocp4_workload_advanced_developer_suite_quay_admin_password: "{{ common_password }}"

# =============================================================================
# NAMESPACE CONFIGURATION
# =============================================================================
# These namespaces will be created by the platform role
ocp4_workload_advanced_developer_suite_keycloak_namespace: tssc-keycloak
ocp4_workload_advanced_developer_suite_dh_namespace: tssc-dh
ocp4_workload_advanced_developer_suite_gitlab_namespace: gitlab
ocp4_workload_advanced_developer_suite_jenkins_namespace: jenkins
ocp4_workload_advanced_developer_suite_acs_namespace: tssc-acs
ocp4_workload_advanced_developer_suite_tssc_gitops_namespace: tssc-gitops
ocp4_workload_advanced_developer_suite_tssc_tpa_namespace: tssc-tpa
ocp4_workload_advanced_developer_suite_devspaces_namespace: openshift-devspaces
ocp4_workload_advanced_developer_suite_quay_namespace: quay-enterprise

# =============================================================================
# QUAY CONFIGURATION
# =============================================================================
ocp4_workload_quay_operator_namespace: quay-enterprise
ocp4_workload_quay_operator_name: quay-enterprise
ocp4_workload_quay_operator_admin_username: quayadmin
ocp4_workload_quay_operator_admin_password: "{{ common_password }}"

# =============================================================================
# GITLAB CONFIGURATION
# =============================================================================
ocp4_workload_gitops_gitlab_namespace: gitlab
ocp4_workload_gitops_gitlab_root_password: "{{ common_password }}"

# =============================================================================
# OPENSHIFT GITOPS (ARGOCD) CONFIGURATION
# =============================================================================
ocp4_workload_openshift_gitops_namespace: openshift-gitops
ocp4_workload_openshift_gitops_enable_rbac: true

# =============================================================================
# OPENSHIFT DEVSPACES CONFIGURATION
# =============================================================================
ocp4_workload_openshift_devspaces_namespace: openshift-devspaces

# =============================================================================
# JENKINS CONFIGURATION
# =============================================================================
ocp4_workload_jenkins_namespace: jenkins
ocp4_workload_jenkins_admin_password: "{{ common_password }}"

# =============================================================================
# RHDH ORCHESTRATOR CONFIGURATION
# =============================================================================
ocp4_workload_rhdh_orchestrator_namespace: tssc-dh

# =============================================================================
# TESTING SCENARIOS
# =============================================================================
#
# Basic Platform Setup:
#   ansible-playbook setup_platform.yml -e @platform_vars.yml
#
# Custom Domain:
#   ansible-playbook setup_platform.yml -e @platform_vars.yml \
#     -e subdomain_base_suffix=apps.my-cluster.example.com
#
# Custom GUID:
#   ansible-playbook setup_platform.yml -e @platform_vars.yml \
#     -e guid=my-workshop-123
#
# Custom Admin Password:
#   ansible-playbook setup_platform.yml -e @platform_vars.yml \
#     -e common_password=MySecurePassword123
