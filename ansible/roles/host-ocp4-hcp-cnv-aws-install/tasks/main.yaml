---
- name: Set Ansible Python interpreter to k8s virtualenv
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/virtualenvs/k8s/bin/python

- name: Set URLs for OpenShift GA releases (specific version)
  when: (ocp4_installer_version | string).split('.') | length >= 3
  ansible.builtin.set_fact:
    ocp4_client_url: >-
      {{ '{0}/ocp/{1}/openshift-client-linux-{1}.tar.gz'.format(
        ocp4_installer_root_url | default("https://mirror.openshift.com/pub/openshift-v4/clients"),
        ocp4_installer_version
      ) }}

- name: Set URLs for OpenShift GA releases (latest stable)
  when: (ocp4_installer_version | string).split('.') | length == 2
  ansible.builtin.set_fact:
    ocp4_client_url: >-
      {{ '{0}/ocp/stable-{1}/openshift-client-linux.tar.gz'.format(
        ocp4_installer_root_url | default("https://mirror.openshift.com/pub/openshift-v4/clients"),
        ocp4_installer_version
      ) }}

- name: Get the OpenShift CLI
  become: true
  ansible.builtin.unarchive:
    src: "{{ ocp4_client_url }}"
    remote_src: true
    dest: /usr/bin
    mode: 0775
    owner: root
    group: root
  register: r_client
  until: r_client is success
  retries: 10
  delay: 30


- name: Get caller identity
  delegate_to: localhost
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
  ansible.builtin.command: aws sts get-caller-identity --query "Arn" --output text
  register: r_sts
  changed_when: false

- name: Get account ID
  delegate_to: localhost
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
  ansible.builtin.command: aws sts get-caller-identity --query "Account" --output text
  register: r_sts_account
  changed_when: false

- name: Create trust relationship file
  delegate_to: localhost
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
  ansible.builtin.template:
    src: templates/trust-relationship.json
    dest: trust-relationship.json
  vars:
    sts_arn: "{{ r_sts.stdout }}"

- name: Create the IAM
  delegate_to: localhost
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
  ansible.builtin.command: aws iam create-role --role-name hcp-cli-role --assume-role-policy-document file://trust-relationship.json --query "Role.Arn" --output json
  register: r_iam

- name: Save role id
  ansible.builtin.set_fact:
    role_arn: "{{ r_iam.stdout }}"

- name: Save aws account id
  ansible.builtin.set_fact:
    aws_account_id: "{{ r_sts_account.stdout }}"

- name: Create policy file
  delegate_to: localhost
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
  ansible.builtin.template:
    src: templates/policy.json
    dest: policy.json

- name: Attach the policy.json
  delegate_to: localhost
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
  ansible.builtin.command: aws iam put-role-policy --role-name hcp-cli-role --policy-name hcp-policy --policy-document file://policy.json

- name: Get sts credentials
  delegate_to: localhost
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
  ansible.builtin.command: aws sts get-session-token --output json
  register: r_sts_creds

- name: Generate /tmp/sts-creds.json
  ansible.builtin.copy:
    content: "{{ r_sts_creds.stdout }}"
    dest: /tmp/sts-creds.json


- name: Log in (obtain access token)
  community.okd.openshift_auth:
    username: "{{ sandbox_openshift_username }}"
    password: "{{ sandbox_openshift_password }}"
    host: "{{ sandbox_openshift_api_url }}"
  register: k8s_auth_results
  when: sandbox_openshift_username | default(false) | bool

- name: Install OCP using HCP
  module_defaults:
    group/k8s:
      host: "{{ sandbox_hcp.sandbox_openshift_api_url }}"
      api_key: "{{ k8s_auth_results.k8s_auth.api_key | default(sandbox_hcp.sandbox_openshift_api_key) }}"
      validate_certs: false

  block:
    - name: Check if x.y.z version exists
      when: hcp_cluster_version is match("^[0-9]+\\.[0-9]+\\.[0-9]+$")
      block:
        - name: Check if exists
          register: r_check_image_set
          kubernetes.core.k8s_info:
            api_version: hive.openshift.io/v1
            kind: ClusterImageSet
            name: img{{ hcp_cluster_version }}-x86-64-appsub

        - name: Fail if version not available
          ansible.builtin.fail:
            msg: "Version {{ hcp_cluster_version }} not available"
          when:
            - r_check_image_set.resources | default([]) | length == 0

        - name: Set releaseImage
          ansible.builtin.set_fact:
            ocp_release_image: "{{ r_check_image_set.resources[0].spec.releaseImage }}"

    - name: Select the latest image when x.y is specified
      when: hcp_cluster_version is match("^[0-9]+\\.[0-9]+$")
      block:
        - name: "Get available ClusterImageSets"
          kubernetes.core.k8s_info:
            api_version: hive.openshift.io/v1
            kind: ClusterImageSet
          register: cis_list

        - name: "Filter ClusterImageSets matching version {{ hcp_cluster_version }}"
          ansible.builtin.set_fact:
            filtered_image: >-
              {{
                cis_list.resources
                | selectattr('metadata.name', 'match', "img" + hcp_cluster_version|string + "\.\d+-x86-64-appsub")
                | sort(attribute='metadata.name', reverse=True)
                | first | default(None)
              }}

        - name: Fail if version not available
          ansible.builtin.fail:
            msg: "Version {{ hcp_cluster_version }} not available"
          when: filtered_image == ""

        - name: Set releaseImage
          ansible.builtin.set_fact:
            ocp_release_image: "{{ filtered_image.spec.releaseImage }}"
    - ansible.builtin.debug:
        msg: "Selected HCP version {{ ocp_release_image }}"

    - name: Add the certificate definition for OAuth service
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'certificate.yaml') }}"
        wait: true
        wait_timeout: 300
      vars:
        namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"

    - name: Wait until Oauth Certificate is ready
      ignore_errors: true
      register: r_oauth
      kubernetes.core.k8s_info:
        api_version: cert-manager.io/v1
        kind: Certificate
        name: oauth-{{ guid }}
        namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"
        wait: true
        wait_sleep: 5
        wait_timeout: 800
        wait_condition:
          type: "Ready"
          status: "True"

    - name: Restart OAuth request if it fails
      when: r_oauth is failed
      block:
        - name: Delete failed OAuth Certificate
          kubernetes.core.k8s:
            api_version: cert-manager.io/v1
            kind: Certificate
            name: oauth-{{ guid }}
            namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"
            state: absent

        - name: Add the certificate definition for OAuth service
          kubernetes.core.k8s:
            definition: "{{ lookup('ansible.builtin.template', 'certificate.yaml') }}"
            wait: true
            wait_timeout: 300
          vars:
            namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"

        - name: Wait until Oauth Certificate is ready
          register: r_oauth
          kubernetes.core.k8s_info:
            api_version: cert-manager.io/v1
            kind: Certificate
            name: oauth-{{ guid }}
            namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"
            wait: true
            wait_sleep: 5
            wait_timeout: 800
            wait_condition:
              type: "Ready"
              status: "True"

    - name: Add the pull secret
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'pullsecret.yaml.j2') }}"
        wait: true
        wait_timeout: 300
      vars:
        namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"

    - name: Set variable for kubeconfig
      ansible.builtin.set_fact:
        kubeconfig_base64: "{{ lookup('ansible.builtin.template', 'kubeconfig.yaml') | ansible.builtin.b64encode }}"
      vars:
        sandbox_openshift_api_url_name: "{{ sandbox_openshift_api_url.replace('https://','').replace('.','_') }}"

    - name: Create the kubeconfig secret
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'kubeconfigsecret.yaml.j2') }}"
        wait: true
        wait_timeout: 300
      vars:
        namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"

    - name: Create htpasswd secret for admin and userX
      ansible.builtin.include_tasks: setup_htpasswd_authentication.yml

    - name: Save the pull secret
      ansible.builtin.copy:
        content: "{{ ocp4_pull_secret }}"
        dest: /tmp/pull-secret.txt

    - name: Get HCP CLI download URL
      kubernetes.core.k8s_info:
        api_version: console.openshift.io/v1
        kind: ConsoleCLIDownload
        name: hcp-cli-download
      register: r_hcp_cli_download
      retries: 20
      delay: 10
      until: r_hcp_cli_download.resources | length > 0

    - name: Set HCP CLI download URL
      when: r_hcp_cli_download.resources | length > 0
      ansible.builtin.set_fact:
        _ocp4_workload_rhacm_hcp_cli_url: >-
          {{ r_hcp_cli_download.resources[0] | to_json | from_json
          | json_query("spec.links[?contains(href,'/linux/amd64')].href") | first }}

    - name: Download HCP CLI
      ansible.builtin.get_url:
        url: "{{ _ocp4_workload_rhacm_hcp_cli_url }}"
        validate_certs: false
        dest: /tmp/hcp.tar.gz
        mode: "0660"
      register: r_hcp_cli
      until: r_hcp_cli is success
      retries: 10
      delay: 10

    - name: Install HCP CLI on bastion
      become: true
      ansible.builtin.unarchive:
        src: /tmp/hcp.tar.gz
        remote_src: true
        dest: /usr/bin
        mode: "0775"
        owner: root
        group: root
      args:
        creates: /usr/bin/hcp

    - name: Remove downloaded file
      ansible.builtin.file:
        state: absent
        path: /tmp/hcp.tar.gz

    - name: Setup HCP CLI bash completion
      become: true
      ansible.builtin.shell: "/usr/bin/hcp completion bash >/etc/bash_completion.d/hcp"
      args:
        creates: /etc/bash_completion.d/hcp

    - name: Login to OCP
      ansible.builtin.command: oc login --token={{ sandbox_hcp.sandbox_openshift_api_key }} --server={{ sandbox_hcp.sandbox_openshift_api_url }}

    - name: Create cluster
      ansible.builtin.command: hcp create cluster aws --name {{ guid }} --infra-id {{ guid }} --base-domain {{ aws_sandbox_provision_data.aws_route53_domain[1:] }} --sts-creds /tmp/sts-creds.json --pull-secret /tmp/pull-secret.txt --region {{ aws_sandbox_provision_data.aws_default_region }} --generate-ssh --node-pool-replicas 3 --namespace {{ sandbox_hcp.sandbox_openshift_namespace }} --role-arn  {{ role_arn }} --etcd-storage-class ocs-external-storagecluster-ceph-rbd --render
      register: hcp_create_output

    - name: Debug HCP create output
      ansible.builtin.debug:
        var: hcp_create_output

    - name: Gather information about all VPC subnets
      delegate_to: localhost
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
        AWS_REGION: "{{ aws_sandbox_provision_data.aws_default_region }}"
      amazon.aws.ec2_vpc_subnet_info:
      register: subnet_info

    - name: Get subnet ID containing "-private-" in the Name tag
      ansible.builtin.set_fact:
        aws_subnet_id: >-
          {{ subnet_info.subnets
             | selectattr('tags.Name', 'search', '-private-')
             | map(attribute='subnet_id')
             | list | first }}

    - name: Gather Route53 hosted zones
      delegate_to: localhost
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
        AWS_REGION: "{{ aws_sandbox_provision_data.aws_default_region }}"
      amazon.aws.route53_info:
        query: hosted_zone
      register: r53_info

    - name: Set private and public zone IDs
      ansible.builtin.set_fact:
        aws_route53_private_zone_id: >-
          {{ r53_info.hosted_zones
             | selectattr('Name', 'equalto', guid + aws_sandbox_provision_data.aws_route53_domain + ".")
             | map(attribute='Id')
             | map('regex_replace', '^/hostedzone/', '')
             | first }}
        aws_route53_public_zone_id: >-
          {{ r53_info.hosted_zones
             | selectattr('Name', 'equalto', aws_sandbox_provision_data.aws_route53_domain[1:] + ".")
             | map(attribute='Id')
             | map('regex_replace', '^/hostedzone/', '')
             | first }}

    - name: Gather all VPCs
      delegate_to: localhost
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_sandbox_provision_data.aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_sandbox_provision_data.aws_secret_access_key }}"
        AWS_REGION: "{{ aws_sandbox_provision_data.aws_default_region }}"
      amazon.aws.ec2_vpc_net_info:
      register: vpc_info

    - name: Set VPC ID fact
      ansible.builtin.set_fact:
        aws_vpc_id: >-
          {{ vpc_info.vpcs
             | selectattr('tags.Name', 'equalto', 'hcp-' + guid + '-vpc')
             | map(attribute='vpc_id')
             | first }}


    - name: Create the HostedCluster
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'hostedcluster.yaml') }}"
        wait: true
        wait_timeout: 300
      vars:
        namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"
        target_namespace: "{{ sandbox_openshift_namespace }}"

    - name: Create the NodePool
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'nodepool.yaml') }}"
        wait: true
        wait_timeout: 300
      vars:
        namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"

    - name: Get HostedCluster
      kubernetes.core.k8s_info:
        api_version: hypershift.openshift.io/v1beta1
        kind: HostedCluster
        name: "hcp-{{ guid }}"
        namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"
      register: r_hosted_cluster
      retries: 120
      delay: 10
      until:
        - r_hosted_cluster.resources[0].status.kubeconfig is defined
        - r_hosted_cluster.resources[0].status.kubeconfig.name is defined
        - r_hosted_cluster.resources[0].status.kubeconfig.name | length > 0

    - name: Get the OpenShift admin kubeconfig secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: hcp-{{ guid }}-admin-kubeconfig
        namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"
      register: kubeadmin_secret_result

    - name: Get the OpenShift secret
      when: hcp_authentication | default('') != 'htpasswd'
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: hcp-{{ guid }}-kubeadmin-password
        namespace: "{{ sandbox_hcp.sandbox_openshift_namespace }}"
      register: password_secret_result

    - name: Decode the kubeconfig secret
      ansible.builtin.set_fact:
        kubeconfig_decoded: "{{ kubeadmin_secret_result.resources[0].data.kubeconfig | b64decode }}"

    - name: Decode the kubeadmin password secret
      when: hcp_authentication | default('') != 'htpasswd'
      ansible.builtin.set_fact:
        kubeadmin_password: "{{ password_secret_result.resources[0].data.password | b64decode }}"

- name: Generate /tmp/kubeconfig
  ansible.builtin.copy:
    dest: /tmp/kubeconfig
    content: "{{ kubeconfig_decoded }}"

- name: Get information about the router-nodeport-default service
  kubernetes.core.k8s_info:
    kubeconfig: /tmp/kubeconfig
    api_version: v1
    kind: Service
    namespace: openshift-ingress
    name: router-nodeport-default
  register: service_info
  retries: 10
  delay: 30
  until:
    - service_info.resources[0].spec.ports is defined
    - service_info.resources[0].spec.ports | length > 0

- name: Extract nodeport for http
  ansible.builtin.set_fact:
    nodeport_http: "{{ service_info.resources[0].spec.ports | selectattr('name', 'equalto', 'http') | map(attribute='nodePort') | first }}"

- name: Extract nodeport for https
  ansible.builtin.set_fact:
    nodeport_https: "{{ service_info.resources[0].spec.ports | selectattr('name', 'equalto', 'https') | map(attribute='nodePort') | first }}"

- name: Post-Install tasks
  module_defaults:
    group/k8s:
      host: "{{ sandbox_openshift_api_url }}"
      api_key: "{{ k8s_auth_results.k8s_auth.api_key | default(sandbox_openshift_api_key) }}"
      validate_certs: false

  block:
    - name: Add the service (type LoadBalancer) for the apps
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'workers_svc.yaml') }}"
        wait: true
        wait_timeout: 300
      vars:
        namespace: "{{ sandbox_openshift_namespace }}"

    - name: Wait for the LoadBalancer value - workers
      register: svc_apps
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: "svc-{{ guid }}-apps"
        namespace: "{{ sandbox_openshift_namespace }}"
      until: svc_apps.resources[0].status.loadBalancer.ingress[0].ip | default('') != ''
      retries: 10
      delay: 2

    - name: Add A dns record - apps
      amazon.aws.route53:
        state: present
        aws_access_key_id: "{{ route53_aws_access_key_id }}"
        aws_secret_access_key: "{{ route53_aws_secret_access_key }}"
        hosted_zone_id: "{{ route53_aws_zone_id }}"
        record: "*.apps.hcp-{{ guid }}.{{ cluster_dns_zone }}"
        zone: "{{ cluster_dns_zone  }}"
        value: "{{ svc_apps.resources[0].status.loadBalancer.ingress[0].ip }}"
        type: A
      register: r_route53_add_record
      until: r_route53_add_record is success
      retries: 10
      delay: 30

    - name: Make sure .kube directory exists for {{ ansible_user }}
      ansible.builtin.file:
        state: directory
        path: /home/{{ ansible_user }}/.kube
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Make sure .kube directory exists for root
      become: true
      ansible.builtin.file:
        state: directory
        path: /root/.kube
        owner: root
        group: root
        mode: "0700"

    - name: Copy cluster kubeconfig to /home/{{ ansible_user }}/.kube/config
      ansible.builtin.copy:
        remote_src: true
        src: "/tmp/kubeconfig"
        dest: "/home/{{ ansible_user }}/.kube/config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Copy cluster kubeconfig to /root/.kube/config
      become: true
      ansible.builtin.copy:
        remote_src: true
        src: /tmp/kubeconfig
        dest: /root/.kube/config
        owner: root
        group: root
        mode: "0600"

    - name: Set up Student User
      when: install_student_user | bool
      block:
        - name: Make sure .kube directory exists in /home/{{ student_name }}
          become: true
          ansible.builtin.file:
            state: directory
            path: "/home/{{ student_name }}/.kube"
            owner: "{{ student_name }}"
            group: users
            mode: "0700"

        - name: Copy /tmp/kubeconfig to /home/{{ student_name }}/.kube
          become: true
          ansible.builtin.copy:
            src: /tmp/kubeconfig
            dest: /home/{{ student_name }}/.kube/config
            remote_src: true
            owner: "{{ student_name }}"
            group: users
            mode: 0600

    - name: Create OpenShift Bash completion file
      become: true
      ansible.builtin.shell: oc completion bash >/etc/bash_completion.d/openshift

- name: Assign cluster-admin role to admin user
  environment:
    K8S_AUTH_KUBECONFIG: /home/{{ ansible_user }}/.kube/config
  kubernetes.core.k8s:
    definition: "{{ lookup('ansible.builtin.template', 'clusterrolebinding.yaml') }}"

- name: Gather and Print cluster info
  ansible.builtin.import_tasks: print_cluster_info.yml
