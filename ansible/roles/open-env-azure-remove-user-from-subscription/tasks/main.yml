---
- name: Log into Azure CLI
  no_log: True
  command: >
    az login --service-principal -u {{ azure_service_principal }}
    -p {{ azure_password }} --tenant {{ azure_tenant }}

- name: Check if email is Red Hat associate
  set_fact:
    internal_user: True
  when:
    - '"@redhat.com" in requester_email'
    - agnosticd_open_environment | default(false) | bool

- name: Check if email is not a Red Hat associate
  set_fact:
    internal_user: False
  when:
    - '"@redhat.com" not in requester_email'

- name: Checking if user is in Active Directory
  when:
    - internal_user | default(false) | bool
  azure.azcollection.azure_rm_aduser_info:
    auth_source: env
    user_principal_name: "{{ requester_email }}"
    tenant: "{{ azure_tenant }}"
  register: azuser

- name: Remove user from group
  when:
    - internal_user | default(false) | bool
  azure.azcollection.azure_rm_adgroup:
    auth_source: env
    tenant: "{{ azure_tenant }}"
    object_id: "{{ azure_group_id }}"
    state: 'present'
    absent_members:
      - "{{ azuser.ad_users[0].object_id }}"

- name: Retrieve which Pool ID is allocated for this user from the database
  ansible.builtin.uri:
    return_content: yes
    status_code: [200, 404]
    url: "{{ az_function_show }}{{ project_tag }}/{{ az_pool_id }}?code={{ azure_pool_api_secret }}"
  register: poolid

- name: Write out the assigned Pool ID
  debug:
    msg: "{{ poolid.content }}"

- name: Purge azure services and pool assignment
  when:
    - poolid.content
    - poolid.status == 200
  block:
    - name: Get facts for the subscription by name
      azure.azcollection.azure_rm_subscription_info:
        auth_source: env
        name: "{{ poolid.content }}"
      register: assignedsubscription

    - name: Write out assignedsubscription
      debug:
        msg: "{{ assignedsubscription }}"

    - name: Get subscription ID
      set_fact:
        pool_subscription_id: "{{ assignedsubscription.subscriptions[0].subscription_id }}"

    - name: Get subscription FQID
      set_fact:
        subscriptionfqid: "{{ assignedsubscription.subscriptions[0].fqid }}"

    - name: Switch Subscriptions
      ansible.builtin.command: >
        az account set -s "{{ pool_subscription_id }}"

    # ── Phase 1: Apply deny policy to block new resource creation ──
    # Applied first so it starts propagating immediately. Azure Policy deny
    # blocks CREATE/UPDATE but allows DELETE, so our cleanup proceeds normally.
    # Propagation can take up to 30 min — this is defense-in-depth, not the
    # sole protection. RBAC revocation (Phase 2) is the primary control.

    - name: Write deny policy rules to temp file
      ansible.builtin.copy:
        content: |
          {
            "if": {
              "allOf": [
                {"not": {"field": "type", "like": "Microsoft.Authorization/*"}},
                {"not": {"field": "type", "equals": "Microsoft.Resources/tags"}}
              ]
            },
            "then": {
              "effect": "deny"
            }
          }
        dest: "/tmp/deny-policy-rules-{{ guid }}.json"

    - name: Create temporary deny-all-creation policy definition
      ansible.builtin.command: >-
        az policy definition create
        --name "temp-deny-creation-{{ guid }}"
        --subscription "{{ pool_subscription_id }}"
        --display-name "Temporary deny all resource creation (cleanup {{ guid }})"
        --mode All
        --rules @/tmp/deny-policy-rules-{{ guid }}.json
      register: r_deny_policy_def

    - name: Assign deny-all-creation policy to subscription
      when: r_deny_policy_def is not failed
      ansible.builtin.command: >-
        az policy assignment create
        --name "temp-deny-creation-{{ guid }}"
        --scope "{{ subscriptionfqid }}"
        --policy "temp-deny-creation-{{ guid }}"
        --enforcement-mode Default
      register: r_deny_policy_assign

    - name: Remove deny policy temp file
      ansible.builtin.file:
        path: "/tmp/deny-policy-rules-{{ guid }}.json"
        state: absent

    # ── Phase 2: Revoke user access ──
    # With deny policy propagating, now remove RBAC and delete the SP.
    # RBAC removal is immediate for new auth checks; SP deletion invalidates
    # the identity. Together with the deny policy, this closes the window
    # where users could create resources during cleanup.

    - name: Ensure pool manager SP has direct Owner on subscription
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      azure.azcollection.azure_rm_roleassignment:
        auth_source: env
        scope: "{{ subscriptionfqid }}"
        assignee_object_id: "{{ azure_open_env_app_id }}"
        role_definition_id:
          "/subscriptions/{{ pool_subscription_id }}/providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635"
        state: present

    - name: Get all direct role assignments for the subscription
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      azure.azcollection.azure_rm_roleassignment_info:
        auth_source: env
        scope: "{{ subscriptionfqid }}"
        strict_scope_match: True
      register: role_assignments

    - name: Remove non-pool-manager role assignments from the subscription
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      when: item.assignee_object_id != azure_open_env_app_id
      azure.azcollection.azure_rm_roleassignment:
        auth_source: env
        id: "{{ item.id }}"
        state: absent
      loop: "{{ role_assignments.roleassignments }}"

    - name: Find open environment app registrations by name
      ansible.builtin.command: >-
        az ad app list
        --filter "displayName eq 'api://openenv-{{ guid }}' or displayName eq 'api://openenv-aro-{{ guid }}'"
        --query "[].id" -o tsv
      register: r_openenv_app_ids
      changed_when: false

    - name: Delete open environment app registrations
      when: r_openenv_app_ids.stdout_lines | length > 0
      ansible.builtin.command: >-
        az rest --method DELETE --url https://graph.microsoft.com/v1.0/applications/{{ item }}
      loop: "{{ r_openenv_app_ids.stdout_lines }}"

    # ── Phase 3: Clean up DNS and resource groups ──

    - name: Clean up DNS zone
      command: >
        az network dns zone delete
          -g openenv-{{ guid }}
          -n {{ guid }}.{{ azure_root_dns_zone }}
          -y
          --subscription {{ pool_subscription_id }}
      ignore_errors: true

    - name: Delete NS record from DNS
      azure.azcollection.azure_rm_dnsrecordset:
        resource_group: "{{ azure_dns_resource_group }}"
        subscription_id: "{{ azure_subscription_id }}"
        record_type: NS
        relative_name: "{{ guid }}"
        zone_name: "{{ azure_root_dns_zone }}"
        state: absent

    - name: Get all resource groups in the subscription
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      azure.azcollection.azure_rm_resourcegroup_info:
        auth_source: env
        tenant: "{{ azure_tenant }}"
      register: allresourcegroups

    - name: Write out all resource groups
      debug:
        msg: "{{ allresourcegroups }}"

    - name: Empty Resource Group
      when: allresourcegroups.resourcegroups|length>0
      include_tasks: empty_resource_group.yml
      vars:
        az_resource_group: "{{ item.name }}"
      loop: "{{ allresourcegroups.resourcegroups }}"

    - name: Get list of all locks in the subscription (all scopes)
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      ansible.builtin.command: >
        az lock list --subscription {{ pool_subscription_id }}
        --query "[].{name:name, id:id, resourceGroup:resourceGroup}"
        -o json
      register: r_subscription_locks_raw
      changed_when: false

    - name: Set lock list fact
      ansible.builtin.set_fact:
        r_subscription_locks_list: "{{ r_subscription_locks_raw.stdout | from_json }}"

    - name: Delete all locks in the subscription (all scopes)
      when: r_subscription_locks_list | length > 0
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      ansible.builtin.command: >
        az lock delete --ids {{ item.id }}
      loop: "{{ r_subscription_locks_list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Split resource groups into VisualStudioOnline and regular
      ansible.builtin.set_fact:
        _vs_online_rgs: >-
          {{ allresourcegroups.resourcegroups
             | selectattr('name', 'match', '^VisualStudioOnline-')
             | list }}
        _regular_rgs: >-
          {{ allresourcegroups.resourcegroups
             | rejectattr('name', 'match', '^VisualStudioOnline-')
             | list }}

    - name: Delete regular resource groups (hard fail)
      when: _regular_rgs | length > 0
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      azure.azcollection.azure_rm_resourcegroup:
        auth_source: env
        name: "{{ item.name }}"
        location: "{{ item.location }}"
        force_delete_nonempty: yes
        state: absent
      loop: "{{ _regular_rgs }}"

    - name: Delete VisualStudioOnline resource groups (best-effort)
      when: _vs_online_rgs | length > 0
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      azure.azcollection.azure_rm_resourcegroup:
        auth_source: env
        name: "{{ item.name }}"
        location: "{{ item.location }}"
        force_delete_nonempty: yes
        state: absent
      register: r_delete_vs_rgs
      failed_when: false
      loop: "{{ _vs_online_rgs }}"

    - name: Report VisualStudioOnline resource groups that failed to delete
      when:
        - r_delete_vs_rgs.results is defined
        - r_delete_vs_rgs.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
      vars:
        _failed_rgs: >-
          {{ r_delete_vs_rgs.results
             | selectattr('failed', 'defined')
             | selectattr('failed')
             | map(attribute='item')
             | map(attribute='name')
             | list }}
      ansible.builtin.debug:
        msg: >-
          WARNING: Failed to delete VisualStudioOnline resource group(s): {{ _failed_rgs | join(', ') }}.
          This is typically caused by Azure DevOps billing still linked to the subscription.
          Billing must be removed manually via Azure DevOps Organization Settings > Billing.

    # ── Phase 4: Second-pass to catch resource groups created during cleanup ──

    - name: "Second pass: list any remaining resource groups"
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      azure.azcollection.azure_rm_resourcegroup_info:
        auth_source: env
        tenant: "{{ azure_tenant }}"
      register: remaining_resourcegroups

    - name: "Second pass: report straggler resource groups"
      when: remaining_resourcegroups.resourcegroups | length > 0
      ansible.builtin.debug:
        msg: >-
          Found {{ remaining_resourcegroups.resourcegroups | length }} resource group(s) created
          after initial listing: {{ remaining_resourcegroups.resourcegroups | map(attribute='name') | list | join(', ') }}.
          Deleting stragglers now.

    - name: "Second pass: delete straggler resource groups"
      when: remaining_resourcegroups.resourcegroups | length > 0
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ pool_subscription_id }}"
      azure.azcollection.azure_rm_resourcegroup:
        auth_source: env
        name: "{{ item.name }}"
        location: "{{ item.location }}"
        force_delete_nonempty: yes
        state: absent
      loop: "{{ remaining_resourcegroups.resourcegroups }}"

    # ── Phase 5: Finalize subscription and release pool ──

    - name: Remove deny-all-creation policy assignment
      when: r_deny_policy_assign is not skipped and r_deny_policy_assign is not failed
      ansible.builtin.command: >-
        az policy assignment delete
        --name "temp-deny-creation-{{ guid }}"
        --scope "{{ subscriptionfqid }}"
      ignore_errors: true

    - name: Remove deny-all-creation policy definition
      when: r_deny_policy_def is not failed
      ansible.builtin.command: >-
        az policy definition delete
        --name "temp-deny-creation-{{ guid }}"
        --subscription "{{ pool_subscription_id }}"
      ignore_errors: true

    - name: Initialize all tags we care about on the Subscription
      command: >
        az tag create --resource-id {{ subscriptionfqid }} --tags GUID="" EMAIL="" cost-center="{{ cost_center }}"

    - name: Remove pool allocation from the database
      ansible.builtin.uri:
        url: "{{ az_function_release }}{{ project_tag }}/{{ az_pool_id }}?code={{ azure_pool_api_secret }}"
      ignore_errors: yes

    - name: Log out of Azure CLI
      command: >
        az logout

    - name: Fail if any VisualStudioOnline resource groups could not be deleted
      when:
        - r_delete_vs_rgs.results is defined
        - r_delete_vs_rgs.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
      vars:
        _failed_rgs: >-
          {{ r_delete_vs_rgs.results
             | selectattr('failed', 'defined')
             | selectattr('failed')
             | map(attribute='item')
             | map(attribute='name')
             | list }}
      ansible.builtin.fail:
        msg: >-
          VisualStudioOnline resource group(s) could not be deleted: {{ _failed_rgs | join(', ') }}.
          All other cleanup (pool release, tags, role assignments) completed successfully.
          Manual cleanup required — remove Azure DevOps billing via Organization Settings.
