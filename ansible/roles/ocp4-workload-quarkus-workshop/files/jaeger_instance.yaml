---
apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: jaeger
spec:
  strategy: allInOne
  storage:
    type: memory
  ingress:
    security: none
  allInOne:
    # Jaeger operator v1.65 injects --reporter.grpc.tls.* flags on OpenShift,
    # but Jaeger >=1.63 removed those flags from all-in-one (jaeger-operator#2814).
    # Pin to the last image that still supports them.
    image: jaegertracing/all-in-one:1.62.0
