---
apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: jaeger
spec:
  strategy: allInOne
  storage:
    type: memory
  ingress:
    security: none
  allInOne:
    # Jaeger operator v1.65 injects deprecated --reporter.grpc.tls.* flags on
    # OpenShift that Jaeger v1.65.0 no longer supports (jaeger-operator#2814).
    # Setting host-port prevents that injection.
    options:
      reporter.grpc.host-port: ":14250"
