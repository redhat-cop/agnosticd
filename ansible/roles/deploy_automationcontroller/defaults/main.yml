---

deploy_automationcontroller_installer_url: ""
deploy_automationcontroller_manifest_url: ""

deploy_automationcontroller_admin_user: "{{ automationcontroller_admin_user | default('admin') }}"
deploy_automationcontroller_admin_password: "{{ automationcontroller_admin_password | default(common_password) }}"

aap_deploy_insights: false

# Controller type for execution node configurations
aap_deploy_controller_type: hybrid

# Registry configuration
registry_url: "registry.redhat.io"
registry_username: ""
registry_password: ""

# packages, libraries, installer vars

deploy_automationcontroller_pip_packages:
  - pip
  - setuptools
  - wheel
  - ansible>=2.14
  - requests
  - ansible-tower-cli

deploy_automationcontroller_dnf_packages:
  - python3.9
  - podman
  - crun

deploy_automationcontroller_dnf_gpgcheck: 0

# AAP Version Detection
# Explicit version override (for URLs like bundle-latest.tar.gz)
# Set to "2.5" or higher to enable AAP 2.5+ template with gateway support
deploy_automationcontroller_aap_version: ""

# Containerized Installation
deploy_automationcontroller_bundle_install: false
deploy_automationcontroller_bundle_dir: ""

# TLS Configuration (containerized deployments)
deploy_automationcontroller_gateway_tls_cert: ""
deploy_automationcontroller_gateway_tls_key: ""

# EDA Configuration
deploy_automationcontroller_eda_admin_password: "{{ deploy_automationcontroller_admin_password }}"
