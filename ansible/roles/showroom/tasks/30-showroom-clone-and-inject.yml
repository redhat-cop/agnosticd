---
- name: Clone and Inject Showroom repo and vars
  block:

    - name: Clone showroom primary repo - lab content in adoc
      ansible.builtin.git:
        repo: "{{ showroom_git_repo }}"
        dest: "{{ showroom_user_content_dir }}"
        force: true
        version: "{{ showroom_git_ref | default(showroom_git_tag) | default('main') }}"
      become_user: "{{ showroom_user }}"

    - name: Setup and inject userdata into showroom repo
      when: showroom_var_inject | default(true) | bool
      block:

        - name: Set f_user_data
          set_fact:
            f_user_data: "{{ lookup('agnosticd_user_data', '*') | from_yaml }}"

        - name: Determine Antora content start_path
          block:

            - name: Build Antora playbook candidates
              ansible.builtin.set_fact:
                f_antora_playbook_candidates:
                  - "{{ showroom_user_content_dir }}/default-site.yml"
                  - "{{ showroom_user_content_dir }}/{{ showroom_ui }}-site.yml"

            - name: Check Antora playbook candidates on remote
              ansible.builtin.stat:
                path: "{{ item }}"
              loop: "{{ f_antora_playbook_candidates }}"
              register: r_antora_pb_stats

            - name: Set Antora playbook path if present
              ansible.builtin.set_fact:
                f_antora_playbook: >-
                  {{ (r_antora_pb_stats.results
                      | selectattr('stat.exists')
                      | map(attribute='item')
                      | list | first) | default('', true) }}

            - name: Load Antora playbook when present
              when: f_antora_playbook != ''
              ansible.builtin.include_vars:
                file: "{{ f_antora_playbook }}"
                name: f_antora_playbook_data

            - name: Compute Antora content start_path (default to 'content')
              ansible.builtin.set_fact:
                f_content_start_path: >-
                  {{
                    (f_antora_playbook != '')
                    | ternary(
                        ((f_antora_playbook_data.content | default({})).sources | default([])
                          | map(attribute='start_path') | list | first | default('content')),
                        'content'
                      )
                  }}

        - name: Load antora.yml from the showroom content dir
          ansible.builtin.include_vars:
            file: "{{ showroom_user_content_dir }}/{{ f_content_start_path | default('content') }}/antora.yml"
            name: __src

        - name: Write merged_vars to a file
          ansible.builtin.copy:
            content: >-
              {{ __src | combine(__attribute_user_data, recursive=true) | to_nice_yaml(indent=2) }}
            dest: "{{ showroom_user_content_dir }}/{{ f_content_start_path | default('content') }}/antora.yml"
            owner: "{{ showroom_user }}"
            group: "{{ showroom_user_group | default(showroom_user) }}"
            mode: "0644"
          vars:
            __attribute_user_data:
              asciidoc:
                attributes: "{{ f_user_data }}"

