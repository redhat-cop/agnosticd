---
# Post-workload tasks for namespaced example

- name: Verify deployment is ready
  kubernetes.core.k8s_info:
    host: "{{ sandbox_openshift_api_url }}"
    api_key: "{{ sandbox_openshift_api_token | default(omit) }}"
    username: "{{ sandbox_openshift_user | default(omit) }}"
    password: "{{ sandbox_openshift_password | default(omit) }}"
    validate_certs: false
    api_version: apps/v1
    kind: Deployment
    name: "{{ ocp_workloads_namespaced_example.app_name }}"
    namespace: "{{ sandbox_openshift_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  register: deployment_status

- name: Get route URL if route was created
  when: ocp_workloads_namespaced_example.create_route | bool
  kubernetes.core.k8s_info:
    host: "{{ sandbox_openshift_api_url }}"
    api_key: "{{ sandbox_openshift_api_token | default(omit) }}"
    username: "{{ sandbox_openshift_user | default(omit) }}"
    password: "{{ sandbox_openshift_password | default(omit) }}"
    validate_certs: false
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ ocp_workloads_namespaced_example.app_name }}-route"
    namespace: "{{ sandbox_openshift_namespace }}"
  register: route_info

- name: Display application access information
  debug:
    msg:
      - "Application '{{ ocp_workloads_namespaced_example.app_name }}' deployed successfully!"
      - "Namespace: {{ sandbox_openshift_namespace }}"
      - "Deployment status: {{ deployment_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Available') | map(attribute='status') | first | default('Unknown') }}"
      - "Ready replicas: {{ deployment_status.resources[0].status.readyReplicas | default(0) }}/{{ ocp_workloads_namespaced_example.app_replicas }}"
      - "{% if ocp_workloads_namespaced_example.create_route and route_info.resources | length > 0 %}Application URL: http://{{ route_info.resources[0].spec.host }}{% endif %}"
  when: not silent | bool

- name: post_workload tasks complete
  debug:
    msg: "Post-Workload tasks completed successfully."
  when: not silent | bool
