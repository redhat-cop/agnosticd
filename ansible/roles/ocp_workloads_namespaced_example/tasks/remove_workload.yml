---
# Workload removal tasks demonstrating both oc command and kubernetes.core approaches

# Use oc command for authentication (consistent with deployment)
- name: Login to OpenShift cluster with token for removal
  ansible.builtin.shell: |
    oc login --server={{ sandbox_openshift_api_url }} \
      --token={{ sandbox_openshift_api_token }} \
      --insecure-skip-tls-verify=true
  when: sandbox_openshift_api_token | default('') | length > 0
  no_log: true
  register: oc_login_result
  retries: 3
  delay: 10
  until: oc_login_result.rc == 0

- name: Login to OpenShift cluster with username/password for removal
  ansible.builtin.shell: |
    oc login --server={{ sandbox_openshift_api_url }} \
      --username={{ sandbox_openshift_user }} \
      --password={{ sandbox_openshift_password }} \
      --insecure-skip-tls-verify=true
  when: 
    - sandbox_openshift_api_token | default('') | length == 0
    - sandbox_openshift_user | default('') | length > 0
  no_log: true
  register: oc_login_user_result
  retries: 3
  delay: 10
  until: oc_login_user_result.rc == 0

- name: Set target namespace for removal
  ansible.builtin.shell: oc project {{ sandbox_openshift_namespace }}
  register: oc_project_result
  retries: 3
  delay: 5
  until: oc_project_result.rc == 0

# Use kubernetes.core module for route removal (consistent with deployment approach)
- name: Remove Route using kubernetes.core module
  when: ocp_workloads_namespaced_example_defaults.create_route | bool
  kubernetes.core.k8s:
    host: "{{ sandbox_openshift_api_url }}"
    api_key: "{{ sandbox_openshift_api_token | default(omit) }}"
    username: "{{ sandbox_openshift_user | default(omit) }}"
    password: "{{ sandbox_openshift_password | default(omit) }}"
    validate_certs: false
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ ocp_workloads_namespaced_example_defaults.app_name }}-route"
    namespace: "{{ sandbox_openshift_namespace }}"
    state: absent
  register: route_delete_result

# Use kubernetes.core module for standard Kubernetes resources
- name: Remove Service using kubernetes.core module
  kubernetes.core.k8s:
    host: "{{ sandbox_openshift_api_url }}"
    api_key: "{{ sandbox_openshift_api_token | default(omit) }}"
    username: "{{ sandbox_openshift_user | default(omit) }}"
    password: "{{ sandbox_openshift_password | default(omit) }}"
    validate_certs: false
    api_version: v1
    kind: Service
    name: "{{ ocp_workloads_namespaced_example_defaults.app_name }}-service"
    namespace: "{{ sandbox_openshift_namespace }}"
    state: absent

- name: Remove Deployment using kubernetes.core module
  kubernetes.core.k8s:
    host: "{{ sandbox_openshift_api_url }}"
    api_key: "{{ sandbox_openshift_api_token | default(omit) }}"
    username: "{{ sandbox_openshift_user | default(omit) }}"
    password: "{{ sandbox_openshift_password | default(omit) }}"
    validate_certs: false
    api_version: apps/v1
    kind: Deployment
    name: "{{ ocp_workloads_namespaced_example_defaults.app_name }}"
    namespace: "{{ sandbox_openshift_namespace }}"
    state: absent
    wait: true
    wait_timeout: 300

# Verify removal using oc command
- name: Verify all resources are removed using oc command
  ansible.builtin.shell: |
    oc get deployment,service,route -l app={{ ocp_workloads_namespaced_example_defaults.app_name }} \
      -n {{ sandbox_openshift_namespace }} --ignore-not-found=true
  register: verify_removal_result

- name: Display removal summary
  debug:
    msg:
      - "=== Removal Summary ==="
      - "Application '{{ ocp_workloads_namespaced_example_defaults.app_name }}' removal completed"
      - "Namespace: {{ sandbox_openshift_namespace }}"
      - ""
      - "=== Methods Demonstrated ==="
      - "Authentication: oc login command"
      - "Route, Service & Deployment removal: kubernetes.core.k8s module"
      - "Verification: oc get command"
      - ""
      - "Remaining resources: {{ verify_removal_result.stdout | default('None') }}"
  when: not silent | bool

- name: Send removal status to AgnosticD UI
  agnosticd_user_info:
    msg: "Namespaced workload '{{ ocp_workloads_namespaced_example_defaults.app_name }}' removed successfully."
    data:
      workload_name: "{{ ocp_workloads_namespaced_example_defaults.app_name }}"
      namespace: "{{ sandbox_openshift_namespace }}"
      removal_method: "kubernetes.core.k8s module"
      remaining_resources: "{{ verify_removal_result.stdout | default('None') }}"
      openshift_cluster: "{{ sandbox_openshift_api_url }}"
      removal_status: "completed"

- name: Workload removal complete
  debug:
    msg: "Workload '{{ ocp_workloads_namespaced_example_defaults.app_name }}' removed successfully using kubernetes.core approach"
  when: not silent | bool
