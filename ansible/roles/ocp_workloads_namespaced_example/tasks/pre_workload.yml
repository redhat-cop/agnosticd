---
# Pre-workload tasks for namespaced example

- name: Set up workload for namespace deployment
  debug:
    msg: "Setting up namespaced workload - no bastion or SSH access required"

# Set up the combined dictionary for the workload
- name: Set up ocp_workloads_namespaced_example combined dictionary
  set_fact:
    ocp_workloads_namespaced_example: >-
      {{ ocp_workloads_namespaced_example_defaults
       | combine(ocp_workloads_namespaced_example_vars    | default( {} ),
                 ocp_workloads_namespaced_example_secrets | default( {} ), recursive=true )
      }}

# Validate required connection parameters
- name: Validate OpenShift connection parameters
  assert:
    that:
      - sandbox_openshift_api_url | default('') | length > 0
      - sandbox_openshift_namespace | default('') | length > 0
      - (sandbox_openshift_api_token | default('') | length > 0) or (sandbox_openshift_user | default('') | length > 0 and sandbox_openshift_password | default('') | length > 0)
    fail_msg: "Required OpenShift connection parameters are missing. Need sandbox_openshift_api_url, sandbox_openshift_namespace, and either sandbox_openshift_api_token or sandbox_openshift_user/sandbox_openshift_password"

# Print combined role variables (verbosity 2 to hide secrets)
- name: Print combined role variables
  debug:
    var: ocp_workloads_namespaced_example
    verbosity: 2

- name: pre_workload tasks complete
  debug:
    msg: "Pre-Workload tasks completed successfully."
  when: not silent | bool
