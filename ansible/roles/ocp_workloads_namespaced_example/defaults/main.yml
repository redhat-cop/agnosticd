---
become_override: false
silent: false

# Default values for the namespaced example workload
ocp_workloads_namespaced_example_defaults:
  app_name: "hello-world"
  app_image: "quay.io/redhattraining/hello-world-nginx:v1.0"
  app_replicas: 1
  service_port: 8080
  create_route: true
  route_path: "/"
  resource_limits:
    cpu: "100m"
    memory: "128Mi"
  resource_requests:
    cpu: "50m"
    memory: "64Mi"
