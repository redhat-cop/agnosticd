---
# Default variables for network_ssh_config role

# Student user name (should be set by control-user role)
student_name: lab-user

# Environment authorized key name (should be set by environment)
env_authorized_key: "{{ guid }}key"

# Network device default settings
network_device_user: "{{ student_name }}"
network_device_ssh_timeout: 30
network_device_keepalive: 30

# Cisco specific settings
cisco_enable_password: "{{ common_password | default('admin') }}"
