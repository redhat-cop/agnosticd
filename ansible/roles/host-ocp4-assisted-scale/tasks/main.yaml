---
- name: Log in (obtain access token)
  community.okd.openshift_auth:
    username: "{{ sandbox_openshift_username }}"
    password: "{{ sandbox_openshift_password }}"
    host: "{{ sandbox_openshift_api_url }}"
  register: k8s_auth_results
  when: sandbox_openshift_username | default(false)

- name: Destroy OCP using Assisted Installed
  module_defaults:
    group/k8s:
      host: "{{ sandbox_openshift_api_url }}"
      api_key: "{{ k8s_auth_results.k8s_auth.api_key|default(sandbox_openshift_api_key) }}"
      validate_certs: false

  block:
    - name: Get a list of clusters
      rhpds.assisted_installer.list_clusters:
        offline_token: "{{ ai_offline_token }}"
        owner: true
      register: r_list_clusters

    - name: Filter the created clusters
      ansible.builtin.set_fact:
        cluster: "{{ item }}"
      when: item.name == cluster_name and item.status == "installed"
      loop: "{{ r_list_clusters.result }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Import cluster
      rhpds.assisted_installer.import_cluster:
        offline_token: "{{ offline_token }}"
        cluster_name: "{{ cluster_name }}"
        api_vip_dnsname: "api.{{ cluster.base_dns_domain }}"
        openshift_cluster_id: "{{ cluster.openshift_cluster_id }}"
      register: r_import_cluster

    - name: Debug r_import_cluster
      ansible.builtin.debug:
        var: r_import_cluster
