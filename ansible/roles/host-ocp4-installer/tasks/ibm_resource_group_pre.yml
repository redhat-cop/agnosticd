---
- name: Get RELEASE_IMAGE
  ansible.builtin.shell: openshift-install version | awk '/release image/ {print $3}'
  register: r_release_image

- name: Generate /tmp/pull-secret.txt
  ansible.builtin.copy:
    content: "{{ ocp4_pull_secret | to_json if ocp4_pull_secret is mapping else ocp4_pull_secret }}"
    dest: /tmp/pull-secret.txt

- name: Get CCO_IMAGE
  ansible.builtin.shell: oc adm release info --image-for='cloud-credential-operator' quay.io/openshift-release-dev/ocp-release@sha256:91037938dc2ebc2732e7baa6eb4192fa4376abab19f0f545848a87ab7c91931d -a /tmp/pull-secret.txt
  environment:
    OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: quay.io/openshift-release-dev/ocp-release:4.18.4-x86_64
  register: r_cco_image

- name: Extract ccoctl tool
  ansible.builtin.shell: |
    oc image extract {{ r_cco_image.stdout }} \
    --file="/usr/bin/ccoctl.rhel9" \
    -a /tmp/pull-secret.txt
  environment:
    OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: quay.io/openshift-release-dev/ocp-release:4.18.4-x86_64

- name: Copy ccoctl tool
  ansible.builtin.copy:
    remote_src: true
    src: ccoctl.rhel9
    dest: /home/{{ ansible_user }}/ccoctl
    mode: 0755

- name: Download OCP install (TODO)
  become: true
  ansible.builtin.get_url:
    url: https://lab.oforte.net/ccoctl
    dest: /home/{{ ansible_user }}/ccoctl
    mode: 0755


- name: Extract credentials
  ansible.builtin.shell: |
    oc adm release extract --cloud=ibmcloud --credentials-requests \
      quay.io/openshift-release-dev/ocp-release@sha256:91037938dc2ebc2732e7baa6eb4192fa4376abab19f0f545848a87ab7c91931d \
      --to=/home/{{ ansible_user }}/{{ cluster_name }}/credentials/
  environment:
    OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: quay.io/openshift-release-dev/ocp-release:4.18.4-x86_64

- name: Create IBMMService IDs
  environment:
    IBMCLOUD_API_KEY: "{{ ibmcloud_api_key }}"
  ansible.builtin.shell: |
    /home/{{ ansible_user }}/ccoctl ibmcloud create-service-id \
      --credentials-requests-dir=/home/{{ ansible_user }}/{{ cluster_name }}/credentials/ \
      --name={{ cluster_name }} \
      --output-dir=/home/{{ ansible_user }}/{{ cluster_name }}/ \
      --resource-group-name={{ ibmcloud_resource_group_name }}
  environment:
    IC_API_KEY: "{{ ibmcloud_api_key | default(omit) }}"    
