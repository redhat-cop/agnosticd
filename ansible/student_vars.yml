---
# Student Provisioning Variables for ADS Workshop
# Usage:
#   ansible-playbook provision_students.yml -e @student_vars.yml -e ACTION=create
#   ansible-playbook provision_students.yml -e @student_vars.yml -e ACTION=remove

# =============================================================================
# REQUIRED VARIABLES - YOU MUST SET THESE
# =============================================================================

# Workshop GUID (must match platform setup)
guid: ads-workshop-001

# Number of students to provision
num_users: 3

# =============================================================================
# COMMON PASSWORD (from common.yaml)
# =============================================================================
# In production, this is: "{{ (guid[:5] | hash('md5') | int(base=16) | b64encode)[:8] }}"
# For testing, we'll use a simple password
common_password: openshift

# =============================================================================
# STUDENT CONFIGURATION (from common.yaml lines 231-236)
# =============================================================================
ocp4_workload_advanced_developer_suite_user_base_name: user
ocp4_workload_advanced_developer_suite_user_password: "{{ common_password }}"
ocp4_workload_advanced_developer_suite_user_count: "{{ num_users }}"
ocp4_workload_advanced_developer_suite_admin_user: admin
ocp4_workload_advanced_developer_suite_admin_password: "{{ common_password }}"

# =============================================================================
# NAMESPACE CONFIGURATION (from common.yaml)
# =============================================================================
ocp4_workload_advanced_developer_suite_keycloak_namespace: tssc-keycloak
ocp4_workload_advanced_developer_suite_dh_namespace: tssc-dh
ocp4_workload_advanced_developer_suite_gitlab_namespace: gitlab
ocp4_workload_advanced_developer_suite_jenkins_namespace: jenkins
ocp4_workload_advanced_developer_suite_acs_namespace: tssc-acs
ocp4_workload_advanced_developer_suite_tssc_gitops_namespace: tssc-gitops
ocp4_workload_advanced_developer_suite_tssc_tpa_namespace: tssc-tpa
ocp4_workload_advanced_developer_suite_devspaces_namespace: openshift-devspaces
ocp4_workload_advanced_developer_suite_quay_namespace: quay-enterprise

# =============================================================================
# QUAY CONFIGURATION (from common.yaml lines 307-309)
# =============================================================================
ocp4_workload_advanced_developer_suite_quay_admin_user: quayadmin
ocp4_workload_advanced_developer_suite_quay_admin_password: "{{ common_password }}"

# =============================================================================
# ACS CONFIGURATION
# =============================================================================
ocp4_workload_advanced_developer_suite_acs_admin_user: admin

# =============================================================================
# SHOWROOM CONFIGURATION (from common.yaml lines 488-496)
# =============================================================================
ocp4_workload_showroom_namespace: showroom
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-ads-workshop.git
ocp4_workload_showroom_content_git_repo_ref: main
ocp4_workload_showroom_deployer_chart_name: zerotouch
ocp4_workload_showroom_deployer_chart_version: "1.9.13"
ocp4_workload_showroom_zero_touch_ui_enabled: "true"
ocp4_workload_showroom_content_image: quay.io/rhpds/showroom-content:v1.2.0
ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.0.5/nookbag-v0.0.5.zip"
ocp4_workload_showroom_deployment_type: helm
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer

# =============================================================================
# CLUSTER RESOURCE QUOTAS (NEW)
# =============================================================================
# Enable cluster-level resource quotas per student
ocp4_workload_advanced_developer_suite_enable_cluster_quotas: true

# Compute Resource Quotas (per student, across all their namespaces)
ocp4_workload_advanced_developer_suite_cpu_requests: "2000m"      # 2 CPU cores requested
ocp4_workload_advanced_developer_suite_cpu_limits: "4000m"        # 4 CPU cores limit
ocp4_workload_advanced_developer_suite_memory_requests: "4Gi"     # 4GB RAM requested
ocp4_workload_advanced_developer_suite_memory_limits: "8Gi"       # 8GB RAM limit

# Storage Resource Quotas
ocp4_workload_advanced_developer_suite_storage_requests: "10Gi"   # 10GB storage total
ocp4_workload_advanced_developer_suite_pvc_count: "5"             # Max 5 PVCs

# Object Count Limits (across all user's namespaces)
ocp4_workload_advanced_developer_suite_max_pods: "20"             # Max 20 pods
ocp4_workload_advanced_developer_suite_max_services: "10"         # Max 10 services
ocp4_workload_advanced_developer_suite_max_secrets: "20"          # Max 20 secrets
ocp4_workload_advanced_developer_suite_max_configmaps: "20"       # Max 20 configmaps
ocp4_workload_advanced_developer_suite_max_deployments: "10"      # Max 10 deployments
ocp4_workload_advanced_developer_suite_max_routes: "20"           # Max 20 routes

# ArgoCD Application Limits
ocp4_workload_advanced_developer_suite_max_argocd_apps: "10"      # Max 10 ArgoCD apps per student

# =============================================================================
# OPTIONAL: STANDALONE MODE CONFIGURATION
# =============================================================================
# If running against external cluster, uncomment and set these:
# openshift_api_key: "eyJhbGciOiJSUzI1NiIsImtpZCI6..."
# openshift_api_url: "https://api.cluster-abc123.example.com:6443"
# openshift_api_ca_cert: |
#   -----BEGIN CERTIFICATE-----
#   MIIDDDCCAfSgAwIBAgIBATANBgkqhkiG9w...
#   -----END CERTIFICATE-----

# =============================================================================
# USAGE SCENARIOS
# =============================================================================
#
# Scenario 1: Provision 3 Students (default)
#   ansible-playbook provision_students.yml -e @student_vars.yml -e ACTION=create
#
# Scenario 2: Single Student
#   ansible-playbook provision_students.yml -e @student_vars.yml -e num_users=1 -e ACTION=create
#
# Scenario 3: Many Students (10)
#   ansible-playbook provision_students.yml -e @student_vars.yml -e num_users=10 -e ACTION=create
#
# Scenario 4: Custom Username Pattern
#   ansible-playbook provision_students.yml -e @student_vars.yml \
#     -e ocp4_workload_advanced_developer_suite_user_base_name=student -e ACTION=create
#
# Scenario 5: Disable Cluster Quotas
#   ansible-playbook provision_students.yml -e @student_vars.yml \
#     -e ocp4_workload_advanced_developer_suite_enable_cluster_quotas=false -e ACTION=create
#
# Scenario 6: Remove All Students
#   ansible-playbook provision_students.yml -e @student_vars.yml -e ACTION=remove
#
# Scenario 7: Custom Resource Limits
#   ansible-playbook provision_students.yml -e @student_vars.yml \
#     -e ocp4_workload_advanced_developer_suite_cpu_limits=8000m \
#     -e ocp4_workload_advanced_developer_suite_memory_limits=16Gi \
#     -e ACTION=create
