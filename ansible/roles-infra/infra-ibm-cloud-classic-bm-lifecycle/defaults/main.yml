---
# Default variables for IBM Cloud Classic Baremetal lifecycle management

# IBM Cloud API key for authentication (required)
# ibm_cloud_api_key: "YOUR_IBM_CLOUD_API_KEY"

# IBM Cloud server ID for the bare metal server (required)
# ibm_cloud_server_id: "YOUR_SERVER_ID"

# Default action if not specified
ACTION: "status"

# Default verbosity level
verbosity: 0 