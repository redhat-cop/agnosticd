---
- name: Get bastion VM detailed status
  ansible.builtin.command: ibmcloud sl vs detail {{ hostvars[groups['bastions'][0]].vm_id }} --output json
  register: bastion_vm_detail_check
  changed_when: false
  failed_when: false
  when: 
    - groups['bastions'] is defined
    - groups['bastions'] | length > 0

- name: Parse bastion VM detailed status
  ansible.builtin.set_fact:
    bastion_vm_power_state: "{{ (bastion_vm_detail_check.stdout | from_json).powerState.keyName }}"
  when: 
    - bastion_vm_detail_check is defined
    - bastion_vm_detail_check.rc == 0
    - bastion_vm_detail_check.stdout != ""

- name: Start bastion VM if not running
  ansible.builtin.command: ibmcloud sl vs power-on {{ hostvars[groups['bastions'][0]].vm_id }} --force
  register: bastion_start_result
  changed_when: bastion_start_result.rc == 0
  failed_when: false
  when: 
    - bastion_vm_power_state is defined
    - bastion_vm_power_state != "RUNNING"

- name: Wait for VM to start up
  ansible.builtin.pause:
    seconds: 30
    prompt: "Waiting for bastion VM to start up..."
  when: 
    - bastion_start_result is defined
    - bastion_start_result.rc is defined
    - bastion_start_result.rc == 0

- name: Check bastion VM status after start attempt
  ansible.builtin.command: ibmcloud sl vs detail {{ hostvars[groups['bastions'][0]].vm_id }} --output json
  register: bastion_vm_post_start_check
  changed_when: false
  failed_when: false
  when: 
    - groups['bastions'] is defined
    - groups['bastions'] | length > 0
    - bastion_vm_power_state is defined

- name: Parse post-start bastion VM status
  ansible.builtin.set_fact:
    bastion_vm_final_state: "{{ (bastion_vm_post_start_check.stdout | from_json).powerState.keyName }}"
  when: 
    - bastion_vm_post_start_check is defined
    - bastion_vm_post_start_check.rc == 0
    - bastion_vm_post_start_check.stdout != "" 