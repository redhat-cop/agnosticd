---
- include_tasks: initialize.yml

- when:
    - ACTION == 'start'
  block:
    - include_tasks: discover_vm_inventory.yml
    - include_tasks: start_vm_dependency.yml
    - include_tasks: wait_for_bastion_https.yml
    - name: Power on BM server via Redfish Power Management (HAProxy)
      include_role:
        name: infra-redfish-power-management
      vars:
        bmc_hostname: "{{ hostvars[groups['bastions'][0]]['ansible_host'] }}"
        bmc_username: "{{ bm_server_info.remote_mgmt_user }}"
        bmc_password: "{{ bm_server_info.remote_mgmt_password }}"
        power_action: "on"
      when: 
        - groups['bastions'] is defined
        - groups['bastions'] | length > 0
        - bm_server_info is defined
        - bm_server_info.remote_mgmt_ip is defined
        - bm_server_info.remote_mgmt_user is defined
        - bm_server_info.remote_mgmt_password is defined

- when:
    - ACTION == 'stop'
  block:
    - include_tasks: discover_vm_inventory.yml
    - include_tasks: start_vm_dependency.yml
    - include_tasks: wait_for_bastion_https.yml
    - name: Check current BM power state before stop operation
      ansible.builtin.uri:
        url: "https://{{ hostvars[groups['bastions'][0]]['ansible_host'] }}/redfish/v1/Systems/1"
        method: GET
        user: "{{ bm_server_info.remote_mgmt_user }}"
        password: "{{ bm_server_info.remote_mgmt_password }}"
        validate_certs: false
        force_basic_auth: true
        status_code: 200
        timeout: 30
      register: bm_pre_stop_power_status
      failed_when: false
      when: 
        - groups['bastions'] is defined
        - groups['bastions'] | length > 0
        - bm_server_info is defined
        - bm_server_info.remote_mgmt_ip is defined
        - bm_server_info.remote_mgmt_user is defined
        - bm_server_info.remote_mgmt_password is defined
    - name: Power off BM server via Redfish Power Management (HAProxy) 
      include_role:
        name: infra-redfish-power-management
      vars:
        bmc_hostname: "{{ hostvars[groups['bastions'][0]]['ansible_host'] }}"
        bmc_username: "{{ bm_server_info.remote_mgmt_user }}"
        bmc_password: "{{ bm_server_info.remote_mgmt_password }}"
        power_action: "off"
      when: 
        - groups['bastions'] is defined
        - groups['bastions'] | length > 0
        - bm_server_info is defined
        - bm_server_info.remote_mgmt_ip is defined
        - bm_server_info.remote_mgmt_user is defined
        - bm_server_info.remote_mgmt_password is defined
        - bm_pre_stop_power_status is succeeded
        - bm_pre_stop_power_status.json.PowerState == "On"
    - name: Display stop completion if already off
      agnosticd_user_info:
        msg: |
          🔌 BM Server {{ bm_server_info.hostname | default(bm_server_info.server_id) }} already powered off ✅
          Bastion VM remains running for BMC access
      when: 
        - bm_pre_stop_power_status is succeeded
        - bm_pre_stop_power_status.json.PowerState == "Off"

- when:
    - ACTION == 'status'
  block:
    - include_tasks: discover_vm_inventory.yml
    - include_tasks: start_vm_dependency.yml
    - include_tasks: wait_for_bastion_https.yml
    - name: Get BM power status via Redfish Power Management (HAProxy)
      include_role:
        name: infra-redfish-power-management
      vars:
        bmc_hostname: "{{ hostvars[groups['bastions'][0]]['ansible_host'] }}"
        bmc_username: "{{ bm_server_info.remote_mgmt_user }}"
        bmc_password: "{{ bm_server_info.remote_mgmt_password }}"
        power_action: "status"
      when: 
        - groups['bastions'] is defined
        - groups['bastions'] | length > 0
        - bm_server_info is defined
        - bm_server_info.remote_mgmt_ip is defined
        - bm_server_info.remote_mgmt_user is defined
        - bm_server_info.remote_mgmt_password is defined 