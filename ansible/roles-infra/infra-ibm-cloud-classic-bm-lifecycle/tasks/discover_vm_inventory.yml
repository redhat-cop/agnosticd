---
- name: List existing IBM Cloud Classic VMs
  ansible.builtin.command: ibmcloud sl vs list --output json
  register: existing_vms_result
  changed_when: false
  failed_when: false

- name: Parse existing VMs list
  ansible.builtin.set_fact:
    existing_vms: "{{ existing_vms_result.stdout | from_json }}"
  when: 
    - existing_vms_result.rc == 0
    - existing_vms_result.stdout != ""

- name: Set empty VMs list if no output or command failed
  ansible.builtin.set_fact:
    existing_vms: []
  when: 
    - existing_vms_result.rc != 0 or existing_vms_result.stdout == ""

- name: Filter VMs that might be bastion hosts
  ansible.builtin.set_fact:
    potential_bastions: "{{ existing_vms | selectattr('hostname', 'match', '.*bastion.*|.*bast.*') | list }}"
  when: existing_vms is defined

- name: Add discovered bastion VMs to inventory
  ansible.builtin.add_host:
    name: "{{ item.hostname }}"
    groups: "bastions"
    ansible_host: "{{ item.primaryIpAddress }}"
    ansible_user: "{{ ssh_user | default('root') }}"
    ansible_ssh_private_key_file: "{{ env_authorized_key_path }}"
    vm_id: "{{ item.id }}"
    vm_hostname: "{{ item.hostname }}"
    vm_domain: "{{ item.domain }}"
    vm_public_ip: "{{ item.primaryIpAddress }}"
    vm_private_ip: "{{ item.primaryBackendIpAddress | default('') }}"
    vm_status: "{{ item.status | default('unknown') }}"
    vm_datacenter: "{{ item.datacenter.name | default('unknown') }}"
    vm_cores: "{{ item.maxCpu | default(0) }}"
    vm_memory: "{{ item.maxMemory | default(0) }}"
  loop: "{{ potential_bastions }}"
  loop_control:
    label: "{{ item.hostname }}"
  when: 
    - potential_bastions is defined
    - potential_bastions | length > 0 