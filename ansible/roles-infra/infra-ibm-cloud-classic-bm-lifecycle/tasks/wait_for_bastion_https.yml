---
- name: Wait for bastion HAProxy HTTPS service to be ready
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['bastions'][0]]['ansible_host'] }}"
    port: 443
    delay: 5
    timeout: 180
    state: started
  register: https_wait_result
  when: 
    - groups['bastions'] is defined
    - groups['bastions'] | length > 0

- name: Test HTTPS connection to bastion HAProxy
  ansible.builtin.uri:
    url: "https://{{ hostvars[groups['bastions'][0]]['ansible_host'] }}/redfish/v1/"
    method: GET
    user: "{{ bm_server_info.remote_mgmt_user }}"
    password: "{{ bm_server_info.remote_mgmt_password }}"
    validate_certs: false
    force_basic_auth: true
    status_code: [200, 401, 403]  # Allow auth errors - we just want connectivity
    timeout: 30
  register: https_test_result
  retries: 3
  delay: 10
  until: https_test_result.status in [200, 401, 403]
  when: 
    - https_wait_result is succeeded
    - bm_server_info is defined
    - bm_server_info.remote_mgmt_user is defined
    - bm_server_info.remote_mgmt_password is defined

- name: Fail if HAProxy HTTPS is not responding
  ansible.builtin.fail:
    msg: |
      ❌ HAProxy HTTPS connectivity failed after timeout
      
      Host: {{ hostvars[groups['bastions'][0]]['ansible_host'] }}
      Port: 443 (HTTPS)
  when: 
    - https_wait_result is failed or https_test_result.status not in [200, 401, 403]