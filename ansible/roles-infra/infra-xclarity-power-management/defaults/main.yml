---
# XClarity Power Management Role - Defaults
# Converted from https://github.com/rut31337/lenovo-xclarity-ansible

## BMC Connection Variables (Required)
# These must be provided when calling the role
# bmc_hostname: "192.168.1.100"
# bmc_username: "admin"
# bmc_password: "password123"

## Redfish API Settings
validate_certs: false                     # Skip certificate validation for self-signed certs
force_basic_auth: true                    # Use basic authentication
connection_timeout: 30                    # Connection timeout in seconds

## Power State Monitoring
power_monitor_retries: 30                 # Number of retries for power state monitoring
power_monitor_delay: 5                    # Delay between power state checks in seconds 