---
# ============================================================================
# AWS Region Validation and Smart Selection Role
# ============================================================================

- name: Display AWS Region Validation starting
  debug:
    msg: "🔍 AWS Region Validation - Analyzing workload requirements for optimal region selection"

- name: Collect all workload variables for region analysis
  set_fact:
    workload_vars: "{{ hostvars[inventory_hostname] }}"

- name: Validate selected AWS region compatibility
  when: aws_region is defined
  block:
    - name: Validate region compatibility with workload requirements
      set_fact:
        aws_region_validation: "{{ aws_region | aws_validate_region_compatibility(workload_vars) }}"

    - name: Display validation results
      debug:
        msg: |
          🎯 AWS Region Validation Results:
          Selected Region: {{ aws_region_validation.selected_region }}
          Workload Type: {{ aws_region_validation.workload_type }}
          Compatible: {{ aws_region_validation.compatible }}
          {% if aws_region_validation.issues %}
          ❌ Issues Found:
          {% for issue in aws_region_validation.issues %}
          - {{ issue }}
          {% endfor %}
          {% endif %}
          {% if aws_region_validation.warnings %}
          ⚠️ Warnings:
          {% for warning in aws_region_validation.warnings %}
          - {{ warning }}
          {% endfor %}
          {% endif %}
          💡 Optimal Regions: {{ aws_region_validation.optimal_regions | join(', ') }}

    - name: Fail if region is incompatible
      fail:
        msg: |
          ❌ AWS Region {{ aws_region }} is not compatible with this workload!
          
          Issues:
          {% for issue in aws_region_validation.issues %}
          - {{ issue }}
          {% endfor %}
          
          Please select one of these compatible regions:
          {{ aws_region_validation.optimal_regions | join(', ') }}
      when: not aws_region_validation.compatible

    - name: Set validated region
      set_fact:
        aws_region_validated: "{{ aws_region }}"
        aws_region_final: "{{ aws_region }}"

- name: Auto-select optimal region when no region specified
  when: aws_region is not defined
  block:
    - name: Get optimal regions for workload
      set_fact:
        optimal_regions: "{{ workload_vars | aws_get_optimal_regions }}"

    - name: Auto-select best region
      set_fact:
        aws_region_auto_selected: "{{ workload_vars | aws_auto_select_region }}"

    - name: Display auto-selection results
      debug:
        msg: |
          🤖 AWS Region Auto-Selection Results:
          Auto-Selected Region: {{ aws_region_auto_selected }}
          Available Optimal Regions: {{ optimal_regions | join(', ') }}

    - name: Set auto-selected region
      set_fact:
        aws_region: "{{ aws_region_auto_selected }}"
        aws_region_validated: "{{ aws_region_auto_selected }}"
        aws_region_final: "{{ aws_region_auto_selected }}"

- name: Display final region selection
  debug:
    msg: |
      ✅ AWS Region Selection Complete:
      Final Region: {{ aws_region_final }}
      Validation Status: {{ 'Validated' if aws_region_validation is defined else 'Auto-Selected' }}

- name: Set region validation metadata
  set_fact:
    aws_region_metadata:
      final_region: "{{ aws_region_final }}"
      validation_performed: "{{ aws_region_validation is defined }}"
      auto_selected: "{{ aws_region_auto_selected is defined }}"
      workload_type: "{{ aws_region_validation.workload_type if aws_region_validation is defined else 'detected' }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
