---
# ============================================================================
# AWS Region Validation Role Defaults
# ============================================================================

# Enable/disable region validation
aws_region_validation_enabled: true

# Fail on incompatible regions (set to false for warnings only)
aws_region_validation_strict: true

# Default region if none specified and auto-selection fails
aws_region_default: us-east-2

# Enable detailed validation output
aws_region_validation_verbose: true
