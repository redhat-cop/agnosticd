---
# IBM Cloud Classic VM Inventory Role - Default Variables

# Terraform configuration
terraform_working_dir: "{{ output_dir }}/terraform-ibm-vm-{{ guid | default('default') }}"
save_vm_info: true

# SSH configuration
ssh_user: "root"
ssh_private_key_path: "{{ env_authorized_key_path }}"

# SSH wait timing configuration
ssh_wait_delay: 10       # Seconds to wait before starting SSH checks
ssh_wait_timeout: 300    # Total timeout for SSH to become available
ssh_connect_timeout: 5   # Timeout for individual connection attempts
ssh_retry_interval: 2    # Seconds to wait between connection retries

# Inventory configuration
inventory_group: "all"

# Connection testing
wait_for_ssh: true
test_ssh_connection: true 