---
# IBM Cloud Classic SSH Key Infrastructure Role - Create Tasks

- name: Verify IBM Cloud CLI is available and logged in
  ansible.builtin.command: ibmcloud account show
  register: ibmcloud_login_status
  failed_when: false
  changed_when: false

- name: Fail if not logged in to IBM Cloud
  ansible.builtin.fail:
    msg: "Not logged in to IBM Cloud. Please ensure login is performed before calling this role."
  when: ibmcloud_login_status.rc != 0

- name: Check available security commands
  ansible.builtin.command: ibmcloud sl security help
  register: sl_security_help
  failed_when: false
  changed_when: false

- name: Check if SSH provision key exists locally
  stat:
    path: "{{ ssh_provision_key_path }}"
  register: stat_ssh_provision_key

- name: Fail if SSH provision key doesn't exist
  fail:
    msg: "SSH provision key not found at {{ ssh_provision_key_path }}. Please create it first."
  when: not stat_ssh_provision_key.stat.exists

- name: Generate SSH public key content if not defined
  block:
    - name: Generate SSH public key from private key
      command: >-
        ssh-keygen -y -f {{ ssh_provision_key_path | quote }}
      register: r_ssh_pubkey_content
      changed_when: false
      
    - name: Set SSH public key content fact
      set_fact:
        ssh_provision_pubkey_content: "{{ r_ssh_pubkey_content.stdout }}"
        
  when: ssh_provision_pubkey_content is not defined

- name: List SSH keys in IBM Cloud Classic
  ansible.builtin.command: ibmcloud sl security sshkey-list --output json
  register: existing_ssh_keys_result
  changed_when: false
  failed_when: false

- name: Set SoftLayer availability flag
  ansible.builtin.set_fact:
    softlayer_available: "{{ existing_ssh_keys_result.rc == 0 }}"

- name: Fail if unable to list SSH keys
  ansible.builtin.fail:
    msg: |
      Unable to list SSH keys. SoftLayer plugin commands are not available.
      
      This error occurred when trying to run:
      - 'ibmcloud sl security ssh-key list --output json' returned {{ existing_ssh_keys_result.rc }}
      - Error: {{ existing_ssh_keys_result.stderr | default('N/A') }}
      
      Troubleshooting:
      1. Check that SoftLayer plugin is properly installed: ibmcloud plugin list
      2. Verify IBM Cloud CLI is up to date: ibmcloud update
      3. Ensure your account has Classic Infrastructure permissions
      4. Try manual plugin installation: ibmcloud plugin install infrastructure-service
  when: not (softlayer_available | default(false))

- name: SSH key management tasks (when SoftLayer is available)
  block:
    - name: Parse existing SSH keys
      ansible.builtin.set_fact:
        existing_ssh_keys: "{{ existing_ssh_keys_result.stdout | from_json }}"
      when: existing_ssh_keys_result.stdout != ""

    - name: Set empty SSH keys list if no output
      ansible.builtin.set_fact:
        existing_ssh_keys: []
      when: existing_ssh_keys_result.stdout == ""

    - name: Check if SSH key with same name already exists
      ansible.builtin.set_fact:
        existing_ssh_key: "{{ existing_ssh_keys | selectattr('label', 'equalto', ssh_key_name) | first | default({}) }}"

    - name: Create SSH key in IBM Cloud Classic
      ansible.builtin.command: >-
        ibmcloud sl security sshkey-add 
        "{{ ssh_key_name }}" 
        --key "{{ ssh_provision_pubkey_content }}" 
        --output json
      register: ssh_key_create_result
      failed_when: false
      when: existing_ssh_key == {}

    - name: Fail if unable to create SSH key
      ansible.builtin.fail:
        msg: |
          Unable to create SSH key using 'sshkey-add' command.
          
          Command executed:
          ibmcloud sl security sshkey-add "{{ ssh_key_name }}" --key "{{ ssh_provision_pubkey_content }}" --output json
          
          Return code: {{ ssh_key_create_result.rc }}
          Error output: {{ ssh_key_create_result.stderr | default('N/A') }}
          Standard output: {{ ssh_key_create_result.stdout | default('N/A') }}
      when: existing_ssh_key == {} and ssh_key_create_result.rc != 0

    - name: Parse created SSH key information
      ansible.builtin.set_fact:
        created_ssh_key: "{{ ssh_key_create_result.stdout | from_json }}"
      when: existing_ssh_key == {} and ssh_key_create_result is defined and ssh_key_create_result.rc == 0

    - name: Set SSH key ID from existing or created key
      ansible.builtin.set_fact:
        ssh_key_id: "{{ existing_ssh_key.ID | default(created_ssh_key.id) }}"

    - name: Get SSH key details from list output
      ansible.builtin.set_fact:
        ssh_key_details: "{{ existing_ssh_keys | selectattr('ID', 'equalto', ssh_key_id) | first | default({}) }}"

    - name: Set SSH key details from created key if not found in list
      ansible.builtin.set_fact:
        ssh_key_details: "{{ created_ssh_key | default({}) }}"
      when: ssh_key_details == {} and created_ssh_key is defined

    - name: Display SSH key information
      ansible.builtin.debug:
        msg:
          - "SSH Key created/found successfully"
          - "SSH Key ID: {{ ssh_key_id }}"
          - "SSH Key Label: {{ ssh_key_details.label }}"
          - "SSH Key Fingerprint: {{ ssh_key_details.fingerprint | default('N/A') }}"

    - name: Save SSH key information to output directory
      ansible.builtin.copy:
        content: |
          ssh_key_id: {{ ssh_key_id }}
          ssh_key_name: {{ ssh_key_details.label }}
          ssh_key_fingerprint: {{ ssh_key_details.fingerprint | default('') }}
          ssh_key_public_key: {{ ssh_key_details.key | default('') }}
          created_date: {{ ssh_key_details.createDate | default('') }}
        dest: "{{ output_dir }}/{{ ssh_key_name }}_info.yml"
      when: output_dir is defined

    - name: Set SSH key ID as fact for use by other roles
      ansible.builtin.set_fact:
        env_authorized_key_id: "{{ ssh_key_id }}"
        ssh_key_id: "{{ ssh_key_id }}"

  when: softlayer_available | default(false) 