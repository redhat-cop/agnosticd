---
# IBM Cloud Classic SSH Key Infrastructure Role - Main Tasks

- name: Validate required variables for provision
  assert:
    that:
      - guid is defined
      - env_authorized_key_path is defined
    fail_msg: "Required variables are missing: guid, env_authorized_key_path"
  when: ACTION == 'provision'

- name: Validate required variables for destroy
  assert:
    that:
      - guid is defined
    fail_msg: "Required variable is missing: guid"
  when: ACTION == 'destroy'

- name: Set SSH key name based on guid
  set_fact:
    ssh_key_name: "{{ guid }}-ssh-key"
  when: ssh_key_name is not defined or ssh_key_name == ''

- name: Include create tasks
  include_tasks: create.yml
  when: ACTION == 'provision'

- name: Include destroy tasks
  include_tasks: destroy.yml
  when: ACTION == 'destroy'