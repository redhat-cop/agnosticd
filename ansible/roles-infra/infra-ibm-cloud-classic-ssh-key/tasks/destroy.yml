---
# IBM Cloud Classic SSH Key Infrastructure Role - Destroy Tasks

- name: Check if IBM Cloud CLI is installed
  ansible.builtin.command: ibmcloud --version
  register: ibmcloud_version
  failed_when: false
  changed_when: false

- name: Install IBM Cloud CLI if not present
  block:
    - name: Download and install IBM Cloud CLI
      ansible.builtin.shell: |
        curl -fsSL {{ ibm_cloud_cli_install_url }} | sh
      become: true
      
    - name: Verify IBM Cloud CLI installation
      ansible.builtin.command: ibmcloud --version
      register: ibmcloud_verify
      failed_when: ibmcloud_verify.rc != 0
      changed_when: false
      
  when: ibmcloud_version.rc != 0

- name: Login to IBM Cloud with API key
  ansible.builtin.command: ibmcloud login --apikey {{ ibm_cloud_classic_api_key }}
  register: ibmcloud_login_result
  failed_when: false
  changed_when: false
  no_log: true

- name: Check if logged in to IBM Cloud
  ansible.builtin.command: ibmcloud account show
  register: ibmcloud_login_status
  failed_when: false
  changed_when: false

- name: Fail if not logged in to IBM Cloud
  ansible.builtin.fail:
    msg: "Not logged in to IBM Cloud. Please check your API key."
  when: ibmcloud_login_status.rc != 0

- name: Check for saved SSH key information
  stat:
    path: "{{ output_dir }}/{{ ssh_key_name }}_info.yml"
  register: stat_ssh_key_info
  when: output_dir is defined

- name: Load SSH key information from file
  include_vars:
    file: "{{ output_dir }}/{{ ssh_key_name }}_info.yml"
  when: output_dir is defined and stat_ssh_key_info.stat.exists

- name: List SSH keys in IBM Cloud Classic
  ansible.builtin.command: ibmcloud sl security sshkey-list --output json
  register: existing_ssh_keys_result
  changed_when: false
  failed_when: false

- name: Check if SoftLayer plugin is available
  ansible.builtin.set_fact:
    softlayer_available: "{{ existing_ssh_keys_result.rc == 0 }}"

- name: Fail if unable to list SSH keys
  ansible.builtin.fail:
    msg: |
      Unable to list SSH keys. SoftLayer plugin commands are not available.
      
      This error occurred when trying to run:
      - 'ibmcloud sl security sshkey-list --output json' returned {{ existing_ssh_keys_result.rc }}
      - Error: {{ existing_ssh_keys_result.stderr | default('N/A') }}
      
      Troubleshooting:
      1. Check that SoftLayer plugin is properly installed: ibmcloud plugin list
      2. Verify IBM Cloud CLI is up to date: ibmcloud update
      3. Ensure your account has Classic Infrastructure permissions
      4. Try manual plugin installation: ibmcloud plugin install infrastructure-service
  when: not (softlayer_available | default(false))

- name: Parse existing SSH keys
  ansible.builtin.set_fact:
    existing_ssh_keys: "{{ existing_ssh_keys_result.stdout | from_json }}"
  when: existing_ssh_keys_result.stdout != ""

- name: Set empty SSH keys list if no output
  ansible.builtin.set_fact:
    existing_ssh_keys: []
  when: existing_ssh_keys_result.stdout == ""

- name: Find SSH key to delete by name
  ansible.builtin.set_fact:
    ssh_key_to_delete: "{{ existing_ssh_keys | selectattr('label', 'equalto', ssh_key_name) | first | default({}) }}"

- name: Find SSH key to delete by ID (if loaded from file)
  ansible.builtin.set_fact:
    ssh_key_to_delete: "{{ existing_ssh_keys | selectattr('ID', 'equalto', ssh_key_id | string) | first | default({}) }}"
  when: ssh_key_id is defined and ssh_key_to_delete == {}

- name: Display SSH key to be deleted
  ansible.builtin.debug:
    msg:
      - "Found SSH key to delete"
      - "ID: {{ ssh_key_to_delete.ID }}"
      - "Label: {{ ssh_key_to_delete.label }}"
      - "Fingerprint: {{ ssh_key_to_delete.fingerprint | default('N/A') }}"
  when: ssh_key_to_delete != {}

- name: Delete SSH key from IBM Cloud Classic
  ansible.builtin.command: ibmcloud sl security sshkey-remove {{ ssh_key_to_delete.ID }} --force
  register: ssh_key_delete_result
  failed_when: false
  when: ssh_key_to_delete != {}

- name: Fail if unable to delete SSH key
  ansible.builtin.fail:
    msg: |
      Unable to delete SSH key using 'sshkey-remove' command.
      
      Command executed:
      ibmcloud sl security sshkey-remove {{ ssh_key_to_delete.ID }} --force
      
      Return code: {{ ssh_key_delete_result.rc }}
      Error output: {{ ssh_key_delete_result.stderr | default('N/A') }}
      Standard output: {{ ssh_key_delete_result.stdout | default('N/A') }}
  when: ssh_key_to_delete != {} and ssh_key_delete_result.rc != 0

- name: Display deletion result
  ansible.builtin.debug:
    msg: "SSH key '{{ ssh_key_name }}' (ID: {{ ssh_key_to_delete.ID }}) deleted successfully"
  when: ssh_key_to_delete != {} and ssh_key_delete_result.rc == 0

- name: Clean up saved SSH key information file
  ansible.builtin.file:
    path: "{{ output_dir }}/{{ ssh_key_name }}_info.yml"
    state: absent
  when: 
    - output_dir is defined
    - ssh_key_to_delete != {}
    - ssh_key_delete_result is defined
    - ssh_key_delete_result.rc == 0

- name: Warn if SSH key not found
  ansible.builtin.debug:
    msg: 
      - "Warning: SSH key '{{ ssh_key_name }}' not found in IBM Cloud Classic."
      - "It may have already been deleted or never existed."
      - "Searched by name: {{ ssh_key_name }}"
      - "Searched by ID: {{ ssh_key_id | default('not available') }}"
  when: ssh_key_to_delete == {} 