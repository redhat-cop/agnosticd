---
# IBM Cloud Classic SSH Key Infrastructure Role - Default Variables

# SSH key configuration
ssh_key_name: "{{ guid }}-ssh-key"
ssh_key_label: "AgnosticD SSH Key for {{ guid }}"

# IBM Cloud Classic API configuration
# ibm_cloud_classic_api_key: ""   # Set via environment variable or extra vars

# SSH key file paths (consistent with AgnosticD patterns)
ssh_provision_key_path: "{{ env_authorized_key_path }}"
ssh_provision_pubkey_path: "{{ env_authorized_key_path_pub }}"

# Whether to wait for operations to complete
wait_for_completion: true

# Tags for the SSH key
ssh_key_tags:
  - "agnosticd"
  - "guid:{{ guid }}"
  - "env_type:{{ env_type | default('unknown') }}" 