# Network configuration
private_vlan_id: ""  # Optional - if not provided, IBM Cloud will auto-assign
public_vlan_id: ""   # Optional - if not provided, IBM Cloud will auto-assign

# No global security groups - use only inline rules per instance

# VM tagging - configured per instance using instance.tags
# tags: []  # No default tags - specify per instance

# Post-installation script
post_install_script_uri: ""

# SSH configuration
ssh_user: "root"
ssh_private_key_path: "{{ env_authorized_key_path }}"

# SSH wait timing configuration
ssh_wait_delay: 0        # Seconds to wait before starting SSH checks
ssh_wait_timeout: 600     # Total timeout for SSH to become available
ssh_connect_timeout: 5    # Timeout for individual connection attempts
ssh_retry_interval: 2     # Seconds to wait between connection retries

# Inventory configuration
inventory_group: "all"
create_inventory_file: true
inventory_file: "./inventory"

# Connection testing
wait_for_ssh: true
test_ssh_connection: true