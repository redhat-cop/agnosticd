---
# defaults file for infra-ibm-classic-bm-pxe-server role

# RHEL ISO Configuration - These must be provided by the user/config
# rhel_iso_url: ""         # Required - URL to RHEL 10 ISO
# rhel_iso_username: ""    # Optional - Username for ISO download
# rhel_iso_password: ""    # Optional - Password for ISO download
rhel_iso_filename: "rhel-10.0-x86_64-dvd.iso"  # ISO filename for download and storage

# Server Configuration
# The role requires bm_server_info from infra-ibm-cloud-classic-bm-info role
# This contains all necessary server information including MAC addresses and IP addresses

# Network Configuration
# The PXE server private and public IPs are automatically discovered by examining
# all network interfaces and identifying which ones have private vs public IP addresses.
# The discovered IPs will be used for:
# - DHCP server configuration (private IP as DNS server and next-server)
# - TFTP server for PXE boot (private IP)
# - HTTP server for kickstart files and repository access (private IP)
# pxe_server_private_ip: "auto-discovered from interface with private IP"
# pxe_server_public_ip: "auto-discovered from interface with public IP"
# discovered_private_interface: "auto-discovered interface name with private IP"
# discovered_public_interface: "auto-discovered interface name with public IP"

# Default network configuration for bm_server_info conversion
# These are used when converting bm_server_info to host_configuration format
bm_server_private_netmask: "255.255.255.0"
bm_server_public_netmask: "255.255.255.0"
bm_server_public_gateway: ""
bm_server_bonded_network: false

# Domain and DNS Configuration
domain_name: "{{ domain_name | default('example.com') }}"
secondary_dns: "8.8.8.8"

# DHCP Configuration
dhcp_filename: "rhel10/EFI/BOOT/BOOTX64.EFI"

# GRUB Configuration
grub_timeout: 0
grub_menu_title: "RHEL 10"
grub_kernel_path: "images/RHEL-10/vmlinuz"
grub_initrd_path: "images/RHEL-10/initrd.img"
grub_kernel_params: "ip=dhcp inst.text inst.nosave=all net.ifnames=0 biosdevname=0"

# Kickstart Configuration
kickstart_satellite_url: "{{ kickstart_satellite_url | default('') }}"
kickstart_activation_key: "{{ kickstart_activation_key | default('') }}"
kickstart_auth_token: "{{ kickstart_auth_token | default('') }}"
kickstart_user_password: "{{ generated_password | default('') }}"

# SSH Key Configuration
kickstart_ssh_key: "{{ ansible_ssh_user_public_key | default('') }}"

# Default HAProxy Services
haproxy_services:
  - name: "https"
    port: 443
  - name: "console"
    port: 3900

# File paths
iso_storage_path: "/var/images"
iso_mount_path: "/mnt/rhel10"
tftp_root: "/var/lib/tftpboot"
web_root: "/var/www/html"
kickstart_path: "/var/www/html/ks"

# Services to enable
required_packages:
  - dhcp-server
  - httpd
  - tftp-server
  - haproxy

pxe_services:
  - httpd
  - dhcpd
  - tftp
  - haproxy

# Backup configuration
backup_configs: true