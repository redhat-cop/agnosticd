---
# ============================================================================
# AWS Region Intelligence Role Defaults
# ============================================================================

# Default region selection behavior
aws_region: us-east-2
aws_region_show_all: false

# Workload detection defaults
workload_type: standard
compatible_regions: "{{ aws_regions_standard }}"

# User interface defaults
aws_region_info: ""
aws_region_info_message: "🏢 Standard Workload: Available in all regions"

# Region validation tracking
aws_region_metadata:
  workload_type: "{{ workload_type }}"
  compatible_regions: "{{ compatible_regions }}"
  selected_region: "{{ aws_region }}"
  is_compatible: true
  show_all_regions: "{{ aws_region_show_all }}"
  info_message: "{{ aws_region_info_message }}"
  validation_passed: true

# Enable detailed logging
aws_region_intelligence_verbose: true
