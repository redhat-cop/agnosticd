---
# defaults file for infra-ibm-cloud-classic-bm-info

# API key for IBM Cloud authentication (should be passed as extra var)
ibm_cloud_api_key: ""

# Server ID to query (should be passed as extra var)
ibm_cloud_server_id: ""

# Whether to display results 
display_results: true

# Whether to save results to file
save_to_file: false

# Output file path (if save_to_file is true)
output_file: "bm_server_info.json"
