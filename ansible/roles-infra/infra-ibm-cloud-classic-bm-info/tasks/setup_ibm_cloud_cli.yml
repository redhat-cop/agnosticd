---
# tasks file for IBM Cloud CLI setup
- name: Check if IBM Cloud CLI is installed
  ansible.builtin.command: ibmcloud --version
  register: ibmcloud_version
  failed_when: false
  changed_when: false

- name: Install IBM Cloud CLI if not present
  block:
    - name: Download and install IBM Cloud CLI
      ansible.builtin.shell: |
        curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
      become: true
      
    - name: Verify IBM Cloud CLI installation
      ansible.builtin.command: ibmcloud --version
      register: ibmcloud_verify
      failed_when: ibmcloud_verify.rc != 0
      changed_when: false
      
  when: ibmcloud_version.rc != 0

- name: Login to IBM Cloud with API key
  ansible.builtin.command: ibmcloud login --apikey "{{ ibm_cloud_api_key }}"
  register: ibmcloud_login_result
  failed_when: false
  changed_when: false
  no_log: true

- name: Check if logged in to IBM Cloud
  ansible.builtin.command: ibmcloud account show
  register: ibmcloud_login_status
  failed_when: false
  changed_when: false

- name: Fail if not logged in to IBM Cloud
  ansible.builtin.fail:
    msg: "Failed to authenticate with IBM Cloud. Please verify your API key is correct and has appropriate permissions."
  when: ibmcloud_login_status.rc != 0

- name: Check if SoftLayer plugin is installed
  ansible.builtin.command: ibmcloud plugin list
  register: plugin_list
  changed_when: false

- name: Install SoftLayer plugin if not present
  ansible.builtin.command: ibmcloud plugin install infrastructure-service -f
  register: plugin_install_result
  failed_when: false
  when: "'infrastructure-service' not in plugin_list.stdout and 'sl' not in plugin_list.stdout"

- name: Install SoftLayer plugin (alternative method) if not present
  ansible.builtin.command: ibmcloud plugin install sl -f
  register: plugin_install_result2
  failed_when: false
  when: "'sl' not in plugin_list.stdout and (plugin_install_result.rc is not defined or plugin_install_result.rc != 0)"

- name: Check plugin list after installation
  ansible.builtin.command: ibmcloud plugin list
  register: plugin_list_after
  changed_when: false

- name: Display plugin installation results
  ansible.builtin.debug:
    msg:
      - "Plugin installation results:"
      - "infrastructure-service install result: {{ plugin_install_result.rc | default('not run') }}"
      - "sl install result: {{ plugin_install_result2.rc | default('not run') }}"
      - "Plugins after installation: {{ plugin_list_after.stdout_lines | default([]) }}"

- name: Verify SoftLayer plugin installation
  ansible.builtin.command: ibmcloud sl help
  register: sl_help_result
  failed_when: false
  changed_when: false

- name: Fail if SoftLayer plugin not working
  ansible.builtin.fail:
    msg: |
      SoftLayer plugin is not working properly. 
      
      Plugin installation results:
      - infrastructure-service install: {{ plugin_install_result.rc | default('not run') }}
      - sl install: {{ plugin_install_result2.rc | default('not run') }}
      
      Plugin verification results:
      - 'ibmcloud sl help' returned: {{ sl_help_result.rc }}
      
      Error details:
      - sl help error: {{ sl_help_result.stderr | default('None') }}
      
      Current plugins installed:
      {{ plugin_list_after.stdout | default('Unable to list plugins') }}
      
      Please check plugin installation manually:
      1. Run: ibmcloud plugin list
      2. Try: ibmcloud plugin install infrastructure-service --force
      3. Verify: ibmcloud sl help
  when: sl_help_result.rc != 0