---
# Default variables for IBM Cloud Classic VM lifecycle management

# IBM Cloud API key for authentication (required)
# ibm_cloud_api_key: "YOUR_IBM_CLOUD_API_KEY"

# Output directory containing Terraform state and outputs (required)
# output_dir: "/path/to/output/directory"

# Default action if not specified
ACTION: "status"

# Default verbosity level
verbosity: 0

# Terraform working directory (consistent with deployment pattern)
terraform_working_dir: "{{ output_dir }}/terraform-ibm-vm-{{ guid | default('default') }}"

# VM information (extracted from Terraform outputs)
vm_count: 0
vm_ids: []
vm_hostnames: []
vm_public_ips: []
vm_private_ips: []
vm_datacenters: []
deployment_summary: {} 