---
- name: Check VM status before stopping
  ansible.builtin.command:
    cmd: ibmcloud sl vs detail {{ item }} --output json
  loop: "{{ vm_ids }}"
  register: vm_status_check
  changed_when: false
  failed_when: false
  environment:
    IBMCLOUD_API_KEY: "{{ ibm_cloud_api_key }}"

- name: Parse VM status information
  ansible.builtin.set_fact:
    vm_status_info: "{{ vm_status_check.results | map(attribute='stdout') | map('from_json') | list }}"
  when: vm_status_check.results is defined

- name: Display VM status before stop operation
  ansible.builtin.debug:
    msg: 
      - "VM {{ vm_hostnames[ansible_loop.index0] }} ({{ item }}) current status:"
      - "  Power State: {{ vm_status_info[ansible_loop.index0].powerState.name if vm_status_info[ansible_loop.index0].powerState is defined else 'Unknown' }}"
      - "  Action: {{ 'Skip (already stopped)' if (vm_status_info[ansible_loop.index0].powerState.name | default('') | upper) in ['HALTED', 'STOPPED'] else 'Will attempt to stop' }}"
  loop: "{{ vm_ids }}"
  loop_control:
    extended: true
  when: vm_status_info is defined

- name: Stop IBM Cloud Classic VMs (all VMs)
  ansible.builtin.command:
    cmd: ibmcloud sl vs power-off {{ item }} --force
  loop: "{{ vm_ids }}"
  register: vm_stop_results
  changed_when: vm_stop_results.rc == 0
  failed_when: false
  environment:
    IBMCLOUD_API_KEY: "{{ ibm_cloud_api_key }}"
  loop_control:
    extended: true

- name: Display detailed stop results for each VM
  ansible.builtin.debug:
    msg: 
      - "VM {{ vm_hostnames[ansible_loop.index0] }} ({{ item.item }}) stop result:"
      - "  Initial State: {{ vm_status_info[ansible_loop.index0].powerState.name if vm_status_info is defined and vm_status_info[ansible_loop.index0].powerState is defined else 'Unknown' }}"
      - "  Action Taken: Stop command attempted"
      - "  Result: {{ 'Success' if item.rc == 0 else ('Already stopped' if 'AlreadyHalted' in (item.stderr | default('')) else 'Failed: ' + (item.stderr | default('Unknown error'))) }}"
      - "  Return Code: {{ item.rc }}"
  loop: "{{ vm_stop_results.results }}"
  loop_control:
    extended: true
  when: vm_stop_results.results is defined

- name: Display stop action completion
  agnosticd_user_info:
    msg: |
      IBM Cloud Classic VMs Stop Operation Summary:
      
      Total VMs: {{ vm_count }}
      {% if vm_stop_results.results is defined %}
      {% for result in vm_stop_results.results %}
      {% set vm_name = vm_hostnames[loop.index0] %}
      {% set vm_id = result.item %}
      {% set initial_state = vm_status_info[loop.index0].powerState.name if vm_status_info is defined and vm_status_info[loop.index0].powerState is defined else 'Unknown' %}
      
      VM {{ vm_name }} ({{ vm_id }}):
      {% if result.rc == 0 %}
      - Initial State: {{ initial_state }}
      - Action: Stop command sent successfully
      - Result: ✅ VM stopped
      {% elif 'AlreadyHalted' in (result.stderr | default('')) %}
      - Initial State: {{ initial_state }}
      - Action: Stop command attempted
      - Result: ✅ VM already stopped (target state achieved)
      {% else %}
      - Initial State: {{ initial_state }}
      - Action: Stop command failed
      - Result: ❌ Failed: {{ result.stderr | default('Unknown error') }}
      {% endif %}
      {% endfor %}
      {% endif %}
      
      ✅ Operation completed. All VMs are now in stopped state.
      
      Note: "AlreadyHalted" errors are expected and indicate success - the VM
      was already in the desired stopped state.
  when: vm_count | int > 0

- name: Display no VMs message
  ansible.builtin.debug:
    msg: "No IBM Cloud Classic VMs found to stop"
  when: vm_count | int == 0 