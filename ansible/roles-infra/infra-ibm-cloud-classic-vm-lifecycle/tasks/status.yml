---
- name: Get IBM Cloud Classic VM status
  ansible.builtin.command:
    cmd: ibmcloud sl vs detail {{ item }} --output json
  loop: "{{ vm_ids }}"
  register: vm_status_results
  changed_when: false
  failed_when: false
  environment:
    IBMCLOUD_API_KEY: "{{ ibm_cloud_api_key }}"

- name: Parse VM status information
  ansible.builtin.set_fact:
    vm_status_info: "{{ vm_status_info | default([]) + [item.stdout | from_json] }}"
  loop: "{{ vm_status_results.results }}"
  when: item.rc == 0

- name: Report VM status information
  agnosticd_user_info:
    msg: |
      IBM Cloud Classic VM Status:
      
      Total VMs: {{ vm_count }}
      Datacenters: {{ vm_datacenters | unique | join(', ') }}
      
      {% for i in range(vm_count | int) %}
      VM {{ loop.index }}:
      - Hostname: {{ vm_hostnames[i] }}
      - ID: {{ vm_ids[i] }}
      - Public IP: {{ vm_public_ips[i] | default('N/A') }}
      - Private IP: {{ vm_private_ips[i] | default('N/A') }}
      - Datacenter: {{ vm_datacenters[i] }}
      - Status: {{ vm_status_info[i].powerState.name | default('Unknown') if vm_status_info is defined and vm_status_info[i] is defined and vm_status_info[i].powerState is defined else 'Unknown' }}
      {% endfor %}

- name: Display detailed VM status
  ansible.builtin.debug:
    msg: 
      - "IBM Cloud Classic VM Status Check:"
      - "Total VMs found: {{ vm_count }}"
      - "VM hostnames: {{ vm_hostnames }}"
      - "VM datacenters: {{ vm_datacenters | unique }}"
      - "Deployment summary: {{ deployment_summary }}"
  when: vm_count | int > 0

- name: Display VM status details
  ansible.builtin.debug:
    msg: "VM {{ vm_hostnames[ansible_loop.index0] }} ({{ item }}): {{ vm_status_info[ansible_loop.index0].powerState.name | default('Unknown') if vm_status_info is defined and vm_status_info[ansible_loop.index0] is defined and vm_status_info[ansible_loop.index0].powerState is defined else 'Status check failed' }}"
  loop: "{{ vm_ids }}"
  loop_control:
    extended: true
  when: vm_count | int > 0

- name: Display no VMs message
  ansible.builtin.debug:
    msg: "No IBM Cloud Classic VMs found to check status"
  when: vm_count | int == 0 