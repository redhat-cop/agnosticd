---
- name: Initialize IBM Cloud Classic VM lifecycle management
  ansible.builtin.debug:
    msg: "Initializing IBM Cloud Classic VM lifecycle management for ACTION: {{ ACTION }}"

- name: Validate IBM Cloud API key is provided
  ansible.builtin.fail:
    msg: "ibm_cloud_api_key is required. Please provide it as an extra var: -e ibm_cloud_api_key=YOUR_API_KEY"
  when: ibm_cloud_api_key is not defined or ibm_cloud_api_key == ""

- name: Check if output directory exists
  ansible.builtin.stat:
    path: "{{ output_dir }}"
  register: output_dir_stat
  when: output_dir is defined

- name: Validate output directory is provided and exists
  ansible.builtin.fail:
    msg: "output_dir is required and must exist. Current value: {{ output_dir | default('not defined') }}"
  when: output_dir is not defined or not output_dir_stat.stat.exists

- name: Validate Terraform directory exists
  ansible.builtin.stat:
    path: "{{ terraform_working_dir }}"
  register: terraform_dir_stat

- name: Fail if Terraform directory does not exist
  ansible.builtin.fail:
    msg: "Terraform working directory {{ terraform_working_dir }} does not exist. VM deployment may not have completed successfully."
  when: not terraform_dir_stat.stat.exists

- name: Check if Terraform state exists
  ansible.builtin.stat:
    path: "{{ terraform_working_dir }}/terraform.tfstate"
  register: terraform_state_stat

- name: Validate Terraform state exists
  ansible.builtin.fail:
    msg: "No Terraform state found in {{ terraform_working_dir }}. VM deployment may not have completed successfully."
  when: not terraform_state_stat.stat.exists

- name: Get Terraform outputs
  ansible.builtin.command:
    cmd: terraform output -json
    chdir: "{{ terraform_working_dir }}"
  register: terraform_outputs_raw
  changed_when: false

- name: Parse Terraform outputs
  ansible.builtin.set_fact:
    terraform_outputs: "{{ terraform_outputs_raw.stdout | from_json }}"

- name: Extract VM information from Terraform outputs
  ansible.builtin.set_fact:
    vm_count: "{{ terraform_outputs.vm_count.value | default(0) }}"
    vm_ids: "{{ terraform_outputs.vm_ids.value | default([]) }}"
    vm_hostnames: "{{ terraform_outputs.vm_hostnames.value | default([]) }}"
    vm_public_ips: "{{ terraform_outputs.vm_public_ips.value | default([]) }}"
    vm_private_ips: "{{ terraform_outputs.vm_private_ips.value | default([]) }}"
    vm_datacenters: "{{ terraform_outputs.vm_datacenters.value | default([]) }}"
    deployment_summary: "{{ terraform_outputs.deployment_summary.value | default({}) }}"

- name: Display VM information
  ansible.builtin.debug:
    msg: 
      - "Found {{ vm_count }} VMs in Terraform state"
      - "VM hostnames: {{ vm_hostnames }}"
      - "VM datacenters: {{ vm_datacenters | unique }}"
    verbosity: 1

- name: Validate VMs exist for lifecycle operations
  ansible.builtin.fail:
    msg: "No VMs found in Terraform state. Cannot perform lifecycle operations."
  when: vm_count | int == 0 