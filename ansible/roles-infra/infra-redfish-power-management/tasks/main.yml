---
- name: Validate required BMC connection parameters
  ansible.builtin.fail:
    msg: "Required parameter '{{ item }}' is missing"
  when: vars[item] is not defined or vars[item] == ""
  loop:
    - bmc_hostname
    - bmc_username
    - bmc_password
  tags: [always, validation]

- name: Validate power action parameter
  ansible.builtin.fail:
    msg: "Invalid power_action. Must be one of: status, on, off, force_off, reset"
  when: power_action not in ['status', 'on', 'off', 'force_off', 'reset']
  tags: [always, validation]

- name: Exit with error if both enable_pxe_boot_and_reset and power_action are set
  block:
    - name: Display configuration error message
      ansible.builtin.debug:
        msg: "ERROR: Cannot specify both enable_pxe_boot_and_reset and power_action. When enable_pxe_boot_and_reset is enabled, the system will automatically reset after PXE configuration."
    - name: End playbook execution with error
      ansible.builtin.meta: end_play
  when: (enable_pxe_boot_and_reset | bool) and power_action is defined and power_action != 'status'
  tags: [always, validation]

- name: Test BMC connectivity
  include_tasks: connectivity.yml
  tags: [always, connectivity]

- name: Get current power state
  include_tasks: power_status.yml
  tags: [always, power]

- name: Check for graceful exit conditions
  include_tasks: graceful_exits.yml
  tags: [always, power]

- name: Execute power actions
  include_tasks: power_actions.yml
  when: power_action in ['on', 'off', 'force_off', 'reset'] and not (enable_pxe_boot_and_reset | bool)
  tags: [power]

- name: Handle PXE boot configuration
  include_tasks: pxe_boot.yml
  when: enable_pxe_boot_and_reset | bool
  tags: [pxe, boot]

- name: Handle power actions that require monitoring
  include_tasks: power_monitoring.yml
  when: power_action in ['on', 'off', 'force_off', 'reset'] or (enable_pxe_boot_and_reset | bool)
  tags: [power, monitoring]

- name: Get final power state
  include_tasks: power_status.yml
  tags: [always, power] 
