---
- name: Validate user action parameter
  ansible.builtin.fail:
    msg: "Invalid user_action. Must be one of: create, update_password, delete, status"
  when: user_action not in ['create', 'update_password', 'delete', 'status']
  tags: [always, validation]

- name: Validate user role parameter
  ansible.builtin.fail:
    msg: "Invalid user_role. Must be one of: Administrator, Operator, ReadOnly, PowerUser"
  when: user_role not in ['Administrator', 'Operator', 'ReadOnly', 'PowerUser']
  tags: [always, validation]

- name: Validate target password for create/update actions
  ansible.builtin.fail:
    msg: "target_password is required and cannot be empty when user_action is '{{ user_action }}'"
  when: 
    - user_action in ['create', 'update_password']
    - target_password is not defined or target_password == ""
  tags: [always, validation]

- name: Validate password requirements
  include_tasks: validate_password.yml
  when: 
    - target_password is defined and target_password != ""
    - user_action in ['create', 'update_password']
  tags: [always, validation]

- name: Test BMC connectivity
  include_tasks: connectivity.yml
  tags: [always, connectivity]

- name: Get account service information
  include_tasks: account_service.yml
  tags: [always, account_service]

- name: Manage user account
  include_tasks: user_operations.yml
  when: user_action in ['create', 'update_password', 'delete', 'status']
  tags: [users]

- name: Handle PowerUser role assignment
  include_tasks: poweruser_role.yml
  when: 
    - user_action in ['create', 'update_password']
    - user_role == "PowerUser"
  tags: [role_management, poweruser]

- name: Display operation summary
  ansible.builtin.debug:
    msg: 
      - "Redfish User Management Operation Completed"
      - "Action: {{ user_action }}"
      - "Target User: {{ target_username }}"
      - "User Role: {{ user_role }}"
      - "BMC Host: {{ bmc_hostname }}"
  tags: [always, summary] 
