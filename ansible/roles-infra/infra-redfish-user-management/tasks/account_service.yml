---
- name: Get current account service information
  ansible.builtin.uri:
    url: "https://{{ bmc_hostname }}/redfish/v1/AccountService"
    method: GET
    user: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    validate_certs: "{{ validate_certs }}"
    force_basic_auth: "{{ force_basic_auth }}"
    status_code: 200
    timeout: "{{ connection_timeout }}"
  register: account_service_info
  tags: [account_service]

- name: Display account service information
  ansible.builtin.debug:
    msg: 
      - "Account Service Information:"
      - "Service Enabled: {{ account_service_info.json.ServiceEnabled | default('Unknown') }}"
      - "Max Password Length: {{ account_service_info.json.MaxPasswordLength | default('Unknown') }}"
      - "Min Password Length: {{ account_service_info.json.MinPasswordLength | default('Unknown') }}"
      - "Accounts Collection: {{ account_service_info.json.Accounts['@odata.id'] | default('Unknown') }}"
      - "Roles Collection: {{ account_service_info.json.Roles['@odata.id'] | default('Unknown') }}"
  when: account_service_info.status == 200 and account_service_info.json is defined
  tags: [account_service, debug]

- name: Get current user accounts
  ansible.builtin.uri:
    url: "https://{{ bmc_hostname }}{{ account_service_info.json.Accounts['@odata.id'] }}"
    method: GET
    user: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    validate_certs: "{{ validate_certs }}"
    force_basic_auth: "{{ force_basic_auth }}"
    status_code: 200
    timeout: "{{ connection_timeout }}"
  register: current_accounts
  when: account_service_info.status == 200 and account_service_info.json is defined and account_service_info.json.Accounts is defined
  tags: [account_service, users]

- name: Initialize current_accounts if not defined
  ansible.builtin.set_fact:
    current_accounts:
      status: 404
      json:
        Members: []
  when: current_accounts is not defined

- name: Display current user accounts summary
  ansible.builtin.debug:
    msg: 
      - "Current User Accounts Summary:"
      - "Total accounts: {{ current_accounts.json.Members | length }}"
      - "Account endpoints: Available ({{ current_accounts.json.Members | length }} total)"
  when: current_accounts.status == 200 and current_accounts.json is defined and current_accounts.json.Members is defined
  tags: [account_service, users, debug] 
