---
# Redfish User Management Role - Defaults

## BMC Connection Variables (Required)
# These must be provided when calling the role
# bmc_hostname: "192.168.1.100"
# bmc_username: "admin"
# bmc_password: "password123"

## User Management Variables
target_username: "console"                # Target username to manage
target_password: "{{ lookup('password', '/dev/null length=12 chars=ascii_letters,digits') }}"
user_action: "status"                     # create, update_password, delete, status
user_role: "ReadOnly"                     # Administrator, Operator, ReadOnly, PowerUser
enable_user: true                         # Enable user account
force_password_update_on_existing: true   # Force password update if user exists during create action

## Redfish API Settings
validate_certs: false                     # Skip certificate validation for self-signed certs
force_basic_auth: true                    # Use basic authentication
connection_timeout: 30                    # Connection timeout in seconds 
