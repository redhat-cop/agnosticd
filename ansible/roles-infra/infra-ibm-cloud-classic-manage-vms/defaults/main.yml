---
# IBM Cloud Classic VM Deployment Role - Default Variables

# Action mode
# ACTION: ""  # REQUIRED - must be provided as extra var (provision or destroy)

# Terraform configuration
terraform_working_dir: "{{ output_dir }}/terraform-ibm-vm-{{ guid | default('default') }}"
terraform_download_url: "https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip"
cleanup_terraform_files: false 
save_vm_info: true

# IBM Cloud connection settings
# ibm_cloud_api_key: ""  # REQUIRED - must be provided as extra var
# region: ""  # REQUIRED - must be provided as extra var (e.g., "us-south", "us-east", "eu-gb")

# VM configuration defaults (applied to all VMs if not specified per VM)
domain: "example.com"
image: "REDHAT_9_64"
network_speed: 1000
hourly_billing: true
private_network_only: false
cores: 2
memory: 4096
rootfs_size: 25  # Root filesystem size in GB
additional_disks: []  # Additional disks beyond root filesystem (empty by default)
local_disk: true
ssh_key_ids: []
user_metadata: ""
notes: "VM created by AgnosticD"
dedicated_acct_host_only: false

# VM instances configuration - REQUIRED
# instances: []  # List of VM configurations
# Example:
# 
# Security Group Rules:
# - private_security_group_rules: creates inline rules ONLY for private interface
# - public_security_group_rules: creates inline rules ONLY for public interface
# - If no inline rules are specified, VM has no security groups
#
# Ansible Group Assignment:
# - VMs can be automatically added to custom ansible groups using tags
# - Use tag format: "ansible_group:groupname" to add VM to the "groupname" ansible group
# - Multiple ansible_group tags can be used to add VM to multiple groups
# - Group names are sanitized: invalid characters (anything except letters, numbers, underscores) are replaced with underscores
# - Examples: "ansible_group:bastions", "ansible_group:webservers", "ansible_group:databases"
# - Note: "ansible_group:my-group" becomes ansible group "my_group"
#
# instances:
#   - name: "web"
#     datacenter: "dal13"
#     count: 3  # Creates web-01, web-02, web-03
#     cores: 2
#     memory: 4096
#     rootfs_size: 25
#     additional_disks: [100, 200]  # Additional 100GB and 200GB disks
#     image: "REDHAT_9_64"
#     ssh_key_ids: []
#     user_metadata: "web-server"
#     notes: "Web server instance"
#     tags: ["web", "ansible_group:webservers"]
#     private_security_group_rules:
#       - name: "private_ssh"
#         description: "Allow SSH from private network"
#         rule_type: "ingress"
#         ether_type: "IPv4"
#         from_port: 22
#         to_port: 22
#         protocol: "tcp"
#         cidr: "10.0.0.0/8"
#     public_security_group_rules:
#       - name: "public_http"
#         description: "Allow HTTP from anywhere"
#         rule_type: "ingress"
#         ether_type: "IPv4"
#         from_port: 80
#         to_port: 80
#         protocol: "tcp"
#         cidr: "0.0.0.0/0"
#   - name: "db"
#     datacenter: "wdc07"
#     count: 1
#     cores: 4
#     memory: 8192
#     rootfs_size: 50
#     additional_disks: [500]  # Additional 500GB disk for database
#     image: "REDHAT_9_64"
#     ssh_key_ids: []
#     user_metadata: "database-server"
#     notes: "Database server instance"
#     tags: ["database", "ansible_group:databases"]
#     private_security_group_rules:
#       - name: "private_mysql"
#         description: "Allow MySQL from private network"
#         rule_type: "ingress"
#         ether_type: "IPv4"
#         from_port: 3306
#         to_port: 3306
#         protocol: "tcp"
#         cidr: "10.0.0.0/8"

# DNS Configuration
create_dns_records: false
route53_aws_access_key_id: ""
route53_aws_secret_access_key: ""
aws_region: "us-east-1"
# route53_aws_zone_id: ""  # Auto-discovered from cluster_dns_zone, or provide manually
# cluster_dns_zone: ""  # REQUIRED - must be provided as extra var when DNS is enabled
dns_ttl: 300

# Terraform Logging Configuration
terraform_log_level: "INFO"  # Options: TRACE, DEBUG, INFO, WARN, ERROR
terraform_enable_logging: true

# Network configuration
private_vlan_id: ""  # Optional - if not provided, IBM Cloud will auto-assign
public_vlan_id: ""   # Optional - if not provided, IBM Cloud will auto-assign

# No global security groups - use only inline rules per instance

# VM tagging - configured per instance using instance.tags
# tags: []  # No default tags - specify per instance

# Post-installation script
post_install_script_uri: ""

# SSH configuration
ssh_user: "root"
ssh_private_key_path: "{{ env_authorized_key_path }}"