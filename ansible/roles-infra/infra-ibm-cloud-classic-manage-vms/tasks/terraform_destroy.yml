---
- name: Check if Terraform working directory exists
  ansible.builtin.stat:
    path: "{{ terraform_working_dir }}"
  register: terraform_dir_stat

- name: Fail if Terraform working directory doesn't exist
  ansible.builtin.fail:
    msg: "Terraform working directory {{ terraform_working_dir }} does not exist. Nothing to destroy."
  when: not terraform_dir_stat.stat.exists

- name: Check if Terraform state file exists
  ansible.builtin.stat:
    path: "{{ terraform_working_dir }}/terraform.tfstate"
  register: terraform_state_stat

- name: Fail if Terraform state file doesn't exist
  ansible.builtin.fail:
    msg: "Terraform state file does not exist in {{ terraform_working_dir }}. Nothing to destroy."
  when: not terraform_state_stat.stat.exists

- name: Get current Terraform state
  ansible.builtin.command:
    cmd: terraform show -json
    chdir: "{{ terraform_working_dir }}"
  register: terraform_show
  changed_when: false
  failed_when: false

- name: Parse current state
  ansible.builtin.set_fact:
    current_state: "{{ terraform_show.stdout | from_json }}"
  when: terraform_show.rc == 0

- name: Display resources to be destroyed
  ansible.builtin.debug:
    msg:
      - "Resources to be destroyed:"
      - "{{ current_state.values.root_module.resources | map(attribute='address') | list }}"
  when: 
    - terraform_show.rc == 0
    - current_state.values is defined
    - current_state.values.root_module is defined

- name: Plan Terraform destroy
  ansible.builtin.command:
    cmd: terraform plan -destroy -out=destroy_plan
    chdir: "{{ terraform_working_dir }}"
  register: terraform_destroy_plan
  changed_when: terraform_destroy_plan.rc == 0

- name: Apply Terraform destroy
  ansible.builtin.command:
    cmd: terraform apply -auto-approve destroy_plan
    chdir: "{{ terraform_working_dir }}"
  register: terraform_destroy_apply
  changed_when: terraform_destroy_apply.rc == 0

- name: Clean up Terraform files
  ansible.builtin.file:
    path: "{{ terraform_working_dir }}"
    state: absent
  when: cleanup_terraform_files | default(true)

- name: Display destroy completion
  ansible.builtin.debug:
    msg:
      - "VM(s) destruction completed successfully"
      - "All resources have been removed from IBM Cloud"
      - "Terraform working directory: {{ 'Cleaned up' if (cleanup_terraform_files | default(true)) else 'Preserved at ' + terraform_working_dir }}" 