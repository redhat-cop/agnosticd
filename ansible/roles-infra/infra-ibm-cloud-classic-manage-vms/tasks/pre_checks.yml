---
- name: Validate IBM Cloud API key is provided
  ansible.builtin.fail:
    msg: "ibm_cloud_api_key is required. Please provide it as an extra var: -e ibm_cloud_api_key=YOUR_API_KEY"
  when: ibm_cloud_api_key is not defined or ibm_cloud_api_key == ""

- name: Validate VM configuration
  ansible.builtin.fail:
    msg: "instances list is required with at least one VM. Please provide it as an extra var."
  when: instances is not defined or instances|length == 0

- name: Validate individual VM names
  ansible.builtin.fail:
    msg: "VM {{ item.0.name | default('at index ' + item.1|string) }}: name is required"
  when: item.0.name is not defined or item.0.name == ""
  loop: "{{ instances | zip(range(instances|length)) | list }}"
  loop_control:
    label: "{{ item.0.name | default('VM ' + item.1|string) }}"

- name: Validate individual VM datacenters
  ansible.builtin.fail:
    msg: "VM {{ item.0.name | default('at index ' + item.1|string) }}: datacenter is required"
  when: item.0.datacenter is not defined or item.0.datacenter == ""
  loop: "{{ instances | zip(range(instances|length)) | list }}"
  loop_control:
    label: "{{ item.0.name | default('VM ' + item.1|string) }}"

- name: Validate individual VM count values
  ansible.builtin.fail:
    msg: "VM {{ item.0.name | default('at index ' + item.1|string) }}: count must be a positive integer (got: {{ item.0.count }})"
  when: item.0.count is defined and (item.0.count is not number or item.0.count <= 0 or item.0.count != (item.0.count | int))
  loop: "{{ instances | zip(range(instances|length)) | list }}"
  loop_control:
    label: "{{ item.0.name | default('VM ' + item.1|string) }}"

- name: Validate output_dir is provided
  ansible.builtin.fail:
    msg: "output_dir is required. Please provide it as an extra var: -e output_dir=YOUR_OUTPUT_DIR"
  when: output_dir is not defined or output_dir == ""

- name: Check if Terraform is installed
  ansible.builtin.command: terraform version
  register: terraform_version
  failed_when: false
  changed_when: false

- name: Install Terraform if not present
  block:
    - name: Download Terraform
      ansible.builtin.get_url:
        url: "{{ terraform_download_url }}"
        dest: "{{ output_dir }}/terraform.zip"
        mode: '0644'
      
    - name: Unzip Terraform
      ansible.builtin.unarchive:
        src: "{{ output_dir }}/terraform.zip"
        dest: "/usr/local/bin/"
        remote_src: yes
      become: true
      
    - name: Make Terraform executable
      ansible.builtin.file:
        path: "/usr/local/bin/terraform"
        mode: '0755'
      become: true
      
    - name: Verify Terraform installation
      ansible.builtin.command: terraform version
      register: terraform_verify
      failed_when: terraform_verify.rc != 0
      changed_when: false
      
    - name: Clean up Terraform zip file
      ansible.builtin.file:
        path: "{{ output_dir }}/terraform.zip"
        state: absent
      
  when: terraform_version.rc != 0

- name: Create terraform working directory
  ansible.builtin.file:
    path: "{{ terraform_working_dir }}"
    state: directory
    mode: '0755'

- name: Display pre-check summary
  ansible.builtin.debug:
    msg:
      - "Pre-checks completed successfully"
      - "IBM Cloud API Key: [REDACTED]"
      - "Output Directory: {{ output_dir }}"
      - "Terraform working directory: {{ terraform_working_dir }}"
      - "VM Configuration ({{ instances|length }} instance types, {{ instances|map(attribute='count', default=1)|sum }} total VMs):"
      - "{% for instance in instances %}  - {{ instance.name }} ({{ instance.datacenter }}) - Count: {{ instance.count | default(1) }}{% endfor %}" 