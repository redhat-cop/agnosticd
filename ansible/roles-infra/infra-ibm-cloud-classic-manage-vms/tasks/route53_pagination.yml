---
# Route53 pagination handler for zones discovery
- name: Discover Route53 hosted zones (with pagination)
  amazon.aws.route53_info:
    aws_access_key: "{{ route53_aws_access_key_id }}"
    aws_secret_key: "{{ route53_aws_secret_access_key }}"
    query: hosted_zone
    next_marker: "{{ route53_next_marker | default(omit) }}"
  register: route53_zones_page

- name: Add zones from current page
  ansible.builtin.set_fact:
    route53_all_zones: "{{ route53_all_zones | default([]) + route53_zones_page.hosted_zones }}"

- name: Continue pagination if more zones exist
  ansible.builtin.include_tasks: route53_pagination.yml
  when: route53_zones_page.next_marker is defined
  vars:
    route53_next_marker: "{{ route53_zones_page.next_marker }}" 