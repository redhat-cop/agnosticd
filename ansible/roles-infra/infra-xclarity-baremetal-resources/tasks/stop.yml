---
- name: Stop XClarity managed servers
  include_role:
    name: "infra-xclarity-power-management"
  vars:
    # Pass through BMC connection parameters
    bmc_hostname: "{{ bmc_hostname }}"
    bmc_username: "{{ bmc_username }}"
    bmc_password: "{{ bmc_password }}"
    power_action: "off"
    enable_pxe_boot_and_reset: false
  when: 
    - bmc_hostname is defined
    - bmc_username is defined
    - bmc_password is defined

- name: Display stop action completion
  ansible.builtin.debug:
    msg: "XClarity Baremetal servers stopped (power off)" 