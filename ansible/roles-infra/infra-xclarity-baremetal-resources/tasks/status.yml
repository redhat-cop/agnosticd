---
- name: Get XClarity server power status
  include_role:
    name: "infra-xclarity-power-management"
  vars:
    # Pass through BMC connection parameters
    bmc_hostname: "{{ bmc_hostname }}"
    bmc_username: "{{ bmc_username }}"
    bmc_password: "{{ bmc_password }}"
    power_action: "status"
    enable_pxe_boot_and_reset: false
  when: 
    - bmc_hostname is defined
    - bmc_username is defined
    - bmc_password is defined

- name: Report XClarity server status information
  agnosticd_user_info:
    msg: |
      XClarity Baremetal Server Status:
      
      BMC Host: {{ bmc_hostname | default('Not configured') }}
      Console User: {{ target_username | default('console') }}
      Power Status: {{ power_status.json.PowerState | default('Unknown - check BMC connection') }}
      
      Server is currently: {{ 'POWERED ON' if (power_status.json.PowerState | default('') | lower) == 'on' else 'POWERED OFF' if (power_status.json.PowerState | default('') | lower) == 'off' else 'UNKNOWN STATE' }}

- name: Display detailed power status
  ansible.builtin.debug:
    msg: 
      - "XClarity Baremetal Power Status Check:"
      - "BMC Host: {{ bmc_hostname | default('Not configured') }}"
      - "Power State: {{ power_status.json.PowerState | default('Unknown') }}"