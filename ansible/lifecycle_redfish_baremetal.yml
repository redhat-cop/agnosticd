---
# IBM Cloud Classic Infrastructure Lifecycle Management
# 
# The BM lifecycle role now manages VM dependencies internally:
# - START: VM → BM (ensures bastion running for BMC access)
# - STOP: BM → VM (stops BM via BMC, then stops bastion)
# - STATUS: VM + BM (checks both infrastructure components)
#
# No separate VM lifecycle call needed - it's handled automatically
# by the BM lifecycle role based on BMC access requirements.

- when: >-
    ACTION == 'stop'
    or ACTION == 'start'
    or ACTION == 'status'
  include_role:
    name: infra-ibm-cloud-classic-bm-lifecycle 