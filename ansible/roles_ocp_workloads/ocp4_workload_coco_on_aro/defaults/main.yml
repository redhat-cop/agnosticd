---
# ocp_username can be set by the provisioner if the workload is applied to a
# shared cluster to set up for the requesting user.
# The default, "system:admin", is not used for roles that are deployed as part of a whole
# OpenShift cluster provision run.
ocp_username: "system:admin"

# OSC version tag
ocp4_workload_coco_on_aro_osc_version: "latest"

# Verity image base name
ocp4_workload_coco_on_aro_verity_image: "registry.redhat.io/openshift-sandboxed-containers/osc-dm-verity-image"

# Image to pull to podvm (will be determined dynamically if not set)
# Format: registry.redhat.io/openshift-sandboxed-containers/osc-dm-verity-image@sha256:...
ocp4_workload_coco_on_aro_image: ""

# Path to cluster pull secret file (relative to working directory or absolute path)
ocp4_workload_coco_on_aro_authfile: "cluster-pull-secret.json"

# Workshop users (devel / uadmin), OAuth, RBAC, kubeconfigs, tmux — see tasks/workshop_users.yml
ocp4_workload_coco_on_aro_setup_workshop_users: true

# Admin kubeconfig path (ARO open-environment bastion uses azure_kube_config_root)
ocp4_workload_coco_on_aro_admin_kubeconfig: >-
  {{ (azure_kube_config_root | default('/home/' + (ansible_user | default('azure')) + '/'))
     | regex_replace('/$', '') }}/.kube/config

# Namespaces where uadmin may manage workloads (RoleBinding to sandboxed-admin-namespace-role).
# Standard RHOAI / OpenShift AI namespaces are included; missing namespaces are skipped at apply time.
# Do not add trustee-operator-system: workload RBAC for uadmin is intentionally excluded there (opsec).
ocp4_workload_coco_on_aro_uadmin_namespaces:
  - openshift-sandboxed-containers-operator
  - redhat-ods-operator
  - redhat-ods-applications
  - redhat-ods-monitoring
  - rhods-notebooks
  - openshift-cloud-controller-manager
  - openshift-serverless
  - openshift-operators
  - knative-openshift
  - istio-system
  - openshift-config
  - kube-system
  - default
  - fraud-detection

# Bastion home for workshop kubeconfigs (devel.kubeconfig, uadmin.kubeconfig) and users.htpasswd
ocp4_workload_coco_on_aro_home: "/home/{{ ansible_user | default('azure') }}"

# Tmux session name created by workshop_users.yml; .bashrc can auto-attach on login
ocp4_workload_coco_on_aro_tmux_session: work
ocp4_workload_coco_on_aro_bashrc_tmux_auto_attach: true
