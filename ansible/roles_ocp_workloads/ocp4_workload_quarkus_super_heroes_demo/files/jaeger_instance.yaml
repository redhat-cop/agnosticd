---
apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: jaeger
  labels:
    app: jaeger
    app.kubernetes.io/part-of: monitoring
    name: jaeger
    role: monitoring
    system: quarkus-super-heroes
spec:
  strategy: allInOne
  storage:
    type: memory
  labels:
    app: jaeger
    app.kubernetes.io/part-of: monitoring
    name: jaeger
    role: monitoring
    system: quarkus-super-heroes
  ingress:
    security: none
  allInOne:
    # Jaeger operator v1.65 injects --reporter.grpc.tls.* flags on OpenShift,
    # but Jaeger >=1.63 removed those flags from all-in-one (jaeger-operator#2814).
    image: jaegertracing/all-in-one:1.62.0
