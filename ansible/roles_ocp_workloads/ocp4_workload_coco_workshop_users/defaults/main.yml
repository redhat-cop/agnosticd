---
ocp_username: "system:admin"

# Bastion user that owns the workshop kubeconfigs and opens the terminal tabs.
# All three personas log in as this OS user; only KUBECONFIG differs.
ocp4_workload_coco_workshop_users_student: "{{ student_name | default('lab-user') }}"
ocp4_workload_coco_workshop_users_home: "/home/{{ ocp4_workload_coco_workshop_users_student }}"
ocp4_workload_coco_workshop_users_kubeconfig_dir: "{{ ocp4_workload_coco_workshop_users_home }}/.kube"

# Workshop personas
ocp4_workload_coco_workshop_users_opsec_user: opsec
ocp4_workload_coco_workshop_users_devel_user: devel
ocp4_workload_coco_workshop_users_password: "{{ common_password }}"

# The admin persona is the cluster-admin user created by ocp4_workload_authentication.
# That role stores the password it actually used in the
# _ocp4_workload_authentication_admin_password host fact, which is generated
# randomly unless ocp4_workload_authentication_htpasswd_admin_password is set.
# Reading the fact first is the only way to log in when the password was
# generated (set_fact facts persist across the workload roles of the same play).
ocp4_workload_coco_workshop_users_admin_user: "{{ ocp4_workload_authentication_admin_user | default('admin') }}"
ocp4_workload_coco_workshop_users_admin_password: >-
  {{ _ocp4_workload_authentication_admin_password
     | default(ocp4_workload_authentication_htpasswd_admin_password
               | default(common_password | default(''))) }}

# Namespaces used by the workshop narrative
ocp4_workload_coco_workshop_users_trustee_namespace: trustee-operator-system
ocp4_workload_coco_workshop_users_devel_namespaces:
  - default
  - fraud-detection

# Login retry behaviour (the OAuth server rolls out after the htpasswd change)
ocp4_workload_coco_workshop_users_login_retries: 30
ocp4_workload_coco_workshop_users_login_delay: 20

# Temporary htpasswd working file (removed after the secret is updated)
ocp4_workload_coco_workshop_users_tmp_htpasswd: "/tmp/coco-workshop-users-{{ guid }}.htpasswd"

# -------------------------------------------------------------------
# Terminal tabs: one wetty pod per persona, SSHing to the bastion as the
# student user and exporting that persona's KUBECONFIG. Plain Kubernetes
# objects rendered from templates/terminals.yaml.j2 — no helm involved;
# helm is exclusive to the CoCo stack installation
# (ocp4_workload_coco_helm_install), whose terminal stage must stay off
# (ocp4_workload_coco_helm_install_terminal_tabs_enabled: false).
# -------------------------------------------------------------------
ocp4_workload_coco_workshop_users_terminal_tabs_enabled: true
ocp4_workload_coco_workshop_users_terminal_namespace: coco-terminal
ocp4_workload_coco_workshop_users_terminal_image: quay.io/rhpds/wetty:v3.2.1
ocp4_workload_coco_workshop_users_terminal_host_prefix: terminal
ocp4_workload_coco_workshop_users_terminal_host_suffix: "{{ guid }}"

# Public hostname students SSH to. LB1150 sets it in the catalog
# (bastion-<guid>.<region>.cloudapp.azure.com); the inventory hostvar is the
# generic fallback for other environments.
ocp4_workload_coco_workshop_users_terminal_bastion_host: >-
  {{ bastion_public_hostname | default(
       hostvars[groups['bastions'][0]].public_dns_name | default('', true),
     true) | regex_replace('\.$', '') }}
ocp4_workload_coco_workshop_users_terminal_bastion_user: "{{ student_name | default('lab-user') }}"
ocp4_workload_coco_workshop_users_terminal_bastion_password: "{{ student_password | default(common_password | default('')) }}"
ocp4_workload_coco_workshop_users_terminal_bastion_port: 22

# One terminal per persona; the kubeconfig paths are created by this role.
ocp4_workload_coco_workshop_users_terminals:
  - name: "{{ ocp4_workload_coco_workshop_users_opsec_user }}"
    kubeconfig: "{{ ocp4_workload_coco_workshop_users_kubeconfig_dir }}/{{ ocp4_workload_coco_workshop_users_opsec_user }}.kubeconfig"
  - name: "{{ ocp4_workload_coco_workshop_users_devel_user }}"
    kubeconfig: "{{ ocp4_workload_coco_workshop_users_kubeconfig_dir }}/{{ ocp4_workload_coco_workshop_users_devel_user }}.kubeconfig"
  - name: "{{ ocp4_workload_coco_workshop_users_admin_user }}"
    kubeconfig: "{{ ocp4_workload_coco_workshop_users_kubeconfig_dir }}/{{ ocp4_workload_coco_workshop_users_admin_user }}.kubeconfig"

# Showroom tab URLs (terminal-<guid>-<persona>.<ingress domain>). Published
# under the environment_variables user data map: the showroom content
# container exports that map as environment variables and envsubst
# substitutes them into ui-config.yml. Flat user data keys never reach
# envsubst (they only become Antora attributes).
ocp4_workload_coco_workshop_users_terminal_urls_env: true
