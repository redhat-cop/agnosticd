---
ocp_username: "system:admin"

# Bastion user that owns the workshop kubeconfigs and opens the terminal tabs.
# All three personas log in as this OS user; only KUBECONFIG differs.
ocp4_workload_coco_workshop_users_student: "{{ student_name | default('lab-user') }}"
ocp4_workload_coco_workshop_users_home: "/home/{{ ocp4_workload_coco_workshop_users_student }}"
ocp4_workload_coco_workshop_users_kubeconfig_dir: "{{ ocp4_workload_coco_workshop_users_home }}/.kube"

# Workshop personas
ocp4_workload_coco_workshop_users_opsec_user: opsec
ocp4_workload_coco_workshop_users_devel_user: devel
ocp4_workload_coco_workshop_users_password: "{{ common_password }}"

# The admin persona is the cluster-admin user created by ocp4_workload_authentication.
# That role stores the password it actually used in the
# _ocp4_workload_authentication_admin_password host fact, which is generated
# randomly unless ocp4_workload_authentication_htpasswd_admin_password is set.
# Reading the fact first is the only way to log in when the password was
# generated (set_fact facts persist across the workload roles of the same play).
ocp4_workload_coco_workshop_users_admin_user: "{{ ocp4_workload_authentication_admin_user | default('admin') }}"
ocp4_workload_coco_workshop_users_admin_password: >-
  {{ _ocp4_workload_authentication_admin_password
     | default(ocp4_workload_authentication_htpasswd_admin_password
               | default(common_password | default(''))) }}

# Namespaces used by the workshop narrative
ocp4_workload_coco_workshop_users_trustee_namespace: trustee-operator-system
ocp4_workload_coco_workshop_users_devel_namespaces:
  - default
  - fraud-detection

# Login retry behaviour (the OAuth server rolls out after the htpasswd change)
ocp4_workload_coco_workshop_users_login_retries: 30
ocp4_workload_coco_workshop_users_login_delay: 20

# Temporary htpasswd working file (removed after the secret is updated)
ocp4_workload_coco_workshop_users_tmp_htpasswd: "/tmp/coco-workshop-users-{{ guid }}.htpasswd"
