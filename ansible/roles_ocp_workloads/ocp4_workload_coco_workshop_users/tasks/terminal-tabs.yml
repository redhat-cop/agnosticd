---
# One wetty terminal tab per persona. Each pod SSHes to the bastion as the
# student user and only exports that persona's KUBECONFIG, so the terminals
# work as soon as the kubeconfigs created by this role exist.
#
# The terminals are plain Kubernetes objects (Namespace, Deployment, Service,
# Route) rendered from templates/terminals.yaml.j2 and applied with the k8s
# module: no helm and no chart repository involved. Helm stays exclusive to
# the CoCo stack installation (ocp4_workload_coco_helm_install).

- name: Apply the terminal tabs
  kubernetes.core.k8s:
    definition: "{{ lookup('ansible.builtin.template', 'terminals.yaml.j2')
                    | from_yaml_all | select('mapping') | list }}"

- name: Wait for the terminal tab deployments
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "terminal-{{ item.name }}"
    namespace: "{{ ocp4_workload_coco_workshop_users_terminal_namespace }}"
  loop: "{{ ocp4_workload_coco_workshop_users_terminals }}"
  loop_control:
    label: "{{ item.name }}"
  register: r_coco_users_terminal_deployment
  until:
    - r_coco_users_terminal_deployment.resources | length > 0
    - r_coco_users_terminal_deployment.resources[0].status.availableReplicas | default(0) | int >= 1
  delay: 10
  retries: 30
