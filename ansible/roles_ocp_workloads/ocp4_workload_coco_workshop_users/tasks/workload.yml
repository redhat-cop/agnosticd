---
# ---------------------------------------------------------------------------
# Workshop personas for LB1150: opsec, devel and admin.
#
# Non-destructive by design: the htpasswd Secret and the OAuth configuration
# created by ocp4_workload_authentication are extended, never replaced.
# No OS users and no tmux: every terminal tab SSHes to the bastion as
# {{ student_name }} and only exports a different KUBECONFIG.
# ---------------------------------------------------------------------------

- name: Get OAuth cluster configuration
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: OAuth
    name: cluster
  register: r_coco_oauth

- name: Find an existing HTPasswd identity provider
  ansible.builtin.set_fact:
    _coco_htpasswd_idps: >-
      {{ r_coco_oauth.resources[0].spec.identityProviders | default([])
         | selectattr('type', 'equalto', 'HTPasswd') | list }}

- name: Determine htpasswd secret name
  ansible.builtin.set_fact:
    _coco_htpasswd_secret: >-
      {{ (_coco_htpasswd_idps | first).htpasswd.fileData.name
         if _coco_htpasswd_idps | length > 0 else 'htpasswd' }}

- name: Read the existing htpasswd secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ _coco_htpasswd_secret }}"
    namespace: openshift-config
  register: r_coco_htpasswd_secret

- name: Write the current htpasswd database to a working file
  ansible.builtin.copy:
    content: >-
      {{ (r_coco_htpasswd_secret.resources[0].data.htpasswd | b64decode)
         if r_coco_htpasswd_secret.resources | length > 0 else '' }}
    dest: "{{ ocp4_workload_coco_workshop_users_tmp_htpasswd }}"
    mode: "0600"
  no_log: true

- name: Add the opsec and devel users (append, keep existing entries)
  community.general.htpasswd:
    path: "{{ ocp4_workload_coco_workshop_users_tmp_htpasswd }}"
    name: "{{ item }}"
    password: "{{ ocp4_workload_coco_workshop_users_password }}"
    # Same scheme as ocp4_workload_authentication (FIPS compatible)
    hash_scheme: ldap_sha1
  loop:
    - "{{ ocp4_workload_coco_workshop_users_opsec_user }}"
    - "{{ ocp4_workload_coco_workshop_users_devel_user }}"
  no_log: true

- name: Read the updated htpasswd database
  ansible.builtin.slurp:
    src: "{{ ocp4_workload_coco_workshop_users_tmp_htpasswd }}"
  register: r_coco_htpasswd_file
  no_log: true

- name: Create or update the htpasswd secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _coco_htpasswd_secret }}"
        namespace: openshift-config
      type: Opaque
      data:
        htpasswd: "{{ r_coco_htpasswd_file.content }}"

- name: Add an HTPasswd identity provider when none exists
  when: _coco_htpasswd_idps | length == 0
  kubernetes.core.k8s:
    state: patched
    api_version: config.openshift.io/v1
    kind: OAuth
    name: cluster
    definition:
      spec:
        identityProviders: >-
          {{ r_coco_oauth.resources[0].spec.identityProviders | default([])
             + [{
                 'name': 'htpasswd_provider',
                 'challenge': true,
                 'login': true,
                 'mappingMethod': 'claim',
                 'type': 'HTPasswd',
                 'htpasswd': {'fileData': {'name': _coco_htpasswd_secret}}
               }] }}

- name: Remove the temporary htpasswd file
  ansible.builtin.file:
    path: "{{ ocp4_workload_coco_workshop_users_tmp_htpasswd }}"
    state: absent

# ---------------------------------------------------------------------------
# Kubeconfigs (one per persona, owned by the bastion student user)
# ---------------------------------------------------------------------------

- name: Get the API server URL
  ansible.builtin.command: oc whoami --show-server
  register: r_coco_api_server
  changed_when: false

- name: Read the API server CA from the bastion kubeconfig
  # Runs as the workload user, whose kubeconfig embeds the cluster CA. The
  # value is passed to the student login below so the persona kubeconfigs
  # verify the API certificate; when it cannot be read the login falls back
  # to the system trust store, like ocp4_workload_authentication does.
  ansible.builtin.command: >-
    oc config view --raw --minify
    -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
  register: r_coco_api_ca
  changed_when: false
  failed_when: false

- name: Ensure the .kube directory is owned by the student user
  become: true
  ansible.builtin.file:
    path: "{{ ocp4_workload_coco_workshop_users_kubeconfig_dir }}"
    state: directory
    owner: "{{ ocp4_workload_coco_workshop_users_student }}"
    group: users
    mode: "0700"

- name: Create a home directory per persona
  # Each terminal tab starts in its persona's directory instead of the
  # shared home, so files created in different tabs do not mix.
  become: true
  ansible.builtin.file:
    path: "{{ ocp4_workload_coco_workshop_users_home }}/{{ item }}"
    state: directory
    owner: "{{ ocp4_workload_coco_workshop_users_student }}"
    group: users
    mode: "0755"
  loop:
    - "{{ ocp4_workload_coco_workshop_users_opsec_user }}"
    - "{{ ocp4_workload_coco_workshop_users_devel_user }}"
    - "{{ ocp4_workload_coco_workshop_users_admin_user }}"

- name: Log in the workshop personas and write their kubeconfigs
  # KUBECONFIG is exported inside the script: environment: variables do not
  # reliably survive become/sudo. The CA comes from the bastion kubeconfig
  # (read by the task above, as the workload user) because the API
  # certificate may not be in the system trust store.
  ansible.builtin.shell: |
    set -euo pipefail
    tls_args=""
    ca_b64='{{ r_coco_api_ca.stdout | default("") }}'
    if [ -n "$ca_b64" ]; then
      ca_file="{{ ocp4_workload_coco_workshop_users_kubeconfig_dir }}/cluster-ca.crt"
      printf '%s' "$ca_b64" | base64 -d > "$ca_file"
      chmod 0644 "$ca_file"
      tls_args="--certificate-authority=$ca_file"
    else
      tls_args="--insecure-skip-tls-verify=true"
    fi
    export KUBECONFIG="{{ ocp4_workload_coco_workshop_users_kubeconfig_dir }}/{{ item.name }}.kubeconfig"
    oc login "{{ r_coco_api_server.stdout }}" \
      --username="{{ item.user }}" \
      --password="{{ item.password }}" \
      $tls_args
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ ocp4_workload_coco_workshop_users_student }}"
  loop:
    - name: "{{ ocp4_workload_coco_workshop_users_opsec_user }}"
      user: "{{ ocp4_workload_coco_workshop_users_opsec_user }}"
      password: "{{ ocp4_workload_coco_workshop_users_password }}"
    - name: "{{ ocp4_workload_coco_workshop_users_devel_user }}"
      user: "{{ ocp4_workload_coco_workshop_users_devel_user }}"
      password: "{{ ocp4_workload_coco_workshop_users_password }}"
    - name: "{{ ocp4_workload_coco_workshop_users_admin_user }}"
      user: "{{ ocp4_workload_coco_workshop_users_admin_user }}"
      password: "{{ ocp4_workload_coco_workshop_users_admin_password }}"
  register: r_coco_login
  until: r_coco_login is success
  retries: "{{ ocp4_workload_coco_workshop_users_login_retries | int }}"
  delay: "{{ ocp4_workload_coco_workshop_users_login_delay | int }}"
  no_log: true

# ---------------------------------------------------------------------------
# RBAC
#
# Persona matrix:
#   admin: full access to everything except the excluded namespaces
#          (trustee-operator-system)
#   opsec: full access to trustee-operator-system ONLY
#   devel: edit access to the devel namespaces ONLY (default,
#          fraud-detection)
# ---------------------------------------------------------------------------

- name: Ensure the workshop narrative namespaces exist
  # fraud-detection and trustee-operator-system are part of the persona
  # matrix; create them when missing (the same approach as the ARO
  # workshop) so the bindings are deterministic. ocp4_workload_
  # coco_helm_install applies the CoCo stack into trustee-operator-system
  # later; creating the namespace first is harmless.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop: "{{ ocp4_workload_coco_workshop_users_devel_namespaces
            + [ocp4_workload_coco_workshop_users_trustee_namespace] }}"

- name: List existing namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
  register: r_coco_namespaces

- name: Give opsec admin access to the Trustee namespace
  # opsec is the guardian of the Trustee namespace: full access there and
  # nowhere else.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: coco-opsec-trustee-admin
        namespace: "{{ ocp4_workload_coco_workshop_users_trustee_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: User
          name: "{{ ocp4_workload_coco_workshop_users_opsec_user }}"

- name: Give devel edit access to the workload namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: coco-devel-edit
        namespace: "{{ item }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: edit
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: User
          name: "{{ ocp4_workload_coco_workshop_users_devel_user }}"
  loop: "{{ ocp4_workload_coco_workshop_users_devel_namespaces
            | intersect(r_coco_namespaces.resources | map(attribute='metadata.name') | list) }}"

- name: Remove the cluster-admin binding granted by ocp4_workload_authentication
  # This lab's admin persona is a workload administrator (like the ARO
  # workshop's uadmin), not a cluster admin. ocp4_workload_authentication
  # grants the admin user cluster-admin unconditionally, so drop that
  # binding here; the restore happens in remove_workload.yml.
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: "cluster-admin-{{ ocp4_workload_coco_workshop_users_admin_user }}"

- name: Apply the admin cluster-scoped ClusterRole
  # Full cluster-scoped access (nodes, namespaces, operators, machine
  # configs, CRDs, SCCs) EXCEPT RBAC escalation and impersonation: with
  # those, the admin persona could grant itself access to the excluded
  # trustee-operator-system namespace and the restriction would be
  # meaningless. Namespaced access is granted per namespace below.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: coco-admin-cluster-role
      rules:
        - apiGroups: [""]
          resources: ["namespaces", "nodes", "persistentvolumes"]
          verbs: ["*"]
        - apiGroups:
            - config.openshift.io
            - operator.openshift.io
            - machineconfiguration.openshift.io
            - kataconfiguration.openshift.io
            - node.k8s.io
            - storage.k8s.io
            - apiextensions.k8s.io
            - admissionregistration.k8s.io
            - scheduling.k8s.io
            - certificates.k8s.io
            - apiregistration.k8s.io
            - flowcontrol.apiserver.k8s.io
          resources: ["*"]
          verbs: ["*"]
        - apiGroups: ["security.openshift.io"]
          resources: ["securitycontextconstraints"]
          verbs: ["*"]
        # Read-only operator lifecycle metadata, so `oc get csv -A` and
        # `oc get operators` work (the console's Installed Operators
        # overview uses the aggregated Operator resource). Includes the
        # Trustee operator in cluster-wide listings; writing in
        # trustee-operator-system stays opsec-only.
        - apiGroups: ["operators.coreos.com"]
          resources: ["clusterserviceversions", "subscriptions", "operatorgroups", "installplans"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["operators.operators.coreos.com"]
          resources: ["operators"]
          verbs: ["get", "list", "watch"]

- name: Bind the cluster-scoped admin role
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: coco-admin-sandboxed-admin
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: coco-admin-cluster-role
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: User
          name: "{{ ocp4_workload_coco_workshop_users_admin_user }}"

- name: Apply the admin namespace ClusterRole
  # Unrestricted within a namespace (same shape as cluster-admin's
  # namespaced reach); bound per namespace below. RBAC's escalation
  # prevention keeps this from exceeding itself.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: coco-admin-namespace-role
      rules:
        - apiGroups: ["*"]
          resources: ["*"]
          verbs: ["*"]

- name: Give the admin persona full access to every namespace except the excluded ones
  # RBAC cannot subtract a namespace from a cluster-wide grant, so full
  # namespaced access is bound namespace by namespace, skipping
  # trustee-operator-system (opsec's domain). Namespaces created after this
  # workload runs are not bound automatically; OpenShift still grants the
  # creator admin in namespaces they create via `oc new-project`.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: coco-admin-namespace
        namespace: "{{ item }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: coco-admin-namespace-role
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: User
          name: "{{ ocp4_workload_coco_workshop_users_admin_user }}"
  loop: "{{ (r_coco_namespaces.resources | map(attribute='metadata.name') | list)
            | difference(ocp4_workload_coco_workshop_users_admin_excluded_namespaces) }}"

# ---------------------------------------------------------------------------
# Showroom data
# ---------------------------------------------------------------------------

- name: Get the cluster ingress domain
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: r_coco_ingress

- name: Get the cluster resource group
  # The guide's Azure CLI steps run against the cluster's resource group
  # (where the peer pod resources live), like the ARO workshop's
  # openenv-<guid> group.
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Infrastructure
    name: cluster
  register: r_coco_infrastructure
  failed_when: false

- name: Get the OpenShift console route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: console
    namespace: openshift-console
  register: r_coco_console_route
  failed_when: false

- name: Set the showroom tab URL facts
  vars:
    _apps_domain: >-
      {{ r_coco_ingress.resources[0].spec.appsDomain
         | default(r_coco_ingress.resources[0].spec.domain) }}
    _coco_terminal_host: >-
      {{ ocp4_workload_coco_workshop_users_terminal_host_prefix
      }}-{{ ocp4_workload_coco_workshop_users_terminal_host_suffix }}
  ansible.builtin.set_fact:
    _coco_apps_domain: "{{ _apps_domain }}"
    _coco_console_url: >-
      {{ ('https://' ~ r_coco_console_route.resources[0].spec.host)
         if (r_coco_console_route.resources | default([]) | length > 0)
         else 'https://console-openshift-console.' ~ _apps_domain }}
    _coco_opsec_url: "https://{{ _coco_terminal_host }}-{{ ocp4_workload_coco_workshop_users_opsec_user }}.{{ _apps_domain }}"
    _coco_devel_url: "https://{{ _coco_terminal_host }}-{{ ocp4_workload_coco_workshop_users_devel_user }}.{{ _apps_domain }}"
    _coco_admin_url: "https://{{ _coco_terminal_host }}-{{ ocp4_workload_coco_workshop_users_admin_user }}.{{ _apps_domain }}"

- name: Deploy the terminal tabs
  when: ocp4_workload_coco_workshop_users_terminal_tabs_enabled | bool
  ansible.builtin.include_tasks: terminal-tabs.yml

- name: Report workshop persona data
  agnosticd_user_info:
    data:
      coco_opsec_user: "{{ ocp4_workload_coco_workshop_users_opsec_user }}"
      coco_devel_user: "{{ ocp4_workload_coco_workshop_users_devel_user }}"
      coco_admin_user: "{{ ocp4_workload_coco_workshop_users_admin_user }}"
      coco_opsec_kubeconfig: "{{ ocp4_workload_coco_workshop_users_kubeconfig_dir }}/{{ ocp4_workload_coco_workshop_users_opsec_user }}.kubeconfig"
      coco_devel_kubeconfig: "{{ ocp4_workload_coco_workshop_users_kubeconfig_dir }}/{{ ocp4_workload_coco_workshop_users_devel_user }}.kubeconfig"
      coco_admin_kubeconfig: "{{ ocp4_workload_coco_workshop_users_kubeconfig_dir }}/{{ ocp4_workload_coco_workshop_users_admin_user }}.kubeconfig"
      # Antora attributes consumed by the guide pages: the console link and
      # the per-persona login credentials the guide tells the student to
      # use. aro_kube_* is the trusted-cluster console login, which the
      # guide labels "Login as opsec"; the coco_* pair feeds the
      # untrusted-cluster login block.
      aro_console: "{{ _coco_console_url }}"
      aro_kube_username: "{{ ocp4_workload_coco_workshop_users_opsec_user }}"
      aro_kube_password: "{{ ocp4_workload_coco_workshop_users_password }}"
      coco_opsec_password: "{{ ocp4_workload_coco_workshop_users_password }}"
      coco_devel_password: "{{ ocp4_workload_coco_workshop_users_password }}"
      coco_admin_password: "{{ ocp4_workload_coco_workshop_users_admin_password }}"
      # Setting azure_resource_group to a real value switches the guide from
      # its manual mode (hidden persona notes, manual service principal
      # login blocks) to the full workshop mode the ARO workshop runs in:
      # persona notes, console login credentials and pre-filled Azure CLI
      # commands. azure_tenant_id is the attribute name the guide's az
      # login expects (the open-env config publishes the same pair).
      azure_resource_group: >-
        {{ r_coco_infrastructure.resources[0].status.platformStatus.azure.resourceGroupName
           | default(az_resource_group | default(''), true) }}
      azure_tenant_id: "{{ azure_tenant }}"
      # The showroom content container runs envsubst over ui-config.yml with
      # only the variables exported from this nested user data map: flat user
      # data keys never reach envsubst (they only become Antora attributes).
      # The terminal URLs are deterministic and match the wetty routes this
      # role creates.
      environment_variables:
        openshift_console_url: "{{ _coco_console_url }}"
        opsec_url: "{{ _coco_opsec_url }}"
        devel_url: "{{ _coco_devel_url }}"
        admin_url: "{{ _coco_admin_url }}"

- name: Workshop users configured
  ansible.builtin.debug:
    msg: >-
      Personas ready: {{ ocp4_workload_coco_workshop_users_opsec_user }},
      {{ ocp4_workload_coco_workshop_users_devel_user }},
      {{ ocp4_workload_coco_workshop_users_admin_user }}
      (kubeconfigs in {{ ocp4_workload_coco_workshop_users_kubeconfig_dir }})
