---
# ocp4_workload_helm_from_content_repo default variables

become_override: false
ocp_username: user-redhat.com
silent: false

# Kubernetes authentication (set by catalog item for CNV deployments)
ocp4_workload_helm_from_content_repo_k8s_auth_host: ""
ocp4_workload_helm_from_content_repo_k8s_auth_api_key: ""
ocp4_workload_helm_from_content_repo_validate_certs: true

# Legacy kubeconfig support (for non-CNV deployments)
ocp4_workload_helm_from_content_repo_kubeconfig: ""

# Namespace to deploy into
# - CNV/Babylon: Use sandbox_openshift_namespace (sandbox-{guid}-{catalog})
# - AWS/Azure: Use guid
ocp4_workload_helm_from_content_repo_namespace: "{{ guid }}"

# Content repository configuration (typically set by catalog item)
ocp4_workload_helm_from_content_repo_git_repo: ""
ocp4_workload_helm_from_content_repo_git_ref: main

# Base URL for fetching config files from content repo
# Constructed from git repo URL and ref
ocp4_workload_helm_from_content_repo_git_config_url: >-
  {{ ocp4_workload_helm_from_content_repo_git_repo
     | regex_replace('\.git$', '')
     | regex_replace('github\.com', 'raw.githubusercontent.com')
     }}/{{ ocp4_workload_helm_from_content_repo_git_ref }}/config

# Helm charts configuration from content repo
# Fetched from config/helm-charts.yaml
ocp4_workload_helm_from_content_repo_helm_charts: []

# Default security constraints (can be overridden per-chart in helm-charts.yaml)
ocp4_workload_helm_from_content_repo_default_security:
  allowClusterScopedResources: false
  allowPrivileged: false
  allowHostPath: false
  maxCpuLimit: "4000m"
  maxMemoryLimit: "8Gi"
  maxStorageClaim: "10Gi"

# Wait configuration for chart deployments
ocp4_workload_helm_from_content_repo_wait_enabled: true
ocp4_workload_helm_from_content_repo_wait_timeout: 600
ocp4_workload_helm_from_content_repo_wait_retries: 60
ocp4_workload_helm_from_content_repo_wait_delay: 5

# Helm template fetch retry configuration
ocp4_workload_helm_from_content_repo_helm_retries: 3
ocp4_workload_helm_from_content_repo_helm_delay: 5
