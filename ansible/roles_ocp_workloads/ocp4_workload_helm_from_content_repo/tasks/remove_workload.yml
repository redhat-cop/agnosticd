---
# ocp4_workload_helm_from_content_repo remove tasks

- name: Remove workload
  ansible.builtin.debug:
    msg: "Removing Helm chart deployment workload for user {{ ocp_username }}"

# Note: Helm charts deployed by this workload are in the namespace
# Namespace deletion (handled by base config) will remove all resources
# No explicit removal needed here

- name: Workload removal complete
  ansible.builtin.debug:
    msg: "Workload removal completed successfully (resources removed with namespace)"
