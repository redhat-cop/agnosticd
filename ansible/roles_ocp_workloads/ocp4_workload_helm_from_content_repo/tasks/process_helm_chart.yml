---
# Process and deploy a single Helm chart

- name: "Set chart facts for {{ _chart.name }}"
  ansible.builtin.set_fact:
    _chart_name: "{{ _chart.name }}"
    _chart_source: "{{ _chart.source }}"
    _release_name: "{{ _chart.release.name }}"
    _release_namespace: "{{ _chart.release.namespace | default(ocp4_workload_helm_from_content_repo_namespace) }}"
    _security_constraints: "{{ ocp4_workload_helm_from_content_repo_default_security | combine(_chart.security | default({})) }}"
    _wait_enabled: "{{ _chart.wait.enabled | default(ocp4_workload_helm_from_content_repo_wait_enabled) }}"
    _wait_timeout: "{{ _chart.wait.timeout | default(ocp4_workload_helm_from_content_repo_wait_timeout) }}"

- name: "Report deploying chart: {{ _chart_name }}"
  ansible.builtin.debug:
    msg: "Deploying Helm chart '{{ _chart_name }}' as release '{{ _release_name }}' in namespace '{{ _release_namespace }}'"

# =============================================
# Render Helm chart based on source type
# =============================================

# Write chart values to temporary file (all source types)
- name: Write chart values to temporary file
  ansible.builtin.copy:
    content: "{{ _chart['release']['values'] | default({}) | to_nice_yaml }}"
    dest: "/tmp/helm_values_{{ _chart_name }}.yml"
    mode: '0644'

# Render from repository
- name: "Render chart from repository: {{ _chart_name }}"
  when: _chart_source.type == 'repository'
  kubernetes.core.helm_template:
    chart_repo_url: "{{ _chart_source.url }}"
    chart_ref: "{{ _chart_source.chart_ref }}"
    chart_version: "{{ _chart_source.version | default(omit) }}"
    release_name: "{{ _release_name }}"
    release_namespace: "{{ _release_namespace }}"
    values_files:
      - "/tmp/helm_values_{{ _chart_name }}.yml"
  register: r_helm_templates_repo
  retries: "{{ ocp4_workload_helm_from_content_repo_helm_retries }}"
  delay: "{{ ocp4_workload_helm_from_content_repo_helm_delay }}"
  until: r_helm_templates_repo is succeeded

# Render from URL
- name: "Render chart from URL: {{ _chart_name }}"
  when: _chart_source.type == 'url'
  kubernetes.core.helm_template:
    chart_ref: "{{ _chart_source.url }}"
    release_name: "{{ _release_name }}"
    release_namespace: "{{ _release_namespace }}"
    values_files:
      - "/tmp/helm_values_{{ _chart_name }}.yml"
  register: r_helm_templates_url
  retries: "{{ ocp4_workload_helm_from_content_repo_helm_retries }}"
  delay: "{{ ocp4_workload_helm_from_content_repo_helm_delay }}"
  until: r_helm_templates_url is succeeded

# Render from local path (content repo)
- name: "Render chart from local path: {{ _chart_name }}"
  when: _chart_source.type == 'path'
  kubernetes.core.helm_template:
    chart_ref: "{{ ocp4_workload_helm_from_content_repo_clone_path }}/{{ _chart_source.path }}"
    release_name: "{{ _release_name }}"
    release_namespace: "{{ _release_namespace }}"
    values_files:
      - "/tmp/helm_values_{{ _chart_name }}.yml"
  register: r_helm_templates_path
  retries: "{{ ocp4_workload_helm_from_content_repo_helm_retries }}"
  delay: "{{ ocp4_workload_helm_from_content_repo_helm_delay }}"
  until: r_helm_templates_path is succeeded

# Unify result into single variable
- name: Set unified helm template result
  ansible.builtin.set_fact:
    r_helm_templates: >-
      {{
        r_helm_templates_repo if _chart_source.type == 'repository'
        else r_helm_templates_url if _chart_source.type == 'url'
        else r_helm_templates_path
      }}

# Fail for embedded charts (not yet supported)
- name: Fail if embedded chart requested
  when: _chart_source.type == 'embedded'
  ansible.builtin.fail:
    msg: |
      Embedded chart support requires the chart to be packaged as a tarball.
      Please use 'type: repository' and point to a Helm chart repository instead.
      Example: chart_repo_url: https://charts.example.com
               chart_ref: mychart
               version: 1.0.0

# =============================================
# Security validation
# =============================================

- name: Parse rendered manifests for security validation
  ansible.builtin.set_fact:
    _rendered_manifests: "{{ r_helm_templates.stdout | from_yaml_all | list }}"

- name: "Validate security constraints for {{ _chart_name }}"
  ansible.builtin.include_tasks: validate_security.yml
  loop: "{{ _rendered_manifests }}"
  loop_control:
    loop_var: _manifest
    label: "{{ _manifest.kind | default('Unknown') }}/{{ _manifest.metadata.name | default('unnamed') }}"

# =============================================
# Extract pod labels from rendered manifests
# =============================================

- name: "Extract pod labels from {{ _chart_name }} workload manifests"
  ansible.builtin.set_fact:
    _pod_label_selectors: >-
      {% set labels = {} -%}
      {% for manifest in _rendered_manifests -%}
        {% if manifest.kind in ['Deployment', 'StatefulSet', 'DaemonSet'] and manifest.spec.template.metadata.labels is defined -%}
          {% set _ = labels.update(manifest.spec.template.metadata.labels) -%}
        {% elif manifest.kind == 'Pod' and manifest.metadata.labels is defined -%}
          {% set _ = labels.update(manifest.metadata.labels) -%}
        {% endif -%}
      {% endfor -%}
      {% if labels | length > 0 -%}
      {{ labels.items() | map('join', '=') | list }}
      {%- else -%}
      ["app.kubernetes.io/instance={{ _release_name }}"]
      {%- endif %}

- name: "Report pod label selectors for {{ _chart_name }}"
  ansible.builtin.debug:
    msg: "Using label selectors: {{ _pod_label_selectors }}"

# =============================================
# Deploy manifests (based on showroom pattern)
# =============================================

- name: "Deploy {{ _chart_name }} manifests to namespace {{ _release_namespace }}"
  kubernetes.core.k8s:
    namespace: "{{ _release_namespace }}"
    host: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_host | default(omit) }}"
    api_key: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_api_key | default(omit) }}"
    validate_certs: "{{ ocp4_workload_helm_from_content_repo_validate_certs }}"
    kubeconfig: "{{ ocp4_workload_helm_from_content_repo_kubeconfig | default(omit) }}"
    definition: "{{ r_helm_templates.stdout | from_yaml_all }}"
    wait: false  # We'll do our own waiting below

# =============================================
# Wait for chart deployment readiness
# =============================================

- name: "Wait for {{ _chart_name }} pods to be created"
  when: _wait_enabled | bool
  kubernetes.core.k8s_info:
    host: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_host | default(omit) }}"
    api_key: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_api_key | default(omit) }}"
    validate_certs: "{{ ocp4_workload_helm_from_content_repo_validate_certs }}"
    kubeconfig: "{{ ocp4_workload_helm_from_content_repo_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Pod
    namespace: "{{ _release_namespace }}"
    label_selectors: "{{ _pod_label_selectors }}"
  register: r_chart_pods
  retries: "{{ ocp4_workload_helm_from_content_repo_wait_retries }}"
  delay: "{{ ocp4_workload_helm_from_content_repo_wait_delay }}"
  until: r_chart_pods.resources | length > 0
  failed_when: false

- name: "Warn if {{ _chart_name }} pods not created"
  when:
    - _wait_enabled | bool
    - r_chart_pods.resources | default([]) | length == 0
  ansible.builtin.debug:
    msg: "WARNING: No pods found for release {{ _release_name }}. Chart may not create pods immediately or may use other resource types."

- name: "Wait for {{ _chart_name }} pods to be Running and Ready"
  when:
    - _wait_enabled | bool
    - r_chart_pods.resources | length > 0
  kubernetes.core.k8s_info:
    host: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_host | default(omit) }}"
    api_key: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_api_key | default(omit) }}"
    validate_certs: "{{ ocp4_workload_helm_from_content_repo_validate_certs }}"
    kubeconfig: "{{ ocp4_workload_helm_from_content_repo_kubeconfig | default(omit) }}"
    api_version: v1
    kind: Pod
    namespace: "{{ _release_namespace }}"
    label_selectors: "{{ _pod_label_selectors }}"
  register: r_chart_pods_status
  retries: "{{ ocp4_workload_helm_from_content_repo_wait_retries }}"
  delay: "{{ ocp4_workload_helm_from_content_repo_wait_delay }}"
  until:
    - r_chart_pods_status.resources | length > 0
    - r_chart_pods_status.resources | selectattr('status.phase', 'equalto', 'Running') | list | length == r_chart_pods_status.resources | length
    - r_chart_pods_status.resources | map(attribute='status.containerStatuses', default=[]) | flatten | selectattr('ready', 'equalto', true) | list | length > 0
  failed_when: false

- name: "Warn if {{ _chart_name }} pods not ready"
  when:
    - _wait_enabled | bool
    - r_chart_pods.resources | length > 0
    - r_chart_pods_status.resources | default([]) | selectattr('status.phase', 'equalto', 'Running') | list | length != r_chart_pods_status.resources | length
  ansible.builtin.debug:
    msg: "WARNING: Not all pods for release {{ _release_name }} are Running and Ready. Check pod status in namespace {{ _release_namespace }}."

- name: "Report {{ _chart_name }} deployment status"
  ansible.builtin.debug:
    msg: |
      Chart {{ _chart_name }} deployed:
      - Release: {{ _release_name }}
      - Namespace: {{ _release_namespace }}
      - Pods: {{ r_chart_pods_status.resources | default([]) | length }}
      - Status: {{ 'Ready' if (r_chart_pods_status.resources | default([]) | selectattr('status.phase', 'equalto', 'Running') | list | length > 0) else 'Not Ready' }}

# =============================================
# Create Routes for service exposure
# =============================================

- name: "Create Routes for {{ _chart_name }}"
  ansible.builtin.include_tasks: create_routes.yml

# =============================================
# Cleanup
# =============================================

- name: Remove temporary values file
  ansible.builtin.file:
    path: "/tmp/helm_values_{{ _chart_name }}.yml"
    state: absent
