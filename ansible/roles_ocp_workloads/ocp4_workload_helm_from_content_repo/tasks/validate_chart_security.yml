---
# Validate all manifests in a single chart
# Accumulates violations to _validation_violations list

- name: "Validate security for chart: {{ _chart_to_validate.chart_name }}"
  ansible.builtin.include_tasks: validate_manifest_security.yml
  vars:
    _manifest: "{{ item }}"
    _chart_name: "{{ _chart_to_validate.chart_name }}"
    _security_constraints: "{{ _chart_to_validate.security_constraints }}"
  loop: "{{ _chart_to_validate.manifests }}"
  loop_control:
    label: "{{ item.kind | default('Unknown') }}/{{ item.metadata.name | default('unnamed') }}"
