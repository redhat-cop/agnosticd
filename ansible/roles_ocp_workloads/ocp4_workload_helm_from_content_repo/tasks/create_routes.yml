---
# Create OpenShift Routes for helm-deployed services
# Called from process_helm_chart.yml after resources are deployed

- name: "Create Routes for {{ _chart_name }}"
  when: _chart.routes | default([]) | length > 0
  block:
    - name: "Create Route {{ route.name }}"
      kubernetes.core.k8s:
        host: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_host | default(omit) }}"
        api_key: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_api_key | default(omit) }}"
        validate_certs: "{{ ocp4_workload_helm_from_content_repo_validate_certs }}"
        kubeconfig: "{{ ocp4_workload_helm_from_content_repo_kubeconfig | default(omit) }}"
        definition:
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: "{{ route.name }}"
            namespace: "{{ _release_namespace }}"
            labels:
              app.kubernetes.io/managed-by: helm-from-content-repo
              app.kubernetes.io/instance: "{{ _release_name }}"
          spec:
            host: >-
              {{ route.host | default(route.name) }}-{{ guid }}.{{ ocp4_workload_helm_from_content_repo_apps_domain }}
            path: "{{ route.path | default(omit if route.tls_termination | default('edge') == 'passthrough' else '/') }}"
            to:
              kind: Service
              name: "{{ route.service }}"
            port:
              targetPort: "{{ route.targetPort }}"
            tls: "{{ _route_tls | from_yaml if route.tls | default(false) else omit }}"
            httpHeaders: "{{ _route_http_headers | from_yaml if route.remove_x_frame_options | default(true) and route.tls | default(false) and route.tls_termination | default('edge') != 'passthrough' else omit }}"
      vars:
        _route_tls: |
          termination: {{ route.tls_termination | default('edge') }}
          insecureEdgeTerminationPolicy: {{ route.tls_insecure_policy | default('Redirect') }}
          {% if route.tls_termination | default('edge') == 'reencrypt' and route.tls_destination_ca_cert is defined %}
          destinationCACertificate: |
            {{ route.tls_destination_ca_cert | indent(4) }}
          {% endif %}
        _route_http_headers: |
          actions:
            response:
              - name: X-Frame-Options
                action:
                  type: Delete
      loop: "{{ _chart.routes }}"
      loop_control:
        loop_var: route
      register: r_routes
      until: r_routes is success
      retries: "{{ ocp4_workload_helm_from_content_repo_retries }}"
      delay: "{{ ocp4_workload_helm_from_content_repo_delay }}"

    - name: "Report created Routes for {{ _chart_name }}"
      ansible.builtin.debug:
        msg: |
          Created {{ _chart.routes | length }} Route(s) for {{ _chart_name }}:
          {% for route in _chart.routes %}
          - {{ route.name }}: https://{{ route.host | default(route.name) }}-{{ guid }}.{{ ocp4_workload_helm_from_content_repo_apps_domain }}{{ route.path | default('/') }}
          {% endfor %}
