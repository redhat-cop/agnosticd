---
# Deploy a pre-rendered and validated Helm chart

- name: "Report deploying chart: {{ _rendered_chart.chart_name }}"
  ansible.builtin.debug:
    msg: "Deploying Helm chart '{{ _rendered_chart.chart_name }}' as release '{{ _rendered_chart.release_name }}' in namespace '{{ _rendered_chart.release_namespace }}'"

# =============================================
# Extract pod labels from rendered manifests
# =============================================

- name: "Extract pod labels from {{ _rendered_chart.chart_name }} workload manifests"
  ansible.builtin.set_fact:
    _expected_pod_labels: >-
      {{
        _rendered_chart.manifests
        | selectattr('kind', 'in', ['Deployment', 'StatefulSet', 'DaemonSet'])
        | selectattr('spec.template.metadata.labels', 'defined')
        | map(attribute='spec.template.metadata.labels')
        | list
        | first
        | default({'app.kubernetes.io/instance': _rendered_chart.release_name})
      }}

# =============================================
# Deploy and wait (with k8s module defaults)
# =============================================

- name: Deploy chart and wait for readiness
  module_defaults:
    group/k8s:
      host: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_host | default(omit) }}"
      api_key: "{{ ocp4_workload_helm_from_content_repo_k8s_auth_api_key | default(omit) }}"
      validate_certs: "{{ ocp4_workload_helm_from_content_repo_validate_certs }}"
      kubeconfig: "{{ ocp4_workload_helm_from_content_repo_kubeconfig | default(omit) }}"
  block:
    - name: "Deploy {{ _rendered_chart.chart_name }} manifests"
      kubernetes.core.k8s:
        namespace: "{{ _rendered_chart.release_namespace }}"
        definition: "{{ _rendered_chart.manifests }}"
        wait: false

    # Wait for parent workload resource (Deployment/StatefulSet) instead of pods
    # This avoids k8s_info label_selector bug where it fails to find pods that don't exist yet
    - name: "Find workload resource for {{ _rendered_chart.chart_name }}"
      when: _rendered_chart.wait_enabled | bool
      ansible.builtin.set_fact:
        _workload_resource: >-
          {{
            _rendered_chart.manifests
            | selectattr('kind', 'in', ['Deployment', 'StatefulSet', 'DaemonSet'])
            | list
            | first
            | default({})
          }}

    # wkulhanek pattern: query Deployment/StatefulSet and check readyReplicas
    # Avoids k8s_info label_selector bug entirely - no pod queries needed
    - name: "Wait for {{ _rendered_chart.chart_name }} to be ready"
      when:
        - _rendered_chart.wait_enabled | bool
        - _workload_resource | length > 0
      kubernetes.core.k8s_info:
        api_version: "{{ _workload_resource.apiVersion }}"
        kind: "{{ _workload_resource.kind }}"
        name: "{{ _workload_resource.metadata.name }}"
        namespace: "{{ _rendered_chart.release_namespace }}"
      register: r_workload
      retries: "{{ ocp4_workload_helm_from_content_repo_wait_retries }}"
      delay: 5
      until:
        - r_workload.resources | length > 0
        - r_workload.resources[0].status.readyReplicas is defined
        - r_workload.resources[0].status.readyReplicas | int == r_workload.resources[0].spec.replicas | int
      failed_when: false
      changed_when: false

    # If workload didn't become ready, provide diagnostic information
    - name: "Report workload not ready"
      when:
        - _rendered_chart.wait_enabled | bool
        - _workload_resource | length > 0
        - r_workload.resources | default([]) | length > 0
        - >-
          r_workload.resources[0].status.readyReplicas is not defined or
          r_workload.resources[0].status.readyReplicas | int < r_workload.resources[0].spec.replicas | int
      ansible.builtin.fail:
        msg: |
          ========================================================================
          Chart {{ _rendered_chart.chart_name }} workload not ready after {{ ocp4_workload_helm_from_content_repo_wait_retries }} retries
          ========================================================================

          WORKLOAD STATUS:
          - Kind: {{ _workload_resource.kind }}
          - Name: {{ _workload_resource.metadata.name }}
          - Namespace: {{ _rendered_chart.release_namespace }}
          - Desired replicas: {{ r_workload.resources[0].spec.replicas | default(0) }}
          - Ready replicas: {{ r_workload.resources[0].status.readyReplicas | default(0) }}
          - Available replicas: {{ r_workload.resources[0].status.availableReplicas | default(0) }}
          - Current replicas: {{ r_workload.resources[0].status.replicas | default(0) }}
          {% if r_workload.resources[0].status.conditions is defined %}

          CONDITIONS (Deployment):
          {% for condition in r_workload.resources[0].status.conditions %}
          - {{ condition.type }}: {{ condition.status }} - {{ condition.message | default('N/A') }}
          {% endfor %}
          {% endif %}

          TROUBLESHOOTING:
          1. Check pod status: oc get pods -n {{ _rendered_chart.release_namespace }}
          2. Describe workload: oc describe {{ _workload_resource.kind | lower }} {{ _workload_resource.metadata.name }} -n {{ _rendered_chart.release_namespace }}
          3. Check events: oc get events -n {{ _rendered_chart.release_namespace }} --sort-by='.lastTimestamp'

          ========================================================================

    - name: "Report {{ _rendered_chart.chart_name }} deployment status"
      ansible.builtin.debug:
        msg: |
          Chart {{ _rendered_chart.chart_name }} deployed:
          - Release: {{ _rendered_chart.release_name }}
          - Namespace: {{ _rendered_chart.release_namespace }}
          {% if _workload_resource | default({}) | length > 0 %}
          - Workload: {{ _workload_resource.kind }}/{{ _workload_resource.metadata.name }}
          - Ready replicas: {{ r_workload.resources[0].status.readyReplicas | default(0) }} / {{ r_workload.resources[0].spec.replicas | default(0) }}
          - Status: {{ 'Ready' if (r_workload.resources[0].status.readyReplicas | default(0) | int == r_workload.resources[0].spec.replicas | default(0) | int) else 'Pending' }}
          {% else %}
          - Workload: None (chart contains no Deployment/StatefulSet/DaemonSet)
          - Status: Deployed
          {% endif %}

    # =============================================
    # Create Routes for service exposure
    # =============================================

    - name: "Create Routes for {{ _rendered_chart.chart_name }}"
      ansible.builtin.include_tasks: create_routes.yml
      vars:
        _chart_name: "{{ _rendered_chart.chart_name }}"
        _release_name: "{{ _rendered_chart.release_name }}"
        _release_namespace: "{{ _rendered_chart.release_namespace }}"
        _chart_config: "{{ _rendered_chart.chart_config }}"
