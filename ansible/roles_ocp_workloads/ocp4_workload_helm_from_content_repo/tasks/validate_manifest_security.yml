---
# Validate a single manifest against security constraints
# Adds violations to _validation_violations list instead of failing

# Skip validation for empty manifests or non-dict types
- name: Skip validation for invalid manifest
  when:
    - _manifest is not mapping
    - _manifest.kind is not defined
  ansible.builtin.debug:
    msg: "Skipping validation for non-manifest content"

- name: Validate manifest security
  when:
    - _manifest is mapping
    - _manifest.kind is defined
  block:
    # =============================================
    # Check for cluster-scoped resources
    # =============================================
    - name: Define cluster-scoped resource types
      ansible.builtin.set_fact:
        _cluster_scoped_kinds:
          - ClusterRole
          - ClusterRoleBinding
          - CustomResourceDefinition
          - PersistentVolume
          - StorageClass
          - Namespace
          - Node
          - ClusterResourceQuota
          - ValidatingWebhookConfiguration
          - MutatingWebhookConfiguration
          - PriorityClass
          - RuntimeClass
          - CSIDriver
          - CSINode
          - VolumeAttachment

    - name: Add violation for cluster-scoped resources
      when:
        - not (_security_constraints.allowClusterScopedResources | default(false) | bool)
        - _manifest.kind in _cluster_scoped_kinds
      ansible.builtin.set_fact:
        _validation_violations: >-
          {{ _validation_violations + [{
            'chart_name': _chart_name,
            'resource_kind': _manifest.kind,
            'resource_name': _manifest.metadata.name,
            'violation_type': 'Cluster-scoped resource not allowed',
            'details': 'This resource type requires allowClusterScopedResources: true in security configuration'
          }] }}

    # =============================================
    # Check for privileged containers
    # =============================================
    - name: Check for privileged containers in workload resources
      when:
        - _manifest.kind in ['Pod', 'Deployment', 'StatefulSet', 'DaemonSet', 'Job', 'CronJob']
        - not (_security_constraints.allowPrivileged | default(false) | bool)
      block:
        - name: Extract container specs
          ansible.builtin.set_fact:
            _containers: |-
              {% if _manifest.kind == 'Pod' -%}
              {{ _manifest.spec.containers | default([]) }}
              {%- elif _manifest.kind in ['Deployment', 'StatefulSet', 'DaemonSet'] -%}
              {{ _manifest.spec.template.spec.containers | default([]) }}
              {%- elif _manifest.kind == 'Job' -%}
              {{ _manifest.spec.template.spec.containers | default([]) }}
              {%- elif _manifest.kind == 'CronJob' -%}
              {{ _manifest.spec.jobTemplate.spec.template.spec.containers | default([]) }}
              {%- else -%}
              []
              {%- endif %}

        - name: Check for privileged flag in containers
          when: _containers | length > 0
          ansible.builtin.set_fact:
            _privileged_containers: >-
              {% set privileged = [] -%}
              {% for container in _containers -%}
                {% if container.securityContext is defined and container.securityContext.privileged is defined and container.securityContext.privileged -%}
                  {{ privileged.append(container.name) or '' }}
                {%- endif -%}
              {%- endfor -%}
              {{ privileged }}

        - name: Add violation for privileged containers
          when:
            - _privileged_containers is defined
            - _privileged_containers | length > 0
          ansible.builtin.set_fact:
            _validation_violations: >-
              {{ _validation_violations + [{
                'chart_name': _chart_name,
                'resource_kind': _manifest.kind,
                'resource_name': _manifest.metadata.name,
                'violation_type': 'Privileged containers not allowed',
                'details': 'Containers with privileged=true: ' + (_privileged_containers | join(', '))
              }] }}

    # =============================================
    # Check for host namespace access
    # =============================================
    - name: Check for host namespace usage
      when:
        - _manifest.kind in ['Pod', 'Deployment', 'StatefulSet', 'DaemonSet', 'Job', 'CronJob']
        - not (_security_constraints.allowHostNamespace | default(false) | bool)
      block:
        - name: Extract pod spec for host namespace check
          ansible.builtin.set_fact:
            _pod_spec_host: |-
              {% if _manifest.kind == 'Pod' -%}
              {{ _manifest.spec | default({}) }}
              {%- elif _manifest.kind in ['Deployment', 'StatefulSet', 'DaemonSet'] -%}
              {{ _manifest.spec.template.spec | default({}) }}
              {%- elif _manifest.kind == 'Job' -%}
              {{ _manifest.spec.template.spec | default({}) }}
              {%- elif _manifest.kind == 'CronJob' -%}
              {{ _manifest.spec.jobTemplate.spec.template.spec | default({}) }}
              {%- else -%}
              {}
              {%- endif %}

        - name: Build host namespace violations list
          when:
            - (_pod_spec_host.hostNetwork | default(false) | bool) or
              (_pod_spec_host.hostIPC | default(false) | bool) or
              (_pod_spec_host.hostPID | default(false) | bool)
          ansible.builtin.set_fact:
            _host_namespace_violations: >-
              {% set violations = [] -%}
              {% if _pod_spec_host.hostNetwork | default(false) | bool -%}
                {{ violations.append('hostNetwork') or '' }}
              {%- endif %}
              {% if _pod_spec_host.hostIPC | default(false) | bool -%}
                {{ violations.append('hostIPC') or '' }}
              {%- endif %}
              {% if _pod_spec_host.hostPID | default(false) | bool -%}
                {{ violations.append('hostPID') or '' }}
              {%- endif %}
              {{ violations }}

        - name: Add violation for host namespace usage
          when:
            - _host_namespace_violations is defined
            - _host_namespace_violations | length > 0
          ansible.builtin.set_fact:
            _validation_violations: >-
              {{ _validation_violations + [{
                'chart_name': _chart_name,
                'resource_kind': _manifest.kind,
                'resource_name': _manifest.metadata.name,
                'violation_type': 'Host namespace access not allowed',
                'details': 'Blocked by restricted-v2 SCC. Violations: ' + (_host_namespace_violations | join(', '))
              }] }}

    # =============================================
    # Check for hostPath volumes
    # =============================================
    - name: Check for hostPath volumes
      when:
        - _manifest.kind in ['Pod', 'Deployment', 'StatefulSet', 'DaemonSet', 'Job', 'CronJob']
        - not (_security_constraints.allowHostPath | default(false) | bool)
      block:
        - name: Extract volume specs
          ansible.builtin.set_fact:
            _volumes: |-
              {% if _manifest.kind == 'Pod' -%}
              {{ _manifest.spec.volumes | default([]) }}
              {%- elif _manifest.kind in ['Deployment', 'StatefulSet', 'DaemonSet'] -%}
              {{ _manifest.spec.template.spec.volumes | default([]) }}
              {%- elif _manifest.kind == 'Job' -%}
              {{ _manifest.spec.template.spec.volumes | default([]) }}
              {%- elif _manifest.kind == 'CronJob' -%}
              {{ _manifest.spec.jobTemplate.spec.template.spec.volumes | default([]) }}
              {%- else -%}
              []
              {%- endif %}

        - name: Check for hostPath in volumes
          when: _volumes | length > 0
          ansible.builtin.set_fact:
            _hostpath_volumes: >-
              {{ _volumes | selectattr('hostPath', 'defined') | map(attribute='name') | list }}

        - name: Add violation for hostPath volumes
          when:
            - _hostpath_volumes is defined
            - _hostpath_volumes | length > 0
          ansible.builtin.set_fact:
            _validation_violations: >-
              {{ _validation_violations + [{
                'chart_name': _chart_name,
                'resource_kind': _manifest.kind,
                'resource_name': _manifest.metadata.name,
                'violation_type': 'hostPath volumes not allowed',
                'details': 'hostPath volumes: ' + (_hostpath_volumes | join(', '))
              }] }}

    # =============================================
    # Check for hostPort in containers
    # =============================================
    - name: Check for hostPort usage
      when:
        - _manifest.kind in ['Pod', 'Deployment', 'StatefulSet', 'DaemonSet', 'Job', 'CronJob']
        - not (_security_constraints.allowHostPort | default(false) | bool)
      block:
        - name: Extract container specs for hostPort check
          ansible.builtin.set_fact:
            _containers_hostport: |-
              {% if _manifest.kind == 'Pod' -%}
              {{ _manifest.spec.containers | default([]) }}
              {%- elif _manifest.kind in ['Deployment', 'StatefulSet', 'DaemonSet'] -%}
              {{ _manifest.spec.template.spec.containers | default([]) }}
              {%- elif _manifest.kind == 'Job' -%}
              {{ _manifest.spec.template.spec.containers | default([]) }}
              {%- elif _manifest.kind == 'CronJob' -%}
              {{ _manifest.spec.jobTemplate.spec.template.spec.containers | default([]) }}
              {%- else -%}
              []
              {%- endif %}

        - name: Check for hostPort in container ports
          when: _containers_hostport | length > 0
          ansible.builtin.set_fact:
            _hostport_containers: >-
              {% set containers_with_hostport = [] -%}
              {% for container in _containers_hostport -%}
                {% for port in container.ports | default([]) -%}
                  {% if port.hostPort is defined -%}
                    {{ containers_with_hostport.append(container.name) or '' }}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ containers_with_hostport | unique }}

        - name: Add violation for hostPort usage
          when:
            - _hostport_containers is defined
            - _hostport_containers | length > 0
          ansible.builtin.set_fact:
            _validation_violations: >-
              {{ _validation_violations + [{
                'chart_name': _chart_name,
                'resource_kind': _manifest.kind,
                'resource_name': _manifest.metadata.name,
                'violation_type': 'hostPort not allowed',
                'details': 'Blocked by restricted-v2 SCC. Containers with hostPort: ' + (_hostport_containers | join(', '))
              }] }}

    # =============================================
    # Warn about NetworkPolicy
    # =============================================
    - name: Warn about NetworkPolicy conflicts
      when: _manifest.kind == 'NetworkPolicy'
      ansible.builtin.debug:
        msg: |
          WARNING: Chart {{ _chart_name }} deploys NetworkPolicy {{ _manifest.metadata.name }}.
          This may conflict with firewall.yaml rules from your content repository.
          Ensure the chart's NetworkPolicy is compatible with your lab's network security requirements.
