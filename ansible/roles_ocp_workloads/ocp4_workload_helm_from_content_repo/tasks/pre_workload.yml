---
# Pre-workload validation tasks

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - ocp4_workload_helm_from_content_repo_namespace is defined
      - ocp4_workload_helm_from_content_repo_namespace | length > 0
    fail_msg: "Namespace must be defined for Helm chart deployment"

- name: Pre-workload tasks complete
  when: not silent | bool
  ansible.builtin.debug:
    msg: "Pre-Workload tasks completed successfully."
