---
# Validate all rendered charts for security compliance
# Accumulates violations and fails at the end if any found

- name: Initialize validation results
  ansible.builtin.set_fact:
    _validation_violations: []

- name: Validate security constraints for all charts
  ansible.builtin.include_tasks: validate_chart_security.yml
  loop: "{{ _rendered_charts }}"
  loop_control:
    loop_var: _chart_to_validate
    label: "{{ _chart_to_validate.chart_name }}"

- name: Report validation summary
  ansible.builtin.debug:
    msg: |
      Security validation complete:
      - Charts validated: {{ _rendered_charts | length }}
      - Total manifests: {{ _rendered_charts | map(attribute='manifests') | map('length') | sum }}
      - Violations found: {{ _validation_violations | length }}

- name: Fail if any security violations found
  when: _validation_violations | length > 0
  ansible.builtin.fail:
    msg: |
      ========================================================================
      SECURITY VALIDATION FAILED - Deployment blocked
      ========================================================================

      Found {{ _validation_violations | length }} security violation(s) across {{ _rendered_charts | length }} chart(s).
      All charts must pass security validation before deployment.

      VIOLATIONS:
      ========================================================================

      {% for violation in _validation_violations %}
      {{ loop.index }}. Chart: {{ violation.chart_name }}
         Resource: {{ violation.resource_kind }}/{{ violation.resource_name }}
         Violation: {{ violation.violation_type }}
         {% if violation.details is defined %}
         Details: {{ violation.details }}
         {% endif %}

      {% endfor %}
      ========================================================================

      Fix the violations above and re-run the workload.
      All charts will be validated before any deployment occurs.
