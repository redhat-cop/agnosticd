---
- name: "Ensure nvidia_gpu namespace exists"
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: Namespace
    name: "{{ nvidia_gpu_operator_namespace }}"

- name: Create NVIDIA GPU operatorgroup
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', 'nvidia_gpu_operatorgroup.yaml') | from_yaml }}"
  register: operatorgroup_result
  retries: 30
  delay: 6

- name: Create NVIDIA GPU subscription
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'nvidia_gpu_sub.yaml.j2') | from_yaml }}"
  register: subscription_result
  retries: 40
  delay: 6

- name: Wait for NVIDIA GPU ClusterPolicy CRD
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusterpolicies.nvidia.com
  register: r_gpu_crd
  retries: 60
  delay: 10
  until:
    - r_gpu_crd.resources is defined
    - r_gpu_crd.resources | length == 1

- name: Setup NVIDIA GPU Cluster Policy
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', 'nvidia_gpu_clusterpolicy.json') | from_yaml }}"
  retries: 10
  delay: 15
  register: r_gpu_clusterpolicy
  until: r_gpu_clusterpolicy is not failed
