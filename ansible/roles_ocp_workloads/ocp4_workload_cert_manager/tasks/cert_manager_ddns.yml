---
- name: Create webhook credential via gateway admin API
  ansible.builtin.uri:
    url: "https://acme-bifrost.apps.ocpv-infra01.dal12.infra.demo.redhat.com/admin/credentials"
    method: POST
    body_format: json
    body:
      kid: "cluster-{{ guid }}"
    headers:
      Authorization: "Bearer {{ ocp4_workload_cert_manager_acme_bifrost_admin_token }}"
      Content-Type: "application/json"
    status_code: [201]
  register: _acme_bifrost_cred_create

- name: Record KID and secret from create response (secret shown once)
  ansible.builtin.set_fact:
    ocp4_workload_cert_manager_acme_bifrost_webhook_kid: "{{ _acme_bifrost_cred_create.json.kid }}"
    ocp4_workload_cert_manager_acme_bifrost_webhook_secret: "{{ _acme_bifrost_cred_create.json.secret }}"

- name: Create DDNS secret
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'secret-tsig-creds.yaml.j2') }}"
  register: r_ddns_secret
  retries: 10
  delay: 60
  until: r_ddns_secret is success
