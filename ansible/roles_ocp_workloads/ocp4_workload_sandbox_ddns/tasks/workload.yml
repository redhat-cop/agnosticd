---
- name: Create TSIG key via bind-key-api
  ansible.builtin.uri:
    url: "http://{{ cluster_dns_server }}:8080/keys"
    method: POST
    headers:
      Authorization: "Bearer {{ ocp4_workload_sandbox_ddns_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "cluster-{{ guid }}.{{ cluster_dns_zone }}"
      algorithm: hmac-sha256
    status_code: [201]
    return_content: true
  register: ddns_key_create

- name: Set DDNS key name and secret from API response
  ansible.builtin.set_fact:
    ddns_key_name: "{{ ddns_key_create.json.name }}"
    ddns_key_secret: "{{ ddns_key_create.json.secret }}"

