---
ocp_username: "system:admin"

# -------------------------------------------------------------------
# Charts repository (same repo that serves the showroom content)
# -------------------------------------------------------------------
ocp4_workload_coco_helm_install_charts_repo: https://github.com/confidential-devhub/workshop-on-ARO-showroom.git
# LB1150 uses the `azure` branch: main plus the charts/ directory and ui-config.yml.
ocp4_workload_coco_helm_install_charts_repo_ref: azure
ocp4_workload_coco_helm_install_charts_dir: "/tmp/coco-charts-{{ guid }}"
ocp4_workload_coco_helm_install_workdir: "/tmp/coco-work-{{ guid }}"

# -------------------------------------------------------------------
# Operators
# -------------------------------------------------------------------
ocp4_workload_coco_helm_install_cert_manager_namespace: cert-manager-operator
ocp4_workload_coco_helm_install_cert_manager_channel: stable-v1

ocp4_workload_coco_helm_install_trustee_namespace: trustee-operator-system
ocp4_workload_coco_helm_install_trustee_channel: stable

ocp4_workload_coco_helm_install_osc_namespace: openshift-sandboxed-containers-operator
ocp4_workload_coco_helm_install_osc_channel: stable

# Seconds to wait for the three operator CSVs to reach Succeeded
ocp4_workload_coco_helm_install_csv_timeout: 1200

# -------------------------------------------------------------------
# Trustee operands
# -------------------------------------------------------------------
ocp4_workload_coco_helm_install_trustee_profile: Restricted
ocp4_workload_coco_helm_install_trustee_route_name: kbs-route
ocp4_workload_coco_helm_install_trustee_deployment_timeout: 900

# cosign public keys used by the image signature policy
ocp4_workload_coco_helm_install_cosign_pub_url: >-
  https://raw.githubusercontent.com/confidential-devhub/workshop-on-ARO-showroom/azure/helpers/cosign.pub
ocp4_workload_coco_helm_install_redhat_cosign_pub_url: >-
  https://security.access.redhat.com/data/63405576.txt

# -------------------------------------------------------------------
# CoCo tools / RVPS reference values
# -------------------------------------------------------------------
ocp4_workload_coco_helm_install_coco_tools_image: quay.io/openshift_sandboxed_containers/coco-tools:0.5.1
# veritas expects the Rekor host without the scheme (see helpers/configure-trustee.sh)
ocp4_workload_coco_helm_install_rekor_url: >-
  rekor-server-sigstore-rekor-prod.apps.rosa.appsrep11ue1.tgem.p3.openshiftapps.com
ocp4_workload_coco_helm_install_rekor_pub_key_url: >-
  https://rekor-server-sigstore-rekor-prod.apps.rosa.appsrep11ue1.tgem.p3.openshiftapps.com/api/v1/log/publicKey
ocp4_workload_coco_helm_install_veritas_tee: snp
ocp4_workload_coco_helm_install_podman_pull_retries: 5
ocp4_workload_coco_helm_install_podman_pull_delay: 10

# -------------------------------------------------------------------
# OSC operands (peer pods on Azure)
# -------------------------------------------------------------------
ocp4_workload_coco_helm_install_peerpod_instance_size: "Standard_DC2as_v5"
ocp4_workload_coco_helm_install_peerpod_instance_sizes: >-
  Standard_DC2as_v5,Standard_DC2es_v5,Standard_DC4as_v5,Standard_DC4es_v5,Standard_DC8es_v5,Standard_DC8as_v5
ocp4_workload_coco_helm_install_peerpods_limit_per_node: "10"
ocp4_workload_coco_helm_install_peerpod_root_volume_size: "20"
ocp4_workload_coco_helm_install_peerpod_tags: "key1=value1,key2=value2"
ocp4_workload_coco_helm_install_kataconfig_name: kataconfig-kata
ocp4_workload_coco_helm_install_kataconfig_pool: kata-oc
ocp4_workload_coco_helm_install_mcp_wait_timeout: 1800
ocp4_workload_coco_helm_install_runtimeclass_wait_timeout: 1800

# -------------------------------------------------------------------
# Terminal tabs (one wetty pod per workshop persona)
# -------------------------------------------------------------------
ocp4_workload_coco_helm_install_terminal_tabs_enabled: true
ocp4_workload_coco_helm_install_terminal_namespace: coco-terminal
ocp4_workload_coco_helm_install_terminal_image: quay.io/rhpds/wetty:v3.2.1
ocp4_workload_coco_helm_install_terminal_host_prefix: terminal
ocp4_workload_coco_helm_install_terminal_host_suffix: "{{ guid }}"
# Public hostname students SSH to. LB1150 sets it in the catalog
# (bastion-<guid>.<region>.cloudapp.azure.com); the inventory hostvar is the
# generic fallback for other environments.
ocp4_workload_coco_helm_install_terminal_bastion_host: >-
  {{ bastion_public_hostname | default(
       hostvars[groups['bastions'][0]].public_dns_name | default('', true),
     true) | regex_replace('\.$', '') }}
ocp4_workload_coco_helm_install_terminal_bastion_user: "{{ student_name | default('lab-user') }}"
ocp4_workload_coco_helm_install_terminal_bastion_password: "{{ student_password | default(common_password | default('')) }}"
ocp4_workload_coco_helm_install_terminal_bastion_port: 22
# Kubeconfigs created by ocp4_workload_coco_workshop_users on the bastion
ocp4_workload_coco_helm_install_terminal_kubeconfig_dir: "/home/{{ student_name | default('lab-user') }}/.kube"
ocp4_workload_coco_helm_install_terminals:
  - name: opsec
    kubeconfig: "{{ ocp4_workload_coco_helm_install_terminal_kubeconfig_dir }}/opsec.kubeconfig"
  - name: devel
    kubeconfig: "{{ ocp4_workload_coco_helm_install_terminal_kubeconfig_dir }}/devel.kubeconfig"
  - name: admin
    kubeconfig: "{{ ocp4_workload_coco_helm_install_terminal_kubeconfig_dir }}/admin.kubeconfig"

# -------------------------------------------------------------------
# Reported to the showroom as user data / Antora attributes
# -------------------------------------------------------------------
ocp4_workload_coco_helm_install_osc_docs_url: >-
  https://docs.redhat.com/en/documentation/openshift_sandboxed_containers/1.13/html/deploying_confidential_containers_on_microsoft_azure_red_hat_openshift/index
ocp4_workload_coco_helm_install_trustee_docs_url: >-
  https://docs.redhat.com/en/documentation/openshift_sandboxed_containers/1.13/html/deploying_red_hat_build_of_trustee_for_workloads_running_on_microsoft_azure/index
