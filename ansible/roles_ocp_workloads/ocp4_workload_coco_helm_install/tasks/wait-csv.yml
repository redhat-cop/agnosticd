---
# Wait until the ClusterServiceVersion in the namespace reports Succeeded.
# Each of the three subscriptions is the only one in its namespace.
# Expected vars: _coco_wait_namespace

- name: "Wait for the operator CSV in {{ _coco_wait_namespace }}"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ _coco_wait_namespace }}"
  register: r_coco_csvs
  until:
    - r_coco_csvs.resources | length > 0
    - r_coco_csvs.resources[0].status.phase is defined
    - r_coco_csvs.resources[0].status.phase == 'Succeeded'
  delay: 20
  retries: "{{ (ocp4_workload_coco_helm_install_csv_timeout | int / 20) | int }}"

- name: "Operator CSV ready in {{ _coco_wait_namespace }}"
  ansible.builtin.debug:
    msg: >-
      {{ r_coco_csvs.resources
         | map(attribute='metadata.name') | list }}
