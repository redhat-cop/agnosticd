---
# Render one chart with helm template and apply the result with the k8s module.
# OLM owns the operator lifecycle, so `helm install` is deliberately not used.
#
# Expected vars:
#   _coco_chart_name        chart directory under the charts repo
#   _coco_chart_release     helm release name
#   _coco_chart_namespace   namespace passed to helm
#   _coco_chart_values_file values file to render with (absolute path)

- name: "Render chart {{ _coco_chart_name }}"
  kubernetes.core.helm_template:
    chart_ref: "{{ ocp4_workload_coco_helm_install_charts_dir }}/charts/{{ _coco_chart_name }}"
    release_name: "{{ _coco_chart_release }}"
    release_namespace: "{{ _coco_chart_namespace }}"
    values_files:
      - "{{ _coco_chart_values_file }}"
  register: r_coco_chart_render

- name: "Apply chart {{ _coco_chart_name }}"
  kubernetes.core.k8s:
    definition: "{{ r_coco_chart_render.stdout | from_yaml_all | select('mapping') | list }}"
  register: r_coco_chart_apply
