---
# Install helm if it is not already on the bastion. Mirrors
# ocp4_workload_showroom/tasks/check-and-install-helm.yaml so this role can run
# before the showroom role.

- name: Check whether helm is installed
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/helm
    - /usr/bin/helm
  register: r_coco_helm_stat

- name: Install helm
  when: r_coco_helm_stat.results | selectattr('stat.exists') | list | length == 0
  become: true
  block:
    - name: Download helm
      ansible.builtin.unarchive:
        src: https://catalog-item-assets.s3.us-east-2.amazonaws.com/helm-linux-amd64.tar.gz
        remote_src: true
        dest: /usr/local/bin
        mode: "0775"
        owner: root
        group: root
      register: r_coco_helm_download
      retries: 10
      delay: 30
      until: r_coco_helm_download is success

    - name: Link helm binary
      ansible.builtin.file:
        src: /usr/local/bin/linux-amd64/helm
        dest: /usr/local/bin/helm
        state: link
        owner: root
        group: root
        mode: "0775"

- name: Get helm version
  ansible.builtin.command: helm version --short
  register: r_coco_helm_version
  changed_when: false

- name: Emit helm version
  ansible.builtin.debug:
    msg: "Using {{ r_coco_helm_version.stdout }}"
