---
# Reverse order of installation: consumers before providers.

- name: Delete terminal tabs
  when: ocp4_workload_coco_helm_install_terminal_tabs_enabled | bool
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.1.api_version }}"
    kind: "{{ item.1.kind }}"
    name: "terminal-{{ item.0 }}"
    namespace: "{{ ocp4_workload_coco_helm_install_terminal_namespace }}"
  loop: >-
    {{ ocp4_workload_coco_helm_install_terminals | map(attribute='name') | list
       | product([
           {'kind': 'Deployment', 'api_version': 'apps/v1'},
           {'kind': 'Service', 'api_version': 'v1'},
           {'kind': 'Route', 'api_version': 'route.openshift.io/v1'}])
       | list }}
  loop_control:
    label: "{{ item.1.kind }}/terminal-{{ item.0 }}"
  ignore_errors: true

- name: Delete the terminal namespace
  when: ocp4_workload_coco_helm_install_terminal_tabs_enabled | bool
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_coco_helm_install_terminal_namespace }}"
  ignore_errors: true

- name: Remove OSC operands
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - api_version: kataconfiguration.openshift.io/v1
      kind: KataConfig
      name: "{{ ocp4_workload_coco_helm_install_kataconfig_name }}"
    - api_version: v1
      kind: ConfigMap
      name: peer-pods-cm
      namespace: "{{ ocp4_workload_coco_helm_install_osc_namespace }}"
    - api_version: v1
      kind: ConfigMap
      name: osc-feature-gates
      namespace: "{{ ocp4_workload_coco_helm_install_osc_namespace }}"
  ignore_errors: true

- name: Remove Trustee operands
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - api_version: confidentialcontainers.org/v1alpha1
      kind: TrusteeConfig
      name: trusteeconfig
      namespace: "{{ ocp4_workload_coco_helm_install_trustee_namespace }}"
    - api_version: confidentialcontainers.org/v1alpha1
      kind: KbsConfig
      name: trusteeconfig-kbs-config
      namespace: "{{ ocp4_workload_coco_helm_install_trustee_namespace }}"
    - api_version: route.openshift.io/v1
      kind: Route
      name: "{{ ocp4_workload_coco_helm_install_trustee_route_name }}"
      namespace: "{{ ocp4_workload_coco_helm_install_trustee_namespace }}"
    - api_version: cert-manager.io/v1
      kind: Certificate
      name: kbs-https
      namespace: "{{ ocp4_workload_coco_helm_install_trustee_namespace }}"
    - api_version: cert-manager.io/v1
      kind: Certificate
      name: kbs-token
      namespace: "{{ ocp4_workload_coco_helm_install_trustee_namespace }}"
    - api_version: cert-manager.io/v1
      kind: Issuer
      name: kbs-issuer
      namespace: "{{ ocp4_workload_coco_helm_install_trustee_namespace }}"
  ignore_errors: true

- name: Remove operator subscriptions
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: "{{ item.name }}"
    namespace: "{{ item.namespace }}"
  loop:
    - name: sandboxed-containers-operator
      namespace: "{{ ocp4_workload_coco_helm_install_osc_namespace }}"
    - name: trustee-operator
      namespace: "{{ ocp4_workload_coco_helm_install_trustee_namespace }}"
    - name: openshift-cert-manager-operator
      namespace: "{{ ocp4_workload_coco_helm_install_cert_manager_namespace }}"
  ignore_errors: true

- name: Remove the Azure peer pod network (NAT gateway, public IP, subnet association)
  when: ocp4_workload_coco_helm_install_peerpod_nat_cleanup_enabled | bool
  ansible.builtin.include_tasks: remove-azure-peerpod-network.yml

- name: CoCo workload removal complete
  ansible.builtin.debug:
    msg: "CoCo operators, operands and Azure peer pod network removal requested"
