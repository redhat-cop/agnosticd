---
become_override: false
odf_channel: "stable-4.13"

ocp4_workload_external_odf_registry_size: 100Gi

# NooBaa pvPool - number of PV volumes in the default backing store.
# Default of 1 matches the NooBaa operator default.
# Set this to match your worker node count when using clusters larger
# than 3 workers, to ensure Quay and other object storage consumers
# have sufficient capacity.
# Example in an AgnosticV catalog item:
#   ocp4_workload_external_odf_noobaa_pv_pool_num_volumes: "{{ worker_instance_count | int }}"
ocp4_workload_external_odf_noobaa_pv_pool_num_volumes: 1
ocp4_workload_external_odf_noobaa_deploy_timeout: 600
