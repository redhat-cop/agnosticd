- name: Evaluate {{ docs_namespace }} namespace if not exists
  k8s:
    api_version: v1
    kind: Namespace
    name: '{{ docs_namespace }}'
    state: present

- name: Check if IM credentials Secret exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: im-credentials
    namespace: '{{ docs_namespace }}'
  register: im_secret

- name: Load existing IM users from Secret if it exists
  set_fact:
    im_users: "{{ (im_secret.resources[0].data['im_credentials.json'] | b64decode | from_json) }}"
  when: im_secret.resources | length > 0

# yamllint disable rule:line-length
- name: Generate new IM users if Secret doesn't exist
  set_fact:
    im_users: >-
      {{
        im_users | default([]) + [{'name': 'user' + item | string, 'password': (lookup('password', '/dev/null length=1 chars=ascii_lowercase') + lookup('password', '/dev/null length=1 chars=ascii_uppercase') + lookup('password', '/dev/null length=1 chars=digits') + lookup('password', '/dev/null length=5 chars=ascii_letters,digits')) | list | shuffle | join('')}]
      }}
  loop: "{{ range(1, num_users | int + 1) | list }}"
  when: im_secret.resources | length == 0
# yamllint enable rule:line-length

- name: Create or update OpenShift secret with IM credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: im-credentials
        namespace: '{{ docs_namespace }}'
      type: Opaque
      stringData:
        im_credentials.json: |
          {{ im_users | to_json(indent=2) }}
  when: im_secret.resources | length == 0 or im_users is not defined


- name: Display user credentials for verification
  debug:
    msg: "User: {{ item.name }}, Password: {{ item.password }}"
  loop: "{{ im_users }}"
  # when: ansible_verbosity >= 2  # Only show with -v or higher

# yamllint disable rule:line-length
# - name: "SIMULATION: Generate fake OpenShift passwords (remove before merge)"
#   set_fact:
#     openshift_users: >-
#       {{ openshift_users | default([]) + [{'name': item.name,
#         'password': lookup('password', '/dev/null chars=ascii_letters,digits length=16')}] }}
#   loop: "{{ im_users }}"

- name: Capture OpenShift user passwords from provisioning data
  set_fact:
    openshift_users: >-
      {{ openshift_users | default([]) + [{'name': item.name,
        'password': lookup('agnosticd_user_data', 'password', user=item.name)}] }}
  loop: "{{ im_users }}"
  when:
    - im_secret.resources | length == 0 or im_secret.resources[0].data['openshift.json'] is not defined
    - lookup('agnosticd_user_data', 'password', user=im_users[0].name) | default('', true) | length > 0

# yamllint enable rule:line-length
- name: Add OpenShift credentials to im-credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: im-credentials
        namespace: '{{ docs_namespace }}'
      type: Opaque
      stringData:
        openshift.json: "{{ openshift_users | to_json(indent=2) }}"
  when: openshift_users is defined
