---
# ============================================================
# Create per-user lab-config Secret in each userN-devspaces namespace.
# Can be run standalone — all data is loaded from the im-credentials
# Secret, with no dependency on in-memory facts from other tasks.
# ============================================================

- name: Load im-credentials Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: im-credentials
    namespace: "{{ docs_namespace }}"
  register: lab_config_secret

- name: Parse im-credentials data
  set_fact:
    _lc_im_users: "{{ lab_config_secret.resources[0].data['im_credentials.json'] | b64decode | from_json }}"
    _lc_rc_tokens: "{{ lab_config_secret.resources[0].data['rocketchat.json'] | b64decode | from_json }}"
    _lc_matrix: "{{ lab_config_secret.resources[0].data['matrix.json'] | b64decode | from_json }}"
    _lc_s3: "{{ lab_config_secret.resources[0].data['s3.json'] | b64decode | from_json }}"
    _lc_helpdesk: "{{ lab_config_secret.resources[0].data['helpdesk.json'] | b64decode | from_json }}"

- name: Get S3 endpoint URL
  shell: oc get route s3 -n openshift-storage -o jsonpath='https://{.spec.host}'
  register: _lc_s3_endpoint

- name: Initialize api_keys if Connectivity Link stack is not deployed
  set_fact:
    api_keys: "{{ api_keys | default({}) }}"

- name: Create lab-config Secret for each user
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: lab-config
        namespace: "{{ item.name }}-devspaces"
      type: Opaque
      stringData:
        config: |
          # Helpdesk (per-user)
          helpdesk_username={{ item.name }}
          helpdesk_password={{ item.password }}
          helpdesk_group_id={{ (_lc_helpdesk.users | selectattr('name', 'equalto', item.name) | first).group_id }}

          # Helpdesk (shared)
          helpdesk_url=https://helpdesk-helpdesk.{{ route_subdomain }}
          helpdesk_type_id_issue={{ _lc_helpdesk.type_id_issue }}
          helpdesk_priority_id_normal={{ _lc_helpdesk.priority_id_normal }}

          # Database (per-user)
          db_username={{ item.name }}
          db_password={{ item.password }}

          # RocketChat (per-user)
          rocketchat_userid={{ (_lc_rc_tokens | selectattr('name', 'equalto', item.name) | first).userid }}
          rocketchat_token={{ (_lc_rc_tokens | selectattr('name', 'equalto', item.name) | first).token }}

          # Matrix (per-user)
          matrix_token={{ (_lc_matrix | selectattr('name', 'equalto', item.name) | first).token }}
          matrix_room={{ (_lc_matrix | selectattr('name', 'equalto', item.name) | first).roomid }}

          # Matrix (shared)
          matrix_url=https://element-matrix.{{ route_subdomain }}

          # S3 (shared)
          s3_access_key={{ _lc_s3.accessKey }}
          s3_secret_key={{ _lc_s3.secretKey }}
          s3_endpoint={{ _lc_s3_endpoint.stdout }}

          # S3 (per-user)
          s3_bucket={{ item.name }}

          # AI / MaaS (per-user key, shared endpoint from virtual keys workload)
          maas_url={{ litellm_api_base_url | default(maas_url) }}
          maas_key={{ _litellm_user_data['litellm_' ~ item.name ~ '_virtual_key'] | default('') }}
          internal_ai_gateway_url={{ internal_ai_gateway_url }}
          internal_ai_http_route_url={{ internal_ai_gateway_url }}/{{ item.name }}/v1

          # Kuadrant API keys (per-user)
          kuadrant_silver_api_key={{ (api_keys[item.name] | default({}))['silver'] | default('') }}
          kuadrant_gold_api_key={{ (api_keys[item.name] | default({}))['gold'] | default('') }}
  loop: "{{ _lc_im_users }}"
  loop_control:
    label: "{{ item.name }}"
