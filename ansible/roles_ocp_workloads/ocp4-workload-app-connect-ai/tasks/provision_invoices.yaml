---
# Create per-user S3 buckets and upload a default invoice PDF.
# The invoice is downloaded from the lab-deploy-assets repo.

- name: Get S3 admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: noobaa-admin
    namespace: openshift-storage
  register: _inv_s3_secret

- name: Set S3 credentials
  set_fact:
    _inv_s3_access_key: "{{ _inv_s3_secret.resources[0].data.AWS_ACCESS_KEY_ID | b64decode }}"
    _inv_s3_secret_key: "{{ _inv_s3_secret.resources[0].data.AWS_SECRET_ACCESS_KEY | b64decode }}"
    _inv_s3_endpoint: "https://s3-openshift-storage.{{ route_subdomain }}"

- name: Download invoice PDF from git repo
  get_url:
    url: "{{ lab_deploy_assets_repo | replace('github.com', 'raw.githubusercontent.com') }}/{{ lab_deploy_assets_branch }}/invoices/invoice_61356291.pdf"
    dest: /tmp/invoice_61356291.pdf

- name: Create per-user S3 bucket
  amazon.aws.s3_bucket:
    name: "{{ item.name }}"
    state: present
    endpoint_url: "{{ _inv_s3_endpoint }}"
    aws_access_key: "{{ _inv_s3_access_key }}"
    aws_secret_key: "{{ _inv_s3_secret_key }}"
    validate_certs: false
  loop: "{{ im_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Upload invoice PDF to each user bucket
  amazon.aws.aws_s3:
    bucket: "{{ item.name }}"
    object: invoice_61356291.pdf
    src: /tmp/invoice_61356291.pdf
    mode: put
    endpoint_url: "{{ _inv_s3_endpoint }}"
    aws_access_key: "{{ _inv_s3_access_key }}"
    aws_secret_key: "{{ _inv_s3_secret_key }}"
    validate_certs: false
  loop: "{{ im_users }}"
  loop_control:
    label: "{{ item.name }}"
