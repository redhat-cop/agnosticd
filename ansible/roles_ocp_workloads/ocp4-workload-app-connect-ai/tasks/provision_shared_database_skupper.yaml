---
- name: Create Skupper Site in {{ shared_db_namespace }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: skupper.io/v2alpha1
      kind: Site
      metadata:
        name: database-site
        namespace: "{{ shared_db_namespace }}"

- name: Wait for Skupper Site to be Ready
  kubernetes.core.k8s_info:
    api_version: skupper.io/v2alpha1
    kind: Site
    name: database-site
    namespace: "{{ shared_db_namespace }}"
  register: skupper_site
  retries: 20
  delay: 30
  until:
    - skupper_site.resources | length > 0
    - skupper_site.resources[0].status.status is defined
    - skupper_site.resources[0].status.status == "Ready"

- name: Create Skupper RouterAccess in {{ shared_db_namespace }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: skupper.io/v2alpha1
      kind: RouterAccess
      metadata:
        name: database-router-access
        namespace: "{{ shared_db_namespace }}"
      spec:
        roles:
          - name: inter-router
            port: 55671
          - name: edge
            port: 45671
        accessType: route
        tlsCredentials: database-router-access
        generateTlsCredentials: true

- name: Wait for Skupper RouterAccess to be Ready
  kubernetes.core.k8s_info:
    api_version: skupper.io/v2alpha1
    kind: RouterAccess
    name: database-router-access
    namespace: "{{ shared_db_namespace }}"
  register: skupper_ra
  retries: 20
  delay: 30
  until:
    - skupper_ra.resources | length > 0
    - skupper_ra.resources[0].status.status is defined
    - skupper_ra.resources[0].status.status == "Ready"

- name: Create Skupper Connector for PostgreSQL
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: skupper.io/v2alpha1
      kind: Connector
      metadata:
        name: postgres
        namespace: "{{ shared_db_namespace }}"
      spec:
        routingKey: postgres
        port: 5432
        selector: app=postgres
