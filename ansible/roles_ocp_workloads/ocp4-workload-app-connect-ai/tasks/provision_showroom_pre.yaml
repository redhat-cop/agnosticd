- name: Slurp provision-user-data.yaml
  delegate_to: localhost
  ansible.builtin.slurp:
    src: "{{ output_dir | default(playbook_dir) }}/provision-user-data.yaml"
  register: r_provision_user_data_backup

- name: Remove users key from provision-user-data.yaml
  delegate_to: localhost
  ansible.builtin.copy:
    dest: "{{ output_dir | default(playbook_dir) }}/provision-user-data.yaml"
    content: >-
      {{ ((r_provision_user_data_backup.content | b64decode | from_yaml) or {})
      | dict2items | rejectattr('key', 'equalto', 'users') | list | items2dict
      | to_nice_yaml }}
