---
- name: Load IM credentials
  include_tasks: load_im_credentials.yaml

- name: Provision OpenShift DevSpaces
  include_tasks: provision_devspaces.yaml
  vars:
    operators_project: "openshift-operators"
    snapshot_operator_project: "openshift-marketplace"
    che_project: "devspaces"

- name: Provision users workload
  ansible.builtin.include_tasks: provision_users_workload.yaml
  vars:
    che_project: "devspaces"

- name: Provision Streams and workload
  ansible.builtin.include_tasks: provision_streams.yaml
  vars:
    operators_project: "openshift-operators"
    snapshot_operator_project: "openshift-marketplace"

- name: Provision filestash S3 viewer
  include_tasks: provision_filestash.yaml

- name: Provision Matrix Synapse Homeserver
  include_tasks: provision_im_matrix_synapse.yaml
  vars:
    matrix_synapse_namespace: "matrix"

- name: Provision Matrix Element Web
  k8s:
    state: present
    resource_definition: "{{ lookup('template', 'im_matrix_element_web.yaml.j2') }}"
  vars:
    matrix_synapse_namespace: "matrix"

# Needs to be provisioned after DevSpaces to configure webhooks
- name: Provision Rocket Chat
  include_tasks: provision_im_rocketchat.yaml
  vars:
    rocketchat_namespace: "rocketchat"

- name: Provision Helpdesk
  include_tasks: provision_helpdesk.yaml

# START ========================================

- name: Provision Service Interconnect Operator
  include_tasks: provision_skupper.yaml
  vars:
    operators_project: "openshift-operators"

- name: Provision Shared Database
  include_tasks: provision_shared_database.yaml
  vars:
    shared_db_namespace: "shared-database"
    shared_db_admin_user: "dbadmin"
    shared_db_admin_password: "dbadmin123"
    shared_db_name: "labdb"

- name: Provision Shared Database Skupper Resources
  include_tasks: provision_shared_database_skupper.yaml
  vars:
    shared_db_namespace: "shared-database"

# AccessGrants are no longer pre-provisioned — with the inverted site flow,
# students create AccessGrants in their own namespace and AccessTokens in shared-database.
# - name: Provision Per-User Database Schemas and AccessGrants
#   include_tasks: provision_users_database.yaml
#   vars:
#     shared_db_namespace: "shared-database"
#     shared_db_admin_user: "dbadmin"
#     shared_db_name: "labdb"

# END ==========================================

- name: Provision IM credentials
  include_tasks: provision_im_credentials.yaml

# Needs to run before provisioning lab config secrets
- name: Provision Connectivity Link Stack
  include_tasks: provision_cl_main.yaml

- name: Provision per-user lab config Secrets
  include_tasks: provision_lab_config.yaml

# Needs to run after provisioning lab config secrets
- name: Pre-deploy Camel applications
  include_tasks: provision_lab_camel_flows_launch.yaml

- name: Provision per-user invoice buckets
  include_tasks: provision_invoices.yaml

- name: Evaluate Docs
  include_tasks: main_docs.yaml

- name: Pre-deploy Camel applications
  include_tasks: provision_lab_camel_flows_wait.yaml
