---
- name: Evaluate llm-api namespace if not exists
  k8s:
    api_version: v1
    kind: Namespace
    name: llm-api
    state: present

- name: Create shadow ExternalName Service for LLM API
  k8s:
    state: present
    resource_definition: "{{ lookup('template', 'llm-api-shadow-service.yaml.j2') }}"

- name: Create Istio ServiceEntry for external LLM API
  k8s:
    state: present
    resource_definition: "{{ lookup('template', 'llm-api-service-entry.yaml.j2') }}"

- name: Create Istio DestinationRule for LLM API TLS origination
  k8s:
    state: present
    resource_definition: "{{ lookup('template', 'llm-api-destination-rule.yaml.j2') }}"
