---
# Wait for the predeploy Job to complete and clean up all Job resources.

- name: Set predeploy variables
  set_fact:
    _predeploy_namespace: "{{ im_users[-1].name }}-devspaces"

- name: Wait for predeploy Job to complete
  shell: oc get job predeploy-apps -n {{ _predeploy_namespace }} -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}'
  register: _predeploy_status
  until: _predeploy_status.stdout == "True"
  retries: 40
  delay: 30

- name: Delete predeploy Job
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: predeploy-apps
    namespace: "{{ _predeploy_namespace }}"
    delete_options:
      propagationPolicy: Background

- name: Delete predeploy ClusterRoleBinding
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: predeploy-job-cluster-admin

- name: Delete predeploy ServiceAccount
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ServiceAccount
    name: predeploy-job
    namespace: "{{ _predeploy_namespace }}"
