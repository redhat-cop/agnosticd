---
- name: Evaluate kuadrant-system namespace if not exists
  k8s:
    api_version: v1
    kind: Namespace
    name: kuadrant-system
    state: present

- name: Evaluate Kuadrant OperatorGroup
  k8s:
    state: present
    resource_definition: "{{ lookup('template', 'kuadrant-operatorgroup.yaml.j2') }}"

# RHCL declares an exact Limitador package dependency in its OLM bundle.
# Installing the latest standalone Limitador first can make RHCL unsatisfiable.
# Let OLM resolve and install the compatible dependency with RHCL.
- name: Evaluate Kuadrant Subscription
  k8s:
    state: present
    resource_definition: "{{ lookup('template', 'kuadrant-subscription.yaml.j2') }}"

- name: Wait for RHCL operator installation
  ansible.builtin.include_tasks: wait_for_olm_operator.yaml
  vars:
    app_connect_ai_operator_name: rhcl-operator
    app_connect_ai_operator_crd: kuadrants.kuadrant.io

- name: Wait for OLM-managed Limitador dependency CRD to be established
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: limitadors.limitador.kuadrant.io
  register: r_app_connect_ai_limitador_crd
  retries: 60
  delay: 30
  until:
    - r_app_connect_ai_limitador_crd.resources | default([]) | length == 1
    - >-
      (r_app_connect_ai_limitador_crd.resources[0].status | default({})).conditions
      | default([])
      | selectattr('type', 'equalto', 'Established')
      | selectattr('status', 'equalto', 'True') | list | length > 0

- name: Create Kuadrant instance
  k8s:
    state: present
    resource_definition: "{{ lookup('template', 'kuadrant.yaml.j2') }}"

# yamllint disable rule:line-length
- name: Wait for Kuadrant to be ready
  k8s_info:
    api_version: kuadrant.io/v1beta1
    kind: Kuadrant
    name: kuadrant
    namespace: kuadrant-system
  register: r_kuadrant
  retries: 60
  delay: 30
  until:
    - r_kuadrant.resources | length > 0
    - (r_kuadrant.resources[0].status | default({})).conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
# yamllint enable rule:line-length
