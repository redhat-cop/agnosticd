---
apiVersion: service.isf.ibm.com/v1
kind: FusionServiceInstance
metadata:
  name: ibm-cas-service-instance
  namespace: ibm-spectrum-fusion-ns
spec:
  creator: User
  doInstall: true
  parameters:
  - name: namespace
    provided: false
    value: ibm-cas
  - name: doInstall
    provided: false
    value: "false"
  - name: storageClass
    provided: true
    value: ibm-spectrum-fusion-mgmt-sc
  serviceDefinition: ibm-cas-service
  triggerUpdate: false
  updateServiceCRSpec: false
