---
become_override: false
ocp_username: admin
silent: false

ocp4_workload_advanced_developer_suite_post_install_keycloak_namespace: tssc-keycloak
ocp4_workload_advanced_developer_suite_post_install_dh_namespace: tssc-dh

ocp4_workload_advanced_developer_suite_post_install_user_base_name: user
ocp4_workload_advanced_developer_suite_post_install_user_password: password
ocp4_workload_advanced_developer_suite_post_install_user_count: "{{ num_users | default(3) }}"

ocp4_workload_advanced_developer_suite_post_install_admin_user: admin
ocp4_workload_advanced_developer_suite_post_install_admin_password: password

ocp4_workload_advanced_developer_suite_post_install_openshift_keycloak_client_id: idp-4-ocp
ocp4_workload_advanced_developer_suite_post_install_openshift_keycloak_client_secret: password
ocp4_workload_advanced_developer_suite_post_install_dh_keycloak_client_id: rhdh
ocp4_workload_advanced_developer_suite_post_install_dh_keycloak_client_secret: password
ocp4_workload_advanced_developer_suite_post_install_dh_dynamic_plugins_enable:
- disabled: false
  package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic

ocp4_workload_advanced_developer_suite_post_install_gitlab_namespace: gitlab
ocp4_workload_advanced_developer_suite_post_install_devspaces_namespace: openshift-devspaces