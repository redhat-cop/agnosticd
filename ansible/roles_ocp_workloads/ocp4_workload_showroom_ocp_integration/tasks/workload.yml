---
- name: Authenticate to OpenShift API using basic auth
  uri:
    url: "https://{{ openshift_api_url }}:6443/apis"
    method: GET
    user: "{{ lookup('agnosticd_user_data', 'openshift_cluster_admin_username') }}"
    password: "{{ lookup('agnosticd_user_data', 'openshift_cluster_admin_password') }}"
    force_basic_auth: yes
    validate_certs: no
    return_content: yes
  register: api_auth_test
  retries: 10
  delay: 30
  until: api_auth_test.status == 200

- name: Fail if authentication fails after retries
  fail:
    msg: "Authentication to OpenShift API failed after retries (last status: {{ api_auth_test.status }})"
  when: api_auth_test.status != 200

- name: Remove X-Frame-Options header from default ingresscontroller
  kubernetes.core.k8s:
    api_version: operator.openshift.io/v1
    kind: IngressController
    name: default
    namespace: openshift-ingress-operator
    merge_type: merge
    definition:
      spec:
        httpHeaders:
          actions:
            response:
              - name: X-Frame-Options
                action:
                  type: Delete

- name: Get service-ca.crt from v4-0-config-system-service-ca ConfigMap
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: v4-0-config-system-service-ca
    namespace: openshift-authentication
  register: service_ca_cm

- name: Extract service-ca.crt content
  set_fact:
    service_ca_crt: "{{ service_ca_cm.resources[0].data['service-ca.crt'] }}"

- name: Scale down authentication-operator deployment
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: authentication-operator
    namespace: openshift-authentication-operator
    definition:
      spec:
        replicas: 0
    merge_type: merge

- name: Add nodeSelector to authentication-operator deployment
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: authentication-operator
    namespace: openshift-authentication-operator
    definition:
      spec:
        template:
          spec:
            nodeSelector:
              node-role.kubernetes.io/test: ""
    merge_type: merge

- name: Patch oauth-openshift route to use reencrypt and service-ca.crt
  kubernetes.core.k8s:
    api_version: route.openshift.io/v1
    kind: Route
    name: oauth-openshift
    namespace: openshift-authentication
    definition:
      spec:
        tls:
          termination: reencrypt
          destinationCACertificate: "{{ service_ca_crt }}"
    merge_type: merge
