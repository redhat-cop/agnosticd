---
- name: Setting up workload for user
  when: not silent | bool
  ansible.builtin.debug:
    msg: "Setting up operator installation workload for user {{ ocp_username }}"

- name: Install operator with CNV/Babylon API authentication
  module_defaults:
    group/kubernetes.core.k8s:
      host: "{{ ocp4_workload_install_operator_k8s_auth_host | default(omit) }}"
      api_key: "{{ ocp4_workload_install_operator_k8s_auth_api_key | default(omit) }}"
      validate_certs: "{{ ocp4_workload_install_operator_validate_certs | default(true) }}"
  block:
    - name: Install operator via install_operator role
      ansible.builtin.include_role:
        name: install_operator
      vars:
        install_operator_action: "{{ ocp4_workload_install_operator_action }}"
        install_operator_name: "{{ ocp4_workload_install_operator_name }}"
        install_operator_packagemanifest_name: "{{ ocp4_workload_install_operator_packagemanifest_name }}"
        install_operator_namespace: "{{ ocp4_workload_install_operator_namespace }}"
        install_operator_catalog: "{{ ocp4_workload_install_operator_catalog }}"
        install_operator_channel: "{{ ocp4_workload_install_operator_channel }}"
        install_operator_automatic_install_plan_approval: "{{ ocp4_workload_install_operator_automatic_install_plan_approval }}"
        install_operator_csv_nameprefix: "{{ ocp4_workload_install_operator_csv_nameprefix }}"
        install_operator_starting_csv: "{{ ocp4_workload_install_operator_starting_csv }}"
        install_operator_manage_namespaces: "{{ ocp4_workload_install_operator_manage_namespaces }}"
        install_operator_subscription_config: "{{ ocp4_workload_install_operator_subscription_config }}"
        install_operator_catalogsource_setup: "{{ ocp4_workload_install_operator_catalogsource_setup }}"
        install_operator_catalogsource_name: "{{ ocp4_workload_install_operator_catalogsource_name }}"
        install_operator_catalogsource_namespace: "{{ ocp4_workload_install_operator_catalogsource_namespace }}"
        install_operator_catalogsource_image: "{{ ocp4_workload_install_operator_catalogsource_image }}"
        install_operator_catalogsource_image_tag: "{{ ocp4_workload_install_operator_catalogsource_image_tag }}"
        install_operator_catalogsource_pullsecrets: "{{ ocp4_workload_install_operator_catalogsource_pullsecrets }}"
        install_operator_install_csv_ignore_error: "{{ ocp4_workload_install_operator_install_csv_ignore_error }}"
        install_operator_skip_operatorgroup: "{{ ocp4_workload_install_operator_skip_operatorgroup }}"

- name: Workload tasks complete
  when: not silent | bool
  ansible.builtin.debug:
    msg: "Workload tasks completed successfully - Operator {{ ocp4_workload_install_operator_name }} installed"
