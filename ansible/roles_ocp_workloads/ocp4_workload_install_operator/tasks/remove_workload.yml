---
- name: Setting up workload removal for user
  when: not silent | bool
  ansible.builtin.debug:
    msg: "Removing operator installation workload for user {{ ocp_username }}"

- name: Remove operator via install_operator role
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: remove
    install_operator_name: "{{ ocp4_workload_install_operator_name }}"
    install_operator_namespace: "{{ ocp4_workload_install_operator_namespace }}"

- name: Workload removal tasks complete
  when: not silent | bool
  ansible.builtin.debug:
    msg: "Workload removal tasks completed successfully - Operator {{ ocp4_workload_install_operator_name }} removed"
