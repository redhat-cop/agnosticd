---
# ocp4_workload_install_operator
#
# Generic workload wrapper for install_operator role
# Allows catalog items to install any operator via standard workload pattern

become_override: false
ocp_username: system:admin
silent: false

# Kubernetes authentication (for CNV/Babylon deployments)
ocp4_workload_install_operator_k8s_auth_host: ""
ocp4_workload_install_operator_k8s_auth_api_key: ""
ocp4_workload_install_operator_validate_certs: true

# Operator installation action
ocp4_workload_install_operator_action: install

# Required: Name of the operator (must match PackageManifest name)
ocp4_workload_install_operator_name: ""

# PackageManifest name (usually same as operator name)
ocp4_workload_install_operator_packagemanifest_name: "{{ ocp4_workload_install_operator_name }}"

# Namespace to install the operator into
ocp4_workload_install_operator_namespace: openshift-operators

# Catalog holding the operator
ocp4_workload_install_operator_catalog: redhat-operators

# Channel for operator subscription (empty = auto-detect based on cluster version)
ocp4_workload_install_operator_channel: ""

# Automatic InstallPlan approval
ocp4_workload_install_operator_automatic_install_plan_approval: true

# CSV name prefix (usually same as operator name)
ocp4_workload_install_operator_csv_nameprefix: "{{ ocp4_workload_install_operator_name }}"

# Starting CSV (empty = latest in channel)
ocp4_workload_install_operator_starting_csv: ""

# Namespaces for operator to manage (empty list = entire cluster)
ocp4_workload_install_operator_manage_namespaces: []

# Extra subscription config
ocp4_workload_install_operator_subscription_config: ""

# Custom catalog source settings
ocp4_workload_install_operator_catalogsource_setup: false
ocp4_workload_install_operator_catalogsource_name: "{{ ocp4_workload_install_operator_name }}-catalogsource"
ocp4_workload_install_operator_catalogsource_namespace: "{{ ocp4_workload_install_operator_namespace }}"
ocp4_workload_install_operator_catalogsource_image: ""
ocp4_workload_install_operator_catalogsource_image_tag: ""
ocp4_workload_install_operator_catalogsource_pullsecrets: []

# Ignore CSV installation errors
ocp4_workload_install_operator_install_csv_ignore_error: false

# Skip OperatorGroup creation if it already exists
ocp4_workload_install_operator_skip_operatorgroup: false

# Skip Namespace creation if it already exists (common for CNV/Babylon sandbox deployments)
ocp4_workload_install_operator_skip_namespace: false
