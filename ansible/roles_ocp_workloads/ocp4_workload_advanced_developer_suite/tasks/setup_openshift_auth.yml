---
- name: Create admin user
  uri:
    url: https://sso.{{ ocp4_workload_advanced_developer_suite_apps_domain }}/admin/realms/trusted-artifact-signer/users
    method: POST
    validate_certs: false
    body_format: json
    headers:
      Authorization: Bearer {{ ocp4_workload_advanced_developer_suite_keycloak_access_token }}
    body:
      username: admin
      enabled: true
      firstName: "{{ ocp4_workload_advanced_developer_suite_tssc_admin_user }}"
      lastName: TSSC
      email: "{{ ocp4_workload_advanced_developer_suite_tssc_admin_user }}@demo.redhat.com"
      emailVerified: true
    status_code: 201

- name: Get admin user
  uri:
    url: https://sso.{{ ocp4_workload_advanced_developer_suite_apps_domain }}/admin/realms/trusted-artifact-signer/users?username={{ ocp4_workload_advanced_developer_suite_tssc_admin_user }}
    method: GET
    validate_certs: false
    headers:
      Authorization: Bearer {{ ocp4_workload_advanced_developer_suite_keycloak_access_token }}
  register: r_keycloak_admin

- name: Set password for admin
  uri:
    url: https://sso.{{ ocp4_workload_advanced_developer_suite_apps_domain }}/admin/realms/trusted-artifact-signer/users/{{ r_keycloak_admin.json[0].id }}/reset-password
    method: PUT
    validate_certs: false
    body_format: json
    headers:
      Authorization: Bearer {{ ocp4_workload_advanced_developer_suite_keycloak_access_token }}
    body:
      type: password
      temporary: false
      value: "{{ ocp4_workload_advanced_developer_suite_tssc_admin_password }}"
    status_code: 204

- name: Create Openshift client
  uri:
    url: https://sso.{{ ocp4_workload_advanced_developer_suite_apps_domain }}/admin/realms/trusted-artifact-signer/clients
    method: POST
    validate_certs: false
    body_format: json
    headers:
      Authorization: Bearer {{ ocp4_workload_advanced_developer_suite_keycloak_access_token }}
    body:
      clientId: idp-4-ocp
      enabled: true
      redirectUris:
      - '*'
      protocol: openid-connect
      publicClient: false
      secret: "{{ ocp4_workload_advanced_developer_suite_tssc_openshift_keycloak_client_secret }}"
      serviceAccountsEnabled: true
    status_code: 201

- name: Create Openshift auth resources
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop:
  - openshift-admin-crb.yml.j2
  - openshift-openid-client-secret.yml.j2
  - openshift-oauth.yml.j2

- name: Create users
  ansible.builtin.include_tasks:
    file: ./setup_keycloak_user.yml
  vars:
    username: "{{ ocp4_workload_advanced_developer_suite_tssc_user_base_name }}{{ n + 1 }}"
  loop: "{{ range(0, ocp4_workload_advanced_developer_suite_tssc_user_count | int) | list }}"
  loop_control:
    loop_var: n