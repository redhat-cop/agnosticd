---
- name: Clone configuration repository
  ansible.builtin.git:
    accept_hostkey: true
    force: true
    repo: https://root:{{ _gitlab_root_token }}@{{ _gitlab_host }}/{{
      ocp4_workload_advanced_developer_suite_dh_catalog_locations.group }}/{{
      ocp4_workload_advanced_developer_suite_dh_catalog_locations.repository }}
    dest: "~/{{ ocp4_workload_advanced_developer_suite_dh_catalog_locations.repository }}"
    version: "{{ ocp4_workload_advanced_developer_suite_dh_catalog_locations.branch }}"
  environment:
    GIT_SSL_NO_VERIFY: "true"

- name: Fetch provision data file
  run_once: true
  ansible.builtin.fetch:
    src: "~/{{ ocp4_workload_advanced_developer_suite_dh_catalog_locations.repository }}/component-rhpds.yaml"
    dest: /tmp/component-rhpds.yaml
    flat: true
    fail_on_missing: true

- name: Apply template provision data file
  ansible.builtin.template:
    src: /tmp/component-rhpds.yaml
    dest: "~/{{ ocp4_workload_advanced_developer_suite_dh_catalog_locations.repository }}/component-rhpds.yaml"
    mode: "0660"
    owner: "{{ ansible_user }}"
  vars:
    ocp_apps_domain: "{{ _ocp_apps_domain }}"
    guid: "{{ guid }}"

# RHADS 1.8 ships scaffolder-backend-module-gitlab 0.10.0, whose publish:gitlab input
# schema is additionalProperties: false. The catalog's Quarkus templates predate that
# and still pass allowedHosts, description and protectDefaultBranch, so scaffolding a
# component dies in input validation before the GitOps repository is created. Upstream
# tssc-sample-templates has already dropped all three keys; drop them here too, until a
# catalog carrying that fix ships.
- name: Stat scaffolder templates
  ansible.builtin.stat:
    path: "~/{{ ocp4_workload_advanced_developer_suite_dh_catalog_locations.repository }}/{{ item }}"
  loop: "{{ ocp4_workload_advanced_developer_suite_dh_scaffolder_templates }}"
  register: r_scaffolder_templates

- name: Drop publish:gitlab inputs rejected by the RHADS 1.8 scaffolder plugin
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    regexp: "{{ item.1 }}"
    state: absent
  loop: "{{ _present | product(_rejected_inputs) | list }}"
  loop_control:
    label: "{{ item.0 | dirname | basename }}: {{ item.1 }}"
  vars:
    _present: "{{ r_scaffolder_templates.results | selectattr('stat.exists') | map(attribute='stat.path') | list }}"
    _rejected_inputs:
    - '^\s+allowedHosts:'
    - '^\s+description: This is GitOps repository for'
    - '^\s+protectDefaultBranch:'

- name: Push changes to repository
  ansible.builtin.shell: |
    git add . && git commit -m "Update file with provision data" && git push
  args:
    chdir: ~/{{ ocp4_workload_advanced_developer_suite_dh_catalog_locations.repository }}
  ignore_errors: true

- name: Create Gitops auth resources
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop:
  - tssc-gitops-admin-crb.yml.j2

- name: Update developer hub config - set locations
  set_fact:
    _dh_app_config: >-
      {{ _dh_app_config | combine(
        {
          'catalog': {
            'locations': _dh_app_config.catalog.locations + [
              {
                'target': _location,
                'type': 'url'
              }
            ]
          }
        }, recursive=True)
      }}
  vars:
    _location: "{{ _gitlab_url }}/{{ ocp4_workload_advanced_developer_suite_dh_catalog_locations.group }}/{{
      ocp4_workload_advanced_developer_suite_dh_catalog_locations.repository }}/blob/{{
      ocp4_workload_advanced_developer_suite_dh_catalog_locations.branch }}/{{
      ocp4_workload_advanced_developer_suite_dh_catalog_locations.file }}"