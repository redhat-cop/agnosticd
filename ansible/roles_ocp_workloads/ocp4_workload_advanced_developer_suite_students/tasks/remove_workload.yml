---
- name: Remove workload tasks - Students
  ansible.builtin.debug:
    msg: "Removing {{ ocp4_workload_advanced_developer_suite_user_count }} students"

# Retrieve platform configuration for cleanup
- name: Retrieve platform facts for cleanup
  ansible.builtin.include_tasks:
    file: ./retrieve_platform_facts.yml

# Remove all students
- name: Remove each student
  ansible.builtin.include_tasks:
    file: ./remove_student.yml
  vars:
    student_username: "{{ ocp4_workload_advanced_developer_suite_user_base_name }}{{ n + 1 }}"
    student_number: "{{ n + 1 }}"
  loop: "{{ range(0, ocp4_workload_advanced_developer_suite_user_count | int) | list }}"
  loop_control:
    loop_var: n
    label: "{{ ocp4_workload_advanced_developer_suite_user_base_name }}{{ n + 1 }}"

- name: Student removal complete
  ansible.builtin.debug:
    msg: "All {{ ocp4_workload_advanced_developer_suite_user_count }} students have been removed"
