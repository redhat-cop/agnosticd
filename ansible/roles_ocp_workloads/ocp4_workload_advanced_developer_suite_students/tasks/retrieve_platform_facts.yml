---
# Retrieve platform configuration from deployed platform role
# This includes URLs, tokens, and IDs needed for student provisioning

- name: Get ingress domain
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: r_ingress_config

- name: Get console cluster info
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Console
    name: cluster
  register: r_console_config

- name: Set platform URLs
  set_fact:
    _ocp_apps_domain: "{{ r_ingress_config.resources[0].spec.domain }}"
    _ocp_console_url: "{{ r_console_config.resources[0].status.consoleURL }}"
    _ocp_api_url: "https://api.{{ r_ingress_config.resources[0].spec.domain.split('.', 1)[1] }}:6443"
    _gitlab_url: "https://gitlab-{{ ocp4_workload_advanced_developer_suite_gitlab_namespace }}.{{ r_ingress_config.resources[0].spec.domain }}"
    _dh_url: "https://backstage-developer-hub-{{ ocp4_workload_advanced_developer_suite_dh_namespace }}.{{ r_ingress_config.resources[0].spec.domain }}"
    _gitops_url: "https://tssc-gitops-server-{{ ocp4_workload_advanced_developer_suite_tssc_gitops_namespace }}.{{ r_ingress_config.resources[0].spec.domain }}"
    _jenkins_url: "https://jenkins-{{ ocp4_workload_advanced_developer_suite_jenkins_namespace }}.{{ r_ingress_config.resources[0].spec.domain }}"
    _devspaces_url: "https://devspaces.{{ r_ingress_config.resources[0].spec.domain }}"
    _quay_url: "https://quay-{{ guid }}.{{ r_ingress_config.resources[0].spec.domain }}"
    _acs_url: "https://central-{{ ocp4_workload_advanced_developer_suite_acs_namespace }}.{{ r_ingress_config.resources[0].spec.domain }}"
    _tpa_url: "https://server-{{ ocp4_workload_advanced_developer_suite_tssc_tpa_namespace }}.{{ r_ingress_config.resources[0].spec.domain }}"

- name: Get GitLab root token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: gitlab-gitlab-initial-root-password
    namespace: "{{ ocp4_workload_advanced_developer_suite_gitlab_namespace }}"
  register: r_gitlab_root_password

- name: Set GitLab token
  set_fact:
    _gitlab_root_token: "{{ r_gitlab_root_password.resources[0].data.password | b64decode }}"

- name: Get Keycloak admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: keycloak-initial-admin
    namespace: "{{ ocp4_workload_advanced_developer_suite_keycloak_namespace }}"
  register: r_keycloak_admin

- name: Generate Keycloak access token
  uri:
    url: "https://sso.{{ _ocp_apps_domain }}/realms/master/protocol/openid-connect/token"
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      client_id: admin-cli
      username: "{{ r_keycloak_admin.resources[0].data.username | b64decode }}"
      password: "{{ r_keycloak_admin.resources[0].data.password | b64decode }}"
      grant_type: password
  register: r_keycloak_token

- name: Set Keycloak token
  set_fact:
    _keycloak_access_token: "{{ r_keycloak_token.json.access_token }}"

- name: Get GitLab development group
  uri:
    url: "{{ _gitlab_url }}/api/v4/groups/development"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    validate_certs: false
  register: r_gitlab_group

- name: Set GitLab group ID
  set_fact:
    _gitlab_development_group_id: "{{ r_gitlab_group.json.id }}"

- name: Get Keycloak tssc group
  uri:
    url: "https://sso.{{ _ocp_apps_domain }}/admin/realms/trusted-artifact-signer/groups?search=tssc"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _keycloak_access_token }}"
  register: r_keycloak_group

- name: Set Keycloak group ID
  set_fact:
    _keycloak_group_id: "{{ r_keycloak_group.json[0].id }}"

- name: Get GitOps admin password
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: tssc-gitops-cluster
    namespace: "{{ ocp4_workload_advanced_developer_suite_tssc_gitops_namespace }}"
  register: r_gitops_credentials

- name: Get ACS admin password
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: central-htpasswd
    namespace: "{{ ocp4_workload_advanced_developer_suite_acs_namespace }}"
  register: r_acs_credentials

- name: Set credential facts
  set_fact:
    _gitops_admin_password: "{{ r_gitops_credentials.resources[0].data['admin.password'] | b64decode }}"
    _acs_admin_password: "{{ r_acs_credentials.resources[0].data.password | b64decode }}"
