---
- name: Post workload tasks - Student provisioning complete
  ansible.builtin.debug:
    msg: "Successfully provisioned {{ ocp4_workload_advanced_developer_suite_user_count }} students"

- name: Report student provisioning summary
  agnosticd_user_info:
    msg: |
      Student provisioning completed successfully.

      {{ ocp4_workload_advanced_developer_suite_user_count }} students have been created:
      - Usernames: {{ ocp4_workload_advanced_developer_suite_user_base_name }}1 through {{ ocp4_workload_advanced_developer_suite_user_base_name }}{{ ocp4_workload_advanced_developer_suite_user_count }}
      - Password: {{ ocp4_workload_advanced_developer_suite_user_password }}

      Each student has:
      - Keycloak account
      - TPA (Trusted Profile Analyzer) account
      - GitLab group membership
      - Individual showroom instance

      Student showroom URLs:
      {% for n in range(0, ocp4_workload_advanced_developer_suite_user_count | int) %}
      - {{ ocp4_workload_advanced_developer_suite_user_base_name }}{{ n + 1 }}: https://showroom-{{ ocp4_workload_showroom_namespace }}-{{ ocp4_workload_advanced_developer_suite_user_base_name }}{{ n + 1 }}.{{ _ocp_apps_domain }}
      {% endfor %}
