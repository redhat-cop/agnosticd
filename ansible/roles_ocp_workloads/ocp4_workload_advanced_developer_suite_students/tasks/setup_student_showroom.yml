---
# Deploy per-student showroom instance
# Each student gets their own namespace and showroom deployment

- name: Prepare showroom variables for {{ showroom_user }}
  ansible.builtin.set_fact:
    _showroom_student_data:
      openshift_cluster_admin_username: "{{ ocp4_workload_advanced_developer_suite_admin_user }}"
      openshift_cluster_admin_password: "{{ ocp4_workload_advanced_developer_suite_admin_password }}"
      openshift_cluster_console_url: "{{ _ocp_console_url }}"
      openshift_cluster_api_url: "{{ _ocp_api_url }}"
      openshift_cluster_ingress_domain: "{{ _ocp_apps_domain }}"
      user: "{{ showroom_user }}"
      guid: "{{ guid }}"
      rhdh_url: "{{ _dh_url }}"
      rhdh_user: "{{ showroom_user }}"
      rhdh_user_password: "{{ ocp4_workload_advanced_developer_suite_user_password }}"
      gitlab_url: "{{ _gitlab_url }}"
      gitlab_user: "{{ showroom_user }}"
      gitlab_user_password: "{{ ocp4_workload_advanced_developer_suite_user_password }}"
      gitops_url: "{{ _gitops_url }}"
      devspaces_url: "{{ _devspaces_url }}"
      jenkins_url: "{{ _jenkins_url }}"
      quay_url: "{{ _quay_url }}"
      acs_url: "{{ _acs_url }}"
      tpa_url: "{{ _tpa_url }}"

- name: Deploy showroom for {{ showroom_user }}
  ansible.builtin.include_role:
    name: ocp4_workload_showroom
  vars:
    ocp4_workload_showroom_namespace: "{{ showroom_namespace }}"
    _showroom_user_data: "{{ _showroom_student_data }}"
