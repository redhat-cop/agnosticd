---
- name: Post workload tasks - Platform setup complete
  ansible.builtin.debug:
    msg: "Advanced Developer Suite Platform deployment completed successfully"

- name: Report platform URLs
  agnosticd_user_info:
    msg: |
      Advanced Developer Suite Platform has been deployed.

      Platform Components:
      - Developer Hub: {{ _dh_url }}
      - GitLab: {{ _gitlab_url }}
      - GitOps (ArgoCD): {{ _gitops_url }}
      - Jenkins: {{ _jenkins_url }}
      - DevSpaces: {{ _devspaces_url }}
      - Quay: {{ _quay_url }}
      - ACS: {{ _acs_url }}
      - TPA: {{ _tpa_url }}

      Admin Credentials:
      - OpenShift Admin: {{ ocp4_workload_advanced_developer_suite_admin_user }} / {{ ocp4_workload_advanced_developer_suite_admin_password }}

      Next Step: Run the student provisioning workload to create users.
