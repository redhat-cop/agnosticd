---
# Platform-only GitLab setup
# User addition to groups removed - handled by students role

- name: Wait for GitLab to be ready and get root token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: gitlab-gitlab-initial-root-password
    namespace: "{{ ocp4_workload_advanced_developer_suite_gitlab_namespace }}"
  register: r_gitlab_root_password
  retries: 120
  delay: 10
  until:
  - r_gitlab_root_password is defined
  - r_gitlab_root_password.resources is defined
  - r_gitlab_root_password.resources | length > 0

- name: Set GitLab root token
  set_fact:
    _gitlab_root_token: "{{ r_gitlab_root_password.resources[0].data.password | b64decode }}"

- name: Create development group
  ansible.builtin.uri:
    url: "{{ _gitlab_url }}/api/v4/groups"
    method: POST
    body_format: form-urlencoded
    body:
      name: development
      path: development
      visibility: public
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    validate_certs: false
    status_code: 201
  register: r_group
  retries: 100
  delay: 5
  until: r_group.status == 201

- name: Save development group ID
  set_fact:
    _gitlab_development_group_id: "{{ r_group.json.id }}"

# NOTE: User addition to group removed - handled by students role
# Students role will add users to the development group
