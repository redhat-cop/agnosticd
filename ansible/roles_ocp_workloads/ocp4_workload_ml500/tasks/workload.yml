---
# Implement your Workload deployment tasks here

- name: Setting up workload for user
  debug:
    msg: "Setting up workload for user ocp_username = {{ ocp_username }}"

- name: Get lab deployment git repo
  command: "{{ item }}"
  args:
    chdir: "/tmp/{{ guid }}/"
  loop:
    - "git clone https://github.com/ckavili/deploy-lab.git"

- name: Install ml500-base chart
  command: "{{ item }}"
  args:
    chdir: "/tmp/{{ guid }}/deploy-lab/operators"
  loop:
    - "helm dep up"
    - "helm upgrade --install ml500-base . \
        --namespace ml500 --create-namespace --timeout=20m"

  register: ml500_base_result
  until: ml500_base_result.rc == 0
  # ignore_errors: true
  retries: 3
  delay: 10

- name: Wait a moment before checking Operator status
  ansible.builtin.wait_for:
    timeout: 30
  delegate_to: localhost

- name: Get all ClusterServiceVersions in all namespaces
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
  register: all_csvs

- name: Wait for all installed Operators to be in Succeeded phase
  block:
    - name: Filter Operator CSVs
      set_fact:
        operator_csvs: "{{ all_csvs.resources | 
          selectattr('metadata.ownerReferences', 'defined') | 
          selectattr('metadata.ownerReferences[0].kind', 'equalto', 'Subscription') | 
          list }}"

    - name: Detailed Operator Status Check
      block:
        - name: Check Operator Statuses
          ansible.builtin.debug:
            msg: |
              Operator: {{ item.metadata.name }}
              Namespace: {{ item.metadata.namespace }}
              Status: {{ item.status.phase }}
          loop: "{{ operator_csvs }}"
          loop_control:
            label: "{{ item.metadata.name }}"

        - name: Verify All Operators are Succeeded
          vars:
            succeeded_csvs: "{{ operator_csvs | selectattr('status.phase', 'equalto', 'Succeeded') | list }}"
          ansible.builtin.assert:
            that:
              - succeeded_csvs | length == operator_csvs | length
            fail_msg: |
              Not all operators are in Succeeded phase.
              Total Operators: {{ operator_csvs | length }}
              Succeeded Operators: {{ succeeded_csvs | length }}
              Failed Operators: {{ 
                operator_csvs | 
                rejectattr('status.phase', 'equalto', 'Succeeded') | 
                map(attribute='metadata.name') | 
                list 
              }}
          until: succeeded_csvs | length == operator_csvs | length
          retries: 20
          delay: 15

  
- name: Install ml500-toolings chart
  command: "{{ item }}"
  args:
    chdir: "/tmp/{{ guid }}/deploy-lab/toolings"
  loop:
    - "helm dep up"
    - "helm upgrade --install ml500-toolings . \
        --namespace ml500 --timeout=10m"
  register: ml500_toolings_result
  until: ml500_toolings_result.rc == 0
  ignore_errors: true
  retries: 3
  delay: 10

- name: Wait for DataScienceCluster to become Ready
  kubernetes.core.k8s_info:
    api_version: datasciencecluster.opendatahub.io/v1
    kind: DataScienceCluster
  register: dsc_info
  until: >
    dsc_info.resources | length > 0 and
    (
      dsc_info.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready')
                                              | selectattr('status', 'equalto', 'True')
                                              | list
    ) | length > 0
  retries: 5
  delay: 10

- name: Apply updated ConfigMap for user workload monitoring
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: user-workload-monitoring-config
        namespace: openshift-user-workload-monitoring
      data:
        config.yaml: |
          prometheus:
            logLevel: debug
            retention: 15d
          alertmanager:
            enabled: true
            enableAlertmanagerConfig: true
  collections:
    - kubernetes.core


- name: Install ml500-student-content chart
  command: "{{ item }}"
  args:
    chdir: "/tmp/{{ guid }}/deploy-lab/student-content"
  loop:
    - "helm dep up"
    - "helm upgrade --install ml500-student-content . \
        --namespace ml500 --create-namespace --timeout=20m --set cluster_domain={{ ocp4_workload_ml500_apps_domain }} --set attendees={{ num_users }}"
  register: ml500_course_content
  until: ml500_course_content.rc == 0
  # ignore_errors: true
  retries: 3
  delay: 10

- name: Patch OAuth configuration to add HTPasswd identity providers
  kubernetes.core.k8s_json_patch:
    api_version: config.openshift.io/v1
    kind: OAuth
    name: cluster
    patch:
      - op: add
        path: /spec/identityProviders
        value:
          - name: Students
            type: HTPasswd
            mappingMethod: claim
            htpasswd:
              fileData:
                name: htpasswd-ml500

- name: Enable default route for OpenShift image registry
  kubernetes.core.k8s_json_patch:
    api_version: imageregistry.operator.openshift.io/v1
    kind: Config
    name: cluster
    patch:
      - op: add
        path: /spec/defaultRoute
        value: true

- name: Patch GitOps Operator with user namespaces
  block:
    - name: Create namespace list
      set_fact:
        namespace_list: "{{ range(1, num_users + 1) | map('regex_replace', '^(.*)$', 'user\\1-toolings') | join(',') }}"

    - name: Patch OpenShift GitOps Operator subscription
      kubernetes.core.k8s_json_patch:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: openshift-gitops-operator
        namespace: openshift-gitops-operator
        patch:
          - op: add
            path: /spec/config/env/1
            value:
              name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
              value: "{{ namespace_list }}"

# Leave this as the last task in the playbook.
- name: workload tasks complete
  debug:
    msg: "Workload Tasks completed successfully."
  when: not silent | bool
