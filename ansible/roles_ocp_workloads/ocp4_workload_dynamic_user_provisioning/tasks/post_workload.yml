---
- name: Post Workload Tasks
  debug:
    msg: "Post-Workload tasks Started"

# Keycloak user verification is handled in main workload.yml

# GitLab user verification is handled in main workload.yml

- name: Wait for showroom deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "showroom-{{ _dynamic_username }}"
    namespace: "{{ _dynamic_showroom_namespace }}"
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  register: r_showroom_deployment
  when: _showroom_content_repo is defined and _showroom_content_repo != ""

- name: Get showroom route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ _dynamic_showroom_namespace }}"
  register: r_showroom_route
  when: _showroom_content_repo is defined and _showroom_content_repo != ""


- name: Set showroom URL
  ansible.builtin.set_fact:
    _showroom_url: "https://{{ r_showroom_route.resources[0].spec.host }}"
  when:
    - _showroom_content_repo is defined
    - _showroom_content_repo != ""
    - r_showroom_route.resources is defined
    - r_showroom_route.resources | length > 0


- name: Report user creation status
  agnosticd_user_info:
    msg: |
      Dynamic user {{ _dynamic_username }} has been successfully created for workshop {{ guid }}.
      {% if _showroom_url is defined %}🚀 Access your lab: {{ _showroom_url }}{% endif %}


- name: Get existing user data to preserve all info
  agnosticd_user_info:
    user: "{{ _dynamic_username }}"
    mode: get
  register: r_current_userdata

- name: Save complete user information to user data
  agnosticd_user_info:
    user: "{{ _dynamic_username }}"
    data:
      showroom_url: "{{ _showroom_url | default(r_current_userdata.data.showroom_url | default('')) }}"
      openshift_api_url: "{{ r_current_userdata.data.openshift_api_url | default('') }}"
      openshift_cluster_admin_token: "{{ r_current_userdata.data.openshift_cluster_admin_token | default('') }}"
      openshift_api_ca_cert: "{{ r_current_userdata.data.openshift_api_ca_cert | default('') }}"
      rhdh_url: "{{ r_current_userdata.data.rhdh_url | default('') }}"
      rhdh_auth: "{{ r_current_userdata.data.rhdh_auth | default('') }}"
      rhdh_user: "{{ r_current_userdata.data.rhdh_user | default('') }}"
      rhdh_user_password: "{{ r_current_userdata.data.rhdh_user_password | default('') }}"
      gitops_url: "{{ r_current_userdata.data.gitops_url | default('') }}"
      gitops_admin_user: "{{ r_current_userdata.data.gitops_admin_user | default('') }}"
      gitops_admin_password: "{{ r_current_userdata.data.gitops_admin_password | default('') }}"
      gitlab_url: "{{ r_current_userdata.data.gitlab_url | default('') }}"
      gitlab_user: "{{ r_current_userdata.data.gitlab_user | default('') }}"
      gitlab_user_password: "{{ r_current_userdata.data.gitlab_user_password | default('') }}"
      devspaces_url: "{{ r_current_userdata.data.devspaces_url | default('') }}"
      devspaces_user: "{{ r_current_userdata.data.devspaces_user | default('') }}"
      devspaces_user_password: "{{ r_current_userdata.data.devspaces_user_password | default('') }}"
      tpa_url: "{{ r_current_userdata.data.tpa_url | default('') }}"
      tpa_user: "{{ r_current_userdata.data.tpa_user | default('') }}"
      tpa_user_password: "{{ r_current_userdata.data.tpa_user_password | default('') }}"
      quay_url: "{{ r_current_userdata.data.quay_url | default('') }}"
      quay_admin_user: "{{ r_current_userdata.data.quay_admin_user | default('') }}"
      quay_admin_password: "{{ r_current_userdata.data.quay_admin_password | default('') }}"
      acs_url: "{{ r_current_userdata.data.acs_url | default('') }}"
      acs_admin_user: "{{ r_current_userdata.data.acs_admin_user | default('') }}"
      acs_admin_password: "{{ r_current_userdata.data.acs_admin_password | default('') }}"

- name: Post Workload Tasks Complete
  debug:
    msg: "Post-Workload tasks completed successfully"
