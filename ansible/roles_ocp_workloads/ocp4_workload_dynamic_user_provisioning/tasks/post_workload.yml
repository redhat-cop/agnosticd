---
- name: Post Workload Tasks
  debug:
    msg: "Post-Workload tasks Started"

- name: Verify Keycloak user was created
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/admin/realms/{{ ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/users?username={{ _dynamic_username }}
    method: GET
    validate_certs: false
    headers:
      Authorization: Bearer {{ _keycloak_access_token }}
  register: r_verify_keycloak_user
  retries: 5
  delay: 10

- name: Verify GitLab user was created
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/users?username={{ _dynamic_username }}
    method: GET
    validate_certs: false
    status_code: [200, 404]
  register: r_verify_gitlab_user
  retries: 5
  delay: 10

- name: Wait for showroom deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "showroom-{{ _dynamic_username }}"
    namespace: "{{ _dynamic_showroom_namespace }}"
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  register: r_showroom_deployment
  when: _showroom_content_repo is defined and _showroom_content_repo != ""

- name: Get showroom route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ _dynamic_showroom_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=showroom
  register: r_showroom_route
  when: _showroom_content_repo is defined and _showroom_content_repo != ""

- name: Set showroom URL
  ansible.builtin.set_fact:
    _showroom_url: "https://{{ r_showroom_route.resources[0].spec.host }}"
  when: 
    - _showroom_content_repo is defined 
    - _showroom_content_repo != ""
    - r_showroom_route.resources | length > 0

- name: Report user creation status
  agnosticd_user_info:
    msg: |
      Dynamic user {{ _dynamic_username }} has been successfully created for workshop {{ guid }}.
      
      {% if _showroom_url is defined %}🚀 Access your lab: {{ _showroom_url }}{% endif %}

- name: Save user information to user data
  agnosticd_user_info:
    user: "{{ _dynamic_username }}"
    data:
      showroom_url: "{{ _showroom_url | default('') }}"

- name: Post Workload Tasks Complete
  debug:
    msg: "Post-Workload tasks completed successfully"