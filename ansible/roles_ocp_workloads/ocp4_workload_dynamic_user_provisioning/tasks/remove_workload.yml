    msg:
      - "  • {{ item.metadata.name }}"
      - "    └─ Owner: {{ item.spec.owner | default('N/A') }}"
      - "    └─ Type: {{ item.spec.type | default('N/A') }}"
      - "    └─ Lifecycle: {{ item.spec.lifecycle | default('N/A') }}"
