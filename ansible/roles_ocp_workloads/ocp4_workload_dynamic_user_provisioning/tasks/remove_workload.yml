- name: Summary of discovered resources
  ansible.builtin.debug:
    msg:
      - "┌─────────────────────────────────────────────────────────────────┐"
      - "│                           SUMMARY                               │"
      - "└─────────────────────────────────────────────────────────────────┘"
      - ""
      - "📊 TOTAL RESOURCES FOR {{ _dynamic_username }}:"
      - "  ├─ RHDH Components: {{ _rhdh_components | length }}"
      - "  ├─ RHDH APIs: {{ _rhdh_apis | length }}"
      - "  ├─ RHDH Systems: {{ _rhdh_systems | length }}"
      - >-
        ├─ RHDH Other Entities:
        {{ (_rhdh_resources | length + _rhdh_locations | length +
           _rhdh_users | length + _rhdh_groups | length +
           _rhdh_domains | length + _rhdh_other | length) }}
      - "  ├─ GitLab Projects: {{ r_gitlab_projects.json | default([]) | length }}"
      - "  ├─ ArgoCD Applications: {{ _user_argocd_apps | default([]) | length }}"
      - >-
        └─ TOTAL:
        {{ (_rhdh_components | length + _rhdh_apis | length + _rhdh_systems | length +
           _rhdh_resources | length + _rhdh_locations | length + _rhdh_users | length +
           _rhdh_groups | length + _rhdh_domains | length + _rhdh_other | length +
           (r_gitlab_projects.json | default([]) | length) + (_user_argocd_apps | default([]) | length)) }}
      - ""
      - "🚨 ACTION REQUIRED: These resources need to be cleaned up!"
      - ""
      - "████████████████████████████████████████████████████████████████"

# =============================================
# CLEANUP OPERATIONS
# =============================================

- name: "🗑️ STARTING CLEANUP OPERATIONS"
  ansible.builtin.debug:
    msg:
      - ""
      - "████████████████████████████████████████████████████████████████"
      - "                      CLEANUP OPERATIONS"
      - "████████████████████████████████████████████████████████████████"
      - ""
      - "⚠️  WARNING: About to delete resources for {{ _dynamic_username }}"
      - ""

- name: "🦊 DELETING GITLAB REPOSITORIES"
  ansible.builtin.debug:
    msg:
      - "┌─────────────────────────────────────────────────────────────────┐"
      - "│                    DELETING GITLAB REPOS                       │"
      - "└─────────────────────────────────────────────────────────────────┘"
  when: r_gitlab_projects.json | default([]) | length > 0

- name: Delete GitLab repositories
  uri:
    url: >-
      https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/
      {{- 'api/v4/projects/' }}{{ item.project_slug | replace('/', '%2F') }}
    method: DELETE
    validate_certs: false
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    status_code: [202, 204, 404]
  register: r_delete_gitlab_project
  loop: "{{ r_gitlab_projects.json | default([]) }}"
  loop_control:
    label: "{{ item.name }} ({{ item.project_slug }})"

- name: Report GitLab repository deletions
  ansible.builtin.debug:
    msg:
      - "✅ Deleted GitLab repository: {{ item.item.name }}"
      - "   └─ Project Path: {{ item.item.project_slug }}"
      - "   └─ Entity Kind: {{ item.item.entity_kind }}"
      - "   └─ Type: {{ 'GitOps repo' if item.item.name.endswith('-gitops') else 'Skeleton repo' }}"
      - "   └─ Status: {{ item.status }}"
      - ""
  loop: "{{ r_delete_gitlab_project.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.status in [202, 204]

- name: Report GitLab repository deletion failures
  ansible.builtin.debug:
    msg:
      - "❌ Failed to delete GitLab repository: {{ item.item.name }}"
      - "   └─ Project Path: {{ item.item.project_slug }}"
      - "   └─ Status: {{ item.status }}"
      - "   └─ Error: {{ item.msg | default('Unknown error') }}"
      - ""
  loop: "{{ r_delete_gitlab_project.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.status not in [202, 204, 404]

- name: "🏗️ DELETING RHDH CATALOG ENTITIES"
  ansible.builtin.debug:
    msg:
      - "┌─────────────────────────────────────────────────────────────────┐"
      - "│                DELETING RHDH CATALOG ENTITIES                   │"
      - "└─────────────────────────────────────────────────────────────────┘"
      - ""
      - "Resources to delete: {{ _rhdh_resources | default([]) | length }}"
      - "Components to delete: {{ _rhdh_components | default([]) | length }}"
      - "APIs to delete: {{ _rhdh_apis | default([]) | length }}"
      - ""
  when: (_user_entities | default([]) | length > 0) and (_rhdh_backend_token is defined)

- name: Check RHDH authentication before deletion
  ansible.builtin.fail:
    msg: "RHDH backend token not available - cannot delete entities"
  when:
    - (_user_entities | default([]) | length > 0)
    - (_rhdh_backend_token is not defined)

- name: Delete RHDH Resource entities
  uri:
    url: >-
      {{ _rhdh_url }}/api/catalog/entities/by-name/{{ item.kind | lower }}/
      {{- item.metadata.namespace | default('default') }}/{{ item.metadata.name }}
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _rhdh_backend_token }}"
      Content-Type: application/json
    status_code: [200, 202, 204, 404, 409]
    timeout: 30
  register: r_delete_rhdh_resource
  loop: "{{ _rhdh_resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }} (Resource)"
  when:
    - _rhdh_backend_token is defined
    - _rhdh_resources | default([]) | length > 0
  failed_when: false

- name: Delete RHDH Component entities
  uri:
    url: >-
      {{ _rhdh_url }}/api/catalog/entities/by-name/{{ item.kind | lower }}/
      {{- item.metadata.namespace | default('default') }}/{{ item.metadata.name }}
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _rhdh_backend_token }}"
      Content-Type: application/json
    status_code: [200, 202, 204, 404, 409]
    timeout: 30
  register: r_delete_rhdh_component
  loop: "{{ _rhdh_components | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }} (Component)"
  when:
    - _rhdh_backend_token is defined
    - _rhdh_components | default([]) | length > 0
  failed_when: false

- name: Delete RHDH API entities
  uri:
    url: >-
      {{ _rhdh_url }}/api/catalog/entities/by-name/{{ item.kind | lower }}/
      {{- item.metadata.namespace | default('default') }}/{{ item.metadata.name }}
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _rhdh_backend_token }}"
      Content-Type: application/json
    status_code: [200, 202, 204, 404, 409, 400, 403, 500]
    timeout: 30
  register: r_delete_rhdh_api
  loop: "{{ _rhdh_apis | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }} (API)"
  when:
    - _rhdh_backend_token is defined
    - _rhdh_apis | default([]) | length > 0
  failed_when: false

- name: Debug API entities before deletion
  ansible.builtin.debug:
    msg:
      - "API Entity: {{ item.metadata.name }}"
      - "  Kind: {{ item.kind }}"
      - "  Namespace: {{ item.metadata.namespace | default('default') }}"
      - "  Owner: {{ item.spec.owner | default('N/A') }}"
      - >-
        Delete URL: {{ _rhdh_url }}/api/catalog/entities/by-name/{{ item.kind | lower }}/
        {{- item.metadata.namespace | default('default') }}/{{ item.metadata.name }}
      - ""
  loop: "{{ _rhdh_apis | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: _rhdh_apis | default([]) | length > 0

- name: Debug API deletion results
  ansible.builtin.debug:
    msg:
      - "API deletion result for {{ item.item.metadata.name }}:"
      - "  Status: {{ item.status }}"
      - "  URL: {{ item.url }}"
      - "  Response: {{ item.json | default('No JSON response') }}"
      - "  Error: {{ item.msg | default('No error message') }}"
      - ""
  loop: "{{ r_delete_rhdh_api.results | default([]) }}"
  loop_control:
    label: "{{ item.item.metadata.name }}"
  when: r_delete_rhdh_api.results is defined

- name: Debug all RHDH deletion results
  ansible.builtin.debug:
    msg:
      - "RHDH deletion summary:"
      - "  Resource deletions: {{ r_delete_rhdh_resource.results | default([]) | map(attribute='status') | list }}"
      - "  Component deletions: {{ r_delete_rhdh_component.results | default([]) | map(attribute='status') | list }}"
      - "  API deletions: {{ r_delete_rhdh_api.results | default([]) | map(attribute='status') | list }}"
      - ""
      - "Note: 404 means entity was already deleted or never existed"
      - "Note: 204 means entity was successfully deleted"

- name: Report RHDH entity deletions
  ansible.builtin.debug:
    msg:
      - "✅ Deleted RHDH {{ item.item.kind }}: {{ item.item.metadata.name }}"
      - "   └─ Namespace: {{ item.item.metadata.namespace | default('default') }}"
      - "   └─ Status: {{ item.status }}"
      - "   └─ URL: {{ item.url | default('N/A') }}"
      - ""
  loop: >-
    {{
      (r_delete_rhdh_resource.results | default([])) +
      (r_delete_rhdh_component.results | default([])) +
      (r_delete_rhdh_api.results | default([]))
    }}
  loop_control:
    label: "{{ item.item.metadata.name }}"
  when: item.status in [200, 202, 204]

- name: Report RHDH entity deletion failures
  ansible.builtin.debug:
    msg:
      - "❌ Failed to delete RHDH {{ item.item.kind }}: {{ item.item.metadata.name }}"
      - "   └─ Status: {{ item.status }}"
      - "   └─ Error: {{ item.msg | default('Unknown error') }}"
      - "   └─ URL: {{ item.url | default('N/A') }}"
      - ""
  loop: >-
    {{
      (r_delete_rhdh_resource.results | default([])) +
      (r_delete_rhdh_component.results | default([])) +
      (r_delete_rhdh_api.results | default([]))
    }}
  loop_control:
    label: "{{ item.item.metadata.name }}"
  when: item.status not in [200, 202, 204, 404]

- name: Wait for RHDH entity deletions to complete
  ansible.builtin.pause:
    seconds: 5
    prompt: "Waiting for RHDH catalog to process entity deletions..."
  when:
    - (r_delete_rhdh_resource.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list | length > 0) or
      (r_delete_rhdh_component.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list | length > 0) or
      (r_delete_rhdh_api.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list | length > 0)

- name: Verify RHDH entity deletions
  uri:
    url: >-
      {{ _rhdh_url }}/api/catalog/entities/by-name/{{ item.item.kind | lower }}/
      {{- item.item.metadata.namespace | default('default') }}/{{ item.item.metadata.name }}
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _rhdh_backend_token }}"
      Content-Type: application/json
    status_code: [404, 200]
    timeout: 10
  register: r_verify_rhdh_deletion
  loop: >-
    {{
      (r_delete_rhdh_resource.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list) +
      (r_delete_rhdh_component.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list) +
      (r_delete_rhdh_api.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list)
    }}
  loop_control:
    label: "{{ item.item.metadata.name }}"
  failed_when: false
  when: _rhdh_backend_token is defined

- name: Report RHDH deletion verification
  ansible.builtin.debug:
    msg:
      - "✅ Verified deletion of {{ item.item.item.kind }}: {{ item.item.item.metadata.name }}"
      - "   └─ Status: {{ '404 (Deleted)' if item.status == 404 else '200 (Still exists)' }}"
      - ""
  loop: "{{ r_verify_rhdh_deletion.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.metadata.name }}"
  when:
    - r_verify_rhdh_deletion.results is defined
    - item.status == 404

- name: "🚀 DELETING ARGOCD APPLICATIONS"
  ansible.builtin.debug:
    msg:
      - "┌─────────────────────────────────────────────────────────────────┐"
      - "│                   DELETING ARGOCD APPLICATIONS                  │"
      - "└─────────────────────────────────────────────────────────────────┘"
  when: _user_argocd_apps | default([]) | length > 0

- name: Delete ArgoCD Applications
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
  register: r_delete_argocd_app
  loop: "{{ _user_argocd_apps | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Report ArgoCD application deletions
  ansible.builtin.debug:
    msg:
      - "✅ Deleted ArgoCD Application: {{ item.metadata.name }}"
      - "   └─ Namespace: {{ item.metadata.namespace }}"
      - "   └─ Project: {{ item.spec.project | default('N/A') }}"
      - "   └─ Repository: {{ item.spec.source.repoURL | default('N/A') }}"
      - ""
  loop: "{{ _user_argocd_apps | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: "👤 DELETING KEYCLOAK USER"
  ansible.builtin.debug:
    msg:
      - "┌─────────────────────────────────────────────────────────────────┐"
      - "│                    DELETING KEYCLOAK USER                       │"
      - "└─────────────────────────────────────────────────────────────────┘"

- name: Get Keycloak admin credentials for user deletion
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: keycloak-initial-admin
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_keycloak_namespace }}"
  register: r_keycloak_admin_credentials_cleanup
  failed_when: false

- name: Set Keycloak admin credentials for cleanup
  ansible.builtin.set_fact:
    _keycloak_admin_username_cleanup: "{{ r_keycloak_admin_credentials_cleanup.resources[0].data.username | b64decode }}"
    _keycloak_admin_password_cleanup: "{{ r_keycloak_admin_credentials_cleanup.resources[0].data.password | b64decode }}"
  when:
    - r_keycloak_admin_credentials_cleanup.resources is defined
    - r_keycloak_admin_credentials_cleanup.resources | length > 0

- name: Generate Keycloak access token for user deletion
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/realms/master/protocol/openid-connect/token
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      client_id: admin-cli
      username: "{{ _keycloak_admin_username_cleanup }}"
      password: "{{ _keycloak_admin_password_cleanup }}"
      grant_type: password
    timeout: 30
  register: r_keycloak_access_token_cleanup
  failed_when: false
  when: _keycloak_admin_username_cleanup is defined

- name: Get user details from trusted-artifact-signer realm
  uri:
    url: >-
      https://sso.{{ _ocp_apps_domain }}/admin/realms/
      {{- ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/users?username={{ _dynamic_username }}
    method: GET
    validate_certs: false
    headers:
      Authorization: Bearer {{ r_keycloak_access_token_cleanup.json.access_token }}
    timeout: 30
  register: r_keycloak_user_cleanup
  failed_when: false
  when:
    - r_keycloak_access_token_cleanup is defined
    - r_keycloak_access_token_cleanup.json is defined
    - r_keycloak_access_token_cleanup.json.access_token is defined

- name: Delete user from trusted-artifact-signer realm
  uri:
    url: >-
      https://sso.{{ _ocp_apps_domain }}/admin/realms/
      {{- ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/users/{{ r_keycloak_user_cleanup.json[0].id }}
    method: DELETE
    validate_certs: false
    headers:
      Authorization: Bearer {{ r_keycloak_access_token_cleanup.json.access_token }}
    status_code: [204, 404]
    timeout: 30
  register: r_delete_keycloak_user
  failed_when: false
  when:
    - r_keycloak_user_cleanup is defined
    - r_keycloak_user_cleanup.json is defined
    - r_keycloak_user_cleanup.json | length > 0

- name: Get user details from chicken realm (TPA)
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/admin/realms/chicken/users?username={{ _dynamic_username }}
    method: GET
    validate_certs: false
    headers:
      Authorization: Bearer {{ r_keycloak_access_token_cleanup.json.access_token }}
    timeout: 30
  register: r_tpa_user_cleanup
  failed_when: false
  when:
    - r_keycloak_access_token_cleanup is defined
    - r_keycloak_access_token_cleanup.json is defined
    - r_keycloak_access_token_cleanup.json.access_token is defined

- name: Delete user from chicken realm (TPA)
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/admin/realms/chicken/users/{{ r_tpa_user_cleanup.json[0].id }}
    method: DELETE
    validate_certs: false
    headers:
      Authorization: Bearer {{ r_keycloak_access_token_cleanup.json.access_token }}
    status_code: [204, 404]
    timeout: 30
  register: r_delete_tpa_user
  failed_when: false
  when:
    - r_tpa_user_cleanup is defined
    - r_tpa_user_cleanup.json is defined
    - r_tpa_user_cleanup.json | length > 0

- name: Report Keycloak user deletions
  ansible.builtin.debug:
    msg:
      - "✅ Deleted Keycloak user {{ _dynamic_username }} from trusted-artifact-signer realm"
      - "   └─ Status: {{ r_delete_keycloak_user.status | default('N/A') }}"
      - ""
      - "✅ Deleted Keycloak user {{ _dynamic_username }} from chicken realm (TPA)"
      - "   └─ Status: {{ r_delete_tpa_user.status | default('N/A') }}"
      - ""
  when:
    - (r_delete_keycloak_user.status is defined and r_delete_keycloak_user.status == 204) or
      (r_delete_tpa_user.status is defined and r_delete_tpa_user.status == 204)

- name: "📊 CLEANUP SUMMARY"
  ansible.builtin.debug:
    msg:
      - ""
      - "████████████████████████████████████████████████████████████████"
      - "                       CLEANUP SUMMARY"
      - "████████████████████████████████████████████████████████████████"
      - ""
      - "🗑️ RESOURCES CLEANED UP FOR {{ _dynamic_username }}:"
      - "  ├─ GitLab Repositories Deleted: {{ r_delete_gitlab_project.results | selectattr('status', 'in', [202, 204]) | list | length }}"
      - >-
        ├─ RHDH Resources Deleted:
        {{ r_delete_rhdh_resource.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list | length }}
      - >-
        ├─ RHDH Components Deleted:
        {{ r_delete_rhdh_component.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list | length }}
      - >-
        ├─ RHDH APIs Deleted:
        {{ r_delete_rhdh_api.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list | length }}
      - "  ├─ ArgoCD Applications Deleted: {{ _user_argocd_apps | default([]) | length }}"
      - >-
        ├─ Keycloak Users Deleted:
        {{ ((r_delete_keycloak_user.status | default(0) == 204) | int) + ((r_delete_tpa_user.status | default(0) == 204) | int) }}
      - >-
        └─ TOTAL ACTIONS TAKEN:
        {{ (r_delete_gitlab_project.results | selectattr('status', 'in', [202, 204]) | list | length) +
           (r_delete_rhdh_resource.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list | length) +
           (r_delete_rhdh_component.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list | length) +
           (r_delete_rhdh_api.results | default([]) | selectattr('status', 'in', [200, 202, 204]) | list | length) +
           (_user_argocd_apps | default([]) | length) +
           (((r_delete_keycloak_user.status | default(0) == 204) | int) + ((r_delete_tpa_user.status | default(0) == 204) | int)) }}
      - ""
      - "⚠️  STILL TO BE IMPLEMENTED:"
      - "  └─ OpenShift Resource Cleanup: TBD"
      - ""
      - "✅ Comprehensive cleanup completed successfully!"
      - ""
      - "████████████████████████████████████████████████████████████████"
