---
- name: Remove Workload Tasks
  debug:
    msg: "Remove-Workload tasks Started"

- name: Set dynamic user facts for removal
  ansible.builtin.set_fact:
    _dynamic_username: "user-{{ guid }}"
    _dynamic_user_email: "user-{{ guid }}@demo.redhat.com"
    _dynamic_showroom_namespace: "{{ ocp4_workload_dynamic_user_provisioning_showroom_namespace }}-user-{{ guid }}"

- name: Extract OpenShift Apps Domain from console URL
  ansible.builtin.set_fact:
    _ocp_apps_domain: "{{ ocp4_workload_dynamic_user_provisioning_openshift_console_url | regex_replace('https://console-openshift-console\\.', '') }}"
  when: ocp4_workload_dynamic_user_provisioning_openshift_console_url is defined and ocp4_workload_dynamic_user_provisioning_openshift_console_url != ""

- name: Fallback to ingress discovery if console URL not provided
  block:
  - name: Retrieve OpenShift Ingress config
    kubernetes.core.k8s_info:
      api_version: config.openshift.io/v1
      kind: Ingress
      name: cluster
    register: r_ingress_config

  - name: Set OpenShift Apps Domain from ingress
    ansible.builtin.set_fact:
      _ocp_apps_domain: "{{ r_ingress_config.resources[0].spec.domain }}"
  when: ocp4_workload_dynamic_user_provisioning_openshift_console_url is not defined or ocp4_workload_dynamic_user_provisioning_openshift_console_url == ""

# =============================================
# Remove Showroom Instance
# =============================================
- name: Remove showroom Helm release
  kubernetes.core.helm:
    name: "showroom-{{ _dynamic_username }}"
    release_namespace: "{{ _dynamic_showroom_namespace }}"
    state: absent
  failed_when: false

- name: Remove finalizers from showroom namespace
  kubernetes.core.k8s:
    name: "{{ _dynamic_showroom_namespace }}"
    api_version: v1
    kind: Namespace
    merge_type: merge
    definition:
      metadata:
        finalizers: []
  failed_when: false

- name: Remove showroom namespace
  kubernetes.core.k8s:
    name: "{{ _dynamic_showroom_namespace }}"
    api_version: v1
    kind: Namespace
    state: absent
  failed_when: false

# =============================================
# Remove User Quota Resources
# =============================================
- name: Remove finalizers from user workspace namespace
  kubernetes.core.k8s:
    name: "{{ _dynamic_username }}-workspace"
    api_version: v1
    kind: Namespace
    merge_type: merge
    definition:
      metadata:
        finalizers: []
  failed_when: false

- name: Remove user workspace namespace (includes quotas and limits)
  kubernetes.core.k8s:
    name: "{{ _dynamic_username }}-workspace"
    api_version: v1
    kind: Namespace
    state: absent
  failed_when: false

- name: Remove finalizers from user ArgoCD AppProject
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: AppProject
    name: "{{ _dynamic_username }}-project"
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_gitops_namespace | default('tssc-gitops') }}"
    merge_type: merge
    definition:
      metadata:
        finalizers: []
  failed_when: false

- name: Remove user ArgoCD AppProject
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: AppProject
    name: "{{ _dynamic_username }}-project"
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_gitops_namespace | default('tssc-gitops') }}"
    state: absent
  failed_when: false

# =============================================
# Remove Keycloak User
# =============================================
- name: Retrieve Keycloak admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: keycloak-initial-admin
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_keycloak_namespace }}"
  register: r_keycloak_admin_credentials
  failed_when: false

- name: Set Keycloak admin credentials
  ansible.builtin.set_fact:
    _keycloak_admin_username: "{{ r_keycloak_admin_credentials.resources[0].data.username | b64decode }}"
    _keycloak_admin_password: "{{ r_keycloak_admin_credentials.resources[0].data.password | b64decode }}"
  when: r_keycloak_admin_credentials.resources | length > 0

- name: Generate Keycloak access token
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/realms/master/protocol/openid-connect/token
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      client_id: admin-cli
      username: "{{ _keycloak_admin_username }}"
      password: "{{ _keycloak_admin_password }}"
      grant_type: password
  register: r_keycloak_access_token
  failed_when: false
  when: _keycloak_admin_username is defined

# =============================================
# Clean up RHDH/Backstage Catalog Entries FIRST
# =============================================
- name: Get Red Hat Developer Hub route for catalog cleanup
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
    label_selectors:
      - app.kubernetes.io/name=backstage
  register: r_rhdh_cleanup_route
  failed_when: false

- name: Set RHDH URL for catalog cleanup
  ansible.builtin.set_fact:
    _rhdh_cleanup_url: "{{ _rhdh_backend_url if _rhdh_backend_url is defined and _rhdh_backend_url != '' else ('https://' + r_rhdh_cleanup_route.resources[0].spec.host) if r_rhdh_cleanup_route.resources | length > 0 else '' }}"

- name: Set RHDH backend secret as API token
  ansible.builtin.set_fact:
    _rhdh_token: "{{ _rhdh_backend_secret.data['BACKEND_SECRET'] | b64decode }}"
  when: 
    - _rhdh_backend_secret.data is defined
    - _rhdh_backend_secret.data['BACKEND_SECRET'] is defined

- name: Fallback RHDH token generation using OIDC client credentials
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/realms/{{ ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/protocol/openid-connect/token
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      client_id: "{{ _rhdh_backend_secret.data['AUTH_OIDC_CLIENT_ID'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['AUTH_OIDC_CLIENT_ID'] is defined else 'rhdh' }}"
      client_secret: "{{ _rhdh_backend_secret.data['AUTH_OIDC_CLIENT_SECRET'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['AUTH_OIDC_CLIENT_SECRET'] is defined else '' }}"
      grant_type: client_credentials
      scope: openid
    status_code: [200, 400, 401, 403]
  register: r_rhdh_service_token
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_backend_secret.data is defined
    - (_rhdh_token is not defined or _rhdh_token == '')

- name: Set RHDH token from OIDC service credentials
  ansible.builtin.set_fact:
    _rhdh_token: "{{ r_rhdh_service_token.json.access_token }}"
  when: 
    - r_rhdh_service_token.json is defined
    - r_rhdh_service_token.json.access_token is defined
    - (_rhdh_token is not defined or _rhdh_token == '')

- name: Final fallback RHDH token generation using user credentials
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/realms/{{ ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/protocol/openid-connect/token
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      client_id: backstage
      username: "{{ _dynamic_username }}"
      password: "{{ ocp4_workload_dynamic_user_provisioning_password }}"
      grant_type: password
    status_code: [200, 400, 401, 403]
  register: r_rhdh_user_token
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - r_keycloak_access_token.json is defined
    - (_rhdh_token is not defined or _rhdh_token == '')

- name: Set RHDH token from user credentials (final fallback)
  ansible.builtin.set_fact:
    _rhdh_token: "{{ r_rhdh_user_token.json.access_token }}"
  when: 
    - r_rhdh_user_token.json is defined
    - r_rhdh_user_token.json.access_token is defined
    - (_rhdh_token is not defined or _rhdh_token == '')

- name: Debug RHDH token generation
  ansible.builtin.debug:
    msg:
      - "=== RHDH Token Generation Debug ==="
      - "Backend secret available: {{ (_rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['BACKEND_SECRET'] is defined) | bool }}"
      - "OIDC client credentials attempted: {{ r_rhdh_service_token.status is defined | bool }}"
      - "OIDC token success: {{ (r_rhdh_service_token.json is defined and r_rhdh_service_token.json.access_token is defined) | bool }}"
      - "User credentials attempted: {{ r_rhdh_user_token.status is defined | bool }}"
      - "User token success: {{ (r_rhdh_user_token.json is defined and r_rhdh_user_token.json.access_token is defined) | bool }}"
      - "Final RHDH token available: {{ (_rhdh_token is defined and _rhdh_token != '') | bool }}"
      - "Token length: {{ _rhdh_token | length if _rhdh_token is defined else 0 }}"

# =============================================
# Step 1: Comprehensive Entity Discovery in RHDH
# =============================================
- name: Query ALL entities in RHDH catalog for analysis
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/entities"
    method: GET
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_token }}
    status_code: [200, 401, 403, 404]
  register: r_all_rhdh_entities
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_token is defined

- name: Debug RHDH API call status
  ansible.builtin.debug:
    msg:
      - "=== RHDH API Call Debug ==="
      - "API URL: {{ _rhdh_cleanup_url }}/api/catalog/entities"
      - "Token length: {{ _rhdh_token | length if _rhdh_token is defined else 'UNDEFINED' }}"
      - "HTTP Status: {{ r_all_rhdh_entities.status | default('NO RESPONSE') }}"
      - "Response keys: {{ r_all_rhdh_entities.keys() | list if r_all_rhdh_entities is defined else 'NO RESPONSE' }}"
      - "Error message: {{ r_all_rhdh_entities.msg | default('None') }}"
  when: r_all_rhdh_entities is defined

- name: Debug total entities in RHDH catalog
  ansible.builtin.debug:
    msg:
      - "=== RHDH Catalog Discovery Phase ==="
      - "RHDH cleanup URL: {{ _rhdh_cleanup_url | default('NOT DEFINED') }}"
      - "RHDH token defined: {{ _rhdh_token is defined and _rhdh_token != '' }}"
      - "API call successful: {{ r_all_rhdh_entities.json is defined }}"
      - "Total entities in catalog: {{ r_all_rhdh_entities.json | default([]) | length }}"
      - "Entity kinds found: {{ r_all_rhdh_entities.json | default([]) | map(attribute='kind') | unique | list }}"
      - "Target username: {{ _dynamic_username }}"
      - "Sample entities (first 3): {{ (r_all_rhdh_entities.json | default([]))[:3] | map(attribute='metadata.name') | list }}"
  when: r_all_rhdh_entities.json is defined or r_all_rhdh_entities is defined

# =============================================
# Step 2: Primary User Entity Discovery by Owner
# =============================================
- name: Discover user entities by spec.owner (primary method)
  ansible.builtin.set_fact:
    _all_user_entities_final: >-
      {{
        r_all_rhdh_entities.json | default([])
        | selectattr('spec.owner', 'defined')
        | selectattr('spec.owner', 'match', 'user:default/' + _dynamic_username + '$')
        | list
      }}
  when: r_all_rhdh_entities.json is defined

- name: Debug primary entity discovery results
  ansible.builtin.debug:
    msg:
      - "=== Primary Discovery Debug ==="
      - "Looking for spec.owner: user:default/{{ _dynamic_username }}"
      - "Entities with spec.owner defined: {{ (r_all_rhdh_entities.json | default([]) | selectattr('spec.owner', 'defined') | list) | length }}"
      - "Sample spec.owner values: {{ (r_all_rhdh_entities.json | default([]) | selectattr('spec.owner', 'defined') | map(attribute='spec.owner') | unique | list)[:5] }}"
      - "Primary discovery found: {{ _all_user_entities_final | default([]) | length }} entities"
      - "Found entity names: {{ _all_user_entities_final | default([]) | map(attribute='metadata.name') | list }}"
  when: r_all_rhdh_entities.json is defined

- name: Fallback discovery by GitLab source location and name pattern
  ansible.builtin.set_fact:
    _fallback_entities: >-
      {{
        (r_all_rhdh_entities.json | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.backstage.io/source-location', 'defined')
        | selectattr('metadata.annotations.backstage.io/source-location', 'match', '.*user-?' + _user_guid + '.*')
        | list)
        +
        (r_all_rhdh_entities.json | default([])
        | selectattr('metadata.name', 'match', '.*user-?' + _user_guid + '.*')
        | list)
        | unique
      }}
    _all_user_entities_final: >-
      {{
        (_all_user_entities_final | default([])) +
        ((r_all_rhdh_entities.json | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.backstage.io/source-location', 'defined')
        | selectattr('metadata.annotations.backstage.io/source-location', 'match', '.*user-?' + _user_guid + '.*')
        | list)
        +
        (r_all_rhdh_entities.json | default([])
        | selectattr('metadata.name', 'match', '.*user-?' + _user_guid + '.*')
        | list))
        | unique
      }}
  when: 
    - r_all_rhdh_entities.json is defined
    - (_all_user_entities_final | default([]) | length == 0)


# =============================================
# Step 3: Debug Discovery Results
# =============================================
- name: Debug final entity discovery results
  ansible.builtin.debug:
    msg:
      - "=== Entity Discovery Results for {{ _dynamic_username }} ==="
      - "Total unique entities found: {{ _all_user_entities_final | default([]) | length }}"
      - "Entity names: {{ _all_user_entities_final | default([]) | map(attribute='metadata.name') | list }}"
      - "Entity kinds: {{ _all_user_entities_final | default([]) | map(attribute='kind') | unique | list }}"
      - "Entities by type:"
      - "  Components: {{ (_all_user_entities_final | default([]) | selectattr('kind', 'equalto', 'Component') | list) | length }}"
      - "  APIs: {{ (_all_user_entities_final | default([]) | selectattr('kind', 'equalto', 'API') | list) | length }}"
      - "  Systems: {{ (_all_user_entities_final | default([]) | selectattr('kind', 'equalto', 'System') | list) | length }}"
  when: r_all_rhdh_entities.json is defined

- name: Debug individual entity details
  ansible.builtin.debug:
    msg:
      - "Entity: {{ item.metadata.name }}"
      - "  Kind: {{ item.kind }}"
      - "  Namespace: {{ item.metadata.namespace | default('default') }}"
      - "  Owner: {{ item.spec.owner | default('N/A') }}"
      - "  GitLab URL: {{ item.metadata.annotations['backstage.io/source-location'] | default('N/A') if item.metadata.annotations is defined else 'N/A' }}"
  loop: "{{ _all_user_entities_final | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: _all_user_entities_final | default([]) | length > 0

# =============================================
# Step 4: Direct Entity Deletion using known resource names
# =============================================
- name: Set known user resource names for direct deletion
  ansible.builtin.set_fact:
    _user_no_dash: "{{ _dynamic_username.replace('-', '') }}"
    _user_resource_names:
      - { kind: "API", name: "my-quarkus-tkn-{{ _dynamic_username }}" }
      - { kind: "Component", name: "my-quarkus-tkn-{{ _dynamic_username }}" }
      - { kind: "Resource", name: "my-quarkus-tkn-{{ _dynamic_username }}-gitops" }
      - { kind: "API", name: "my-quarkus-tkn-{{ _user_no_dash }}" }
      - { kind: "Component", name: "my-quarkus-tkn-{{ _user_no_dash }}" }
      - { kind: "Resource", name: "my-quarkus-tkn-{{ _user_no_dash }}-gitops" }
    _direct_cleanup_resources:
      gitlab_projects:
        - "development/my-quarkus-tkn-{{ _dynamic_username }}"
        - "development/my-quarkus-tkn-{{ _dynamic_username }}-gitops"
        - "development/my-quarkus-tkn-{{ _user_no_dash }}"
        - "development/my-quarkus-tkn-{{ _user_no_dash }}-gitops"
      argocd_apps:
        - "my-quarkus-tkn-{{ _dynamic_username }}-app-of-apps"
        - "my-quarkus-tkn-{{ _dynamic_username }}-gitops"
        - "my-quarkus-tkn-{{ _user_no_dash }}-app-of-apps"
        - "my-quarkus-tkn-{{ _user_no_dash }}-gitops"
      quay_repos:
        - "tssc/my-quarkus-tkn-{{ _dynamic_username }}"
        - "tssc/my-quarkus-tkn-{{ _user_no_dash }}"
      k8s_patterns:
        - "my-quarkus-tkn-{{ _dynamic_username }}"
        - "my-quarkus-tkn-{{ _user_no_dash }}"

- name: Unregister user entity locations from RHDH catalog
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/locations/by-entity/{{ item.kind | lower }}/{{ item.metadata.namespace | default('default') }}/{{ item.metadata.name }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_token }}
    status_code: [200, 204, 404, 409]
  loop: "{{ _all_user_entities_final }}"
  loop_control:
    label: "Unregister {{ item.kind }}/{{ item.metadata.namespace | default('default') }}/{{ item.metadata.name }}"
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_token is defined
    - _all_user_entities_final | length > 0

- name: Delete user entities from RHDH catalog (after unregistering locations)
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/entities/by-name/{{ item.kind | lower }}/{{ item.metadata.namespace | default('default') }}/{{ item.metadata.name }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_token }}
    status_code: [200, 204, 404, 409]
  loop: "{{ _all_user_entities_final }}"
  loop_control:
    label: "Delete {{ item.kind }}/{{ item.metadata.namespace | default('default') }}/{{ item.metadata.name }}"
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_token is defined
    - _all_user_entities_final | length > 0

- name: Fallback - Delete user entities directly by name pattern
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/entities/by-name/{{ item.kind | lower }}/default/{{ item.name }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_backend_secret.data['BACKEND_SECRET'] | b64decode }}
    status_code: [200, 204, 404, 409]
  loop: "{{ _user_resource_names }}"
  loop_control:
    label: "Fallback delete {{ item.kind }}/default/{{ item.name }}"
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_backend_secret.data is defined
    - _rhdh_backend_secret.data['BACKEND_SECRET'] is defined
    - (_all_user_entities_final | length == 0)

# =============================================
# Step 4: Extract GitLab Repository Information from Discovered Entities
# =============================================
- name: Extract GitLab repository names from discovered RHDH entities
  ansible.builtin.set_fact:
    _user_gitlab_repo_names: >-
      {{
        _all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.backstage.io/source-location', 'defined')
        | map(attribute='metadata.annotations.backstage.io/source-location')
        | select('match', '.*gitlab.*')
        | map('regex_replace', '.*/([^/]+)/?$', '\1')
        | unique
        | list
      }}

- name: Debug GitLab repository extraction
  ansible.builtin.debug:
    msg:
      - "=== GitLab Repository Extraction ==="
      - "Repository names found: {{ _user_gitlab_repo_names | default([]) | length }}"
      - "Repository names: {{ _user_gitlab_repo_names | default([]) }}"

# =============================================
# Step 6: Trigger RHDH Catalog Refresh
# =============================================
- name: Trigger RHDH catalog refresh after cleanup
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/refresh"
    method: POST
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_token }}
    status_code: [200, 202, 401, 403]
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_token is defined

# =============================================
# Remove GitLab User and Repositories
# =============================================
- name: Get GitLab root personal access token from secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: root-user-personal-token
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}"
  register: r_gitlab_root_token
  retries: 120
  delay: 10
  until:
    - r_gitlab_root_token is defined
    - r_gitlab_root_token.resources is defined
    - r_gitlab_root_token.resources | length > 0
    - r_gitlab_root_token.resources[0].data.token is defined

- name: Get RHDH backend configuration secret directly
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: rhdh-secrets
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
  register: r_rhdh_backend_secret
  failed_when: false

- name: Set RHDH backend secret
  ansible.builtin.set_fact:
    _rhdh_backend_secret: "{{ r_rhdh_backend_secret.resources[0] if r_rhdh_backend_secret.resources | length > 0 else {} }}"
  when: r_rhdh_backend_secret.resources is defined

- name: Fallback - search for RHDH secrets if direct lookup fails
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
  register: r_rhdh_secrets
  failed_when: false
  when: _rhdh_backend_secret == {} or _rhdh_backend_secret.data is not defined

- name: Find RHDH backend secret with BACKEND_SECRET
  ansible.builtin.set_fact:
    _rhdh_backend_secret: "{{ r_rhdh_secrets.resources | selectattr('data.BACKEND_SECRET', 'defined') | first | default({}) }}"
  when: 
    - r_rhdh_secrets.resources is defined
    - (_rhdh_backend_secret == {} or _rhdh_backend_secret.data is not defined)

- name: Check if BACKEND_SECRET exists
  ansible.builtin.set_fact:
    _backend_secret_exists: "{{ _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['BACKEND_SECRET'] is defined }}"

- name: Debug RHDH secret discovery
  ansible.builtin.debug:
    msg:
      - "=== RHDH Secret Discovery Debug ==="
      - "Direct secret lookup successful: {{ (r_rhdh_backend_secret.resources is defined and r_rhdh_backend_secret.resources | length > 0) | bool }}"
      - "Secret search results count: {{ r_rhdh_secrets.resources | length if r_rhdh_secrets.resources is defined else 0 }}"
      - "Secret names found: {{ r_rhdh_secrets.resources | map(attribute='metadata.name') | list if r_rhdh_secrets.resources is defined else [] }}"
      - "Final backend secret name: {{ _rhdh_backend_secret.metadata.name if _rhdh_backend_secret.metadata is defined else 'NOT FOUND' }}"
      - "Backend secret has data: {{ (_rhdh_backend_secret.data is defined and _rhdh_backend_secret.data | length > 0) | bool }}"
      - "BACKEND_SECRET key exists: {{ _backend_secret_exists | bool }}"
      - "Available secret keys: {{ _rhdh_backend_secret.data.keys() | list if _rhdh_backend_secret.data is defined else [] }}"

- name: Get ArgoCD admin credentials from tssc-gitops namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: tssc-gitops-cluster
    namespace: tssc-gitops
  register: r_argocd_admin_secret
  failed_when: false

- name: Extract service tokens from RHDH backend secret
  ansible.builtin.set_fact:
    _rhdh_gitlab_token: "{{ _rhdh_backend_secret.data['GITLAB__TOKEN'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['GITLAB__TOKEN'] is defined else '' }}"
    _rhdh_argocd_token: "{{ _rhdh_backend_secret.data['ARGOCD__API_TOKEN'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['ARGOCD__API_TOKEN'] is defined else '' }}"
    _rhdh_argocd_url: "{{ _rhdh_backend_secret.data['ARGOCD__URL'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['ARGOCD__URL'] is defined else '' }}"
    _rhdh_argocd_user: "{{ _rhdh_backend_secret.data['ARGOCD__USER'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['ARGOCD__USER'] is defined else '' }}"
    _rhdh_argocd_password: "{{ _rhdh_backend_secret.data['ARGOCD__PASSWORD'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['ARGOCD__PASSWORD'] is defined else '' }}"
    _rhdh_gitlab_url: "{{ _rhdh_backend_secret.data['GITLAB__URL'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['GITLAB__URL'] is defined else '' }}"
    _rhdh_backend_url: "{{ _rhdh_backend_secret.data['BACKEND_URL'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['BACKEND_URL'] is defined else '' }}"
    _rhdh_keycloak_base_url: "{{ _rhdh_backend_secret.data['KEYCLOAK_BASE_URL'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['KEYCLOAK_BASE_URL'] is defined else '' }}"
    _rhdh_keycloak_realm: "{{ _rhdh_backend_secret.data['KEYCLOAK_REALM'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['KEYCLOAK_REALM'] is defined else '' }}"
    _rhdh_quay_token: "{{ _rhdh_backend_secret.data['QUAY__API_TOKEN'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['QUAY__API_TOKEN'] is defined else '' }}"
    _rhdh_quay_url: "{{ _rhdh_backend_secret.data['QUAY__URL'] | b64decode if _rhdh_backend_secret.data is defined and _rhdh_backend_secret.data['QUAY__URL'] is defined else '' }}"
  when: _rhdh_backend_secret.data is defined

- name: Get Quay super user credentials from tssc-quay namespace
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: tssc-quay-super-user
    namespace: tssc-quay
  register: r_quay_admin_secret
  failed_when: false

- name: Set ArgoCD admin credentials from tssc-gitops secret
  ansible.builtin.set_fact:
    _argocd_admin_user: "{{ r_argocd_admin_secret.resources[0].data.admin | b64decode if r_argocd_admin_secret.resources | length > 0 and r_argocd_admin_secret.resources[0].data.admin is defined else 'admin' }}"
    _argocd_admin_password: "{{ r_argocd_admin_secret.resources[0].data['admin.password'] | b64decode if r_argocd_admin_secret.resources | length > 0 and r_argocd_admin_secret.resources[0].data['admin.password'] is defined else '' }}"
    _argocd_server_url: "https://tssc-gitops-server-tssc-gitops.{{ _ocp_apps_domain }}"
  when: r_argocd_admin_secret.resources is defined

- name: Set Quay admin credentials
  ansible.builtin.set_fact:
    _quay_admin_username: "{{ r_quay_admin_secret.resources[0].data.username | b64decode if r_quay_admin_secret.resources | length > 0 and r_quay_admin_secret.resources[0].data.username is defined else 'quayadmin' }}"
    _quay_admin_password: "{{ r_quay_admin_secret.resources[0].data.password | b64decode if r_quay_admin_secret.resources | length > 0 and r_quay_admin_secret.resources[0].data.password is defined else '' }}"
    _quay_server_url: "https://tssc-quay-quay-tssc-quay.{{ _ocp_apps_domain }}"
  when: r_quay_admin_secret.resources is defined

- name: Set GitLab token (prefer root token, fallback to RHDH token)
  ansible.builtin.set_fact:
    _gitlab_root_token: "{{ r_gitlab_root_token.resources[0].data.token | b64decode if r_gitlab_root_token.resources | length > 0 else _rhdh_gitlab_token }}"

- name: Get GitLab user to delete
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/users?username={{ _dynamic_username }}
    method: GET
    validate_certs: false
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    status_code: [200, 404]
  register: r_gitlab_user
  failed_when: false

- name: Get user's GitLab projects for deletion
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/users/{{ r_gitlab_user.json[0].id }}/projects
    method: GET
    validate_certs: false
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    status_code: [200, 404]
  register: r_user_gitlab_projects
  failed_when: false
  when: 
    - r_gitlab_user.json is defined
    - r_gitlab_user.json | length > 0

- name: Extract GitLab project slugs from RHDH entities
  ansible.builtin.set_fact:
    _gitlab_project_slugs: >-
      {{
        _all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.gitlab.com/project-slug', 'defined')
        | map(attribute='metadata.annotations.gitlab.com/project-slug')
        | unique
        | list
      }}
    _gitlab_projects_from_source: >-
      {{
        _all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.backstage.io/source-location', 'defined')
        | map(attribute='metadata.annotations.backstage.io/source-location')
        | select('match', '.*gitlab.*')
        | map('regex_replace', '.*/development/([^/-]+).*', 'development/\1')
        | unique
        | list
      }}
    _gitlab_projects_to_delete: >-
      {{
        (_all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.gitlab.com/project-slug', 'defined')
        | map(attribute='metadata.annotations.gitlab.com/project-slug')
        | list) +
        (_all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.backstage.io/source-location', 'defined')
        | map(attribute='metadata.annotations.backstage.io/source-location')
        | select('match', '.*gitlab.*')
        | map('regex_replace', '.*/development/([^/-]+).*', 'development/\1')
        | list)
        | unique
      }}

- name: Find GitLab projects using direct resource names
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/projects?search={{ item.split('/')[-1] }}
    method: GET
    validate_certs: false
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    status_code: [200, 404]
  register: r_gitlab_projects_direct
  loop: "{{ _direct_cleanup_resources.gitlab_projects }}"
  failed_when: false

- name: Fallback - Find GitLab projects by full path from RHDH entities
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/projects?search={{ item.split('/')[-1] }}
    method: GET
    validate_certs: false
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    status_code: [200, 404]
  register: r_gitlab_projects_by_name
  loop: "{{ _gitlab_projects_to_delete | default([]) }}"
  failed_when: false
  when: _gitlab_projects_to_delete | default([]) | length > 0

- name: Combine all found GitLab projects for deletion
  ansible.builtin.set_fact:
    r_search_user_projects:
      json: >-
        {{
          (r_gitlab_projects_direct.results | default([]) | selectattr('json', 'defined') | map(attribute='json') | flatten | list) +
          (r_gitlab_projects_by_name.results | default([]) | selectattr('json', 'defined') | map(attribute='json') | flatten | list)
          | unique
        }}

- name: Debug GitLab projects found
  ansible.builtin.debug:
    msg:
      - "=== GitLab Cleanup Status ==="
      - "GitLab token source: {{ 'root-user-personal-token' if r_gitlab_root_token.resources | length > 0 else ('RHDH backend secret' if _rhdh_gitlab_token is defined and _rhdh_gitlab_token != '' else 'none') }}"
      - "GitLab token defined: {{ _gitlab_root_token is defined and _gitlab_root_token != '' }}"
      - "GitLab user found: {{ r_gitlab_user.json is defined and r_gitlab_user.json | length > 0 }}"
      - "User-owned projects found: {{ r_user_gitlab_projects.json | default([]) | length }}"
      - "User-owned projects: {{ r_user_gitlab_projects.json | default([]) | map(attribute='name') | list }}"
      - "RHDH catalog projects found: {{ r_search_user_projects.json | default([]) | length }}"
      - "RHDH catalog projects: {{ r_search_user_projects.json | default([]) | map(attribute='name') | list }}"
      - "Repository names from RHDH: {{ _user_gitlab_repo_names | default([]) }}"
      - ""
      - "=== Service Integration Status ==="
      - "RHDH Backend URL: {{ _rhdh_backend_url | default('Not configured') }}"
      - "RHDH GitLab URL: {{ _rhdh_gitlab_url | default('Not configured') }}"
      - "RHDH ArgoCD URL: {{ _rhdh_argocd_url | default('Not configured') }}"
      - "RHDH Quay URL: {{ _rhdh_quay_url | default('Not configured') }}"
      - "RHDH Keycloak Realm: {{ _rhdh_keycloak_realm | default('Not configured') }}"
      - ""
      - "=== Admin Credentials Status ==="
      - "GitLab root token available: {{ _gitlab_root_token is defined and _gitlab_root_token != '' }}"
      - "ArgoCD admin credentials: {{ _argocd_admin_password is defined and _argocd_admin_password != '' }}"
      - "ArgoCD server URL: {{ _argocd_server_url | default('Not configured') }}"
      - "Quay admin credentials: {{ _quay_admin_password is defined and _quay_admin_password != '' }}"
      - "Quay server URL: {{ _quay_server_url | default('Not configured') }}"

- name: Delete user-owned GitLab projects
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/projects/{{ item.id }}
    method: DELETE
    validate_certs: false
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    status_code: [202, 204, 404]
  loop: "{{ r_user_gitlab_projects.json | default([]) }}"
  failed_when: false
  when: 
    - r_user_gitlab_projects.json | default([]) | length > 0

- name: Delete GitLab projects using root token (direct cleanup)
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/projects/{{ item.id }}
    method: DELETE
    validate_certs: false
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    status_code: [202, 204, 404]
  loop: "{{ r_search_user_projects.json | default([]) }}"
  failed_when: false
  when: 
    - r_search_user_projects.json | default([]) | length > 0

- name: Delete GitLab user
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/users/{{ r_gitlab_user.json[0].id }}
    method: DELETE
    validate_certs: false
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
      Content-Type: application/json
    body_format: form-urlencoded
    body:
      hard_delete: "true"
    status_code: [202, 204, 404]
  failed_when: false
  when: 
    - r_gitlab_user.json is defined
    - r_gitlab_user.json | length > 0


# =============================================
# Clean up ArgoCD Applications (Primary Strategy)
# =============================================
# ArgoCD applications in tssc-gitops namespace manage all user resources
# Deleting the ArgoCD app should cascade delete all managed resources

- name: Set user application facts for cleanup
  ansible.builtin.set_fact:
    _user_guid: "{{ _dynamic_username | replace('user-', '') }}"
    _user_app_name: "my-quarkus-tkn-{{ _dynamic_username | replace('user-', 'user') }}"
    _argocd_namespace: "{{ ocp4_workload_dynamic_user_provisioning_gitops_namespace | default('tssc-gitops') }}"

- name: Get user's GitLab repositories for safe ArgoCD app identification
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/users/{{ r_gitlab_user.json[0].id }}/projects
    method: GET
    validate_certs: false
    headers:
      PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
    status_code: [200, 404]
  register: r_user_gitlab_repos
  failed_when: false
  when: 
    - r_gitlab_user.json is defined
    - r_gitlab_user.json | length > 0
    - _gitlab_root_token is defined

- name: Extract user repository URLs for matching
  ansible.builtin.set_fact:
    _user_repo_urls: >-
      {{
        r_user_gitlab_repos.json | default([])
        | map(attribute='http_url_to_repo')
        | list
      }}
  when: r_user_gitlab_repos.json is defined

- name: Find all ArgoCD applications in gitops namespace
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ _argocd_namespace }}"
  register: r_all_argocd_apps
  failed_when: false

- name: Debug RHDH service integrations available
  ansible.builtin.debug:
    msg:
      - "RHDH ArgoCD token available: {{ _rhdh_argocd_token is defined and _rhdh_argocd_token != '' }}"
      - "RHDH ArgoCD URL: {{ _rhdh_argocd_url | default('Not configured') }}"
      - "RHDH GitLab token available: {{ _rhdh_gitlab_token is defined and _rhdh_gitlab_token != '' }}"
      - "RHDH GitLab URL: {{ _rhdh_gitlab_url | default('Not configured') }}"
      - "RHDH Quay token available: {{ _rhdh_quay_token is defined and _rhdh_quay_token != '' }}"
      - "RHDH Backend URL: {{ _rhdh_backend_url | default('Not configured') }}"
  when: _rhdh_backend_secret.data is defined

- name: Debug sample ArgoCD app metadata structure (first app only)
  ansible.builtin.debug:
    msg:
      - "Sample app name: {{ r_all_argocd_apps.resources[0].metadata.name | default('N/A') }}"
      - "All annotations: {{ r_all_argocd_apps.resources[0].metadata.annotations | default({}) }}"
      - "All labels: {{ r_all_argocd_apps.resources[0].metadata.labels | default({}) }}"
      - "ManagedFields managers: {{ r_all_argocd_apps.resources[0].metadata.managedFields | default([]) | selectattr('manager', 'defined') | map(attribute='manager') | list }}"
      - "Spec source: {{ r_all_argocd_apps.resources[0].spec.source | default({}) }}"
  when: r_all_argocd_apps.resources | length > 0

- name: Extract resource identifiers from RHDH entities for cleanup
  ansible.builtin.set_fact:
    _kubernetes_ids_from_rhdh: >-
      {{
        _all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.backstage.io/kubernetes-id', 'defined')
        | map(attribute='metadata.annotations.backstage.io/kubernetes-id')
        | unique
        | list
      }}
    _tekton_ids_from_rhdh: >-
      {{
        _all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.janus-idp.io/tekton', 'defined')
        | map(attribute='metadata.annotations.janus-idp.io/tekton')
        | unique
        | list
      }}
    _argocd_selectors_from_rhdh: >-
      {{
        _all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.argocd/app-selector', 'defined')
        | map(attribute='metadata.annotations.argocd/app-selector')
        | map('regex_replace', '.*=(.*)$', '\1')
        | unique
        | list
      }}

- name: Find ArgoCD applications using direct naming patterns
  ansible.builtin.set_fact:
    _user_argocd_apps: >-
      {{
        r_all_argocd_apps.resources | default([])
        | selectattr('metadata.name', 'match', '.*my-quarkus-tkn-(' + _dynamic_username + '|' + _dynamic_username.replace('-', '') + ').*')
        | list
      }}
  when: r_all_argocd_apps.resources is defined

- name: Find ArgoCD applications matching RHDH resource identifiers (fallback)
  ansible.builtin.set_fact:
    _user_argocd_apps: >-
      {{
        (_user_argocd_apps | default([])) +
        (r_all_argocd_apps.resources | default([])
        | selectattr('metadata.name', 'match', '.*(' + (_kubernetes_ids_from_rhdh + _tekton_ids_from_rhdh + _argocd_selectors_from_rhdh) | join('|') + ').*')
        | list)
        | unique
      }}
  when: 
    - r_all_argocd_apps.resources is defined
    - (_kubernetes_ids_from_rhdh + _tekton_ids_from_rhdh + _argocd_selectors_from_rhdh) | length > 0

- name: Fallback to GitLab repo URL matching for ArgoCD apps
  ansible.builtin.set_fact:
    _gitlab_repo_urls_from_rhdh: >-
      {{
        _all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.backstage.io/source-location', 'defined')
        | map(attribute='metadata.annotations.backstage.io/source-location')
        | select('match', '.*gitlab.*')
        | list
      }}
    _user_argocd_apps: >-
      {{
        (_user_argocd_apps | default([])) +
        (r_all_argocd_apps.resources | default([])
        | selectattr('spec.source.repoURL', 'defined')
        | selectattr('spec.source.repoURL', 'in', 
          _all_user_entities_final | default([])
          | selectattr('metadata.annotations', 'defined')
          | selectattr('metadata.annotations.backstage.io/source-location', 'defined')
          | map(attribute='metadata.annotations.backstage.io/source-location')
          | select('match', '.*gitlab.*')
          | list)
        | list)
        | unique
      }}
  when: 
    - r_all_argocd_apps.resources is defined
    - _all_user_entities_final | default([]) | length > 0

- name: Final fallback to name pattern matching for ArgoCD apps
  ansible.builtin.set_fact:
    _user_argocd_apps: >-
      {{
        (_user_argocd_apps | default([])) +
        (r_all_argocd_apps.resources | default([])
        | selectattr('metadata.name', 'match', '.*user-?' + _user_guid + '.*')
        | list)
        | unique
      }}
  when: 
    - r_all_argocd_apps.resources is defined
    - (_user_argocd_apps | default([]) | length == 0)

- name: Debug RHDH resource identifiers and ArgoCD matching
  ansible.builtin.debug:
    msg:
      - "=== RHDH Resource Identifiers ==="
      - "Kubernetes IDs: {{ _kubernetes_ids_from_rhdh | default([]) }}"
      - "Tekton IDs: {{ _tekton_ids_from_rhdh | default([]) }}"
      - "ArgoCD selectors: {{ _argocd_selectors_from_rhdh | default([]) }}"
      - "GitLab repo URLs: {{ _gitlab_repo_urls_from_rhdh | default([]) }}"
      - ""
      - "=== ArgoCD Application Matching ==="
      - "ArgoCD apps found: {{ _user_argocd_apps | default([]) | length }}"
      - "Matched apps: {{ _user_argocd_apps | default([]) | map(attribute='metadata.name') | list }}"
      - "App sources: {{ _user_argocd_apps | default([]) | map(attribute='spec.source.repoURL') | list }}"

- name: Debug detailed ownership metadata for each app
  ansible.builtin.debug:
    msg:
      - "App: {{ item.metadata.name }}"
      - "Source repo: {{ item.spec.source.repoURL | default('N/A') }}"
      - "ArgoCD project: {{ item.spec.project | default('N/A') }}"
      - "Backstage-name label: {{ (item.metadata.labels | default({}))['backstage-name'] | default('N/A') }}"
      - "Backstage managed-by-origin: {{ (item.metadata.annotations | default({}))['backstage.io/managed-by-origin'] | default('N/A') }}"
      - "Backstage managed-by-location: {{ (item.metadata.annotations | default({}))['backstage.io/managed-by-location'] | default('N/A') }}"
      - "Backstage kubernetes-id: {{ (item.metadata.labels | default({}))['backstage.io/kubernetes-id'] | default('N/A') }}"
      - "Janus tekton label: {{ (item.metadata.labels | default({}))['janus-idp.io/tekton'] | default('N/A') }}"
      - "ArgoCD managed-by: {{ (item.metadata.annotations | default({}))['argocd.argoproj.io/managed-by'] | default('N/A') }}"
      - "App managed-by: {{ (item.metadata.annotations | default({}))['app.kubernetes.io/managed-by'] | default('N/A') }}"
      - "Creation managers: {{ item.metadata.managedFields | default([]) | selectattr('manager', 'defined') | map(attribute='manager') | list | join(', ') }}"
      - "Child apps: {{ item.status.resources | default([]) | selectattr('kind', 'equalto', 'Application') | map(attribute='name') | list | join(', ') }}"
  loop: "{{ _user_argocd_apps | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Final safety validation - only delete apps with clear user ownership
  ansible.builtin.set_fact:
    _validated_user_apps: "{{ _user_argocd_apps | selectattr('spec.source.repoURL', 'defined') | selectattr('spec.source.repoURL', 'match', '.*user' + _user_guid + '.*') | list }}"

- name: Add apps that match by name pattern as additional validation
  ansible.builtin.set_fact:
    _validated_user_apps: "{{ (_validated_user_apps + (_user_argocd_apps | selectattr('metadata.name', 'match', '.*user' + _user_guid + '.*') | list)) | unique }}"

- name: Debug validation results
  ansible.builtin.debug:
    msg:
      - "Apps validated by repo URL pattern: {{ (_user_argocd_apps | selectattr('spec.source.repoURL', 'defined') | selectattr('spec.source.repoURL', 'match', '.*user' + _user_guid + '.*') | list) | length }}"
      - "Apps validated by name pattern: {{ (_user_argocd_apps | selectattr('metadata.name', 'match', '.*user' + _user_guid + '.*') | list) | length }}"
      - "Total validated apps: {{ _validated_user_apps | length }}"
      - "Final apps to delete: {{ _validated_user_apps | map(attribute='metadata.name') | list }}"

- name: Safety check - abort if too many apps would be deleted
  ansible.builtin.fail:
    msg: "SAFETY: Refusing to delete {{ _validated_user_apps | length }} ArgoCD apps. Manual review required."
  when: 
    - _validated_user_apps | length > 10

- name: Remove finalizers from user ArgoCD applications 
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    merge_type: merge
    definition:
      metadata:
        finalizers: []
  loop: "{{ _user_argocd_apps | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }} (removing finalizers)"
  when: _user_argocd_apps | default([]) | length > 0
  failed_when: false

- name: Delete user ArgoCD applications using OpenShift/Kubernetes (direct cleanup)
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    state: absent
    wait: false
  loop: "{{ _user_argocd_apps | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }} (repo: {{ item.spec.source.repoURL | default('unknown') }})"
  when: _user_argocd_apps | default([]) | length > 0
  register: r_argocd_cleanup

- name: Get ArgoCD admin session token
  uri:
    url: "{{ _argocd_server_url }}/api/v1/session"
    method: POST
    validate_certs: false
    body_format: json
    body:
      username: "{{ _argocd_admin_user }}"
      password: "{{ _argocd_admin_password }}"
    status_code: [200, 401, 403]
  register: r_argocd_admin_session
  failed_when: false
  when: 
    - _argocd_admin_password is defined and _argocd_admin_password != ''
    - _user_argocd_apps | default([]) | length > 0
    - r_argocd_cleanup is failed

- name: Delete ArgoCD applications using admin API with session token
  uri:
    url: "{{ _argocd_server_url }}/api/v1/applications/{{ item.metadata.name }}?cascade=true"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ r_argocd_admin_session.json.token }}"
    status_code: [200, 204, 404]
  loop: "{{ _user_argocd_apps | default([]) }}"
  failed_when: false
  when: 
    - r_argocd_admin_session.json is defined
    - r_argocd_admin_session.json.token is defined
    - _user_argocd_apps | default([]) | length > 0
    - r_argocd_cleanup is failed

- name: Fallback - Delete ArgoCD applications using RHDH token
  uri:
    url: "{{ _rhdh_argocd_url }}/api/v1/applications/{{ item.metadata.name }}?cascade=true"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _rhdh_argocd_token }}"
    status_code: [200, 204, 404]
  loop: "{{ _user_argocd_apps | default([]) }}"
  failed_when: false
  when: 
    - _rhdh_argocd_url is defined and _rhdh_argocd_url != ''
    - _rhdh_argocd_token is defined and _rhdh_argocd_token != ''
    - _user_argocd_apps | default([]) | length > 0
    - r_argocd_cleanup is failed
    - r_argocd_admin_session.json is not defined

- name: Wait for ArgoCD cascade deletion to complete
  ansible.builtin.pause:
    seconds: 30
    prompt: "Waiting for ArgoCD cascade deletion to clean up all managed resources..."
  when: _validated_user_apps | length > 0

# =============================================
# Fallback cleanup for any remaining resources
# =============================================
# ArgoCD should have handled most resources, but clean up any manually created ones

- name: Set resource patterns for cleanup based on RHDH entities
  ansible.builtin.set_fact:
    _resource_patterns: >-
      {{
        (_kubernetes_ids_from_rhdh | default([])) +
        (_tekton_ids_from_rhdh | default([])) +
        (['user-' + _user_guid, 'user' + _user_guid])
      }}

- name: Find resources matching RHDH entity identifiers
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
  register: r_resources_by_type
  loop:
    - { api_version: "apps/v1", kind: "Deployment" }
    - { api_version: "apps/v1", kind: "ReplicaSet" }
    - { api_version: "v1", kind: "Pod" }
    - { api_version: "v1", kind: "Service" }
    - { api_version: "route.openshift.io/v1", kind: "Route" }
    - { api_version: "batch/v1", kind: "Job" }
    - { api_version: "v1", kind: "ConfigMap" }
    - { api_version: "tekton.dev/v1beta1", kind: "PipelineRun" }
    - { api_version: "tekton.dev/v1beta1", kind: "TaskRun" }
  failed_when: false

- name: Filter resources matching user patterns
  ansible.builtin.set_fact:
    _user_resources_to_delete: >-
      {{
        r_resources_by_type.results
        | selectattr('resources', 'defined')
        | map(attribute='resources')
        | flatten
        | selectattr('metadata.name', 'match', '.*(' + _resource_patterns | join('|') + ').*')
        | list
      }}

- name: Debug resources found for deletion
  ansible.builtin.debug:
    msg:
      - "=== Kubernetes Resources to Delete ==="
      - "Resource patterns: {{ _resource_patterns }}"
      - "Resources found: {{ _user_resources_to_delete | length }}"
      - "Resource names: {{ _user_resources_to_delete | map(attribute='metadata.name') | list }}"
      - "Resource types: {{ _user_resources_to_delete | map(attribute='kind') | unique | list }}"

- name: Remove finalizers from user-specific Kubernetes resources
  kubernetes.core.k8s:
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    merge_type: merge
    definition:
      metadata:
        finalizers: []
  loop: "{{ _user_resources_to_delete }}"
  failed_when: false
  when: 
    - _user_resources_to_delete | length > 0
    - item.metadata.finalizers is defined
    - item.metadata.finalizers | length > 0

- name: Delete user-specific Kubernetes resources
  kubernetes.core.k8s:
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    state: absent
    wait: false
  loop: "{{ _user_resources_to_delete }}"
  failed_when: false
  when: _user_resources_to_delete | length > 0

# =============================================
# Clean up Quay Container Images
# =============================================
- name: Extract Quay repository slugs from RHDH entities
  ansible.builtin.set_fact:
    _quay_repo_slugs: >-
      {{
        _all_user_entities_final | default([])
        | selectattr('metadata.annotations', 'defined')
        | selectattr('metadata.annotations.quay.io/repository-slug', 'defined')
        | map(attribute='metadata.annotations.quay.io/repository-slug')
        | unique
        | list
      }}

- name: Debug Quay repositories to delete
  ansible.builtin.debug:
    msg:
      - "=== Quay Repository Cleanup ==="
      - "Repository slugs from RHDH: {{ _quay_repo_slugs | default([]) }}"

- name: Get Quay admin session token
  uri:
    url: "{{ _quay_server_url }}/api/v1/signin"
    method: POST
    validate_certs: false
    body_format: json
    body:
      username: "{{ _quay_admin_username }}"
      password: "{{ _quay_admin_password }}"
    status_code: [200, 401, 403]
  register: r_quay_admin_session
  failed_when: false
  when: 
    - _quay_admin_password is defined and _quay_admin_password != ''

- name: Delete Quay repositories using direct patterns with admin token
  uri:
    url: "{{ _quay_server_url }}/api/v1/repository/{{ item }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ r_quay_admin_session.json.token }}"
    status_code: [204, 404]
  loop: "{{ _direct_cleanup_resources.quay_repos }}"
  failed_when: false
  when: 
    - r_quay_admin_session.json is defined
    - r_quay_admin_session.json.token is defined

- name: Get user Quay namespace repositories using admin token
  uri:
    url: "{{ _quay_server_url }}/api/v1/repository?namespace={{ _dynamic_username }}"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ r_quay_admin_session.json.token }}"
    status_code: [200, 401, 403, 404]
  register: r_user_quay_repos_admin
  failed_when: false
  when: 
    - r_quay_admin_session.json is defined
    - r_quay_admin_session.json.token is defined

- name: Delete Quay repositories from RHDH entities using admin token
  uri:
    url: "{{ _quay_server_url }}/api/v1/repository/{{ item }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ r_quay_admin_session.json.token }}"
    status_code: [204, 404]
  loop: "{{ _quay_repo_slugs | default([]) }}"
  failed_when: false
  when: 
    - r_quay_admin_session.json is defined
    - r_quay_admin_session.json.token is defined
    - _quay_repo_slugs | default([]) | length > 0

- name: Delete user namespace Quay repositories using admin token
  uri:
    url: "{{ _quay_server_url }}/api/v1/repository/{{ _dynamic_username }}/{{ item.name }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ r_quay_admin_session.json.token }}"
    status_code: [204, 404]
  loop: "{{ r_user_quay_repos_admin.json.repositories | default([]) }}"
  failed_when: false
  when: 
    - r_user_quay_repos_admin.json is defined
    - r_user_quay_repos_admin.json.repositories is defined
    - r_user_quay_repos_admin.json.repositories | length > 0

- name: Fallback - Delete Quay repositories using RHDH token
  uri:
    url: "{{ _rhdh_quay_url }}/api/v1/repository/{{ item }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _rhdh_quay_token }}"
    status_code: [204, 404]
  loop: "{{ _quay_repo_slugs | default([]) + _direct_cleanup_resources.quay_repos | default([]) }}"
  failed_when: false
  when: 
    - _rhdh_quay_url is defined and _rhdh_quay_url != ''
    - _rhdh_quay_token is defined and _rhdh_quay_token != ''
    - r_quay_admin_session.json is not defined
    - _quay_repo_slugs | default([]) | length > 0

- name: Fallback - Get user Quay namespace repositories using RHDH token
  uri:
    url: "{{ _rhdh_quay_url }}/api/v1/repository?namespace={{ _dynamic_username }}"
    method: GET
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _rhdh_quay_token }}"
    status_code: [200, 401, 403, 404]
  register: r_user_quay_repos_rhdh
  failed_when: false
  when: 
    - _rhdh_quay_url is defined and _rhdh_quay_url != ''
    - _rhdh_quay_token is defined and _rhdh_quay_token != ''
    - r_quay_admin_session.json is not defined
    - (_quay_repo_slugs | default([]) | length == 0)

- name: Fallback - Delete user namespace Quay repositories using RHDH token
  uri:
    url: "{{ _rhdh_quay_url }}/api/v1/repository/{{ _dynamic_username }}/{{ item.name }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: "Bearer {{ _rhdh_quay_token }}"
    status_code: [204, 404]
  loop: "{{ r_user_quay_repos_rhdh.json.repositories | default([]) }}"
  failed_when: false
  when: 
    - r_user_quay_repos_rhdh.json is defined
    - r_user_quay_repos_rhdh.json.repositories is defined
    - r_user_quay_repos_rhdh.json.repositories | length > 0

# =============================================
# Final Cleanup: Remove Keycloak User
# =============================================
- name: Get Keycloak user to delete
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/admin/realms/{{ ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/users?username={{ _dynamic_username }}
    method: GET
    validate_certs: false
    headers:
      Authorization: Bearer {{ r_keycloak_access_token.json.access_token }}
  register: r_keycloak_user
  failed_when: false
  when: r_keycloak_access_token.json is defined

- name: Delete Keycloak user (final cleanup step)
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/admin/realms/{{ ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/users/{{ r_keycloak_user.json[0].id }}
    method: DELETE
    validate_certs: false
    headers:
      Authorization: Bearer {{ r_keycloak_access_token.json.access_token }}
    status_code: [204, 404]
  failed_when: false
  when: 
    - r_keycloak_user.json is defined
    - r_keycloak_user.json | length > 0

# =============================================
# Report cleanup status
# =============================================
- name: Report user removal status
  agnosticd_user_info:
    msg: |
      Dynamic user {{ _dynamic_username }} has been removed from workshop {{ guid }}:
      
      === Resource Discovery from RHDH ===
      Entities Found: {{ _all_user_entities_final | default([]) | length }}
      Kubernetes IDs: {{ _kubernetes_ids_from_rhdh | default([]) | join(', ') if _kubernetes_ids_from_rhdh | default([]) | length > 0 else 'None' }}
      Tekton IDs: {{ _tekton_ids_from_rhdh | default([]) | join(', ') if _tekton_ids_from_rhdh | default([]) | length > 0 else 'None' }}
      GitLab Projects: {{ _gitlab_projects_to_delete | default([]) | join(', ') if _gitlab_projects_to_delete | default([]) | length > 0 else 'None' }}
      Quay Repositories: {{ _quay_repo_slugs | default([]) | join(', ') if _quay_repo_slugs | default([]) | length > 0 else 'None' }}
      
      === Cleanup Status ===
      RHDH Catalog Entities: {{ 'Cleaned (' + (_all_user_entities_final | default([]) | length | string) + ' entities)' if _all_user_entities_final | default([]) | length > 0 else 'None found' }}
      ArgoCD Applications: {{ 'Deleted (' + (_validated_user_apps | default([]) | length | string) + ' apps)' if _validated_user_apps | default([]) | length > 0 else 'None found' }}
      GitLab Projects: {{ 'Deleted (' + (_gitlab_projects_to_delete | default([]) | length | string) + ' projects)' if _gitlab_projects_to_delete | default([]) | length > 0 else 'None found' }}
      GitLab User: {{ 'Removed' if r_gitlab_user.json is defined and r_gitlab_user.json | length > 0 else 'Not found' }}
      Kubernetes Resources: {{ 'Deleted (' + (_user_resources_to_delete | default([]) | length | string) + ' resources)' if _user_resources_to_delete | default([]) | length > 0 else 'None found' }}
      Quay Repositories: {{ 'Cleaned (' + (_quay_repo_slugs | default([]) | length | string) + ' from entities)' if _quay_repo_slugs | default([]) | length > 0 else ('Cleaned (' + (r_user_quay_repos.json.repositories | default([]) | length | string) + ' from namespace)' if r_user_quay_repos.json is defined and r_user_quay_repos.json.repositories is defined else 'None found') }}
      Keycloak User: {{ 'Removed' if r_keycloak_user.json is defined and r_keycloak_user.json | length > 0 else 'Not found' }}
      Showroom Instance: Removed
      
      {% if _validated_user_apps | length > 0 %}
      === ArgoCD Applications Removed ===
      {% for app in _validated_user_apps %}
      - {{ app.metadata.name }} (repo: {{ app.spec.source.repoURL | default('unknown') }})
      {% endfor %}
      (All managed resources automatically cleaned up via cascade deletion)
      {% endif %}
      
      === Verification Commands ===
      # Check for any remaining user resources (including user1, user-1, and 1 patterns)
      oc get all --all-namespaces -o wide | grep -E "user-?{{ _user_guid }}"
      oc get replicasets --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get jobs --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get pods --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get routes --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get secrets --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get configmaps --all-namespaces | grep -E "user-?{{ _user_guid }}"

- name: Remove Workload Tasks Complete
  debug:
    msg: "Remove-Workload tasks completed successfully"