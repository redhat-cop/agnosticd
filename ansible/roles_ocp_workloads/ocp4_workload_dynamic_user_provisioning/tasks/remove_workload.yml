---
- name: Dynamic user removal started
  debug:
    msg: "Starting removal of dynamic user: {{ _dynamic_username }}"

# =============================================
# Setup Domain Variables
# =============================================
- name: Extract cluster domain from console URL
  ansible.builtin.set_fact:
    _cluster_domain: >-
      {{
        ocp4_workload_dynamic_user_provisioning_openshift_console_url
        | regex_replace('^https://console-openshift-console\.apps\.', '')
      }}

- name: Set OpenShift Apps Domain
  ansible.builtin.set_fact:
    _ocp_apps_domain: "apps.{{ _cluster_domain }}"

# =============================================
# Discover RHDH Resources
# =============================================
- name: Get Red Hat Developer Hub route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
    label_selectors:
      - app.kubernetes.io/name=backstage
  register: r_rhdh_route

- name: Set RHDH URL
  ansible.builtin.set_fact:
    _rhdh_url: "https://{{ r_rhdh_route.resources[0].spec.host }}"
  when: r_rhdh_route.resources | length > 0

- name: Fail if RHDH route not found
  ansible.builtin.fail:
    msg: "RHDH route not found in namespace {{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
  when: r_rhdh_route.resources | length == 0

- name: Get RHDH backend token from secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
  register: r_rhdh_secrets

- name: Debug RHDH secrets
  ansible.builtin.debug:
    msg:
      - "RHDH secrets found: {{ r_rhdh_secrets.resources | map(attribute='metadata.name') | list }}"

- name: Find RHDH backend token secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
    label_selectors:
      - app.kubernetes.io/name=backstage
  register: r_rhdh_backend_secrets

- name: Try to get RHDH backend auth token from backstage secrets
  ansible.builtin.set_fact:
    _rhdh_backend_token: >-
      {{
        r_rhdh_backend_secrets.resources |
        selectattr('data.BACKEND_SECRET', 'defined') |
        map(attribute='data.BACKEND_SECRET') |
        first |
        b64decode
      }}
  when:
    - r_rhdh_backend_secrets.resources | length > 0
    - r_rhdh_backend_secrets.resources | selectattr('data.BACKEND_SECRET', 'defined') | list | length > 0

- name: Try alternative token sources if BACKEND_SECRET not found
  block:
    - name: Look for backstage-backend-auth-key secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: backstage-backend-auth-key
        namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
      register: r_backend_auth_key
      failed_when: false

    - name: Set token from backstage-backend-auth-key
      ansible.builtin.set_fact:
        _rhdh_backend_token: "{{ r_backend_auth_key.resources[0].data['backend-auth-key'] | b64decode }}"
      when:
        - r_backend_auth_key.resources | length > 0
        - r_backend_auth_key.resources[0].data['backend-auth-key'] is defined
  when: _rhdh_backend_token is not defined

- name: Debug RHDH API access setup
  ansible.builtin.debug:
    msg:
      - "RHDH URL: {{ _rhdh_url }}"
      - "Dynamic Username: {{ _dynamic_username }}"
      - "Backend token available: {{ _rhdh_backend_token is defined }}"

- name: Try different authentication approaches for RHDH API
  block:
    - name: Try RHDH API with backend token
      uri:
        url: "{{ _rhdh_url }}/api/catalog/entities"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ _rhdh_backend_token }}"
          Content-Type: application/json
        status_code: [200, 401, 403]
      register: r_all_entities_backend
      failed_when: false
      when: _rhdh_backend_token is defined

    - name: Try RHDH API without authentication
      uri:
        url: "{{ _rhdh_url }}/api/catalog/entities"
        method: GET
        validate_certs: false
        headers:
          Content-Type: application/json
        status_code: [200, 401, 403]
      register: r_all_entities_noauth
      failed_when: false
      when:
        - _rhdh_backend_token is not defined or r_all_entities_backend.status != 200

    - name: Set successful entities response
      ansible.builtin.set_fact:
        r_all_entities: >-
          {{
            r_all_entities_backend if (r_all_entities_backend is defined and r_all_entities_backend.status == 200)
            else r_all_entities_noauth
          }}

- name: Debug RHDH API response
  ansible.builtin.debug:
    msg:
      - "API call successful: {{ r_all_entities.status == 200 }}"
      - "Response status: {{ r_all_entities.status | default('undefined') }}"
      - "Response type: {{ r_all_entities.json | type_debug }}"
      - "Response content: {{ r_all_entities.json | default('no content') }}"

- name: Convert entities to YAML and search for user references
  ansible.builtin.set_fact:
    _user_entities: []
  when:
    - r_all_entities is defined
    - r_all_entities.status == 200

- name: Check if API response contains valid entity list
  ansible.builtin.set_fact:
    _entities_list: >-
      {{
        r_all_entities.json if (
          r_all_entities is defined and
          r_all_entities.status == 200 and
          r_all_entities.json is defined and
          r_all_entities.json is iterable and
          r_all_entities.json is not string and
          r_all_entities.json is not mapping
        ) else []
      }}

- name: Search each entity for user references in YAML content
  ansible.builtin.set_fact:
    _user_entities: >-
      {{
        _user_entities + [item]
      }}
  loop: "{{ _entities_list }}"
  when:
    - _entities_list | length > 0
    - item is mapping
    - item.metadata is defined
    - >-
      (_dynamic_username in (item | to_nice_yaml | lower)) or
      (_dynamic_username in (item.metadata.name | default(''))) or
      (_dynamic_username in (item.spec.owner | default(''))) or
      (_dynamic_username in (item.metadata.namespace | default(''))) or
      (_dynamic_username in (item.metadata.annotations | default({}) | to_nice_yaml)) or
      (_dynamic_username in (item.spec | default({}) | to_nice_yaml)) or
      ((_dynamic_username + '-gitops') in (item.metadata.name | default(''))) or
      ((_dynamic_username + '-dev') in (item.metadata.name | default(''))) or
      ((_dynamic_username + '-prod') in (item.metadata.name | default('')))
  loop_control:
    label: "{{ item.metadata.name | default('unnamed') }}"

- name: Debug comprehensive entity search
  ansible.builtin.debug:
    msg:
      - "Searching for patterns:"
      - "  - {{ _dynamic_username }}"
      - "  - {{ _dynamic_username }}-gitops"
      - "  - {{ _dynamic_username }}-dev"
      - "  - {{ _dynamic_username }}-prod"
      - "Total entities to search: {{ _entities_list | length }}"

- name: Debug all entities summary
  ansible.builtin.debug:
    msg:
      - "Total entities in catalog: {{ _entities_list | length }}"
      - "Entity kinds found: {{ _entities_list | map(attribute='kind') | default([]) | unique | list }}"
  when: _entities_list | length > 0

- name: Debug user-related entities found
  ansible.builtin.debug:
    msg:
      - "User-related entities: {{ _user_entities | default([]) | length }}"
      - "User entities details:"
  when:
    - r_all_entities is defined
    - r_all_entities.status == 200

- name: Show sample of all entities for debugging
  ansible.builtin.debug:
    msg:
      - "Entity {{ ansible_loop.index }}: {{ item.kind }}/{{ item.metadata.name }}"
      - "  Namespace: {{ item.metadata.namespace | default('N/A') }}"
      - "  Owner: {{ item.spec.owner | default('N/A') }}"
      - "  Source location: {{ item.metadata.annotations['backstage.io/source-location'] | default('N/A') }}"
  loop: "{{ _entities_list }}"
  loop_control:
    extended: true
    label: "{{ item.metadata.name }}"
  when:
    - _entities_list | length > 0
    - ansible_loop.index <= 10

- name: List user entity details
  ansible.builtin.debug:
    msg:
      - "Kind: {{ item.kind }}"
      - "Name: {{ item.metadata.name }}"
      - "Namespace: {{ item.metadata.namespace | default('N/A') }}"
      - "Owner: {{ item.spec.owner | default('N/A') }}"
      - "Annotations: {{ item.metadata.annotations | default({}) }}"
      - "Full YAML content:"
      - "{{ item | to_nice_yaml }}"
  loop: "{{ _user_entities | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Discover GitLab projects owned by user
  block:
    - name: Get GitLab root personal access token
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: root-user-personal-token
        namespace: "{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}"
      register: r_gitlab_root_token

    - name: Set GitLab root token
      ansible.builtin.set_fact:
        _gitlab_root_token: "{{ r_gitlab_root_token.resources[0].data.token | b64decode }}"

    - name: Get GitLab user details
      uri:
        url: >-
          https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/
          {{- 'api/v4/users?username=' }}{{ _dynamic_username }}
        method: GET
        validate_certs: false
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        status_code: [200, 404]
      register: r_gitlab_user
      failed_when: false

    - name: Get GitLab projects owned by user
      uri:
        url: >-
          https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/
          {{- 'api/v4/users/' }}{{ r_gitlab_user.json[0].id }}/projects
        method: GET
        validate_certs: false
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        status_code: [200, 404]
      register: r_gitlab_projects
      when:
        - r_gitlab_user.status == 200
        - r_gitlab_user.json | length > 0

    - name: Search for user-related projects in development group
      uri:
        url: >-
          https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/
          {{- 'api/v4/groups/development/projects?search=' }}{{ _dynamic_username }}
        method: GET
        validate_certs: false
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        status_code: [200, 404]
      register: r_gitlab_development_projects
      failed_when: false

    - name: Search for projects with user ID pattern (user123 instead of user-123)
      uri:
        url: >-
          https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/
          {{- 'api/v4/groups/development/projects?search=' }}{{ _dynamic_username | replace('-', '') }}
        method: GET
        validate_certs: false
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        status_code: [200, 404]
      register: r_gitlab_development_projects_alt
      failed_when: false

    - name: Get all projects in development group for comprehensive search
      uri:
        url: >-
          https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/
          {{- 'api/v4/groups/development/projects' }}
        method: GET
        validate_certs: false
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        status_code: [200, 404]
      register: r_gitlab_all_development_projects
      failed_when: false

    - name: Filter development projects for user-related repos
      ansible.builtin.set_fact:
        _filtered_dev_projects: []

    - name: Find user-related projects in all development projects
      ansible.builtin.set_fact:
        _filtered_dev_projects: >-
          {{
            _filtered_dev_projects + [item]
          }}
      loop: "{{ r_gitlab_all_development_projects.json | default([]) }}"
      when:
        - r_gitlab_all_development_projects.json is defined
        - >-
          (_dynamic_username in item.name) or
          (_dynamic_username.replace('-', '') in item.name) or
          (_dynamic_username in item.path) or
          (_dynamic_username.replace('-', '') in item.path)
      loop_control:
        label: "{{ item.name }}"

    - name: Combine all GitLab projects
      ansible.builtin.set_fact:
        r_gitlab_projects:
          json: >-
            {{
              (r_gitlab_projects.json | default([])) +
              (r_gitlab_development_projects.json | default([])) +
              (r_gitlab_development_projects_alt.json | default([])) +
              (_filtered_dev_projects | default([]))
            }}

    - name: Remove duplicate GitLab projects
      ansible.builtin.set_fact:
        _unique_gitlab_projects: []

    - name: Build unique GitLab projects list
      ansible.builtin.set_fact:
        _unique_gitlab_projects: >-
          {{
            _unique_gitlab_projects + [item]
          }}
      loop: "{{ r_gitlab_projects.json | default([]) }}"
      when: item.id not in (_unique_gitlab_projects | map(attribute='id') | list)
      loop_control:
        label: "{{ item.name }} (ID: {{ item.id }})"

    - name: Set final unique GitLab projects
      ansible.builtin.set_fact:
        r_gitlab_projects:
          json: "{{ _unique_gitlab_projects }}"

    - name: Extract GitLab project information directly from RHDH entities
      ansible.builtin.set_fact:
        _gitlab_projects_from_rhdh: []

    - name: Get GitLab project paths from RHDH entity annotations
      ansible.builtin.set_fact:
        _gitlab_projects_from_rhdh: >-
          {{
            _gitlab_projects_from_rhdh + [project_info]
          }}
      vars:
        project_info:
          name: "{{ item.metadata.name }}"
          project_slug: "{{ item.metadata.annotations['gitlab.com/project-slug'] | default('') }}"
          entity_kind: "{{ item.kind }}"
      loop: "{{ _user_entities | default([]) }}"
      when:
        - item.metadata.annotations is defined
        - item.metadata.annotations['gitlab.com/project-slug'] is defined
        - item.metadata.annotations['gitlab.com/project-slug'] != ""
      loop_control:
        label: "{{ item.metadata.name | default('unnamed') }}"

    - name: Debug GitLab projects from RHDH entities
      ansible.builtin.debug:
        msg:
          - "GitLab projects found directly in RHDH entities:"
          - "{{ _gitlab_projects_from_rhdh | map(attribute='project_slug') | list }}"
          - ""
          - "These will be deleted directly using project slugs - no API lookup needed!"

    - name: Set GitLab projects directly from RHDH entities
      ansible.builtin.set_fact:
        r_gitlab_projects:
          json: "{{ _gitlab_projects_from_rhdh }}"

    - name: Extract repository names from GitLab projects for ArgoCD matching
      ansible.builtin.set_fact:
        _gitlab_repo_names: []

    - name: Build list of GitLab repository names for ArgoCD discovery
      ansible.builtin.set_fact:
        _gitlab_repo_names: >-
          {{
            _gitlab_repo_names + [repo_name]
          }}
      vars:
        repo_name: "{{ item.project_slug.split('/')[1] }}"
      loop: "{{ _gitlab_projects_from_rhdh }}"
      when: item.project_slug is defined and '/' in item.project_slug
      loop_control:
        label: "{{ item.name }} → {{ repo_name }}"

    - name: Debug GitLab repository names for ArgoCD matching
      ansible.builtin.debug:
        msg:
          - "GitLab repository names extracted for ArgoCD discovery:"
          - "{{ _gitlab_repo_names }}"
          - ""
          - "These will be used to find ArgoCD applications containing these names"

    - name: Debug final GitLab discovery results
      ansible.builtin.debug:
        msg:
          - "GitLab projects found directly from RHDH entities:"
          - "{{ r_gitlab_projects.json | default([]) | map(attribute='project_slug') | list }}"
          - "Final GitLab projects count: {{ r_gitlab_projects.json | default([]) | length }}"
          - ""
          - "✅ SIMPLIFIED APPROACH: Using project slugs directly from RHDH"
          - "   → No URL construction or API lookups needed"
          - "   → Direct deletion using gitlab.com/project-slug annotations"

    - name: List each discovered GitLab project
      ansible.builtin.debug:
        msg:
          - "RHDH Entity: {{ item.name }}"
          - "  Entity Kind: {{ item.entity_kind }}"
          - "  GitLab Project Slug: {{ item.project_slug }}"
          - "  Will be deleted using: /api/v4/projects/{{ item.project_slug | replace('/', '%2F') }}"
          - ""
      loop: "{{ r_gitlab_projects.json | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Debug GitLab deletion readiness
      ansible.builtin.debug:
        msg:
          - "=== GITLAB DELETION READINESS CHECK ==="
          - "r_gitlab_projects defined: {{ r_gitlab_projects is defined }}"
          - "r_gitlab_projects.json defined: {{ (r_gitlab_projects is defined and r_gitlab_projects.json is defined) }}"
          - "r_gitlab_projects.json length: {{ r_gitlab_projects.json | default([]) | length }}"
          - "r_gitlab_projects.json content: {{ r_gitlab_projects.json | default('UNDEFINED') }}"
          - ""
          - "Deletion condition check:"
          - "  Condition: r_gitlab_projects.json | default([]) | length > 0"
          - "  Result: {{ r_gitlab_projects.json | default([]) | length > 0 }}"
          - ""
          - >-
            CONCLUSION:
            {{ '🔍 GitLab deletion tasks will be SKIPPED' if r_gitlab_projects.json | default([]) | length == 0
               else '✅ GitLab deletion tasks will PROCEED' }}
          - >-
            {{ '   → No actual GitLab repositories found to delete'
               if r_gitlab_projects.json | default([]) | length == 0
               else '   → ' + (r_gitlab_projects.json | length | string) + ' repositories will be deleted' }}
          - >-
            {{ '   → RHDH entities will still be cleaned up (they reference non-existent repos)'
               if r_gitlab_projects.json | default([]) | length == 0 else '' }}

- name: Discover ArgoCD Applications for user
  block:
    - name: Get ArgoCD Applications in user project
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: "{{ ocp4_workload_dynamic_user_provisioning_gitops_namespace | default('tssc-gitops') }}"
      register: r_argocd_apps
      failed_when: false

    - name: Extract ArgoCD app selectors from RHDH entities
      ansible.builtin.set_fact:
        _argocd_selectors: []

    - name: Find ArgoCD app selectors from RHDH entity annotations
      ansible.builtin.set_fact:
        _argocd_selectors: >-
          {{
            _argocd_selectors + [selector_value]
          }}
      vars:
        selector_value: "{{ item.metadata.annotations['argocd/app-selector'] }}"
      loop: "{{ _user_entities | default([]) }}"
      when:
        - item.metadata.annotations is defined
        - item.metadata.annotations['argocd/app-selector'] is defined
        - selector_value != ""
      loop_control:
        label: "{{ item.metadata.name | default('unnamed') }}"

    - name: Extract component names from RHDH entities for ArgoCD matching
      ansible.builtin.set_fact:
        _component_names: >-
          {{
            (_rhdh_components | default([]) | map(attribute='metadata.name') | list) +
            (_rhdh_resources | default([]) | map(attribute='metadata.name') | list) +
            (_rhdh_apis | default([]) | map(attribute='metadata.name') | list)
          }}

    - name: Filter ArgoCD apps related to user using RHDH entity data
      ansible.builtin.set_fact:
        _user_argocd_apps: []
      when: r_argocd_apps.resources is defined

    - name: Find ArgoCD apps by component names and selectors from RHDH entities
      ansible.builtin.set_fact:
        _user_argocd_apps: >-
          {{
            _user_argocd_apps + [item]
          }}
      loop: "{{ r_argocd_apps.resources | default([]) }}"
      when:
        - r_argocd_apps.resources is defined
        - >-
          (item.metadata.name in _component_names) or
          (item.metadata.labels | default({}) | dict2items | selectattr('key', 'equalto', 'tssc/gitops') |
           map(attribute='value') | list | intersect(_argocd_selectors) | length > 0) or
          (item.metadata.labels | default({}) | dict2items | selectattr('value', 'in', _argocd_selectors) | length > 0)
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Find ArgoCD apps by GitLab repository name pattern matching
      ansible.builtin.set_fact:
        _user_argocd_apps: >-
          {{
            _user_argocd_apps + [item]
          }}
      vars:
        app_name: "{{ item.metadata.name }}"
        matching_repos: >-
          {{
            _gitlab_repo_names | select('in', app_name) | list
          }}
      loop: "{{ r_argocd_apps.resources | default([]) }}"
      when:
        - r_argocd_apps.resources is defined
        - item not in _user_argocd_apps
        - _gitlab_repo_names | length > 0
        - matching_repos | length > 0
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Debug ArgoCD app matching with GitLab repo names
      ansible.builtin.debug:
        msg:
          - "Checking ArgoCD app: {{ app_name }}"
          - "GitLab repo names: {{ _gitlab_repo_names }}"
          - "Matches: {{ _gitlab_repo_names | select('in', app_name) | list }}"
          - "Has matches: {{ (_gitlab_repo_names | select('in', app_name) | list | length > 0) }}"
      vars:
        app_name: "{{ item.metadata.name }}"
      loop: "{{ r_argocd_apps.resources | default([]) }}"
      when:
        - r_argocd_apps.resources is defined
        - _gitlab_repo_names | length > 0
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Debug ArgoCD app discovery using RHDH entities
      ansible.builtin.debug:
        msg:
          - "Using RHDH entities as ONLY source of truth for ArgoCD discovery:"
          - "  • Component names from RHDH: {{ _component_names }}"
          - "  • ArgoCD selectors from RHDH: {{ _argocd_selectors }}"
          - "  • GitLab repository names: {{ _gitlab_repo_names }}"
          - "  • NO username pattern matching - only using RHDH entity data"
          - ""
          - "ArgoCD discovery logic:"
          - "  1. App name matches RHDH component names"
          - "  2. App labels match RHDH ArgoCD selectors"
          - "  3. App name matches GitLab repository names from RHDH"
          - "  4. App repoURL contains GitLab repository names from RHDH"
          - ""
          - "Found ArgoCD applications:"
          - "{{ _user_argocd_apps | map(attribute='metadata.name') | list }}"

    - name: Set empty ArgoCD apps if none found
      ansible.builtin.set_fact:
        _user_argocd_apps: []
      when: r_argocd_apps.resources is not defined

- name: Organize discovered resources by type
  ansible.builtin.set_fact:
    _rhdh_components: "{{ _user_entities | default([]) | selectattr('kind', 'equalto', 'Component') | list }}"
    _rhdh_apis: "{{ _user_entities | default([]) | selectattr('kind', 'equalto', 'API') | list }}"
    _rhdh_systems: "{{ _user_entities | default([]) | selectattr('kind', 'equalto', 'System') | list }}"
    _rhdh_resources: "{{ _user_entities | default([]) | selectattr('kind', 'equalto', 'Resource') | list }}"
    _rhdh_locations: "{{ _user_entities | default([]) | selectattr('kind', 'equalto', 'Location') | list }}"
    _rhdh_users: "{{ _user_entities | default([]) | selectattr('kind', 'equalto', 'User') | list }}"
    _rhdh_groups: "{{ _user_entities | default([]) | selectattr('kind', 'equalto', 'Group') | list }}"
    _rhdh_domains: "{{ _user_entities | default([]) | selectattr('kind', 'equalto', 'Domain') | list }}"
    _rhdh_other: >-
      {{
        _user_entities | default([]) |
        rejectattr('kind', 'in', ['Component', 'API', 'System', 'Resource', 'Location', 'User', 'Group', 'Domain']) |
        list
      }}

- name: Debug organized RHDH entities
  ansible.builtin.debug:
    msg:
