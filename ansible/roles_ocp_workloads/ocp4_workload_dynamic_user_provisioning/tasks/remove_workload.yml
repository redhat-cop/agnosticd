- name: "🚀 ARGOCD APPLICATIONS"
  ansible.builtin.debug:
    msg:
      - "┌─────────────────────────────────────────────────────────────────┐"
      - "│                          ARGOCD                                 │"
      - "└─────────────────────────────────────────────────────────────────┘"
      - ""
      - "🚀 APPLICATIONS ({{ _user_argocd_apps | default([]) | length }})"
  when: _user_argocd_apps | default([]) | length > 0

- name: List ArgoCD Applications
  ansible.builtin.debug:
    msg:
      - "  • {{ item.metadata.name }}"
      - "    └─ Project: {{ item.spec.project | default('N/A') }}"
      - "    └─ Repository: {{ item.spec.source.repoURL | default('N/A') }}"
      - "    └─ Path: {{ item.spec.source.path | default('N/A') }}"
      - "    └─ Target Revision: {{ item.spec.source.targetRevision | default('N/A') }}"
      - "    └─ Destination: {{ item.spec.destination.namespace | default('N/A') }}@{{ item.spec.destination.server | default('N/A') }}"
      - "    └─ Sync Status: {{ item.status.sync.status | default('N/A') }}"
      - "    └─ Health: {{ item.status.health.status | default('N/A') }}"
      - ""
  loop: "{{ _user_argocd_apps | default([]) }}"
  loop_control:
