---
- name: Dynamic user removal started
  debug:
    msg: "Starting removal of dynamic user: {{ _dynamic_username }}"

# =============================================
# Setup Domain Variables
# =============================================
- name: Extract cluster domain from console URL
  ansible.builtin.set_fact:
    _cluster_domain: >-
      {{
        ocp4_workload_dynamic_user_provisioning_openshift_console_url
        | regex_replace('^https://console-openshift-console\.apps\.', '')
      }}

- name: Set OpenShift Apps Domain
  ansible.builtin.set_fact:
    _ocp_apps_domain: "apps.{{ _cluster_domain }}"

# =============================================
# Discover RHDH Resources
# =============================================
- name: Get Red Hat Developer Hub route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
    label_selectors:
      - app.kubernetes.io/name=backstage
  register: r_rhdh_route

- name: Set RHDH URL
  ansible.builtin.set_fact:
    _rhdh_url: "https://{{ r_rhdh_route.resources[0].spec.host }}"
  when: r_rhdh_route.resources | length > 0

- name: Fail if RHDH route not found
  ansible.builtin.fail:
    msg: "RHDH route not found in namespace {{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
  when: r_rhdh_route.resources | length == 0

- name: Get RHDH backend token from secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
  register: r_rhdh_secrets

- name: Debug RHDH secrets
  ansible.builtin.debug:
    msg:
      - "RHDH secrets found: {{ r_rhdh_secrets.resources | map(attribute='metadata.name') | list }}"

- name: Find RHDH backend token secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
    label_selectors:
      - app.kubernetes.io/name=backstage
  register: r_rhdh_backend_secrets

- name: Try to get RHDH backend auth token from backstage secrets
  ansible.builtin.set_fact:
    _rhdh_backend_token: >-
      {{
        r_rhdh_backend_secrets.resources |
        selectattr('data.BACKEND_SECRET', 'defined') |
        map(attribute='data.BACKEND_SECRET') |
        first |
        b64decode
      }}
  when: 
    - r_rhdh_backend_secrets.resources | length > 0
    - r_rhdh_backend_secrets.resources | selectattr('data.BACKEND_SECRET', 'defined') | list | length > 0

- name: Try alternative token sources if BACKEND_SECRET not found
  block:
    - name: Look for backstage-backend-auth-key secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: backstage-backend-auth-key
        namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
      register: r_backend_auth_key
      failed_when: false

    - name: Set token from backstage-backend-auth-key
      ansible.builtin.set_fact:
        _rhdh_backend_token: "{{ r_backend_auth_key.resources[0].data['backend-auth-key'] | b64decode }}"
      when:
        - r_backend_auth_key.resources | length > 0
        - r_backend_auth_key.resources[0].data['backend-auth-key'] is defined
  when: _rhdh_backend_token is not defined

- name: Debug RHDH API access setup
  ansible.builtin.debug:
    msg:
      - "RHDH URL: {{ _rhdh_url }}"
      - "Dynamic Username: {{ _dynamic_username }}"
      - "Backend token available: {{ _rhdh_backend_token is defined }}"

- name: Try different authentication approaches for RHDH API
  block:
    - name: Try RHDH API with backend token
      uri:
        url: "{{ _rhdh_url }}/api/catalog/entities"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ _rhdh_backend_token }}"
          Content-Type: application/json
        status_code: [200, 401, 403]
      register: r_all_entities_backend
      failed_when: false
      when: _rhdh_backend_token is defined

    - name: Try RHDH API without authentication
      uri:
        url: "{{ _rhdh_url }}/api/catalog/entities"
        method: GET
        validate_certs: false
        headers:
          Content-Type: application/json
        status_code: [200, 401, 403]
      register: r_all_entities_noauth
      failed_when: false
      when: 
        - _rhdh_backend_token is not defined or r_all_entities_backend.status != 200

    - name: Set successful entities response
      ansible.builtin.set_fact:
        r_all_entities: >-
          {{
            r_all_entities_backend if (r_all_entities_backend is defined and r_all_entities_backend.status == 200)
            else r_all_entities_noauth
          }}

- name: Debug RHDH API response
  ansible.builtin.debug:
    msg:
      - "API call successful: {{ r_all_entities.status == 200 }}"
      - "Response status: {{ r_all_entities.status | default('undefined') }}"
      - "Response type: {{ r_all_entities.json | type_debug }}"
      - "Response content: {{ r_all_entities.json | default('no content') }}"

- name: Convert entities to YAML and search for user references
  ansible.builtin.set_fact:
    _user_entities: []
  when: 
    - r_all_entities is defined
    - r_all_entities.status == 200

- name: Search each entity for user references in YAML content
  ansible.builtin.set_fact:
    _user_entities: >-
      {{
        _user_entities + [item]
      }}
  loop: "{{ r_all_entities.json if (r_all_entities.json is iterable and r_all_entities.json is not string) else [] }}"
  when:
    - r_all_entities is defined
    - r_all_entities.status == 200
    - r_all_entities.json is defined
    - r_all_entities.json is iterable
    - r_all_entities.json is not string
    - item is mapping
    - >-
      (item | to_nice_yaml | lower | search(_dynamic_username | lower)) or
      (item.metadata.name | default('') | search(_dynamic_username)) or
      (item.spec.owner | default('') | search(_dynamic_username)) or
      (item.metadata.namespace | default('') | search(_dynamic_username)) or
      (item.metadata.annotations | default({}) | to_nice_yaml | search(_dynamic_username)) or
      (item.spec | default({}) | to_nice_yaml | search(_dynamic_username))
  loop_control:
    label: "{{ item.metadata.name | default('unnamed') }}"

- name: Debug all entities summary
  ansible.builtin.debug:
    msg:
      - "Total entities in catalog: {{ r_all_entities.json | default([]) | length }}"
      - "Entity kinds found: {{ r_all_entities.json | default([]) | map(attribute='kind') | unique | list }}"
  when: 
    - r_all_entities is defined
    - r_all_entities.status == 200

- name: Debug user-related entities found
  ansible.builtin.debug:
    msg:
      - "User-related entities: {{ _user_entities | default([]) | length }}"
      - "User entities details:"
  when: 
    - r_all_entities is defined
    - r_all_entities.status == 200

- name: Show sample of all entities for debugging
  ansible.builtin.debug:
    msg:
      - "Entity {{ ansible_loop.index }}: {{ item.kind }}/{{ item.metadata.name }}"
      - "  Namespace: {{ item.metadata.namespace | default('N/A') }}"
      - "  Owner: {{ item.spec.owner | default('N/A') }}"
      - "  Source location: {{ item.metadata.annotations['backstage.io/source-location'] | default('N/A') }}"
  loop: "{{ r_all_entities.json | default([]) }}"
  loop_control:
    extended: true
    label: "{{ item.metadata.name }}"
  when: 
    - r_all_entities is defined
    - r_all_entities.status == 200
    - ansible_loop.index <= 10

- name: List user entity details
  ansible.builtin.debug:
    msg:
      - "Kind: {{ item.kind }}"
      - "Name: {{ item.metadata.name }}"
      - "Namespace: {{ item.metadata.namespace | default('N/A') }}"
      - "Owner: {{ item.spec.owner | default('N/A') }}"
      - "Annotations: {{ item.metadata.annotations | default({}) }}"
      - "Full YAML content:"
      - "{{ item | to_nice_yaml }}"
  loop: "{{ _user_entities | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Discover GitLab projects owned by user
  block:
    - name: Get GitLab root personal access token
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: root-user-personal-token
        namespace: "{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}"
      register: r_gitlab_root_token

    - name: Set GitLab root token
      ansible.builtin.set_fact:
        _gitlab_root_token: "{{ r_gitlab_root_token.resources[0].data.token | b64decode }}"

    - name: Get GitLab user details
      uri:
        url: >-
          https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/
          {{- 'api/v4/users?username=' }}{{ _dynamic_username }}
        method: GET
        validate_certs: false
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        status_code: [200, 404]
      register: r_gitlab_user
      failed_when: false

    - name: Get GitLab projects owned by user
      uri:
        url: >-
          https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/
          {{- 'api/v4/users/' }}{{ r_gitlab_user.json[0].id }}/projects
        method: GET
        validate_certs: false
        headers:
          PRIVATE-TOKEN: "{{ _gitlab_root_token }}"
        status_code: [200, 404]
      register: r_gitlab_projects
      when:
        - r_gitlab_user.status == 200
        - r_gitlab_user.json | length > 0

    - name: Debug GitLab projects
      ansible.builtin.debug:
        msg:
          - "GitLab user found: {{ r_gitlab_user.status == 200 and r_gitlab_user.json | length > 0 }}"
          - "Projects count: {{ r_gitlab_projects.json | default([]) | length }}"
          - "Project names: {{ r_gitlab_projects.json | default([]) | map(attribute='name') | list }}"
      when: r_gitlab_user.status == 200

- name: Summary of discovered resources
  ansible.builtin.debug:
    msg:
      - "=== RESOURCE DISCOVERY SUMMARY ==="
      - "User: {{ _dynamic_username }}"
      - "RHDH entities found: {{ _user_entities | default([]) | length }}"
      - "GitLab projects found: {{ r_gitlab_projects.json | default([]) | length }}"
      - "=== END SUMMARY ==="