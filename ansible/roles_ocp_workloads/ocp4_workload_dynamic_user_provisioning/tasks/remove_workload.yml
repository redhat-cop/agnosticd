---
- name: Remove Workload Tasks
  debug:
    msg: "Remove-Workload tasks Started"

- name: Set dynamic user facts for removal
  ansible.builtin.set_fact:
    _dynamic_username: "user-{{ guid }}"
    _dynamic_user_email: "user-{{ guid }}@demo.redhat.com"
    _dynamic_showroom_namespace: "{{ ocp4_workload_dynamic_user_provisioning_showroom_namespace }}-user-{{ guid }}"

- name: Extract OpenShift Apps Domain from console URL
  ansible.builtin.set_fact:
    _ocp_apps_domain: "{{ ocp4_workload_dynamic_user_provisioning_openshift_console_url | regex_replace('https://console-openshift-console\\.', '') }}"
  when: ocp4_workload_dynamic_user_provisioning_openshift_console_url is defined and ocp4_workload_dynamic_user_provisioning_openshift_console_url != ""

- name: Fallback to ingress discovery if console URL not provided
  block:
  - name: Retrieve OpenShift Ingress config
    kubernetes.core.k8s_info:
      api_version: config.openshift.io/v1
      kind: Ingress
      name: cluster
    register: r_ingress_config

  - name: Set OpenShift Apps Domain from ingress
    ansible.builtin.set_fact:
      _ocp_apps_domain: "{{ r_ingress_config.resources[0].spec.domain }}"
  when: ocp4_workload_dynamic_user_provisioning_openshift_console_url is not defined or ocp4_workload_dynamic_user_provisioning_openshift_console_url == ""

# =============================================
# Remove Showroom Instance
# =============================================
- name: Remove showroom Helm release
  kubernetes.core.helm:
    name: "showroom-{{ _dynamic_username }}"
    release_namespace: "{{ _dynamic_showroom_namespace }}"
    state: absent
  failed_when: false

- name: Remove showroom namespace
  kubernetes.core.k8s:
    name: "{{ _dynamic_showroom_namespace }}"
    api_version: v1
    kind: Namespace
    state: absent
  failed_when: false

# =============================================
# Remove Keycloak User
# =============================================
- name: Retrieve Keycloak admin credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: keycloak-initial-admin
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_keycloak_namespace }}"
  register: r_keycloak_admin_credentials
  failed_when: false

- name: Set Keycloak admin credentials
  ansible.builtin.set_fact:
    _keycloak_admin_username: "{{ r_keycloak_admin_credentials.resources[0].data.username | b64decode }}"
    _keycloak_admin_password: "{{ r_keycloak_admin_credentials.resources[0].data.password | b64decode }}"
  when: r_keycloak_admin_credentials.resources | length > 0

- name: Generate Keycloak access token
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/realms/master/protocol/openid-connect/token
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      client_id: admin-cli
      username: "{{ _keycloak_admin_username }}"
      password: "{{ _keycloak_admin_password }}"
      grant_type: password
  register: r_keycloak_access_token
  failed_when: false
  when: _keycloak_admin_username is defined

- name: Get Keycloak user to delete
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/admin/realms/{{ ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/users?username={{ _dynamic_username }}
    method: GET
    validate_certs: false
    headers:
      Authorization: Bearer {{ r_keycloak_access_token.json.access_token }}
  register: r_keycloak_user
  failed_when: false
  when: r_keycloak_access_token.json is defined

- name: Delete Keycloak user
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/admin/realms/{{ ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/users/{{ r_keycloak_user.json[0].id }}
    method: DELETE
    validate_certs: false
    headers:
      Authorization: Bearer {{ r_keycloak_access_token.json.access_token }}
    status_code: [204, 404]
  failed_when: false
  when: 
    - r_keycloak_user.json is defined
    - r_keycloak_user.json | length > 0

# =============================================
# Remove GitLab User
# =============================================
- name: Get GitLab user to delete
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/users?username={{ _dynamic_username }}
    method: GET
    validate_certs: false
    status_code: [200, 404]
  register: r_gitlab_user
  failed_when: false

- name: Delete GitLab user
  uri:
    url: https://gitlab-{{ ocp4_workload_dynamic_user_provisioning_gitlab_namespace }}.{{ _ocp_apps_domain }}/api/v4/users/{{ r_gitlab_user.json[0].id }}
    method: DELETE
    validate_certs: false
    headers:
      Content-Type: application/json
    body_format: form-urlencoded
    body:
      hard_delete: "true"
    status_code: [202, 204, 404]
  failed_when: false
  when: 
    - r_gitlab_user.json is defined
    - r_gitlab_user.json | length > 0

# =============================================
# Clean up RHDH/Backstage Catalog Entries
# =============================================
- name: Get Red Hat Developer Hub route for catalog cleanup
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ ocp4_workload_dynamic_user_provisioning_dh_namespace | default('tssc-dh') }}"
    label_selectors:
      - app.kubernetes.io/name=backstage
  register: r_rhdh_cleanup_route
  failed_when: false

- name: Set RHDH URL for catalog cleanup
  ansible.builtin.set_fact:
    _rhdh_cleanup_url: "https://{{ r_rhdh_cleanup_route.resources[0].spec.host }}"
  when: r_rhdh_cleanup_route.resources | length > 0

- name: Generate RHDH access token for catalog cleanup
  uri:
    url: https://sso.{{ _ocp_apps_domain }}/realms/{{ ocp4_workload_dynamic_user_provisioning_keycloak_realm }}/protocol/openid-connect/token
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      client_id: backstage
      username: "{{ _dynamic_username }}"
      password: "{{ ocp4_workload_dynamic_user_provisioning_password }}"
      grant_type: password
    status_code: [200, 400, 401, 403]
  register: r_rhdh_user_token
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - r_keycloak_access_token.json is defined

- name: Set RHDH token if authentication succeeded
  ansible.builtin.set_fact:
    _rhdh_token: "{{ r_rhdh_user_token.json.access_token }}"
  when: 
    - r_rhdh_user_token.json is defined
    - r_rhdh_user_token.json.access_token is defined

- name: Find user-specific catalog entities in RHDH
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/entities?filter=metadata.annotations.backstage.io/managed-by-origin={{ _dynamic_username }}"
    method: GET
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_token }}
    status_code: [200, 401, 403, 404]
  register: r_catalog_entities
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_token is defined

- name: Delete user-specific catalog entities from RHDH
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/entities/by-name/{{ item.kind | lower }}/{{ item.metadata.namespace | default('default') }}/{{ item.metadata.name }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_token }}
    status_code: [200, 204, 404, 409]
  loop: "{{ r_catalog_entities.json | default([]) }}"
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_token is defined
    - r_catalog_entities.json is defined
    - r_catalog_entities.json | length > 0

- name: Find user-specific GitLab projects/repos in catalog
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/entities?filter=kind=component,metadata.name={{ _dynamic_username }}*"
    method: GET
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_token }}
    status_code: [200, 401, 403, 404]
  register: r_user_components
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_token is defined

- name: Delete user-specific components from RHDH catalog
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/entities/by-name/component/{{ item.metadata.namespace | default('default') }}/{{ item.metadata.name }}"
    method: DELETE
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_token }}
    status_code: [200, 204, 404, 409]
  loop: "{{ r_user_components.json | default([]) }}"
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_token is defined
    - r_user_components.json is defined
    - r_user_components.json | length > 0

- name: Trigger RHDH catalog refresh after cleanup
  uri:
    url: "{{ _rhdh_cleanup_url }}/api/catalog/refresh"
    method: POST
    validate_certs: false
    headers:
      Authorization: Bearer {{ _rhdh_token }}
    status_code: [200, 202, 401, 403]
  failed_when: false
  when: 
    - _rhdh_cleanup_url is defined
    - _rhdh_token is defined

# =============================================
# Clean up ArgoCD Applications (Primary Strategy)
# =============================================
# ArgoCD applications in tssc-gitops namespace manage all user resources
# Deleting the ArgoCD app should cascade delete all managed resources

- name: Set user application facts for cleanup
  ansible.builtin.set_fact:
    _user_guid: "{{ _dynamic_username | replace('user-', '') }}"
    _user_app_name: "my-quarkus-tkn-{{ _dynamic_username | replace('user-', 'user') }}"
    _argocd_namespace: "{{ ocp4_workload_dynamic_user_provisioning_gitops_namespace | default('tssc-gitops') }}"

- name: Find user ArgoCD applications in gitops namespace
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ _argocd_namespace }}"
  register: r_all_argocd_apps
  failed_when: false

- name: Identify user-specific ArgoCD applications
  ansible.builtin.set_fact:
    _user_argocd_apps: >-
      {{
        r_all_argocd_apps.resources | default([])
        | selectattr('metadata.name', 'match', '.*user-?' + _user_guid + '.*')
        | list
      }}

- name: Delete user ArgoCD applications (cascade deletes all managed resources)
  kubernetes.core.k8s:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    state: absent
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Deleted
      status: "True"
  loop: "{{ _user_argocd_apps }}"
  when: _user_argocd_apps | length > 0
  register: r_argocd_cleanup

- name: Wait for ArgoCD cascade deletion to complete
  ansible.builtin.pause:
    seconds: 30
    prompt: "Waiting for ArgoCD cascade deletion to clean up all managed resources..."
  when: _user_argocd_apps | length > 0

# =============================================
# Fallback cleanup for any remaining resources
# =============================================
# ArgoCD should have handled most resources, but clean up any manually created ones

- name: Set user pattern for fallback cleanup
  ansible.builtin.set_fact:
    _user_pattern: ".*user-?{{ _user_guid }}.*"

- name: Find any remaining user-specific resources by name pattern
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
  register: r_remaining_resources
  loop:
    - { api_version: "apps/v1", kind: "Deployment" }
    - { api_version: "apps/v1", kind: "ReplicaSet" }
    - { api_version: "v1", kind: "Pod" }
    - { api_version: "v1", kind: "Service" }
    - { api_version: "route.openshift.io/v1", kind: "Route" }
    - { api_version: "batch/v1", kind: "Job" }
    - { api_version: "v1", kind: "ConfigMap" }
  failed_when: false

- name: Delete any remaining user-specific resources
  kubernetes.core.k8s:
    api_version: "{{ resource.api_version }}"
    kind: "{{ resource.kind }}"
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
    state: absent
  loop: >-
    {{
      r_remaining_resources.results
      | selectattr('resources', 'defined')
      | map(attribute='resources')
      | flatten
      | selectattr('metadata.name', 'match', _user_pattern)
      | list
    }}
  loop_control:
    loop_var: item
  vars:
    resource: "{{ r_remaining_resources.results | selectattr('item.kind', 'equalto', item.kind) | first | default({}) }}"
  failed_when: false
  when: >
    {{
      r_remaining_resources.results
      | selectattr('resources', 'defined')
      | map(attribute='resources')
      | flatten
      | selectattr('metadata.name', 'match', _user_pattern)
      | list | length > 0
    }}

# =============================================
# Report cleanup status
# =============================================
- name: Report user removal status
  agnosticd_user_info:
    msg: |
      Dynamic user {{ _dynamic_username }} has been removed from workshop {{ guid }}:
      
      === Cleanup Status ===
      Showroom Instance: Removed
      Keycloak User: {{ 'Removed' if r_keycloak_user.json is defined and r_keycloak_user.json | length > 0 else 'Not found' }}
      GitLab User: {{ 'Removed' if r_gitlab_user.json is defined and r_gitlab_user.json | length > 0 else 'Not found' }}
      RHDH Catalog: {{ 'Cleaned' if _rhdh_token is defined and (r_catalog_entities.json is defined or r_user_components.json is defined) else 'Skipped (auth failed or not accessible)' }}
      ArgoCD Applications: {{ 'Deleted (' + (_user_argocd_apps | length | string) + ' apps)' if _user_argocd_apps | length > 0 else 'None found' }}
      
      {% if _user_argocd_apps | length > 0 %}
      === ArgoCD Applications Removed ===
      {% for app in _user_argocd_apps %}
      - {{ app.metadata.name }} (namespace: {{ app.metadata.namespace }})
      {% endfor %}
      (All managed resources automatically cleaned up via cascade deletion)
      {% endif %}
      
      === Verification Commands ===
      # Check for any remaining user resources (including user1, user-1, and 1 patterns)
      oc get all --all-namespaces -o wide | grep -E "user-?{{ _user_guid }}"
      oc get replicasets --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get jobs --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get pods --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get routes --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get secrets --all-namespaces | grep -E "user-?{{ _user_guid }}"
      oc get configmaps --all-namespaces | grep -E "user-?{{ _user_guid }}"

- name: Remove Workload Tasks Complete
  debug:
    msg: "Remove-Workload tasks completed successfully"