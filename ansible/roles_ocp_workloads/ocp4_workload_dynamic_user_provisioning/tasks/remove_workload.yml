- name: "🔍 RHDH CATALOG ENTITIES"
  ansible.builtin.debug:
    msg:
      - "┌─────────────────────────────────────────────────────────────────┐"
      - "│                     RED HAT DEVELOPER HUB                      │"
      - "└─────────────────────────────────────────────────────────────────┘"
      - ""
