- name: List RHDH Systems
  ansible.builtin.debug:
    msg:
      - "  • {{ item.metadata.name }}"
      - "    └─ Owner: {{ item.spec.owner | default('N/A') }}"
      - "    └─ Domain: {{ item.spec.domain | default('N/A') }}"
