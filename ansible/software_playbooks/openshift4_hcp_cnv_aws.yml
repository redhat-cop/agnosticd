---
####### Deploy OpenShift using HCP on CNV with AWS workers

- name: Step 004.2 - Install OpenShift using HCP on CNV with AWS workers
  hosts: bastions
  gather_facts: false
  become: false
  tags:
    - step004
    - step004.2
  tasks:
    - name: Call Role to install OpenShift using HCP on CNV with AWS workers
      when: install_ocp4 | default(true) | bool
      ansible.builtin.include_role:
        name: host-ocp4-hcp-cnv-aws-install
