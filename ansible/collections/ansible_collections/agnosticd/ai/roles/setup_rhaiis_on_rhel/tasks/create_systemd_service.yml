---
- name: Create vLLM service file
  ansible.builtin.template:
    src: vllm.service.j2
    dest: /etc/systemd/system/vllm.service
    mode: '0644'
  become: true
  notify: reload systemd

- name: Enable and start vLLM service
  ansible.builtin.systemd:
    name: vllm
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Display message about waiting for vLLM service
  ansible.builtin.debug:
    msg: "Waiting for vLLM service to fully start. This may take several minutes while container images are downloaded..."

- name: Wait for vLLM service to be fully operational
  ansible.builtin.uri:
    url: "http://localhost:{{ vllm_port }}{{ vllm_health_endpoint }}"
    method: GET
    status_code: 200
  register: result
  until: result.status == 200
  retries: "{{ vllm_health_check_retries }}"
  delay: "{{ vllm_health_check_delay }}"
  ignore_errors: yes

- name: Check vLLM service status
  ansible.builtin.command:
    cmd: systemctl status vllm
  register: service_status
  failed_when: false
  changed_when: false
  become: true

- name: Display vLLM service status
  ansible.builtin.debug:
    var: service_status.stdout_lines

- name: Verify vLLM container is running
  ansible.builtin.command:
    cmd: podman ps --filter name={{ vllm_container_name }} --format "{{.Names}}"
  register: container_status
  failed_when: false
  changed_when: false

- name: Fail if vLLM service did not start properly
  ansible.builtin.fail:
    msg: "vLLM service failed to start properly. Please check the logs using 'journalctl -u vllm'."
  when: >
    (result is defined and result.status is not defined or result.status != 200) and
    (container_status.stdout == "" or service_status.rc != 0)
