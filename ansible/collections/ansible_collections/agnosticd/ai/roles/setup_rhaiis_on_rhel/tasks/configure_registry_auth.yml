---
- name: Check if registry credentials are provided
  ansible.builtin.fail:
    msg: >
      Registry authentication is enabled (setup_rhaiis_on_rhel_registry_auth_enabled=true) 
      but no credentials are provided. Please set either setup_rhaiis_on_rhel_registry_username
      and setup_rhaiis_on_rhel_registry_password, or setup_rhaiis_on_rhel_registry_auth_token.
  when: >
    (setup_rhaiis_on_rhel_registry_username | default('') == '' or
    setup_rhaiis_on_rhel_registry_password | default('') == '') and
    setup_rhaiis_on_rhel_registry_auth_token | default('') == ''

- name: Ensure .config/containers directory exists for root user
  ansible.builtin.file:
    path: /root/.config/containers
    state: directory
    mode: '0700'
  become: true

- name: Ensure .config/containers directory exists for {{ student_name | default('dev') }} user
  ansible.builtin.file:
    path: "{{ '~' + student_name | default('dev') }}/.config/containers"
    state: directory
    mode: '0700'
  become: "{{ student_name | default('dev') != ansible_user_id }}"
  become_user: "{{ student_name | default('dev') }}"

- name: Configure registry auth via username/password for root
  ansible.builtin.shell: >
    podman login {{ setup_rhaiis_on_rhel_registry_url }}
    -u {{ setup_rhaiis_on_rhel_registry_username }}
    -p {{ setup_rhaiis_on_rhel_registry_password }}
    --authfile /root/.config/containers/auth.json
  become: true
  no_log: true
  when: setup_rhaiis_on_rhel_registry_username != '' and setup_rhaiis_on_rhel_registry_password != ''
  changed_when: true

- name: Configure registry auth via username/password for {{ student_name | default('dev') }} user
  ansible.builtin.shell: >
    podman login {{ setup_rhaiis_on_rhel_registry_url }}
    -u {{ setup_rhaiis_on_rhel_registry_username }}
    -p {{ setup_rhaiis_on_rhel_registry_password }}
    --authfile {{ '~' + student_name | default('dev') }}/.config/containers/auth.json
  become: "{{ student_name | default('dev') != ansible_user_id }}"
  become_user: "{{ student_name | default('dev') }}"
  no_log: true
  when: setup_rhaiis_on_rhel_registry_username != '' and setup_rhaiis_on_rhel_registry_password != ''
  changed_when: true

- name: Configure registry auth via token for root
  ansible.builtin.shell: >
    podman login {{ setup_rhaiis_on_rhel_registry_url }}
    --authfile /root/.config/containers/auth.json --tls-verify=false
    --auth-token {{ setup_rhaiis_on_rhel_registry_auth_token }}
  become: true
  no_log: true
  when: setup_rhaiis_on_rhel_registry_auth_token != ''
  changed_when: true

- name: Configure registry auth via token for service user
  ansible.builtin.shell: >
    podman login {{ setup_rhaiis_on_rhel_registry_url }}
    --authfile {{ '~' + student_name | default('dev') }}/.config/containers/auth.json
    --tls-verify=false --auth-token {{ setup_rhaiis_on_rhel_registry_auth_token }}
  become: "{{ student_name | default('dev') != ansible_user_id }}"
  become_user: "{{ student_name | default('dev') }}"
  no_log: true
  when: setup_rhaiis_on_rhel_registry_auth_token != ''
  changed_when: true

- name: Pre-pull container image
  ansible.builtin.command:
    cmd: podman pull {{ setup_rhaiis_on_rhel_vllm_container_image }}
  become: true
  changed_when: true
