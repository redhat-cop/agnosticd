---
- name: Step 001.0 XClarity Baremetal Pre-checks
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Ensure mandatory variables are set for XClarity Baremetal
      ansible.builtin.assert:
        that: "{{ check.that }}"
        fail_msg: "{{ check.msg }}"
        quiet: true
      loop_control:
        loop_var: check
        label: "{{ check.msg }}"
      loop:
        - msg: Variable 'bmc_hostname' must be defined
          that:
            - vars.bmc_hostname is defined
            - vars.bmc_hostname != ""
        - msg: Variable 'bmc_username' must be defined
          that:
            - vars.bmc_username is defined
            - vars.bmc_username != ""
        - msg: Variable 'bmc_password' must be defined
          that:
            - vars.bmc_password is defined
            - vars.bmc_password != ""
        - msg: Variable 'target_username' will default to 'console' if not provided
          that:
            - true  # Always passes, just informational
        - msg: Variable 'user_action' will default to 'create' if not provided
          that:
            - true  # Always passes, just informational
        - msg: Variable 'user_role' will default to 'PowerUser' if not provided
          that:
            - true  # Always passes, just informational

    - name: Display XClarity Baremetal configuration
      ansible.builtin.debug:
        msg:
          - "XClarity BMC Configuration:"
          - "BMC Host: {{ bmc_hostname }}"
          - "BMC User: {{ bmc_username }}"
          - "Target User: {{ target_username | default('console') }}"
          - "User Action: {{ user_action | default('create') }}"
          - "User Role: {{ user_role | default('PowerUser') }}"
          - "Power Action: {{ power_action | default('status') }}" 