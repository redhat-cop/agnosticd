---
- name: Step 001.1 Deploy XClarity Baremetal Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Generate secure password if not provided
      ansible.builtin.set_fact:
        target_password: "{{ lookup('password', '/dev/null length=12 chars=ascii_letters,digits') }}"
      when: 
        - target_password is not defined or target_password == ""

    - name: Set defaults to avoid recursion
      ansible.builtin.set_fact:
        resolved_user_action: "create"
        resolved_user_role: "PowerUser"
        resolved_enable_user: "true"
        resolved_target_username: "console"
        resolved_target_password: "{{ target_password }}"
        resolved_enable_pxe_boot_and_reset: "true"

    - name: Run XClarity user management role
      include_role:
        name: "infra-xclarity-user-management"
      vars:
        # BMC connection parameters
        bmc_hostname: "{{ bmc_hostname }}"
        bmc_username: "{{ bmc_username }}"
        bmc_password: "{{ bmc_password }}"
        # User management parameters (no recursion)
        target_username: "{{ resolved_target_username }}"
        target_password: "{{ resolved_target_password }}"
        user_action: "{{ resolved_user_action }}"
        user_role: "{{ resolved_user_role }}"
        enable_user: "{{ resolved_enable_user }}"
      when: 
        - user_action | default('create') in ['create', 'update_password', 'delete', 'status']
        - bmc_hostname is defined
        - bmc_username is defined
        - bmc_password is defined

    - name: Run XClarity power management role  
      include_role:
        name: "infra-xclarity-power-management"
      vars:
        # BMC connection parameters
        bmc_hostname: "{{ bmc_hostname }}"
        bmc_username: "{{ bmc_username }}"
        bmc_password: "{{ bmc_password }}"
        power_action: "status"
        enable_pxe_boot_and_reset: "{{ resolved_enable_pxe_boot_and_reset }}"
      when: 
        - bmc_hostname is defined
        - bmc_username is defined
        - bmc_password is defined

    - name: Create inventory for managed servers
      include_role:
        name: "infra-xclarity-create-inventory"
      vars:
        bmc_hostname: "{{ bmc_hostname }}"
        managed_servers: "{{ xclarity_managed_servers | default([]) }}"
      when: 
        - xclarity_managed_servers is defined
        - xclarity_managed_servers | length > 0