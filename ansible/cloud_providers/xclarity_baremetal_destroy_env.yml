---
- name: Step 001.2 Destroy XClarity Baremetal Environment
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Set defaults to avoid recursion
      ansible.builtin.set_fact:
        resolved_target_username: "{{ target_username | default('console') }}"

    - name: Remove XClarity console user
      include_role:
        name: "infra-xclarity-user-management"
      vars:
        # BMC connection parameters
        bmc_hostname: "{{ bmc_hostname }}"
        bmc_username: "{{ bmc_username }}"
        bmc_password: "{{ bmc_password }}"
        # User management parameters (no recursion)
        target_username: "{{ resolved_target_username }}"
        user_action: "delete"
        user_role: "PowerUser"
        enable_user: false
      when: 
        - xclarity_cleanup_users | default(true) | bool
        - bmc_hostname is defined
        - bmc_username is defined
        - bmc_password is defined

    - name: Force power off servers after user cleanup
      include_role:
        name: "infra-xclarity-power-management"
      vars:
        # BMC connection parameters
        bmc_hostname: "{{ bmc_hostname }}"
        bmc_username: "{{ bmc_username }}"
        bmc_password: "{{ bmc_password }}"
        # Force power off during destroy
        power_action: "force_off"
        enable_pxe_boot_and_reset: false
      when: 
        - bmc_hostname is defined
        - bmc_username is defined
        - bmc_password is defined

    - name: Display cleanup completion
      ansible.builtin.debug:
        msg: 
          - "XClarity Baremetal environment cleanup completed"
          - "BMC Host: {{ bmc_hostname | default('Not specified') }}"
          - "User Cleanup: {{ 'Performed' if (xclarity_cleanup_users | default(true) | bool and bmc_hostname is defined) else 'Skipped' }}"
          - "Power Management: {{ 'Force power off performed' if (bmc_hostname is defined) else 'Skipped' }}"
          - "Target User: {{ target_username | default('console') }}"
          - "Cleanup Order: 1) Remove console user → 2) Force power off servers"

    - name: Display cleanup skip notice
      ansible.builtin.debug:
        msg: 
          - "XClarity user cleanup was skipped"
          - "Reason: Missing BMC connection parameters or cleanup disabled"
          - "Set xclarity_cleanup_users=true and provide bmc_hostname, bmc_username, bmc_password to enable cleanup"
      when: 
        - not (xclarity_cleanup_users | default(true) | bool) or
          bmc_hostname is not defined or
          bmc_username is not defined or
          bmc_password is not defined 