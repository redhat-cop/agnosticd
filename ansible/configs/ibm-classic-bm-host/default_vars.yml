---
# IBM Classic Baremetal Host Configuration - Default Variables
# Integrated deployment for IBM Cloud Classic baremetal servers and VMs

## Cloud Provider
cloud_provider: redfish_baremetal

## BMC Connection Settings
# These must be provided as extra vars or in sample_vars file
# Variables for BMC management:
# bmc_hostname: "192.168.1.100"
# bmc_username: "admin"
# bmc_password: "password123"

## BMC User Management Settings
target_username: "console"             # Default console user
enable_user: true                      # Enable user account

## User Configuration
bastion_user_name: "cloud-user"        # Username for bastion host
baremetal_user_name: "cloud-user"      # Username for baremetal host

## Environment Management
cleanup_users: true                    # Clean up users during destroy

## AgnosticD Standard Variables
output_dir: "{{ output_dir | default('/tmp/' + env_type + '-' + guid) }}"
infra_workloads: []                    # Additional workloads to run
post_infra_workloads: []               # Post-infrastructure workloads
software_to_deploy: none               # No additional software deployment

## DNS Configuration
create_dns_records: true               # Enable Route53 DNS records by default
route53_aws_access_key_id: ""          # AWS access key ID for Route53 (required if DNS enabled)
route53_aws_secret_access_key: ""      # AWS secret access key for Route53 (required if DNS enabled)
aws_region: "us-east-1"                # AWS region for Route53
# route53_aws_zone_id: ""              # Route53 hosted zone ID (auto-discovered from cluster_dns_zone)
# cluster_dns_zone: ""                 # DNS domain for Route53 records (REQUIRED if DNS enabled)
dns_ttl: 300                           # TTL for DNS records in seconds

## SSH Key Management
env_authorized_key: "ssh_provision_{{ guid }}"    # SSH key filename for environment
set_env_authorized_key: true           # Enable SSH key management

## PXE Server Configuration
setup_pxe_server: true                 # Enable PXE server setup on bastion
# Network interfaces are automatically discovered based on private/public IP addresses

## Optional: Managed Servers Configuration
# managed_servers: []

## BMC Connection Options
validate_certs: false
force_basic_auth: true

## Password Generation Settings
user_password_length: 16
user_password_complexity: true

# Common packages to install on all deployed VMs
common_packages:
  - python3-pip
  - python3-requests
  - python3-urllib3

# Common pip packages to install on all deployed VMs
common_pip_packages:
  - passlib

## User Info and Output
user_info_messages: []
user_info_data: {}

## Workloads
# Workloads can be enabled to perform additional configuration
# on the managed systems after user creation
workloads: []

## SSH Configuration
ansible_user: root

## Lab Configuration
lab_users: [] 