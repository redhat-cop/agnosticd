---
- name: Step 004 Software
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags:
    - step004
    - software
  tasks:
    - name: Run additional workloads if defined
      include_role:
        name: "{{ workload_loop_var }}"
      loop: "{{ workloads | default([]) }}"
      loop_control:
        loop_var: workload_loop_var
      when: workloads is defined and workloads | length > 0

- name: Step 004.1 Configure Bastion Hosts
  hosts: bastions
  become: true
  gather_facts: false
  vars:
    bastion_user_name: "{{ hostvars['localhost']['bastion_user_name'] | default('cloud-user') }}"
    generated_password: "{{ hostvars['localhost']['generated_password'] | default('') }}"
  tags:
    - step004
    - bastion_tasks
  tasks:
    - name: "Create {{ bastion_user_name }} with generated password"
      ansible.builtin.user:
        name: "{{ bastion_user_name }}"
        password: "{{ generated_password | password_hash('sha512') }}"
        comment: "IBM Cloud Classic Baremetal User"
        group: "users"
        groups: "wheel"
        shell: "/bin/bash"
        state: present
      when: generated_password is defined and generated_password != ""

    - name: "Enable passwordless sudo for {{ bastion_user_name }}"
      ansible.builtin.copy:
        content: "{{ bastion_user_name }} ALL=(ALL) NOPASSWD: ALL"
        dest: "/etc/sudoers.d/{{ bastion_user_name }}"
        mode: "0440"
      when: generated_password is defined and generated_password != ""

    - name: Enable password authentication
      ansible.builtin.lineinfile:
        line: "PasswordAuthentication yes"
        regexp: '^ *PasswordAuthentication'
        path: "/etc/ssh/sshd_config"
      when: generated_password is defined and generated_password != ""

    - name: Remove PasswordAuthentication line from 50-cloud-init.conf
      ansible.builtin.lineinfile:
        path: "/etc/ssh/sshd_config.d/50-cloud-init.conf"
        regexp: "PasswordAuthentication"
        state: absent
      ignore_errors: true
      when: generated_password is defined and generated_password != ""

    - name: Restart sshd service
      ansible.builtin.service:
        name: sshd
        state: restarted
      when: generated_password is defined and generated_password != "" 