# IBM Classic Baremetal Host Configuration - Sample Variables
# Copy this file and customize for your environment
# Integrated deployment for IBM Cloud Classic baremetal servers and VMs

## Required Variables - MUST be set
cloud_provider: ibm_cloud_classic
env_type: ibm-classic-bm-host
guid: test01

## IBM Cloud Configuration (REQUIRED for VM deployment)
ibm_cloud_api_key: "{{ vault_ibm_cloud_api_key }}"  # Store in vault
ibm_cloud_server_id: "1234567"  # Your IBM Cloud baremetal server ID
region: "us-south"  # IBM Cloud region

