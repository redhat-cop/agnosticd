## BMC Connection (REQUIRED)
# These variables control BMC access to the baremetal server
bmc_hostname: "192.168.1.100"         # BMC IP address or hostname
bmc_username: "admin"                  # BMC admin username
bmc_password: "YourBMCPassword"        # BMC admin password

## BMC User Management Configuration
target_username: "console"             # Username to create/manage (defaults to console)
target_password: "MyConsolePass123!"   # Password for the target user (will be generated if empty)
user_action: "create"                  # create, update_password, delete, status
user_role: "PowerUser"                 # Administrator, Operator, ReadOnly, PowerUser
enable_user: true                      # Enable the user account

## User Configuration
bastion_user_name: "cloud-user"        # Username for bastion host (default: cloud-user)
baremetal_user_name: "cloud-user"      # Username for baremetal host kickstart (default: cloud-user)

## Power Management Configuration (Optional)
power_action: "status"                 # status, on, off, force_off, reset
                                       # Automatically set to force_off when ACTION=destroy
enable_pxe_boot_and_reset: false      # Enable PXE boot with auto reset
                                       # Automatically enabled when ACTION=provision

## Environment Cleanup Settings
cleanup_users: true                    # Clean up users during destroy

## Optional: Managed Servers List (for inventory creation)
# managed_servers:
#   - hostname: "server1.example.com"
#     ip_address: "192.168.1.101"
#     group: "baremetal_servers"
#     uuid: "12345678-1234-1234-1234-123456789012"
