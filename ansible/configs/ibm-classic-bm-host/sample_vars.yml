#     ip_address: "192.168.1.102"
#     group: "baremetal_servers"
#     uuid: "87654321-4321-4321-4321-210987654321"

## AgnosticD Standard Variables
subdomain_base_suffix: ".example.com"
output_dir: "~/tmp/{{ env_type }}-{{ guid }}"

## Additional Configuration
# Include sample VM configuration file for VM deployment
# -e @sample_vm_config.yml

