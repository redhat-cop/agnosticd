---
- name: Step 000 Pre Infrastructure
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tags:
  - step000
  - pre_infrastructure
  tasks:
  - ansible.builtin.debug:
      msg: "Step 000 Pre Infrastructure"

  - name: Set user subscription facts from AzureSandbox (Babylon extra var)
    when:
    - azure_subscription is not defined
    - azure_sandbox is defined
    - azure_sandbox.credentials | default([]) | length > 0
    ansible.builtin.set_fact:
      azure_subscription: "{{ azure_sandbox.credentials[0].subscription_id }}"
      azure_service_principal_id: "{{ azure_sandbox.credentials[0].app_id }}"
      azure_service_principal_password: "{{ azure_sandbox.credentials[0].password }}"

  - name: Set user subscription facts from propagated sandbox provision data
    when:
    - azure_subscription is not defined
    - azure_sandbox_provision_data is defined
    ansible.builtin.set_fact:
      azure_subscription: "{{ azure_sandbox_provision_data.azure_subscription }}"
      azure_service_principal_id: "{{ azure_sandbox_provision_data.azure_service_principal_id | default(azure_service_principal_id | default('')) }}"
      azure_service_principal_password: "{{ azure_sandbox_provision_data.azure_service_principal_password | default(azure_service_principal_password | default('')) }}"

  - name: Set azure_subscription from legacy pool subscription_id fact
    when:
    - azure_subscription is not defined
    - subscription_id is defined
    ansible.builtin.set_fact:
      azure_subscription: "{{ subscription_id }}"
