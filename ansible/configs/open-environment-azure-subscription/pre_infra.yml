---
- name: Step 000 Pre Infrastructure
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tags:
  - step000
  - pre_infrastructure
  tasks:
  - ansible.builtin.debug:
      msg: "Step 000 Pre Infrastructure"

  - name: Set user subscription facts from AzureSandbox (Babylon extra var)
    when:
    - azure_subscription is not defined
    - azure_sandbox is defined
    - azure_sandbox.credentials | default([]) | length > 0
    ansible.builtin.set_fact:
      azure_subscription: "{{ azure_sandbox.credentials[0].subscription_id }}"
      azure_service_principal_id: "{{ azure_sandbox.credentials[0].app_id }}"
      azure_service_principal_password: "{{ azure_sandbox.credentials[0].password }}"
      azure_tenant: "{{ azure_sandbox.credentials[0].tenant }}"

  - name: Align azure_region with pre-created openenv resource group
    when:
    - azure_subscription is defined
    - azure_service_principal_id is defined
    - azure_service_principal_password is defined
    - azure_tenant is defined
    block:
    - name: Log into Azure CLI as user service principal
      no_log: true
      ansible.builtin.command: >-
        az login --service-principal
        -u {{ azure_service_principal_id }}
        -p {{ azure_service_principal_password }}
        --tenant {{ azure_tenant }}

    - name: Get openenv resource group location
      ansible.builtin.command: >-
        az group show --name openenv-{{ guid }}
        --subscription {{ azure_subscription }}
        --query location -o tsv
      register: r_openenv_rg_location
      failed_when: false
      changed_when: false

    - name: Set azure_region to match existing resource group
      when:
      - r_openenv_rg_location.rc == 0
      - r_openenv_rg_location.stdout | trim | length > 0
      ansible.builtin.set_fact:
        azure_region: "{{ r_openenv_rg_location.stdout | trim }}"
        location: "{{ r_openenv_rg_location.stdout | trim }}"

    - name: Log out of Azure CLI
      ansible.builtin.command: az logout
      changed_when: false

  - name: Set user subscription facts from propagated sandbox provision data
    when:
    - azure_subscription is not defined
    - azure_sandbox_provision_data is defined
    ansible.builtin.set_fact:
      azure_subscription: "{{ azure_sandbox_provision_data.azure_subscription }}"
      azure_service_principal_id: "{{ azure_sandbox_provision_data.azure_service_principal_id | default(azure_service_principal_id | default('')) }}"
      azure_service_principal_password: "{{ azure_sandbox_provision_data.azure_service_principal_password | default(azure_service_principal_password | default('')) }}"

  - name: Set azure_subscription from legacy pool subscription_id fact
    when:
    - azure_subscription is not defined
    - subscription_id is defined
    ansible.builtin.set_fact:
      azure_subscription: "{{ subscription_id }}"
