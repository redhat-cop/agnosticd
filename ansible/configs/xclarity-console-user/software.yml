---
- name: Step 004 Software
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags:
    - step004
    - software
  tasks:
    - name: XClarity Software Message
      ansible.builtin.debug:
        msg: "Step 004 Software - No software deployment required for XClarity console user management"

    - name: Run additional workloads if defined
      include_role:
        name: "{{ workload_loop_var }}"
      loop: "{{ workloads | default([]) }}"
      loop_control:
        loop_var: workload_loop_var
      when: workloads is defined and workloads | length > 0 