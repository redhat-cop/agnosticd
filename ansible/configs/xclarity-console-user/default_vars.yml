---
# XClarity Console User Configuration - Default Variables
# Based on https://github.com/rut31337/lenovo-xclarity-ansible

## Cloud Provider
cloud_provider: xclarity_baremetal

## XClarity BMC Connection Settings
# These must be provided as extra vars or in sample_vars file
# Variables match the actual XClarity playbooks:
# bmc_hostname: "192.168.1.100"
# bmc_username: "admin"
# bmc_password: "password123"

## XClarity User Management Settings
target_username: "console"             # Default console user
enable_user: true                      # Enable user account

## Environment Management
xclarity_cleanup_users: true          # Clean up users during destroy

## AgnosticD Standard Variables
output_dir: "{{ output_dir | default('/tmp/' + env_type + '-' + guid) }}"
infra_workloads: []                    # Additional workloads to run
post_infra_workloads: []               # Post-infrastructure workloads
software_to_deploy: none               # No additional software deployment

## Optional: Managed Servers Configuration
# xclarity_managed_servers: []

## XClarity Connection Options
xclarity_validate_certs: false
xclarity_force_basic_auth: true

## Password Generation Settings
xclarity_user_password_length: 16
xclarity_user_password_complexity: true

## AgnosticD Common Settings
install_bastion: false               # No bastion needed for XClarity management
install_common: false                # Minimal common setup
install_student_user: false          # No student user needed

## Software and Packages
update_packages: false               # Don't update packages on XClarity systems
common_packages: []                  # No common packages needed

## User Info and Output
user_info_messages: []
user_info_data: {}

## Workloads
# Workloads can be enabled to perform additional configuration
# on the XClarity managed systems after user creation
workloads: []

## SSH Configuration
ansible_user: root
ansible_ssh_private_key_file: "{{ output_dir }}/{{ env_type }}_id_rsa"

## Lab Configuration
lab_users: [] 