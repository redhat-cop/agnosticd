---
- name: Step 005 Post Software
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags:
    - step005
    - post_software
  tasks:
    - name: XClarity Post Software Message
      ansible.builtin.debug:
        msg: "Step 005 Post Software - XClarity Console User Configuration Complete"

    - name: Save XClarity user information
      agnosticd_user_info:
        data:
          xclarity_bmc_host: "{{ bmc_hostname | default('Not specified') }}"
          xclarity_username: "{{ target_username | default('console') }}"
          xclarity_password: "{{ target_password | default('Not specified') }}"
        msg: |
          XClarity Console Access Information:
          
          BMC Host: {{ bmc_hostname | default('Not specified') }}
          Username: {{ target_username | default('console') }}
          Password: {{ target_password | default('Not specified') }}
          
          Access your XClarity console at: https://{{ bmc_hostname | default('BMC_HOST') }}
      when: bmc_hostname is defined

    - name: Display XClarity user information
      ansible.builtin.debug:
        msg:
          - "XClarity Console User Management Summary:"
          - "BMC Host: {{ bmc_hostname | default('Not specified') }}"
          - "Target User: {{ target_username | default('console') }}"
          - "Target Password: {{ target_password | default('Not specified') }}"
      when: bmc_hostname is defined 