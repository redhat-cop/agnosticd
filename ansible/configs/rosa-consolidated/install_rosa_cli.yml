---
- name: Get ROSA CLI
  ansible.builtin.get_url:
    url: "{{ rosa_installer_url }}"
    dest: /tmp/rosa-linux.tar.gz

# --no-same-owner:
# https://github.com/habitat-sh/builder/issues/365#issuecomment-382862233
- name: Unzip rosa-linux.tar.gz
  ansible.builtin.unarchive:
    src: /tmp/rosa-linux.tar.gz
    dest: "{{ rosa_binary_path }}"
    remote_src: true
    mode: u=rwx,go=rx
    extra_opts:
    - --no-same-owner

- name: Set rosa binary ownership
  when: ACTION == 'provision'
  become: true
  ansible.builtin.file:
    path: "{{ rosa_binary_path }}/rosa"
    owner: root
    mode: u=rwx,go=rx

- name: cleanup archive file
  ansible.builtin.file:
    path: /tmp/rosa-linux.tar.gz
    state: absent

- name: Create rosa Bash completion file
  when: ACTION == 'provision'
  become: true
  ansible.builtin.shell: "{{ rosa_binary_path }}/rosa completion bash >/etc/bash_completion.d/rosa"
